name: Property News collector

# Runs the collector directly on the GitHub runner (free for this public
# repository), so collection no longer depends on the Render web service being
# awake. cron-job.org starts this workflow every 30 minutes through the
# workflow_dispatch API with inputs.trigger=schedule; GitHub's own schedule
# below is only a backup, because GitHub may delay or drop scheduled runs.
# See docs/property-news/DEPLOYMENT.md.
on:
  workflow_dispatch:
    inputs:
      trigger:
        description: "Recorded in collection_runs: schedule (cron-job.org) or manual"
        type: choice
        options: [manual, schedule]
        default: manual
  schedule:
    - cron: "41 * * * *"

permissions:
  contents: read

concurrency:
  group: property-news-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, GEMINI_API_KEY and
    # NEWS_FETCH_USER_AGENT are environment secrets of "Production".
    environment: Production
    defaults:
      run:
        working-directory: property-news
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: property-news/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect and process due sources
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NEWS_FETCH_USER_AGENT: ${{ secrets.NEWS_FETCH_USER_AGENT }}
          # Optional repository/environment variable to switch Gemini models
          # without a code change; empty means the code default.
          NEWS_AI_MODEL: ${{ vars.NEWS_AI_MODEL }}
          NEWS_ENVIRONMENT: production
          NEWS_LOG_LEVEL: INFO
          RUN_TRIGGER: ${{ github.event_name == 'schedule' && 'schedule' || inputs.trigger || 'manual' }}
        run: |
          test -n "$SUPABASE_URL" && test -n "$SUPABASE_SERVICE_ROLE_KEY"
          # Logs go to stderr; stdout carries only the JSON result.
          python -m app.jobs --collect-due --trigger "$RUN_TRIGGER" > "$RUNNER_TEMP/result.json"

      - name: Summarise run
        if: always()
        run: |
          python - "$RUNNER_TEMP/result.json" <<'PY'
          import json
          import os
          import sys
          from collections import Counter

          try:
              with open(sys.argv[1], encoding="utf-8") as result_file:
                  result = json.load(result_file)
          except (OSError, ValueError):
              raise SystemExit("Collector produced no result; see the previous step's log")

          def count(key):
              return result.get(key, 0)

          status = result.get("collection_status")
          summary = (
              "## Property News collection\n\n"
              f"- Status: `{status}`\n"
              f"- Sources active/due/attempted: {count('sources_active')}/{count('sources_due')}/"
              f"{count('sources_attempted')}\n"
              f"- Sources succeeded/failed: {count('sources_successful')}/{count('sources_failed')}\n"
              f"- Known URLs skipped without download: {count('known_urls_skipped')}\n"
              f"- Articles fetched/parsed/rejected/inserted: {count('articles_fetched')}/"
              f"{count('articles_parsed')}/{count('articles_rejected')}/{count('articles_inserted')}\n"
              f"- Items processed/published/pending review/retried/failures: {count('processed')}/"
              f"{count('published')}/{count('pending_review')}/{count('retried')}/"
              f"{count('processing_failures')}\n"
          )
          failures = result.get("source_failures") or []
          if failures:
              categories = Counter(failure.get("category", "unknown") for failure in failures)
              summary += "\n### Failed sources\n\n| Source | Failure category |\n|---|---|\n"
              for failure in failures:
                  name = str(failure.get("name", "")).replace("|", "\\|").replace("\n", " ")
                  summary += f"| {name} | `{failure.get('category', 'unknown')}` |\n"
              summary += "\nFailure categories: " + ", ".join(
                  f"`{category}`: {number}" for category, number in sorted(categories.items())
              ) + "\n"
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as step_summary:
              step_summary.write(summary)

          # Partial source failures are expected; only a run in which several
          # sources were attempted and all failed points at an outage (a single
          # due source timing out is not one). Daily health is checked by
          # property-news-daily-check.yml.
          if status == "failed" and count("sources_attempted") >= 3:
              raise SystemExit("Every attempted source failed")
          if count("sources_failed"):
              print(f"::warning::{count('sources_failed')} of {count('sources_attempted')} sources failed")
          PY
