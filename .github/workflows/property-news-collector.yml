name: Property News collector

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Run the protected collection job
        env:
          PROPERTY_NEWS_SCHEDULER_URL: ${{ secrets.PROPERTY_NEWS_SCHEDULER_URL }}
          NEWS_SCHEDULER_SECRET: ${{ secrets.NEWS_SCHEDULER_SECRET }}
        run: |
          test -n "$PROPERTY_NEWS_SCHEDULER_URL"
          test -n "$NEWS_SCHEDULER_SECRET"
          curl --fail --silent --show-error --retry 2 --retry-all-errors \
            --request POST \
            --header "Authorization: Bearer $NEWS_SCHEDULER_SECRET" \
            --header "Accept: application/json" \
            "$PROPERTY_NEWS_SCHEDULER_URL"
