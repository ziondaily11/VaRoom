name: Property News collector

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Run the protected collection job
        env:
          NEWS_SCHEDULER_SECRET: ${{ secrets.NEWS_SCHEDULER_SECRET }}
        run: |
          test -n "$NEWS_SCHEDULER_SECRET"
          curl --fail --silent --show-error --retry 2 --retry-all-errors \
            --connect-timeout 20 --max-time 60 \
            https://varoom-1.onrender.com/health \
            -o /dev/null
          curl --fail --silent --show-error --retry 2 --retry-all-errors \
            --request POST \
            --header "Authorization: Bearer $NEWS_SCHEDULER_SECRET" \
            --header "Accept: application/json" \
            --connect-timeout 20 --max-time 840 \
            "https://varoom-1.onrender.com/api/internal/jobs/collect"
