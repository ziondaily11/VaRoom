name: Property News daily check

# Once a day, checks the last 24 hours: were new stories collected, did the AI
# provider (not the rules fallback) analyse them, and did the collector run on
# schedule. A failed run makes GitHub email the repository owner, so one
# problem produces at most one email a day. The report is in the run summary.
on:
  schedule:
    - cron: "0 4 * * *" # 07:00 Africa/Nairobi
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: Production
    defaults:
      run:
        working-directory: property-news
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: property-news/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check the last 24 hours
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Only the expected provider is needed, not the key.
          NEWS_AI_PROVIDER: gemini
          NEWS_ENVIRONMENT: production
        run: |
          test -n "$SUPABASE_URL" && test -n "$SUPABASE_SERVICE_ROLE_KEY"
          python -m app.jobs --daily-check
