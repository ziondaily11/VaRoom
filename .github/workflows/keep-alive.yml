name: Keep Render service awake

# Pings the live health endpoint every 10 minutes so Render's free tier
# never sees 15+ minutes of inactivity and spins the service down.
# Also runnable manually from the Actions tab via workflow_dispatch.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          curl --fail --silent --show-error --retry 2 --retry-all-errors \
            --connect-timeout 20 --max-time 60 \
            https://varoom-1.onrender.com/health
          curl --fail --silent --show-error --retry 2 --retry-all-errors \
            --connect-timeout 20 --max-time 60 \
            "https://varoom-1.onrender.com/api/news/latest?limit=1" \
            -o /dev/null
