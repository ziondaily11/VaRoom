<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chats — VaRoom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;0,9..144,900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --red:#C41E3A; --red-deep:#8F1229; --accent:#C41E3A; --accent-deep:#8F1229;
    --accent-soft:#FBE4E7; --white:#FFFFFF; --on-accent:#FFFFFF;
    --ink:#1A1210; --paper:#FBF4F1; --panel:#FCFBFA; --surface-muted:#F5EFEC;
    --line:rgba(26,18,16,.15); --line-soft:rgba(26,18,16,.08);
    --muted:#7a6b67; --soft:#F4F1F0; --success:#C41E3A;
    --font-display:'Fraunces', serif; --font-body:'Inter', sans-serif;
  }
  [data-theme="dark"]{
    --white:#241C1A; --on-accent:#FFFFFF; --paper:#15100F; --surface-muted:#1B1412;
    --ink:#F5EFEC; --muted:#B8ACA8; --red-deep:#F0A5B2; --accent:#F0A5B2;
    --line:rgba(255,255,255,.15); --line-soft:rgba(255,255,255,.08);
    --accent-deep:#F0A5B2; --accent-soft:rgba(240,165,178,.18);
    --panel:#1B1412; --soft:#241C1A; --success:#F0A5B2;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  body{ font-family:var(--font-body); background:var(--paper); color:var(--ink); height:100vh; overflow:hidden; transition:background .2s ease, color .2s ease; }
  a{ color:inherit; text-decoration:none; }
  button{ font-family:inherit; cursor:pointer; border:none; background:none; }
  :focus-visible{ outline:3px solid var(--accent); outline-offset:3px; }

  header{ display:flex; align-items:center; justify-content:space-between; padding:1.1rem 1.6rem; border-bottom:1px solid var(--line); background:var(--white); }
  .logo{ font-family:var(--font-display); font-weight:900; font-size:1.4rem; display:flex; align-items:baseline; }
  .logo .va{ color:var(--red); }
  .back-link{ font-size:.88rem; font-weight:500; }
  .back-link:hover{ color:var(--red); }

  .chat-shell{ display:grid; grid-template-columns:320px 1fr; height:calc(100vh - 61px); background:var(--paper); }

  /* ---------- CONVERSATION LIST ---------- */
  .conv-list{ border-right:1px solid var(--line); overflow-y:auto; background:var(--white); }
  .conv-list-title{ font-family:var(--font-display); font-weight:600; font-size:1.15rem; padding:1.2rem 1.2rem .8rem; }

  .conv-item{
    display:flex; align-items:center; gap:.7rem; width:100%; text-align:left;
    padding:.8rem 1.2rem; border-bottom:1px solid var(--line-soft);
  }
  .chat-app{ display:grid; grid-template-columns:74px minmax(0,1fr); height:100vh; min-height:0; padding:1rem; gap:1rem; overflow:hidden; }
  .app-rail{
    background:#17120F; border:1px solid #17120F; border-radius:16px; padding:.8rem .65rem;
    display:flex; flex-direction:column; align-items:center; gap:.45rem; overflow:hidden;
  }
  .brand-mark{ width:38px; height:38px; display:grid; place-items:center; color:#fff; margin-bottom:.95rem; font-family:var(--font-display); font-size:1.25rem; font-weight:900; }
  .brand-mark span{ color:var(--accent); }
  .rail-link{ width:42px; height:42px; display:grid; place-items:center; border-radius:10px; color:#BDB6B2; transition:background .2s,color .2s; }
  .rail-link:hover{ color:#fff; background:rgba(255,255,255,.1); }
  .rail-link.active{ background:var(--accent); color:#fff; position:relative; }
  .rail-link.active:before{ content:''; width:3px; height:25px; border-radius:4px; background:var(--accent); position:absolute; left:-.65rem; }
  .rail-spacer{ flex:1; }
  .rail-profile{ width:32px; height:32px; border-radius:50%; color:#fff; background:#413735; display:grid; place-items:center; font-weight:700; font-size:.72rem; }

  .chat-stage{ min-width:0; min-height:0; border:1px solid var(--line); border-radius:16px; overflow:hidden; background:var(--white); display:flex; flex-direction:column; }
  header{ flex:0 0 auto; min-height:72px; display:flex; align-items:center; gap:1.5rem; padding:0 1.4rem; border-bottom:1px solid var(--line); background:var(--white); }
  .page-title{ font-size:1.55rem; font-weight:700; letter-spacing:-.04em; white-space:nowrap; }
  .logo{ display:none; }
  .search-wrap{ width:min(360px,42vw); min-width:170px; display:flex; align-items:center; gap:.55rem; background:var(--soft); color:var(--muted); border:1px solid var(--line); border-radius:11px; padding:.62rem .78rem; margin-left:auto; }
  .search-wrap input{ min-width:0; flex:1; background:transparent; color:var(--ink); border:0; font:inherit; font-size:.82rem; }
  .search-wrap input:focus{ outline:none; }
  .search-shortcut{ font-size:.68rem; color:var(--muted); border:1px solid var(--line); padding:.12rem .28rem; border-radius:4px; white-space:nowrap; }
  .help-link{ color:var(--muted); width:30px; height:30px; display:grid; place-items:center; }
  .back-link{ font-size:.8rem; font-weight:650; padding:.55rem .75rem; color:var(--ink); border:1px solid var(--line); border-radius:9px; white-space:nowrap; }
  .back-link:hover{ border-color:var(--accent); color:var(--accent); }

  .chat-shell{ display:grid; grid-template-columns:320px minmax(0,1fr) 286px; min-height:0; flex:1; overflow:hidden; }

  /* ---------- CONVERSATION LIST ---------- */
  .conv-list{ min-height:0; background:var(--panel); border-right:1px solid var(--line); overflow-y:auto; overscroll-behavior:contain; scrollbar-width:thin; }
  .inbox-head{ padding:1.05rem 1rem .7rem; display:flex; align-items:center; justify-content:space-between; }
  .conv-list-title{ font-size:1rem; font-weight:750; letter-spacing:-.025em; }
  .filter-btn{ display:flex; align-items:center; gap:.35rem; border:1px solid var(--line); background:var(--white); color:var(--ink); border-radius:8px; font-size:.73rem; font-weight:650; padding:.45rem .58rem; }
  .filter-btn:hover{ border-color:var(--accent); color:var(--accent); }
  .inbox-section-label{ color:var(--muted); font-size:.7rem; font-weight:700; letter-spacing:.04em; text-transform:uppercase; padding:.45rem 1.1rem .55rem; }
  .conv-item{ display:flex; align-items:center; gap:.68rem; width:100%; text-align:left; padding:.64rem 1rem; border-left:3px solid transparent; transition:background .16s ease; }
  .conv-item:hover{ background:var(--white); }
  .conv-item.active{ background:var(--white); border-left-color:var(--accent); }

  .conv-avatar{
    width:42px; height:42px; border-radius:50%; background:var(--red); color:var(--on-accent);
    display:flex; align-items:center; justify-content:center; font-weight:700; font-size:.95rem;
    flex-shrink:0; overflow:hidden;
  }
  .conv-avatar{ width:40px; height:40px; border-radius:50%; background:#4B403D; color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:.9rem; flex-shrink:0; overflow:hidden; position:relative; }
  .conv-avatar img{ width:100%; height:100%; object-fit:cover; }
  .conv-avatar:after{ content:''; position:absolute; width:9px; height:9px; background:var(--success); border:2px solid var(--panel); right:0; bottom:0; border-radius:50%; }
  .conv-info{ flex:1; min-width:0; }
  .conv-name{ font-weight:700; font-size:.84rem; line-height:1.2; }
  .conv-listing{ display:none; }
  .conv-preview{ font-size:.73rem; color:var(--muted); margin-top:.21rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .conv-time{ font-size:.68rem; color:var(--muted); flex-shrink:0; align-self:flex-start; margin-top:.08rem; }
  .empty-list{ padding:2rem 1.2rem; color:var(--muted); font-size:.85rem; text-align:center; line-height:1.5; }

  /* ---------- THREAD ---------- */
  .thread-panel{ display:flex; flex-direction:column; height:100%; background:var(--paper); }
  .thread-empty{ flex:1; display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:.95rem; text-align:center; padding:2rem; }

  .thread-header{
    display:flex; align-items:center; gap:.7rem; padding:.9rem 1.4rem;
    border-bottom:1px solid var(--line); background:var(--white);
  }
  .thread-back{ display:none; }
  .thread-header-name{ font-weight:700; font-size:.95rem; }

  .listing-context{
    display:flex; align-items:center; gap:.9rem; margin:.9rem 1.4rem 0;
    background:var(--white); border:1px solid var(--line); border-radius:12px;
    padding:.8rem .9rem;
  }
  .listing-context-thumb{
    width:64px; height:64px; border-radius:10px; background:linear-gradient(135deg, var(--red) 0%, var(--red-deep) 100%);
    flex-shrink:0; overflow:hidden;
  }
  .listing-context-thumb img{ width:100%; height:100%; object-fit:cover; }
  .listing-context-info{ flex:1; min-width:0; }
  .listing-context-title{ font-size:.87rem; font-weight:700; }
  .listing-context-loc{ font-size:.76rem; color:var(--muted); margin-top:.1rem; }
  .listing-context-meta{ font-size:.76rem; color:var(--muted); margin-top:.2rem; }
  .listing-context-price{ font-size:.85rem; font-weight:700; color:var(--ink); margin-top:.2rem; }
  .listing-context-price span{ font-weight:500; color:var(--muted); font-size:.74rem; }
  .listing-context-book{
    flex-shrink:0; background:var(--red); color:var(--on-accent);
    font-size:.78rem; font-weight:600; padding:.5rem 1rem; border-radius:100px;
  }
  .listing-context-book:hover{ background:var(--red-deep); }

  .messages-area{ flex:1; overflow-y:auto; padding:1.2rem 1.4rem; display:flex; flex-direction:column; gap:.6rem; }

  .msg-bubble{ max-width:70%; padding:.6rem .9rem; border-radius:16px; font-size:.9rem; line-height:1.4; }
  .msg-bubble.mine{ align-self:flex-end; background:var(--red); color:var(--on-accent); border-bottom-right-radius:4px; }
  .msg-bubble.theirs{ align-self:flex-start; background:var(--white); border:1px solid var(--line); border-bottom-left-radius:4px; }
  .thread-panel{ display:flex; flex-direction:column; min-width:0; min-height:0; background:var(--white); }
  .thread-empty{ flex:1; display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:.9rem; text-align:center; padding:2rem; }
  .thread-header{ flex:0 0 auto; display:flex; align-items:center; gap:.7rem; padding:.68rem 1rem; border-bottom:1px solid var(--line); background:var(--white); }
  .thread-back{ display:none; color:var(--ink); }
  .thread-header .conv-avatar{ width:37px; height:37px; }
  .thread-header-name{ font-weight:750; font-size:.93rem; letter-spacing:-.015em; }
  .thread-header-meta{ color:var(--muted); font-size:.7rem; margin-top:.15rem; }
  .thread-details-button{ display:none; margin-left:auto; width:30px; height:30px; color:var(--accent); border:1px solid #EFB7C2; border-radius:7px; align-items:center; justify-content:center; }

  .listing-context{ flex:0 0 auto; display:flex; align-items:center; gap:.6rem; margin:.55rem 1rem 0; background:var(--panel); border:1px solid var(--line); border-radius:9px; padding:.48rem .55rem; }
  .listing-context-thumb{ width:40px; height:40px; border-radius:6px; background:linear-gradient(135deg,#E76C80 0%,var(--accent-deep) 100%); flex-shrink:0; overflow:hidden; }
  .listing-context-thumb img{ width:100%; height:100%; object-fit:cover; }
  .listing-context-info{ flex:1; min-width:0; }
  .listing-context-title{ font-size:.76rem; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .listing-context-loc,.listing-context-meta{ font-size:.68rem; color:var(--muted); margin-top:.12rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .listing-context-price{ font-size:.72rem; font-weight:700; margin-top:.12rem; }
  .listing-context-price span{ font-weight:500; color:var(--muted); font-size:.67rem; }
  .listing-context-book{ flex-shrink:0; background:var(--accent-soft); color:var(--accent-deep); font-size:.68rem; font-weight:700; padding:.45rem .62rem; border-radius:7px; }
  .listing-context-book:hover{ background:var(--accent); color:#fff; }

  .messages-area{ flex:1; min-height:0; overflow-y:auto; overscroll-behavior:contain; padding:.8rem 1rem; display:flex; flex-direction:column; gap:.4rem; background:var(--panel); }
  .msg-bubble{ max-width:min(74%,430px); padding:.4rem .65rem; border-radius:10px; font-size:.88rem; line-height:1.3; }
  .msg-bubble.mine{ align-self:flex-end; background:#111; color:#fff; border:1px solid #111; border-bottom-right-radius:4px; }
  .msg-bubble.theirs{ align-self:flex-start; background:#fff; color:#111; border:1px solid #111; border-bottom-left-radius:4px; }
  [data-theme="dark"] .msg-bubble.mine{ background:#fff; color:#111; border-color:#fff; }
  [data-theme="dark"] .msg-bubble.theirs{ background:#111; color:#fff; border-color:#fff; }

  .typing-dots{ display:flex; align-items:center; gap:.28rem; padding:.15rem 0; }
  .typing-dots span{
    width:7px; height:7px; border-radius:50%; background:var(--muted);
    animation:typing-bounce 1.1s infinite ease-in-out;
  }
  .typing-dots span:nth-child(2){ animation-delay:.15s; }
  .typing-dots span:nth-child(3){ animation-delay:.3s; }
  @keyframes typing-bounce{
    0%, 60%, 100%{ transform:translateY(0); opacity:.5; }
    30%{ transform:translateY(-4px); opacity:1; }
  }
  .msg-time{ font-size:.68rem; opacity:.7; margin-top:.25rem; }

  .composer{
    display:flex; gap:.7rem; padding:1rem 1.4rem; border-top:1px solid var(--line); background:var(--white);
  }
  .composer input{
    flex:1; font-family:inherit; font-size:.92rem; padding:.75rem 1rem;
    border:1px solid var(--line); border-radius:100px; background:var(--surface-muted); color:var(--ink);
  }
  .composer input:focus{ outline:none; border-color:var(--red); }
  .composer button{
    background:var(--red); color:var(--on-accent); width:42px; height:42px; border-radius:50%;
    display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:background .2s ease;
  }
  .composer button:hover{ background:var(--red-deep); }
  .msg-time{ font-size:.62rem; opacity:.7; margin-top:.1rem; }

  .composer{ flex:0 0 auto; display:flex; align-items:center; gap:.55rem; padding:.62rem 1rem; border-top:1px solid var(--line); background:var(--white); }
  .composer-add{ color:var(--muted); width:28px; height:28px; display:grid; place-items:center; border-radius:8px; }
  .composer-add:hover{ color:var(--accent); background:var(--accent-soft); }
  .composer input{ flex:1; min-width:0; font-family:inherit; font-size:.88rem; padding:.52rem .1rem; border:0; background:transparent; color:var(--ink); }
  .composer input:focus{ outline:none; }
  .composer button#send-btn{ background:var(--accent); color:#fff; width:36px; height:36px; border-radius:10px; display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:background .2s ease,transform .2s ease; }
  .composer button#send-btn:hover{ background:var(--accent-deep); transform:translateY(-1px); }
  .composer button:disabled{ opacity:.5; cursor:not-allowed; }

  .checking-msg{ text-align:center; padding:4rem 0; color:var(--muted); }
  .away-banner{ display:flex; align-items:center; gap:.5rem; margin:.55rem 1rem 0; background:var(--accent-soft); border:1px solid rgba(196,30,58,.18); border-radius:8px; padding:.45rem .6rem; font-size:.72rem; color:var(--accent-deep); line-height:1.35; }
  .msg-bubble.auto-reply{ border:1px dashed rgba(196,30,58,.45); }
  .auto-reply-tag{ display:inline-block; font-size:.62rem; font-weight:700; letter-spacing:.02em; text-transform:uppercase; color:var(--accent); margin-bottom:.2rem; }

  /* ---------- CONTACT DETAILS ---------- */
  .details-panel{ min-height:0; background:var(--panel); border-left:1px solid var(--line); overflow-y:auto; overscroll-behavior:contain; }
  .details-empty{ color:var(--muted); font-size:.8rem; line-height:1.5; padding:2rem 1.2rem; text-align:center; }
  .details-title{ padding:.95rem 1rem .75rem; color:var(--ink); font-size:.86rem; font-weight:750; border-bottom:1px solid var(--line); }
  .details-back{ display:none; }
  .contact-card{ padding:1rem; border-bottom:1px solid var(--line); text-align:center; }
  .contact-card .conv-avatar{ width:54px; height:54px; margin:0 auto .52rem; font-size:1.05rem; }
  .contact-card .conv-avatar:after{ border-color:var(--panel); }
  .contact-name{ font-size:.92rem; font-weight:750; }
  .contact-role{ color:var(--muted); font-size:.72rem; margin-top:.2rem; }
  .details-section{ padding:.9rem 1rem; border-bottom:1px solid var(--line); }
  .details-heading{ font-size:.72rem; font-weight:750; color:var(--ink); margin-bottom:.7rem; }
  .detail-row{ display:flex; align-items:flex-start; gap:.52rem; color:var(--muted); font-size:.72rem; line-height:1.35; padding:.28rem 0; }
  .detail-row svg{ flex:0 0 auto; margin-top:.05rem; color:var(--accent); }
  .detail-label{ display:block; color:var(--muted); font-size:.65rem; margin-bottom:.05rem; }
  .detail-value{ display:block; color:var(--ink); font-size:.74rem; overflow-wrap:anywhere; }
  .related-listing{ display:flex; align-items:center; gap:.55rem; background:var(--white); border:1px solid var(--line); border-radius:7px; padding:.45rem; }
  .related-listing .listing-context-thumb{ width:35px; height:35px; }
  .related-listing-title{ font-size:.7rem; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .related-listing-sub{ color:var(--muted); font-size:.65rem; margin-top:.14rem; }

  @media (max-width:1050px){ .chat-shell{ grid-template-columns:290px minmax(0,1fr); } .details-panel{ display:none; } }
  @media (max-width:760px){
    body{ background:var(--white); overflow:hidden; }
    .chat-app{ display:block; height:100vh; padding:0; }
    .app-rail{ display:none; }
    .chat-stage{ height:100vh; min-height:0; border:0; border-radius:0; box-shadow:none; }
    header{ min-height:64px; padding:0 1.05rem; justify-content:center; }
    .page-title{ font-size:1rem; }
    .search-wrap,.help-link,.back-link{ display:none; }
    .chat-shell{ display:block !important; min-height:0; flex:1; overflow:hidden; }
    .conv-list{ display:block; height:100%; border:0; background:var(--white); overflow-y:auto; }
    .conv-list.hide-mobile{ display:none; }
    .inbox-head{ display:none; }
    .inbox-section-label{ display:flex; padding:.35rem 1.2rem .45rem; font-size:.66rem; justify-content:space-between; }
    .inbox-section-label:after{ content:'Recent'; color:var(--muted); font-weight:600; text-transform:none; letter-spacing:0; }
    .conv-item{ padding:.75rem 1.05rem; gap:.72rem; border-left:0; }
    .conv-item.active{ border-left:0; background:var(--accent-soft); }
    .conv-avatar{ width:43px; height:43px; }
    .conv-name{ font-size:.83rem; }
    .conv-preview{ font-size:.71rem; }
    .conv-time{ color:var(--accent); font-size:.66rem; }
    .thread-panel{ display:none; height:100%; min-height:0; }
    .thread-panel.show-mobile{ display:flex; }
    .thread-back{ display:flex; align-items:center; justify-content:center; width:30px; height:30px; margin-left:-.32rem; }
    .thread-details-button{ display:flex; }
    .thread-header{ padding:.7rem .9rem; }
    .listing-context{ margin:.65rem .85rem 0; }
    .messages-area{ padding:.75rem .85rem; }
    .msg-bubble{ max-width:83%; }
    .composer{ padding:.7rem .85rem; }
    .details-panel{ display:none; height:100%; border-left:0; background:var(--white); }
    .details-panel.show-mobile{ display:block; }
    .details-back{ display:flex; align-items:center; gap:.45rem; width:100%; padding:.8rem 1rem; color:var(--ink); font-size:.82rem; font-weight:700; border-bottom:1px solid var(--line); }
  }
</style>
</head>
<body>
<div class="chat-app">
  <nav class="app-rail" aria-label="Primary navigation">
    <a href="index.html" class="brand-mark" aria-label="VaRoom home"><span>V</span></a>
    <a href="client-home.html" class="rail-link" id="home-nav" aria-label="Home">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1Z"/><path d="M9 21v-7h6v7"/></svg>
    </a>
    <a href="chats.html" class="rail-link active" aria-current="page" aria-label="Chats">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7A8.38 8.38 0 0 1 4 11.5a8.5 8.5 0 0 1 4.7-7.6A8.38 8.38 0 0 1 12.5 3h.5a8.48 8.48 0 0 1 8 8v.5Z"/></svg>
    </a>
    <a href="bookings.html" class="rail-link" aria-label="Bookings">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
    </a>
    <a href="analytics.html" class="rail-link" aria-label="Analytics">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
    </a>
    <a href="payments.html" class="rail-link" aria-label="Payments">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18M7 15h3"/></svg>
    </a>
    <a href="profile.html" class="rail-link" aria-label="Profile">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="7" r="4"/><path d="M5.5 21a6.5 6.5 0 0 1 13 0"/></svg>
    </a>
    <span class="rail-spacer"></span>
    <a href="settings.html" class="rail-link" aria-label="Settings">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.1 2.1-.06-.06a1.7 1.7 0 0 0-1.88-.34 1.7 1.7 0 0 0-1.03 1.56v.1h-3v-.1a1.7 1.7 0 0 0-1.03-1.56 1.7 1.7 0 0 0-1.88.34l-.06.06-2.1-2.1.06-.06A1.7 1.7 0 0 0 7.06 15a1.7 1.7 0 0 0-1.56-1.03h-.1v-3h.1A1.7 1.7 0 0 0 7.06 9.94a1.7 1.7 0 0 0-.34-1.88l-.06-.06 2.1-2.1.06.06a1.7 1.7 0 0 0 1.88.34 1.7 1.7 0 0 0 1.03-1.56v-.1h3v.1a1.7 1.7 0 0 0 1.03 1.56 1.7 1.7 0 0 0 1.88-.34l.06-.06 2.1 2.1-.06.06a1.7 1.7 0 0 0-.34 1.88 1.7 1.7 0 0 0 1.56 1.03h.1v3h-.1A1.7 1.7 0 0 0 19.4 15Z"/></svg>
    </a>
    <div class="rail-profile" aria-label="Your profile">VR</div>
  </nav>

  <main class="chat-stage">
    <header>
      <h1 class="page-title">Chats</h1>
      <label class="search-wrap" for="chat-search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
        <input id="chat-search" type="search" placeholder="Search conversations" autocomplete="off">
        <span class="search-shortcut">⌘ K</span>
      </label>
      <a href="#" class="help-link" aria-label="Help">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><path d="M9.7 9a2.4 2.4 0 1 1 4.2 1.6c-.9.9-1.9 1.3-1.9 2.7"/><path d="M12 16.8h.01"/></svg>
      </a>
      <a href="#" class="back-link" id="back-link">Dashboard</a>
    </header>

    <div id="checking-auth" class="checking-msg">Loading your chats...</div>

    <div class="chat-shell" id="chat-shell" style="display:none;">
      <aside class="conv-list" id="conv-list">
        <div class="inbox-head">
          <p class="conv-list-title">Your inbox</p>
          <button type="button" class="filter-btn" aria-label="Filter conversations">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M7 12h10M10 18h4"/></svg> Filter
          </button>
        </div>
        <p class="inbox-section-label">Conversations</p>
        <div id="conv-list-items"></div>
      </aside>

      <section class="thread-panel" id="thread-panel" aria-live="polite">
        <div class="thread-empty" id="thread-empty">Choose a conversation to see your messages.</div>
      </section>

      <aside class="details-panel" id="details-panel">
        <div class="details-empty">Select a conversation to view contact and property details.</div>
      </aside>
    </div>
  </main>
</div>

<script src="js/supabase-client.js"></script>
<script>
  (async function(){
    const checkingAuth = document.getElementById('checking-auth');
    const chatShell = document.getElementById('chat-shell');
    const convListEl = document.getElementById('conv-list-items');
    const convListPanel = document.getElementById('conv-list');
    const threadPanel = document.getElementById('thread-panel');
    const detailsPanel = document.getElementById('details-panel');
    const chatSearch = document.getElementById('chat-search');

    let currentUser = null;
    let currentRole = null;
    let conversations = [];
    let activeConversationId = null;
    let realtimeChannel = null;

    function resolveTheme(choice){
      return choice === 'system'
        ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
        : choice;
    }

    function applyTheme(choice){
      const resolved = resolveTheme(choice);
      document.documentElement.setAttribute('data-theme', resolved);
      localStorage.setItem('varoom_theme', choice);
    }

    const CHATBOT_REPLY_URL = 'https://varoom.onrender.com/reply';
    // Same cold-start mitigation as elie.html — wake the service up as
    // soon as the chat page opens, not only when an auto-reply is needed.
    fetch('https://varoom.onrender.com/health').catch(function(){});

    const { data: { session } } = await supabaseClient.auth.getSession();
    if (!session) { window.location.href = 'login.html'; return; }
    currentUser = session.user;

    const { data: profile } = await supabaseClient
      .from('profiles').select('role, theme_preference, full_name, avatar_url').eq('id', currentUser.id).maybeSingle();
    if (!profile) { window.location.href = 'login.html'; return; }
    currentRole = profile.role;
    applyTheme(profile.theme_preference || localStorage.getItem('varoom_theme') || 'system');
    document.getElementById('back-link').setAttribute('href', currentRole === 'host' ? 'host-home.html' : 'client-home.html');
    document.getElementById('home-nav').setAttribute('href', currentRole === 'host' ? 'host-home.html' : 'client-home.html');
    const railProfile = document.querySelector('.rail-profile');
    if (profile.full_name) railProfile.textContent = profile.full_name.split(/\s+/).map(function(part){ return part.charAt(0); }).join('').slice(0, 2).toUpperCase();

    function escapeHtml(str){
      const div = document.createElement('div');
      div.textContent = str || '';
      return div.innerHTML;
    }

    function resolveAvatarUrl(avatarValue){
      if (!avatarValue) return null;
      if (avatarValue.indexOf('http') === 0) return avatarValue;
      return supabaseClient.storage.from('avatars').getPublicUrl(avatarValue).data.publicUrl;
    }

    function timeAgo(dateStr){
      const diffMs = Date.now() - new Date(dateStr).getTime();
      const mins = Math.floor(diffMs / 60000);
      if (mins < 1) return 'now';
      if (mins < 60) return mins + 'm';
      const hrs = Math.floor(mins / 60);
      if (hrs < 24) return hrs + 'h';
      return Math.floor(hrs / 24) + 'd';
    }

    // ---------- Load conversation list ----------
    async function loadConversations(){
      const { data, error } = await supabaseClient
        .from('conversations')
        .select('id,listing_id,host_id,client_id,last_message_at,' +
          'host:profiles!conversations_host_id_fkey(full_name,username,phone,avatar_url,away_mode),' +
          'client:profiles!conversations_client_id_fkey(full_name,username,phone,avatar_url),' +
          'listing:listings(title,location_text,listing_photos(storage_path),' +
          'booking_details:listing_booking_details(price_amount,price_unit,size_or_type,max_guests))')
        .or('host_id.eq.' + currentUser.id + ',client_id.eq.' + currentUser.id)
        .order('last_message_at', { ascending:false });

      if (error) {
        convListEl.innerHTML = '<p class="empty-list">Couldn\'t load chats: ' + escapeHtml(error.message) + '</p>';
        return;
      }

      conversations = data || [];

      if (conversations.length === 0) {
        convListEl.innerHTML = '<p class="empty-list">No chats yet. Tap "Chat" on a listing to start one.</p>';
        return;
      }

      // Fetch the most recent message per conversation for a preview line
      const convIds = conversations.map(function(c){ return c.id; });
      const { data: recentMessages } = await supabaseClient
        .from('messages')
        .select('conversation_id, body, created_at')
        .in('conversation_id', convIds)
        .order('created_at', { ascending:false });

      const previewByConv = {};
      (recentMessages || []).forEach(function(m){
        if (!previewByConv[m.conversation_id]) previewByConv[m.conversation_id] = m.body;
      });

      convListEl.innerHTML = conversations.map(function(conv){
        const isHost = conv.host_id === currentUser.id;
        const other = (isHost ? conv.client : conv.host) || {};
        const initial = (other.full_name || '?').charAt(0).toUpperCase();
        const avatarUrl = resolveAvatarUrl(other.avatar_url);
        const avatarHtml = avatarUrl ? '<img src="' + avatarUrl + '" alt="">' : initial;
        const preview = previewByConv[conv.id] || 'Say hello 👋';
        const listingTitle = conv.listing && conv.listing.title ? conv.listing.title : 'VaRoom listing';

        return (
          '<button type="button" class="conv-item" data-conv-id="' + conv.id + '">' +
            '<div class="conv-avatar">' + avatarHtml + '</div>' +
            '<div class="conv-info">' +
              '<div class="conv-name">' + escapeHtml(other.full_name || 'VaRoom user') + '</div>' +
              '<div class="conv-listing">' + escapeHtml(listingTitle) + '</div>' +
              '<div class="conv-preview">' + escapeHtml(preview) + '</div>' +
            '</div>' +
            '<div class="conv-time">' + timeAgo(conv.last_message_at) + '</div>' +
          '</button>'
        );
      }).join('');

      convListEl.querySelectorAll('.conv-item').forEach(function(btn){
        btn.addEventListener('click', function(){
          openConversation(btn.getAttribute('data-conv-id'));
        });
      });
      applyConversationFilter(chatSearch.value);
    }

    function applyConversationFilter(query){
      const search = (query || '').trim().toLowerCase();
      convListEl.querySelectorAll('.conv-item').forEach(function(item){
        item.hidden = !!search && !item.textContent.toLowerCase().includes(search);
      });
    }

    // ---------- Open a conversation thread ----------
    async function openConversation(convId){
      activeConversationId = convId;
      const conv = conversations.find(function(c){ return c.id === convId; });
      if (!conv) return;

      convListEl.querySelectorAll('.conv-item').forEach(function(btn){
        btn.classList.toggle('active', btn.getAttribute('data-conv-id') === convId);
      });

      const isHost = conv.host_id === currentUser.id;
      const other = (isHost ? conv.client : conv.host) || {};
      const otherAvatarUrl = resolveAvatarUrl(other.avatar_url);
      const listing = conv.listing || {};
      const photos = listing.listing_photos || [];
      let thumbHtml = '';
      if (photos.length > 0) {
        const url = supabaseClient.storage.from('listing-photos').getPublicUrl(photos[0].storage_path).data.publicUrl;
        thumbHtml = '<img src="' + url + '" alt="">';
      }

      let booking = listing.booking_details;
      if (Array.isArray(booking)) booking = booking[0] || null;

      const metaBits = [];
      if (booking && booking.size_or_type) metaBits.push(escapeHtml(booking.size_or_type));
      if (booking && booking.max_guests) metaBits.push('Up to ' + booking.max_guests + ' guests');

      const priceHtml = (booking && booking.price_amount !== null && booking.price_amount !== undefined)
        ? 'KSh ' + Number(booking.price_amount).toLocaleString() + (booking.price_unit ? ' <span>/ ' + escapeHtml(booking.price_unit) + '</span>' : '')
        : '';

      const contactName = other.full_name || 'VaRoom user';
      const contactInitial = contactName.charAt(0).toUpperCase();
      const contactRole = isHost ? 'Guest' : 'Host';
      const listingTitle = listing.title || 'VaRoom listing';
      const locationText = listing.location_text || 'Location shared in listing';
      const contactTitle = isHost ? 'Client details' : 'Host details';
      const contactEmail = other.email || '';
      const contactEmailText = contactEmail ? escapeHtml(contactEmail) : 'Not shared';
      const lastActivity = timeAgo(conv.last_message_at);
      const lastActivityText = lastActivity === 'now' ? 'Just now' : lastActivity + ' ago';
      const contactPhoneHtml = other.phone
        ? '<div class="detail-row"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.3 1.8.6 2.6a2 2 0 0 1-.5 2.1L8 9.6a16 16 0 0 0 6 6l1.2-1.2a2 2 0 0 1 2.1-.5c.8.3 1.7.5 2.6.6a2 2 0 0 1 1.7 2Z"/></svg><span><span class="detail-label">Phone</span><span class="detail-value">' + escapeHtml(other.phone) + '</span></span></div>'
        : '';

      threadPanel.innerHTML =
        '<div class="thread-header">' +
          '<button type="button" class="thread-back" id="thread-back-btn" aria-label="Back">' +
            '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>' +
          '</button>' +
          '<div class="conv-avatar">' + (otherAvatarUrl ? '<img src="' + otherAvatarUrl + '" alt="">' : contactInitial) + '</div>' +
          '<div><div class="thread-header-name">' + escapeHtml(contactName) + '</div><div class="thread-header-meta">' + contactRole + ' conversation</div></div>' +
          '<button type="button" class="thread-details-button" id="thread-details-btn" aria-label="Open contact details">' +
            '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><path d="M12 11v5M12 8h.01"/></svg>' +
          '</button>' +
        '</div>' +
        '<div class="listing-context">' +
          '<div class="listing-context-thumb">' + thumbHtml + '</div>' +
          '<div class="listing-context-info">' +
            '<div class="listing-context-title">' + escapeHtml(listingTitle) + '</div>' +
            '<div class="listing-context-loc">' + escapeHtml(locationText) + '</div>' +
            (metaBits.length ? '<div class="listing-context-meta">' + metaBits.join(' · ') + '</div>' : '') +
            (priceHtml ? '<div class="listing-context-price">' + priceHtml + '</div>' : '') +
          '</div>' +
          '<a href="booking.html?listing=' + encodeURIComponent(conv.listing_id) + '" class="listing-context-book">View &amp; book</a>' +
        '</div>' +
        (!isHost && other.away_mode
          ? '<div class="away-banner">🌙 This host is away right now — Elie may help answer using real listing details while they\'re offline.</div>'
          : '') +
        '<div class="messages-area" id="messages-area"></div>' +
        '<div class="composer">' +
          '<button type="button" class="composer-add" aria-label="Add attachment">' +
            '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.4 11.6-8.8 8.8a6 6 0 0 1-8.5-8.5l8.1-8.1a4 4 0 1 1 5.7 5.7l-8.1 8.1a2 2 0 0 1-2.8-2.8l7.4-7.4"/></svg>' +
          '</button>' +
          '<input type="text" id="message-input" placeholder="Write a message…" autocomplete="off">' +
          '<button type="button" id="send-btn" aria-label="Send">' +
            '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M2 21l21-9L2 3v7l15 2-15 2v7z"/></svg>' +
          '</button>' +
        '</div>';

      detailsPanel.innerHTML =
        '<button type="button" class="details-back" id="details-back-btn"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>Conversation</button>' +
        '<div class="details-title">' + contactTitle + '</div>' +
        '<div class="contact-card">' +
          '<div class="conv-avatar">' + (otherAvatarUrl ? '<img src="' + otherAvatarUrl + '" alt="">' : contactInitial) + '</div>' +
          '<div class="contact-name">' + escapeHtml(contactName) + '</div>' +
          '<div class="contact-role">' + contactRole + ' on VaRoom</div>' +
        '</div>' +
        '<div class="details-section">' +
          '<div class="details-heading">Contact</div>' +
          '<div class="detail-row"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg><span><span class="detail-label">Email</span><span class="detail-value">' + contactEmailText + '</span></span></div>' +
          contactPhoneHtml +
        '</div>' +
        '<div class="details-section">' +
          '<div class="details-heading">Conversation</div>' +
          '<div class="detail-row"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 6-9 11-9 11S3 16 3 10a9 9 0 1 1 18 0Z"/><circle cx="12" cy="10" r="3"/></svg><span><span class="detail-label">Listing location</span><span class="detail-value">' + escapeHtml(locationText) + '</span></span></div>' +
          '<div class="detail-row"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 4h16v16H4z"/><path d="M8 2v4M16 2v4M4 10h16"/></svg><span><span class="detail-label">Last activity</span><span class="detail-value">' + lastActivityText + '</span></span></div>' +
        '</div>' +
        '<div class="details-section">' +
          '<div class="details-heading">Related listing</div>' +
          '<a class="related-listing" href="booking.html?listing=' + encodeURIComponent(conv.listing_id) + '">' +
            '<div class="listing-context-thumb">' + thumbHtml + '</div>' +
            '<div style="min-width:0"><div class="related-listing-title">' + escapeHtml(listingTitle) + '</div><div class="related-listing-sub">View property details</div></div>' +
          '</a>' +
        '</div>';

      document.getElementById('thread-back-btn').addEventListener('click', function(){
        convListPanel.classList.remove('hide-mobile');
        threadPanel.classList.remove('show-mobile');
        detailsPanel.classList.remove('show-mobile');
      });

      document.getElementById('thread-details-btn').addEventListener('click', function(){
        threadPanel.classList.remove('show-mobile');
        detailsPanel.classList.add('show-mobile');
      });
      document.getElementById('details-back-btn').addEventListener('click', function(){
        detailsPanel.classList.remove('show-mobile');
        threadPanel.classList.add('show-mobile');
      });

      if (window.innerWidth <= 760) {
        convListPanel.classList.add('hide-mobile');
        threadPanel.classList.add('show-mobile');
        detailsPanel.classList.remove('show-mobile');
      }

      await loadMessages(convId, other);
      subscribeToConversation(convId, other);

      const input = document.getElementById('message-input');
      const sendBtn = document.getElementById('send-btn');

      async function triggerAutoReplyIfAway(messageBody){
        try {
          const { data: { session: freshSession } } = await supabaseClient.auth.getSession();
          if (!freshSession) return;
          await fetch(CHATBOT_REPLY_URL, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': 'Bearer ' + freshSession.access_token
            },
            body: JSON.stringify({
              conversation_id: convId,
              listing_id: conv.listing_id,
              message: messageBody
            })
          });
          // No manual render needed — a real reply, if any, lands via the
          // realtime subscription already listening on this conversation.
        } catch (err) {
          // Silent by design: a failed auto-reply shouldn't alarm the
          // client or block their own message from having sent — the
          // host will still see and can answer it themselves.
        }
      }

      async function sendMessage(){
        const body = input.value.trim();
        if (!body) return;
        sendBtn.disabled = true;

        const { data: inserted, error } = await supabaseClient
          .from('messages')
          .insert({ conversation_id: convId, sender_id: currentUser.id, body: body })
          .select()
          .single();

        sendBtn.disabled = false;
        if (error) { return; }

        input.value = '';
        appendMessage(inserted, true);
        await supabaseClient.from('conversations').update({ last_message_at: new Date().toISOString() }).eq('id', convId);

        if (!isHost) {
          triggerAutoReplyIfAway(body);
        }
      }

      sendBtn.addEventListener('click', sendMessage);
      input.addEventListener('keydown', function(e){
        if (e.key === 'Enter') sendMessage();
      });

      let lastTypingBroadcast = 0;
      input.addEventListener('input', function(){
        if (!realtimeChannel) return;
        const now = Date.now();
        if (now - lastTypingBroadcast < 1500) return;
        lastTypingBroadcast = now;
        realtimeChannel.send({ type: 'broadcast', event: 'typing', payload: { user_id: currentUser.id } });
      });

      input.focus();
    }

    async function loadMessages(convId){
      const { data } = await supabaseClient
        .from('messages')
        .select('id, sender_id, body, created_at, is_auto_reply')
        .eq('conversation_id', convId)
        .order('created_at', { ascending:true });

      const area = document.getElementById('messages-area');
      area.innerHTML = '';
      (data || []).forEach(function(m){ appendMessage(m, m.sender_id === currentUser.id); });
    }

    function appendMessage(m, isMine){
      const area = document.getElementById('messages-area');
      if (!area) return;
      if (area.querySelector('[data-message-id="' + m.id + '"]')) return; // avoid duplicate from realtime echo

      const bubble = document.createElement('div');
      bubble.className = 'msg-bubble ' + (isMine ? 'mine' : 'theirs') + (m.is_auto_reply ? ' auto-reply' : '');
      bubble.setAttribute('data-message-id', m.id);
      const tagHtml = m.is_auto_reply ? '<span class="auto-reply-tag">Auto-reply from Elie</span><br>' : '';
      bubble.innerHTML = tagHtml + escapeHtml(m.body) + '<div class="msg-time">' + timeAgo(m.created_at) + '</div>';
      area.appendChild(bubble);
      area.scrollTop = area.scrollHeight;
    }

    let typingIndicatorTimeout = null;

    function showTypingIndicator(){
      const area = document.getElementById('messages-area');
      if (!area) return;
      let el = document.getElementById('typing-indicator-row');
      if (!el) {
        el = document.createElement('div');
        el.id = 'typing-indicator-row';
        el.className = 'msg-bubble theirs';
        el.innerHTML = '<div class="typing-dots"><span></span><span></span><span></span></div>';
        area.appendChild(el);
      }
      area.scrollTop = area.scrollHeight;
      clearTimeout(typingIndicatorTimeout);
      // No explicit "stopped typing" signal is sent, so this just expires
      // on its own if no further typing events arrive within 3s.
      typingIndicatorTimeout = setTimeout(hideTypingIndicator, 3000);
    }

    function hideTypingIndicator(){
      clearTimeout(typingIndicatorTimeout);
      const el = document.getElementById('typing-indicator-row');
      if (el) el.remove();
    }

    function subscribeToConversation(convId){
      if (realtimeChannel) supabaseClient.removeChannel(realtimeChannel);

      realtimeChannel = supabaseClient
        .channel('conversation-' + convId)
        .on('postgres_changes', {
          event: 'INSERT', schema: 'public', table: 'messages',
          filter: 'conversation_id=eq.' + convId
        }, function(payload){
          if (payload.new.sender_id !== currentUser.id) {
            appendMessage(payload.new, false);
            hideTypingIndicator();
          }
        })
        .on('broadcast', { event: 'typing' }, function(msg){
          if (msg.payload && msg.payload.user_id && msg.payload.user_id !== currentUser.id) {
            showTypingIndicator();
          }
        })
        .subscribe();
    }

    // ---------- Init ----------
    await loadConversations();
    checkingAuth.style.display = 'none';
    chatShell.style.display = 'grid';

    chatSearch.addEventListener('input', function(){
      applyConversationFilter(chatSearch.value);
    });
    document.addEventListener('keydown', function(event){
      if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === 'k') {
        event.preventDefault();
        chatSearch.focus();
      }
    });

    const params = new URLSearchParams(window.location.search);
    const openId = params.get('c');
    if (openId) openConversation(openId);
  })();
</script>

</body>
</html>
