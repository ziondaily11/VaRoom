<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register as Host — VaRoom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;0,9..144,900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --red:#C41E3A; --red-deep:#8F1229; --white:#FFFFFF; --ink:#1A1210; --paper:#FBF4F1;
    --font-display:'Fraunces', serif; --font-body:'Inter', sans-serif;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  body{ font-family:var(--font-body); background:var(--paper); color:var(--ink); min-height:100vh; }
  a{ color:inherit; text-decoration:none; }
  button{ font-family:inherit; cursor:pointer; border:none; }
  :focus-visible{ outline:3px solid var(--red-deep); outline-offset:3px; }

  header{ display:flex; align-items:center; justify-content:space-between; padding:1.5rem 2.5rem; }
  .logo{ font-family:var(--font-display); font-weight:900; font-size:1.55rem; display:flex; align-items:baseline; }
  .logo .va{ color:var(--red); -webkit-text-stroke:1.5px var(--ink); text-shadow:-1px -1px 0 var(--ink), 1px -1px 0 var(--ink), -1px 1px 0 var(--ink), 1px 1px 0 var(--ink); }
  .logo .pin{ width:.34em; height:.34em; border-radius:50% 50% 50% 0; background:var(--red); transform:rotate(-45deg); margin:0 .05em 0 .08em; align-self:flex-start; margin-top:.08em; }
  .back-link{ font-size:.9rem; font-weight:500; }
  .back-link:hover{ color:var(--red); }

  main{ max-width:460px; margin:0 auto; padding:2rem 6vw 6rem; }
  .eyebrow{ font-size:.85rem; font-weight:600; letter-spacing:.14em; text-transform:uppercase; color:var(--red-deep); margin-bottom:.7rem; }
  h1{ font-family:var(--font-display); font-weight:600; font-size:clamp(1.9rem, 4vw, 2.5rem); line-height:1.1; margin-bottom:.8rem; }
  .sub{ font-size:1rem; line-height:1.6; color:#3a2e2c; margin-bottom:2.2rem; }

  form{ display:flex; flex-direction:column; gap:1.2rem; }
  .field{ display:flex; flex-direction:column; gap:.4rem; }
  label{ font-size:.9rem; font-weight:600; }
  input{ font-family:inherit; font-size:1rem; padding:.85rem 1rem; border:1px solid rgba(26,18,16,.15); border-radius:12px; background:var(--white); color:var(--ink); width:100%; }
  input:focus{ outline:none; border-color:var(--red); }

  .password-wrap{ position:relative; }
  .password-wrap input{ padding-right:2.8rem; }
  .toggle-eye{
    position:absolute; right:.7rem; top:50%; transform:translateY(-50%);
    background:none; border:none; cursor:pointer; padding:.3rem;
    display:flex; align-items:center; justify-content:center;
    color:#7a6b67;
  }
  .toggle-eye:hover{ color:var(--red); }
  .toggle-eye svg{ width:20px; height:20px; }

  .field-error{ font-size:.82rem; color:var(--red); display:none; }
  .field-error.show{ display:block; }

  .submit-btn{ background:var(--ink); color:var(--white); padding:1rem 1.6rem; border-radius:100px; font-weight:600; font-size:1rem; margin-top:.6rem; transition:background .2s ease; }
  .submit-btn:hover{ background:var(--red); }
  .submit-btn:disabled{ background:#c9c0bd; cursor:not-allowed; }

  .form-note{ font-size:.85rem; color:#7a6b67; text-align:center; margin-top:.4rem; }
  .consent-row{ display:flex; align-items:flex-start; gap:.6rem; font-size:.85rem; line-height:1.5; color:#3a2e2c; }
  .consent-row input[type="checkbox"]{ margin-top:.2rem; width:1.05rem; height:1.05rem; accent-color:var(--red); flex-shrink:0; cursor:pointer; }
  .consent-row label{ font-weight:400; cursor:pointer; }
  .consent-row a{ color:var(--red-deep); font-weight:600; border-bottom:1.5px solid var(--red-deep); }
  .consent-row a:hover{ color:var(--red); border-color:var(--red); }

  .success-msg{ display:none; background:#F4EDE4; border:1px solid rgba(26,18,16,.1); border-radius:14px; padding:1.4rem 1.6rem; margin-top:1.6rem; font-size:.95rem; }
  .success-msg.show{ display:block; }
  .success-msg a{ color:var(--red); font-weight:600; border-bottom:1.5px solid var(--red); }
</style>
</head>
<body>

<header>
  <a href="index.html" class="logo"><span class="va">Va</span><span class="pin"></span><span class="room">Room</span></a>
  <a href="index.html" class="back-link">← Back to VaRoom</a>
</header>

<main>
  <p class="eyebrow">Register as Host</p>
  <h1>Create your host account.</h1>
  <p class="sub">List and showcase your spaces — Airbnbs, hotels, venues, offices, shops, or property to let or sell.</p>

  <form id="host-signup-form">
    <div class="field">
      <label for="name">Full name</label>
      <input type="text" id="name" name="name" required>
    </div>
    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <div class="password-wrap">
        <input type="password" id="password" name="password" required minlength="8">
        <button type="button" class="toggle-eye" data-target="password" aria-label="Show password">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
    </div>
    <div class="field">
      <label for="confirm-password">Confirm password</label>
      <div class="password-wrap">
        <input type="password" id="confirm-password" name="confirm-password" required minlength="8">
        <button type="button" class="toggle-eye" data-target="confirm-password" aria-label="Show password">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
      <p class="field-error" id="password-mismatch-error">Passwords don't match.</p>
    </div>
    <div class="consent-row">
      <input type="checkbox" id="consent-check" required>
      <label for="consent-check">I agree to the <a href="privacy.html" target="_blank" rel="noopener">Privacy Policy</a> and <a href="terms.html" target="_blank" rel="noopener">Terms of Service</a>.</label>
    </div>
    <button type="submit" class="submit-btn" id="submit-btn" disabled>Create host account</button>
    <p class="form-note">Creates a real VaRoom account — you'll get a confirmation email before you can sign in.</p>
  </form>

  <div class="success-msg" id="success-msg"></div>
</main>

<script src="js/supabase-client.js"></script>
<script>
  // Eye toggle for both password fields
  document.querySelectorAll('.toggle-eye').forEach(function(btn){
    btn.addEventListener('click', function(){
      const targetId = btn.getAttribute('data-target');
      const input = document.getElementById(targetId);
      const isHidden = input.type === 'password';
      input.type = isHidden ? 'text' : 'password';
      btn.setAttribute('aria-label', isHidden ? 'Hide password' : 'Show password');
    });
  });

  // Consent checkbox gates the submit button
  const consentCheck = document.getElementById('consent-check');
  const submitBtn = document.getElementById('submit-btn');
  consentCheck.addEventListener('change', function(){
    submitBtn.disabled = !consentCheck.checked;
  });

  document.getElementById('host-signup-form').addEventListener('submit', async function(e){
    e.preventDefault();

    const name = document.getElementById('name').value;
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirm-password').value;
    const mismatchError = document.getElementById('password-mismatch-error');
    const successMsg = document.getElementById('success-msg');

    if (password !== confirmPassword) {
      mismatchError.classList.add('show');
      document.getElementById('confirm-password').focus();
      return;
    }
    mismatchError.classList.remove('show');

    if (!consentCheck.checked) {
      consentCheck.focus();
      return;
    }

    const { data, error } = await supabaseClient.auth.signUp({
      email: email,
      password: password,
      options: {
        data: { role: 'host', full_name: name }
      }
    });

    if (error) {
      successMsg.textContent = 'Something went wrong: ' + error.message;
      successMsg.classList.add('show');
      successMsg.scrollIntoView({ behavior:'smooth', block:'center' });
      return;
    }

    // If email confirmation is off, Supabase returns an active session
    // immediately — in that case we can go straight to auth-callback.html,
    // which will create the profiles row using the role we just set above.
    if (data.session) {
      window.location.href = 'auth-callback.html';
      return;
    }

    successMsg.innerHTML = 'Account created! Check your email to confirm, then come back and <a href="login.html">log in →</a>';
    successMsg.classList.add('show');
    successMsg.scrollIntoView({ behavior:'smooth', block:'center' });
  });
</script>

</body>
</html>
