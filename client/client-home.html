<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VaRoom — Find your space</title>
<script>
  (function(){
    try{
      var saved = localStorage.getItem('varoom_theme') || 'system';
      var resolved = saved === 'system'
        ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
        : saved;
      document.documentElement.setAttribute('data-theme', resolved);
    }catch(e){}
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;0,9..144,900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --red:#C41E3A; --red-deep:#8F1229; --white:#FFFFFF; --ink:#1A1210; --paper:#FBF4F1;
    --muted:#7a6b67;
    --font-display:'Fraunces', serif; --font-body:'Inter', sans-serif;
  }
  [data-theme="dark"]{
    --white:#241C1A; --paper:#15100F; --ink:#F5EFEC; --muted:#B8ACA8;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  body{ font-family:var(--font-body); background:var(--paper); color:var(--ink); min-height:100vh; transition:background .2s ease, color .2s ease; }
  a{ color:inherit; text-decoration:none; }
  button{ font-family:inherit; cursor:pointer; border:none; background:none; }
  :focus-visible{ outline:3px solid var(--red-deep); outline-offset:3px; }
  ul{ list-style:none; }

  .app-shell{ display:grid; grid-template-columns:240px 1fr; min-height:100vh; }

  /* ---------- SIDEBAR ---------- */
  .sidebar{
    background:var(--white);
    border-right:1px solid rgba(26,18,16,.08);
    padding:1.6rem 1.2rem;
    display:flex;
    flex-direction:column;
    gap:1.6rem;
  }

  .logo{ font-family:var(--font-display); font-weight:900; font-size:1.4rem; display:flex; align-items:baseline; padding:0 .4rem; }
  .logo .va{ color:var(--red); -webkit-text-stroke:1.5px var(--ink); text-shadow:-1px -1px 0 var(--ink), 1px -1px 0 var(--ink), -1px 1px 0 var(--ink), 1px 1px 0 var(--ink); }
  .logo .pin{ width:.34em; height:.34em; border-radius:50% 50% 50% 0; background:var(--red); transform:rotate(-45deg); margin:0 .05em 0 .08em; align-self:flex-start; margin-top:.08em; }

  .nav-group{ display:flex; flex-direction:column; gap:.2rem; }
  .nav-label{ font-size:.72rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); padding:.6rem .6rem .3rem; }

  .nav-item{
    display:flex; align-items:center; gap:.7rem;
    padding:.6rem .7rem; border-radius:10px;
    font-size:.92rem; font-weight:500; color:var(--ink);
    cursor:pointer;
  }
  .nav-item:hover{ background:var(--paper); }
  .nav-item.active{ background:#FBE4E7; color:var(--red-deep); font-weight:600; }
  .nav-item svg{ flex-shrink:0; }

  .nav-item.soon{ color:var(--muted); cursor:default; }
  .nav-item.soon:hover{ background:none; }

  /* soon-active: same look as .soon, but a real clickable <button> that
     gives honest "coming soon" feedback instead of being inert */
  button.nav-item.soon-active{
    width:100%; text-align:left; font-family:inherit; color:var(--muted);
  }
  button.nav-item.soon-active:hover{ background:var(--paper); color:var(--ink); }

  .soon-pill{
    margin-left:auto; font-size:.68rem; font-weight:600;
    background:rgba(26,18,16,.06); color:var(--muted);
    padding:.15rem .5rem; border-radius:100px;
  }

  .sidebar-note{
    margin-top:auto;
    background:#FBE4E7;
    border-radius:14px;
    padding:1rem 1.1rem;
    font-size:.82rem;
    line-height:1.5;
    color:var(--red-deep);
  }
  .sidebar-note strong{ display:block; margin-bottom:.2rem; }

  .logout-btn{ color:var(--red); font-weight:600; font-size:.9rem; padding:.5rem .7rem; text-align:left; }

  .toast{
    position:fixed; bottom:1.5rem; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--ink); color:var(--white); padding:.8rem 1.4rem; border-radius:100px;
    font-size:.88rem; font-weight:600; z-index:300; opacity:0; pointer-events:none;
    transition:opacity .25s ease, transform .25s ease;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  .bottom-bar{ display:none; }

  /* ---------- MAIN COLUMN ---------- */
  .main-col{ display:flex; flex-direction:column; min-height:100vh; }

  .topbar{
    display:flex; align-items:center; gap:1rem;
    padding:1.2rem 2rem;
    border-bottom:1px solid rgba(26,18,16,.08);
    background:var(--white);
  }

  .search-wrap{
    flex:1; display:flex; align-items:center; gap:.6rem;
    background:var(--paper); border-radius:100px; padding:.6rem 1rem;
    max-width:520px;
  }
  .search-wrap input{
    flex:1; border:none; background:transparent; font-family:inherit; font-size:.92rem; color:var(--ink);
  }
  .search-wrap input:focus{ outline:none; }
  .search-btn{ color:var(--muted); display:flex; align-items:center; }
  .search-btn:hover{ color:var(--red); }

  .topbar-right{ margin-left:auto; display:flex; align-items:center; gap:1.4rem; }
  .icon-btn{ color:var(--muted); position:relative; }
  .icon-btn:hover{ color:var(--ink); }

  .avatar-circle{
    width:38px; height:38px; border-radius:50%;
    background:var(--red); color:var(--white);
    display:flex; align-items:center; justify-content:center;
    font-weight:700; font-size:.9rem;
  }

  /* ---------- FEED ---------- */
  .feed-area{ padding:1.8rem 2rem 4rem; max-width:760px; }

  h1.feed-title{
    font-family:var(--font-display); font-weight:600; font-size:1.5rem; margin-bottom:1.2rem;
  }

  .tabs{ display:flex; flex-wrap:wrap; gap:.6rem; margin-bottom:1.6rem; }
  .tab{
    padding:.5rem 1.1rem; border-radius:100px; font-size:.88rem; font-weight:600;
    background:var(--white); border:1px solid rgba(26,18,16,.1); color:var(--ink);
  }
  .tab.active{ background:var(--red); color:var(--white); border-color:var(--red); }

  .state-msg{ color:var(--muted); font-size:.95rem; padding:2rem 0; text-align:center; }

  .card{
    background:var(--white); border:1px solid rgba(26,18,16,.08); border-radius:18px;
    padding:1.3rem; margin-bottom:1.4rem;
  }

  .card-head{ display:flex; align-items:center; gap:.7rem; margin-bottom:.7rem; }
  .card-avatar{
    width:40px; height:40px; border-radius:50%;
    background:var(--red-deep); color:var(--white);
    display:flex; align-items:center; justify-content:center;
    font-weight:700; font-size:.95rem; flex-shrink:0; overflow:hidden;
  }
  .card-avatar img{ width:100%; height:100%; object-fit:cover; }
  .card-host-name{ font-weight:700; font-size:.95rem; display:flex; align-items:center; gap:.35rem; }
  .verified-tick{ color:var(--red); font-size:.85rem; }
  .card-location{ font-size:.8rem; color:var(--muted); }
  .card-time{ margin-left:auto; font-size:.78rem; color:var(--muted); }

  .card-desc{ font-size:.92rem; line-height:1.5; margin-bottom:.9rem; }

  .card-photos{
    display:grid; grid-template-columns:1fr 1fr; gap:.5rem;
    border-radius:12px; overflow:hidden; margin-bottom:.9rem;
  }
  .card-photos img{ width:100%; height:180px; object-fit:cover; display:block; }
  .card-photos.single{ grid-template-columns:1fr; }
  .card-photos.single img{ height:240px; }

  .photo-placeholder{
    grid-column:1 / -1;
    height:180px; border-radius:12px;
    background:linear-gradient(135deg, var(--red) 0%, var(--red-deep) 100%);
    display:flex; align-items:center; justify-content:center;
    color:rgba(255,255,255,.85); font-size:.85rem; font-weight:600;
  }

  .badge-row{ display:flex; flex-wrap:wrap; gap:.5rem; margin-bottom:1rem; }
  .badge{
    display:flex; align-items:center; gap:.3rem;
    font-size:.76rem; font-weight:600; padding:.3rem .65rem; border-radius:100px;
  }
  .badge-verified{ background:#EAF4EE; color:#1E6B3C; }
  .badge-host{ background:#E9F0FB; color:#1A4E8F; }
  .badge-soon{ background:rgba(26,18,16,.05); color:var(--muted); font-weight:500; }

  .action-row{ display:flex; align-items:center; gap:.9rem; padding-top:.9rem; border-top:1px solid rgba(26,18,16,.06); }

  .action-btn{
    display:flex; align-items:center; gap:.4rem;
    font-size:.85rem; font-weight:600; color:var(--ink);
    padding:.5rem .9rem; border-radius:10px;
  }
  .action-btn:hover{ background:var(--paper); }
  .action-btn.disabled{ color:var(--muted); cursor:default; }
  .action-btn.disabled:hover{ background:none; }

  .bookmark-btn{ margin-left:auto; color:var(--muted); }
  .bookmark-btn:hover{ color:var(--red); }
  .bookmark-btn.saved{ color:var(--red); }

  @media (max-width:860px){
    .app-shell{ grid-template-columns:1fr; }

    .sidebar{
      position:fixed;
      inset:0 auto 0 0;
      width:260px;
      z-index:200;
      transform:translateX(-100%);
      transition:transform .25s ease;
      box-shadow:0 0 40px rgba(26,18,16,.25);
    }
    .sidebar.mobile-open{ transform:translateX(0); }

    .sidebar-backdrop{
      display:none;
      position:fixed;
      inset:0;
      background:rgba(26,18,16,.45);
      z-index:190;
    }
    .sidebar-backdrop.show{ display:block; }

    .sidebar .nav-item[data-mobile-hide]{ display:none; }

    .feed-area{ padding:1.4rem 1rem 5.5rem; }

    .bottom-bar{
      display:flex; align-items:center; justify-content:space-around;
      position:fixed; bottom:0; left:0; right:0; z-index:150;
      background:var(--white); border-top:1px solid rgba(26,18,16,.08);
      padding:.6rem 0 calc(.6rem + env(safe-area-inset-bottom));
    }
    .bottom-bar-item{
      display:flex; flex-direction:column; align-items:center; gap:.2rem;
      font-size:.66rem; font-weight:600; color:var(--muted);
      padding:.3rem .6rem; background:none; border:none; font-family:inherit; cursor:pointer;
    }
    .bottom-bar-item.active{ color:var(--red-deep); }
    .bottom-bar-item .avatar-mini{
      width:20px; height:20px; border-radius:50%; overflow:hidden;
      background:var(--red); color:var(--white); display:flex; align-items:center; justify-content:center;
      font-size:.62rem; font-weight:700;
    }
    .bottom-bar-item .avatar-mini img{ width:100%; height:100%; object-fit:cover; }
  }
</style>
</head>

<script src="js/supabase-client.js"></script>
<script>
  (async function(){
    let currentUser = null;
    let currentCategory = 'all';
    let searchTerm = '';
    let bookmarkedIds = new Set();
    let currentView = 'home';
    let interestedCategories = [];

    const feedList = document.getElementById('feed-list');
    const tabsEl = document.getElementById('tabs');
    const searchInput = document.getElementById('search-input');

    // ---------- Auth guard ----------
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (!session) {
      window.location.href = 'login.html';
      return;
    }
    currentUser = session.user;

    const { data: profile } = await supabaseClient
      .from('profiles')
      .select('role, full_name, avatar_url, interested_categories')
      .eq('id', currentUser.id)
      .maybeSingle();

    if (!profile) {
      window.location.href = 'login.html';
      return;
    }

    if (profile.role === 'host') {
      window.location.href = 'host-home.html';
      return;
    }

    interestedCategories = profile.interested_categories || [];
    if (interestedCategories.length > 0) {
      document.getElementById('feed-title').textContent = 'For you';
    }

    const ownAvatarUrl = resolveAvatarUrl(profile.avatar_url);
    if (ownAvatarUrl) {
      const avatarImgHtml = '<img src="' + ownAvatarUrl + '" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">';
      document.getElementById('user-avatar').innerHTML = avatarImgHtml;
      document.getElementById('bottom-avatar').innerHTML = avatarImgHtml;
    } else {
      const initial = (profile.full_name || '?').charAt(0).toUpperCase();
      document.getElementById('user-avatar').textContent = initial;
      document.getElementById('bottom-avatar').textContent = initial;
    }

    // ---------- Bookmarks ----------
    const { data: bookmarks } = await supabaseClient
      .from('bookmarks')
      .select('listing_id')
      .eq('client_id', currentUser.id);

    if (bookmarks) {
      bookmarkedIds = new Set(bookmarks.map(function(b){ return b.listing_id; }));
    }

    async function toggleBookmark(listingId, btn){
      if (bookmarkedIds.has(listingId)) {
        await supabaseClient.from('bookmarks').delete()
          .eq('client_id', currentUser.id).eq('listing_id', listingId);
        bookmarkedIds.delete(listingId);
        btn.classList.remove('saved');
      } else {
        await supabaseClient.from('bookmarks').insert({ client_id: currentUser.id, listing_id: listingId });
        bookmarkedIds.add(listingId);
        btn.classList.add('saved');
      }
    }

    // ---------- Helpers ----------
    function timeAgo(dateStr){
      const diffMs = Date.now() - new Date(dateStr).getTime();
      const mins = Math.floor(diffMs / 60000);
      if (mins < 1) return 'just now';
      if (mins < 60) return mins + 'm ago';
      const hrs = Math.floor(mins / 60);
      if (hrs < 24) return hrs + 'h ago';
      const days = Math.floor(hrs / 24);
      return days + 'd ago';
    }

    function categoryLabel(cat){
      const labels = { airbnb:'Airbnb', hotel:'Hotel', venue:'Event Venue', office:'Office', shop:'Shop', property:'Property' };
      return labels[cat] || cat;
    }

    function escapeHtml(str){
      const div = document.createElement('div');
      div.textContent = str || '';
      return div.innerHTML;
    }

    // Handles avatar_url whether it's a relative storage path (correct,
    // current format) or a full URL (legacy rows saved by an earlier
    // version of onboarding.html) — so old data still renders correctly.
    function resolveAvatarUrl(avatarValue){
      if (!avatarValue) return null;
      if (avatarValue.indexOf('http') === 0) return avatarValue;
      return supabaseClient.storage.from('avatars').getPublicUrl(avatarValue).data.publicUrl;
    }

    // ---------- Render ----------
    function renderCard(listing){
      const host = listing.host || {};
      const photos = (listing.listing_photos || []).map(function(p){
        return supabaseClient.storage.from('listing-photos').getPublicUrl(p.storage_path).data.publicUrl;
      });

      const initial = (host.full_name || '?').charAt(0).toUpperCase();
      const hostAvatarUrl = resolveAvatarUrl(host.avatar_url);
      const avatarHtml = hostAvatarUrl
        ? '<img src="' + hostAvatarUrl + '" alt="">'
        : initial;
      const isBookmarked = bookmarkedIds.has(listing.id);

      let photosHtml = '';
      if (photos.length === 0) {
        photosHtml = '<div class="card-photos"><div class="photo-placeholder">' + categoryLabel(listing.category) + ' — photos coming soon</div></div>';
      } else {
        const cls = photos.length === 1 ? 'card-photos single' : 'card-photos';
        photosHtml = '<div class="' + cls + '">' + photos.slice(0, 2).map(function(url){
          return '<img src="' + url + '" alt="' + escapeHtml(listing.title) + '" loading="lazy">';
        }).join('') + '</div>';
      }

      return (
        '<div class="card">' +
          '<div class="card-head">' +
            '<div class="card-avatar">' + avatarHtml + '</div>' +
            '<div>' +
              '<div class="card-host-name">' + escapeHtml(host.full_name || 'Host') +
                (host.verified ? '<span class="verified-tick">✔</span>' : '') +
              '</div>' +
              '<div class="card-location">' + (host.username ? '@' + escapeHtml(host.username) + ' · ' : '') + escapeHtml(listing.location_text) + '</div>' +
            '</div>' +
            '<div class="card-time">' + timeAgo(listing.created_at) + '</div>' +
          '</div>' +
          '<p class="card-desc">' + escapeHtml(listing.description || listing.title) + '</p>' +
          photosHtml +
          '<div class="badge-row">' +
            (listing.verified ? '<span class="badge badge-verified">📍 GPS verified</span>' : '') +
            (host.verified ? '<span class="badge badge-host">✔ Verified host</span>' : '') +
            '<span class="badge badge-soon" title="Escrow-backed payments are on the roadmap, not live yet">Escrow protected — soon</span>' +
          '</div>' +
          '<div class="action-row">' +
            '<span class="action-btn disabled" title="Coming soon">Book</span>' +
            (listing.host_id === currentUser.id
              ? '<span class="action-btn disabled" title="This is your listing">Chat</span>'
              : '<button type="button" class="action-btn chat-btn" data-listing-id="' + listing.id + '" data-host-id="' + listing.host_id + '">Chat</button>') +
            '<button type="button" class="action-btn bookmark-btn ' + (isBookmarked ? 'saved' : '') + '" data-listing-id="' + listing.id + '">' +
              (isBookmarked ? '★ Saved' : '☆ Save') +
            '</button>' +
          '</div>' +
        '</div>'
      );
    }

    const FEED_SELECT = 'id,title,description,location_text,category,verified,created_at,host_id,host:profiles(full_name,verified,avatar_url,username),listing_photos(storage_path)';

    async function startChat(listingId, hostId){
      const { data, error } = await supabaseClient
        .from('conversations')
        .upsert(
          { listing_id: listingId, host_id: hostId, client_id: currentUser.id },
          { onConflict: 'listing_id,client_id' }
        )
        .select()
        .single();

      if (error) {
        showToast("Couldn't start that chat: " + error.message);
        return;
      }
      window.location.href = 'chats.html?c=' + data.id;
    }

    function attachCardListeners(container){
      container.querySelectorAll('.bookmark-btn').forEach(function(btn){
        btn.addEventListener('click', async function(){
          const id = btn.getAttribute('data-listing-id');
          await toggleBookmark(id, btn);
          btn.textContent = bookmarkedIds.has(id) ? '★ Saved' : '☆ Save';
        });
      });
      container.querySelectorAll('.chat-btn').forEach(function(btn){
        btn.addEventListener('click', function(){
          startChat(btn.getAttribute('data-listing-id'), btn.getAttribute('data-host-id'));
        });
      });
    }

    async function loadFeed(){
      feedList.innerHTML = '<p class="state-msg">Loading listings…</p>';

      const term = searchTerm.trim();

      function withCategory(q){
        if (currentCategory !== 'all') return q.eq('category', currentCategory);
        if (currentView === 'home' && interestedCategories.length > 0) return q.in('category', interestedCategories);
        return q;
      }

      let data, error;

      if (!term) {
        const res = await withCategory(
          supabaseClient.from('listings').select(FEED_SELECT).order('created_at', { ascending:false })
        );
        data = res.data; error = res.error;
      } else {
        // Search matches location text OR the host's username (usernames
        // are unique, so this is a fast way to jump straight to one host's
        // listings). Run as two queries and merge, rather than a single
        // raw filter string, to avoid escaping issues with special
        // characters in what someone types.
        const locQuery = withCategory(
          supabaseClient.from('listings').select(FEED_SELECT).ilike('location_text', '%' + term + '%')
        );

        const { data: matchingHosts } = await supabaseClient
          .from('profiles')
          .select('id')
          .ilike('username', '%' + term + '%');
        const hostIds = (matchingHosts || []).map(function(p){ return p.id; });

        const hostQuery = hostIds.length > 0
          ? withCategory(supabaseClient.from('listings').select(FEED_SELECT).in('host_id', hostIds))
          : Promise.resolve({ data: [], error: null });

        const [locRes, hostRes] = await Promise.all([locQuery, hostQuery]);

        if (locRes.error) { data = null; error = locRes.error; }
        else if (hostRes.error) { data = null; error = hostRes.error; }
        else {
          const seen = new Set();
          data = [];
          (locRes.data || []).concat(hostRes.data || []).forEach(function(listing){
            if (!seen.has(listing.id)) { seen.add(listing.id); data.push(listing); }
          });
          data.sort(function(a, b){ return new Date(b.created_at) - new Date(a.created_at); });
        }
      }

      if (error) {
        feedList.innerHTML = '<p class="state-msg">Couldn\'t load listings: ' + escapeHtml(error.message) + '</p>';
        return;
      }

      if (!data || data.length === 0) {
        const isEmptyHome = currentView === 'home' && currentCategory === 'all' && !term && interestedCategories.length > 0;
        feedList.innerHTML = '<p class="state-msg">' + (isEmptyHome
          ? 'Nothing matching your interests yet — try Explore to see everything.'
          : 'No listings match yet — try a different category, location, or @username.') + '</p>';
        return;
      }

      feedList.innerHTML = data.map(renderCard).join('');
      attachCardListeners(feedList);
    }

    // ---------- Toast (honest "coming soon" feedback) ----------
    const toastEl = document.getElementById('toast');
    let toastTimeout;
    function showToast(message){
      clearTimeout(toastTimeout);
      toastEl.textContent = message;
      toastEl.classList.add('show');
      toastTimeout = setTimeout(function(){ toastEl.classList.remove('show'); }, 2200);
    }
    document.querySelectorAll('[data-soon]').forEach(function(el){
      el.addEventListener('click', function(){
        showToast(el.getAttribute('data-soon') + ' is coming soon.');
      });
    });

    // ---------- Mobile sidebar drawer (doubles as the "You" menu on mobile) ----------
    const sidebar = document.getElementById('sidebar');
    const backdrop = document.getElementById('sidebar-backdrop');

    function openSidebar(){
      sidebar.classList.add('mobile-open');
      backdrop.classList.add('show');
    }
    function closeSidebar(){
      sidebar.classList.remove('mobile-open');
      backdrop.classList.remove('show');
    }

    backdrop.addEventListener('click', closeSidebar);
    sidebar.querySelectorAll('.nav-item, .logout-btn').forEach(function(el){
      el.addEventListener('click', closeSidebar);
    });
    document.getElementById('you-tab').addEventListener('click', openSidebar);
    document.getElementById('notif-bell').addEventListener('click', function(){
      showToast('Notifications are coming soon.');
    });

    // ---------- Shared view switching (sidebar nav-items + bottom bar both call these) ----------
    function setActiveNav(viewName){
      document.querySelectorAll('.nav-item[data-nav]').forEach(function(n){
        n.classList.toggle('active', n.getAttribute('data-nav') === viewName);
      });
      document.querySelectorAll('.bottom-bar-item[data-bottom-nav]').forEach(function(n){
        n.classList.toggle('active', n.getAttribute('data-bottom-nav') === viewName);
      });
    }

    function resetFilters(){
      currentCategory = 'all';
      searchTerm = '';
      searchInput.value = '';
      tabsEl.querySelectorAll('.tab').forEach(function(t){ t.classList.remove('active'); });
      tabsEl.querySelector('[data-category="all"]').classList.add('active');
    }

    function showHomeView(){
      setActiveNav('home');
      currentView = 'home';
      document.getElementById('feed-title').textContent = interestedCategories.length > 0 ? 'For you' : 'Find the perfect space';
      resetFilters();
      loadFeed();
    }

    function showExploreView(){
      setActiveNav('explore');
      currentView = 'explore';
      document.getElementById('feed-title').textContent = 'Explore everything';
      resetFilters();
      loadFeed();
    }

    function showSavedView(){
      setActiveNav('saved');
      document.getElementById('feed-title').textContent = 'Saved';
      feedList.innerHTML = '<p class="state-msg">Loading saved listings…</p>';
      supabaseClient
        .from('listings')
        .select(FEED_SELECT)
        .in('id', Array.from(bookmarkedIds))
        .then(function(res){
          if (!res.data || res.data.length === 0) {
            feedList.innerHTML = '<p class="state-msg">Nothing saved yet — tap the bookmark icon on a listing to save it here.</p>';
            return;
          }
          feedList.innerHTML = res.data.map(renderCard).join('');
          attachCardListeners(feedList);
        });
    }

    const viewHandlers = { home: showHomeView, explore: showExploreView, saved: showSavedView };

    document.querySelectorAll('.nav-item[data-nav]').forEach(function(item){
      item.addEventListener('click', function(){
        viewHandlers[item.getAttribute('data-nav')]();
      });
    });

    document.querySelectorAll('.bottom-bar-item[data-bottom-nav]').forEach(function(item){
      item.addEventListener('click', function(){
        viewHandlers[item.getAttribute('data-bottom-nav')]();
      });
    });

    // ---------- Events ----------
    tabsEl.querySelectorAll('.tab').forEach(function(tab){
      tab.addEventListener('click', function(){
        tabsEl.querySelectorAll('.tab').forEach(function(t){ t.classList.remove('active'); });
        tab.classList.add('active');
        currentCategory = tab.getAttribute('data-category');
        loadFeed();
      });
    });

    let searchDebounce;
    searchInput.addEventListener('input', function(){
      clearTimeout(searchDebounce);
      searchDebounce = setTimeout(function(){
        searchTerm = searchInput.value;
        loadFeed();
      }, 350);
    });

    document.getElementById('logout-btn').addEventListener('click', async function(){
      await supabaseClient.auth.signOut();
      window.location.href = 'index.html';
    });

    loadFeed();
  })();
</script>
