<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Map — VaRoom</title>
<script>
  (function(){
    try{
      var saved = localStorage.getItem('varoom_theme') || 'system';
      var resolved = saved === 'system'
        ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
        : saved;
      document.documentElement.setAttribute('data-theme', resolved);
    }catch(e){}
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;0,9..144,900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --red:#C41E3A; --red-deep:#8F1229; --white:#FFFFFF; --ink:#1A1210; --paper:#FBF4F1;
    --muted:#7a6b67;
    --font-display:'Fraunces', serif; --font-body:'Inter', sans-serif;
  }
  [data-theme="dark"]{ --white:#241C1A; --paper:#15100F; --ink:#F5EFEC; --muted:#B8ACA8; }
  *{ margin:0; padding:0; box-sizing:border-box; }
  body{ font-family:var(--font-body); background:var(--paper); color:var(--ink); min-height:100vh; }
  a{ color:inherit; text-decoration:none; }
  button{ font-family:inherit; cursor:pointer; border:none; background:none; }

  header{ display:flex; align-items:center; justify-content:space-between; padding:1.2rem 1.5rem; }
  .logo{ font-family:var(--font-display); font-weight:900; font-size:1.4rem; }
  .logo .va{ color:var(--red); }
  .back-link{ font-size:.9rem; font-weight:500; }
  .back-link:hover{ color:var(--red); }

  .map-layout{ display:flex; flex-direction:column; height:calc(100vh - 68px); }
  #vrm-map-canvas{ flex:1; background:#ddd; min-height:280px; }

  .sheet{
    background:var(--white); border-radius:18px 18px 0 0; padding:1.4rem 1.6rem 2rem;
    box-shadow:0 -4px 20px rgba(0,0,0,.08);
  }
  .sheet-title{ font-family:var(--font-display); font-weight:700; font-size:1.15rem; margin-bottom:.3rem; }
  .sheet-sub{ font-size:.88rem; color:var(--muted); margin-bottom:.9rem; line-height:1.5; }
  .sheet-status{ font-size:.85rem; padding:.55rem .8rem; border-radius:10px; background:var(--paper); margin-bottom:1rem; }
  .sheet-status.locked{ color:var(--muted); }
  .sheet-status.unlocked{ color:#1E6B3C; background:#EAF4EE; }
  .sheet-actions{ display:flex; gap:.7rem; flex-wrap:wrap; }
  .btn{
    padding:.75rem 1.1rem; border-radius:10px; font-size:.9rem; font-weight:600; text-align:center;
    border:1px solid rgba(128,110,100,.25); background:var(--paper); color:var(--ink); flex:1; min-width:140px;
  }
  .btn-primary{ background:var(--red); border-color:var(--red); color:#fff; }
  .btn[disabled]{ opacity:.5; pointer-events:none; }

  .pending-map{ width:100%; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:.9rem; background:linear-gradient(180deg, #f3ede9, #e5ddd8); }
  [data-theme="dark"] .pending-map{ background:linear-gradient(180deg, #241c1a, #1a1412); }
  .pending-map svg{ width:150px; height:auto; }
  .pending-kenya{ fill:none; stroke:var(--red); stroke-width:2.2; stroke-linejoin:round; opacity:.85; }
  .pending-pin-ring{ fill:none; stroke:var(--red); stroke-width:2; opacity:0; transform-origin:center; animation:pending-ping 2.2s ease-out infinite; }
  .pending-pin-ring.r2{ animation-delay:.7s; }
  .pending-pin-dot{ fill:var(--red); }
  .pending-map-label{ font-size:.85rem; color:var(--muted); text-align:center; max-width:220px; line-height:1.5; }
  @keyframes pending-ping{
    0%{ transform:scale(0.3); opacity:.9; }
    100%{ transform:scale(2.6); opacity:0; }
  }
  @media (min-width: 860px){
    .map-layout{ flex-direction:row; }
    .sheet{ width:380px; border-radius:0; box-shadow:none; border-left:1px solid rgba(128,110,100,.15); overflow-y:auto; }
  }
</style>
</head>
<body>

<header>
  <a class="logo" href="index.html"><span class="va">Va</span>Room</a>
  <a class="back-link" id="back-link" href="index.html">← Back</a>
</header>

<div class="map-layout">
  <div id="vrm-map-canvas"></div>
  <div class="sheet">
    <div class="sheet-title" id="sheet-title">Loading location…</div>
    <div class="sheet-sub" id="sheet-sub"></div>
    <div class="sheet-status" id="sheet-status"></div>
    <div class="sheet-actions">
      <button class="btn btn-primary" id="directions-btn" disabled>Get Directions</button>
    </div>
  </div>
</div>

<script src="js/supabase-client.js"></script>
<script src="js/varoom-maps.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const listingId = params.get('listing');
  const bookingId = params.get('booking');

  const sheetTitle = document.getElementById('sheet-title');
  const sheetSub = document.getElementById('sheet-sub');
  const sheetStatus = document.getElementById('sheet-status');
  const directionsBtn = document.getElementById('directions-btn');

  async function getAuthHeader(){
    const { data: { session } } = await supabaseClient.auth.getSession();
    return session ? { Authorization: 'Bearer ' + session.access_token } : {};
  }

  async function loadLocation(){
    if (!listingId && !bookingId) {
      sheetTitle.textContent = 'No property specified';
      return;
    }
    const headers = await getAuthHeader();
    const endpoint = bookingId ? '/api/bookings/' + bookingId + '/location' : '/api/listings/' + listingId + '/location';
    let result;
    try {
      const res = await fetch(endpoint, { headers });
      const raw = await res.text();
      // A non-JSON response (an HTML 404/error page, most likely) means the
      // map backend isn't reachable from here yet — show a calm status
      // instead of the raw parse error.
      try {
        result = JSON.parse(raw);
      } catch (parseErr) {
        showIntegrationPending();
        return;
      }
      if (!res.ok) throw new Error(result.error || 'Could not load location');
    } catch (err) {
      showIntegrationPending();
      return;
    }
    renderResult(result);
  }

  function showIntegrationPending(){
    sheetTitle.textContent = 'Map integration in progress';
    sheetSub.textContent = "We're still connecting this feature — the map and directions will be available here soon.";
    sheetStatus.style.display = 'none';
    directionsBtn.disabled = true;
    var canvas = document.getElementById('vrm-map-canvas');
    canvas.innerHTML =
      '<div class="pending-map">' +
        '<svg viewBox="0 0 200 220" xmlns="http://www.w3.org/2000/svg">' +
          // Stylized, simplified Kenya silhouette (decorative — not surveyed cartography).
          '<path class="pending-kenya" d="M70 18 L118 14 L142 40 L150 70 L138 92 L150 110 L146 140 L128 150 L132 172 L110 198 L90 188 L78 200 L58 180 L64 154 L48 138 L52 108 L38 90 L46 60 L60 40 Z"/>' +
          '<g transform="translate(100,100)">' +
            '<circle class="pending-pin-ring" r="8"/>' +
            '<circle class="pending-pin-ring r2" r="8"/>' +
            '<circle class="pending-pin-dot" r="5"/>' +
          '</g>' +
        '</svg>' +
        '<div class="pending-map-label">Nairobi and beyond — VaRoom\'s live map is on its way.</div>' +
      '</div>';
  }

  function renderResult(result){
    const loc = result.location || {};
    const exact = result.level >= 3 && loc.latitude != null && loc.longitude != null;

    if (exact) {
      sheetTitle.textContent = loc.formatted_address || (loc.neighborhood ? loc.neighborhood + ', ' + loc.city : 'Property location');
      sheetSub.textContent = loc.neighborhood && loc.city ? loc.neighborhood + ', ' + loc.city : '';
      sheetStatus.textContent = 'Exact location unlocked';
      sheetStatus.className = 'sheet-status unlocked';
      directionsBtn.disabled = false;
      directionsBtn.onclick = function(){
        window.open(VaroomMaps.getDirectionsUrl(loc.latitude, loc.longitude), '_blank');
      };
    } else {
      const area = [loc.neighborhood, loc.city].filter(Boolean).join(', ') || loc.city || 'General area only';
      sheetTitle.textContent = area;
      sheetSub.textContent = result.pendingApproval
        ? 'The exact location becomes available once your host approves this booking.'
        : 'The exact address is shared once a booking with this property is approved.';
      sheetStatus.textContent = result.pendingApproval ? 'Awaiting host approval' : 'General area shown for now';
      sheetStatus.className = 'sheet-status locked';
      directionsBtn.disabled = true;
    }

    VaroomMaps.loadGoogleMaps().then(function(ok){
      if (!ok) {
        document.getElementById('vrm-map-canvas').textContent = '';
        return;
      }
      var center = exact
        ? { lat: loc.latitude, lng: loc.longitude }
        : { lat: -1.286389, lng: 36.817223 }; // Nairobi fallback — no coordinates to center on at Level 1
      var map = new google.maps.Map(document.getElementById('vrm-map-canvas'), {
        center: center,
        zoom: exact ? 16 : 12,
        disableDefaultUI: true,
        zoomControl: true,
      });
      if (exact) {
        new google.maps.Marker({ position: center, map: map });
      } else {
        // Approximate circle only — never a precise pin — for Level 1/2.
        new google.maps.Circle({
          center: center, radius: 1200, map: map,
          fillColor: '#C41E3A', fillOpacity: 0.15, strokeColor: '#C41E3A', strokeOpacity: 0.4, strokeWeight: 1,
        });
      }
    });
  }

  loadLocation();
</script>
</body>
</html>
