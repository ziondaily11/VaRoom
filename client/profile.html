<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your profile — VaRoom</title>
<script>
  (function(){
    try{
      var saved = localStorage.getItem('varoom_theme') || 'system';
      var resolved = saved === 'system'
        ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
        : saved;
      document.documentElement.setAttribute('data-theme', resolved);
    }catch(e){}
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;0,9..144,900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="icon" href="favicon/favicon.ico" sizes="any">
<style>
  :root{
    --red:#C41E3A; --red-deep:#8F1229; --white:#FFFFFF; --ink:#1A1210; --paper:#FBF4F1;
    --muted:#7a6b67; --card-border:rgba(26,18,16,.12);
    --font-display:'Fraunces', serif; --font-body:'Inter', sans-serif;
  }
  [data-theme="dark"]{
    --white:#241C1A; --paper:#15100F; --ink:#F5EFEC; --muted:#B8ACA8; --card-border:rgba(255,255,255,.1);
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  body{ font-family:var(--font-body); background:var(--paper); color:var(--ink); min-height:100vh; transition:background .2s ease, color .2s ease; }
  a{ color:inherit; text-decoration:none; }
  button{ font-family:inherit; cursor:pointer; border:none; background:none; }
  :focus-visible{ outline:3px solid var(--red-deep); outline-offset:3px; }

  header{ display:flex; align-items:center; justify-content:space-between; padding:1.5rem 2.5rem; }
  .logo{ font-family:var(--font-display); font-weight:900; font-size:1.55rem; display:flex; align-items:baseline; }
  .logo .va{ color:var(--red); }
  .back-link{ font-size:.9rem; font-weight:500; }
  .back-link:hover{ color:var(--red); }

  main{ max-width:520px; margin:0 auto; padding:1.5rem 6vw 6rem; }

  .checking-msg{ text-align:center; padding:3rem 0; color:var(--muted); }

  .eyebrow{ font-size:.85rem; font-weight:600; letter-spacing:.14em; text-transform:uppercase; color:var(--red-deep); text-align:center; margin-bottom:.5rem; }
  h1{ font-family:var(--font-display); font-weight:600; font-size:clamp(1.7rem, 4vw, 2.2rem); line-height:1.1; text-align:center; margin-bottom:1.8rem; }

  .avatar-section{ display:flex; flex-direction:column; align-items:center; gap:.7rem; margin-bottom:1.6rem; }

  .avatar-wrap{ position:relative; width:120px; height:120px; }
  .avatar-circle{
    width:120px; height:120px; border-radius:50%;
    background:var(--red); color:var(--white);
    display:flex; align-items:center; justify-content:center;
    font-weight:700; font-size:2.4rem;
    overflow:hidden;
  }
  .avatar-circle img{ width:100%; height:100%; object-fit:cover; }

  .avatar-upload-btn{
    position:absolute; bottom:0; right:0;
    width:38px; height:38px; border-radius:50%;
    background:var(--ink); color:var(--white);
    display:flex; align-items:center; justify-content:center;
    border:3px solid var(--paper);
  }
  .avatar-upload-btn:hover{ background:var(--red); }
  .avatar-upload-btn input[type="file"]{ display:none; }

  .avatar-status{ font-size:.82rem; color:var(--muted); min-height:1.2em; text-align:center; }
  .avatar-status.error{ color:var(--red); }

  .pill-btn{
    display:inline-flex; align-items:center; gap:.4rem;
    font-size:.85rem; font-weight:600; padding:.55rem 1.1rem;
    border-radius:100px; border:1.5px solid var(--red); color:var(--red);
    background:none;
  }
  .pill-btn:hover{ background:var(--red); color:var(--white); }
  .pill-btn svg{ width:14px; height:14px; }

  .info-card{
    border:1px solid var(--card-border); border-radius:20px;
    padding:.4rem 1.4rem; margin-bottom:1.5rem;
  }
  .info-row{ display:flex; align-items:flex-start; gap:1rem; padding:1.1rem 0; border-bottom:1px solid var(--card-border); }
  .info-row:last-of-type{ border-bottom:none; }
  .info-icon{
    width:38px; height:38px; border-radius:50%; flex-shrink:0;
    border:1.5px solid var(--red); color:var(--red);
    display:flex; align-items:center; justify-content:center;
    font-weight:700; font-size:.85rem;
  }
  .info-icon svg{ width:17px; height:17px; }
  .info-body{ flex:1; min-width:0; padding-top:.15rem; }
  .info-label{ font-size:.78rem; font-weight:700; text-transform:capitalize; margin-bottom:.15rem; }
  .info-value{ font-size:.92rem; color:var(--muted); line-height:1.45; word-wrap:break-word; }
  .info-value.empty{ font-style:italic; }

  .info-row input, .info-row textarea{
    font-family:inherit; font-size:.92rem; padding:.6rem .8rem; border:1px solid var(--card-border);
    border-radius:10px; background:var(--paper); color:var(--ink); width:100%;
  }
  .info-row input:focus, .info-row textarea:focus{ outline:none; border-color:var(--red); }
  .info-row textarea{ resize:vertical; min-height:70px; line-height:1.45; }

  .card-actions{ display:flex; gap:.8rem; padding:1.2rem 0; }
  .card-actions .pill-btn{ flex:1; justify-content:center; }
  .card-actions .pill-btn.solid{ background:var(--red); color:var(--white); border-color:var(--red); }
  .card-actions .pill-btn.solid:hover{ background:var(--red-deep); border-color:var(--red-deep); }

  .share-card{
    display:none; border:1px solid var(--card-border); border-radius:20px; padding:1.4rem;
  }
  .share-card.show{ display:block; }
  .share-title{ font-family:var(--font-display); font-weight:600; font-size:1.05rem; color:var(--red); margin-bottom:1rem; padding-bottom:.9rem; border-bottom:1px solid var(--card-border); }
  .share-row{ display:flex; align-items:center; justify-content:space-between; gap:1rem; margin-bottom:1.1rem; flex-wrap:wrap; }
  .share-row-label{ font-size:.85rem; font-weight:600; }
  .copy-link-btn{
    display:inline-flex; align-items:center; gap:.4rem; font-size:.82rem; font-weight:600;
    padding:.55rem 1rem; border-radius:100px; border:1.5px solid var(--red); color:var(--red);
  }
  .copy-link-btn:hover{ background:var(--red); color:var(--white); }
  .copy-link-btn svg{ width:14px; height:14px; }

  .share-icons{ display:flex; gap:.9rem; flex-wrap:wrap; }
  .share-icon{
    width:46px; height:46px; border-radius:50%; border:1.5px solid var(--red); color:var(--red);
    display:flex; align-items:center; justify-content:center; font-weight:700; font-size:.95rem;
  }
  .share-icon:hover{ background:var(--red); color:var(--white); }
  .share-icon svg{ width:19px; height:19px; }

  .save-msg{ display:none; background:var(--white); border:1px solid var(--card-border); border-radius:14px; padding:1.1rem 1.3rem; margin-top:1.2rem; font-size:.9rem; text-align:center; }
  .save-msg.show{ display:block; }
  .save-msg.error{ border-color:rgba(196,30,58,.4); color:var(--red-deep); }

  .quick-links{ border:1px solid var(--card-border); border-radius:20px; overflow:hidden; margin-top:1.5rem; }
  .quick-link{
    display:flex; align-items:center; gap:.8rem; width:100%; text-align:left;
    padding:1rem 1.2rem; font-size:.9rem; font-weight:600; color:var(--ink);
    border-bottom:1px solid var(--card-border);
  }
  .quick-link:last-child{ border-bottom:none; }
  .quick-link:hover{ background:var(--white); }
  .quick-link svg{ width:18px; height:18px; flex-shrink:0; color:var(--red); }
  .quick-link.logout{ color:var(--red); }
  .quick-link.logout svg{ color:var(--red); }
</style>
</head>
<body>

<header>
  <a href="index.html" class="logo"><span class="va">Va</span><span class="room">Room</span></a>
  <a href="#" class="back-link" id="back-link">← Back to dashboard</a>
</header>

<main>
  <div id="checking-auth" class="checking-msg">Loading your profile...</div>

  <div id="profile-page" style="display:none;">
    <p class="eyebrow">Your profile</p>
    <h1>Profile settings</h1>

    <div class="avatar-section">
      <div class="avatar-wrap">
        <div class="avatar-circle" id="avatar-circle">·</div>
        <label class="avatar-upload-btn" for="avatar-input" aria-label="Change photo">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2Z"/><circle cx="12" cy="13" r="4"/></svg>
          <input type="file" id="avatar-input" accept="image/png,image/jpeg,image/webp">
        </label>
      </div>
      <button type="button" class="pill-btn" id="top-edit-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4Z"/></svg>
        Edit
      </button>
      <p class="avatar-status" id="avatar-status">Click the camera icon to add a photo</p>
    </div>

    <div class="info-card">
      <div class="info-row">
        <div class="info-icon" id="role-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </div>
        <div class="info-body">
          <div class="info-label" id="role-label">Host</div>
          <div class="info-value" id="role-value">—</div>
        </div>
      </div>

      <div class="info-row" data-field="full_name">
        <div class="info-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </div>
        <div class="info-body">
          <div class="info-label">Full name</div>
          <div class="info-value" id="full-name-value">—</div>
          <input type="text" id="full-name-input" style="display:none;">
        </div>
      </div>

      <div class="info-row" data-field="username">
        <div class="info-icon">@</div>
        <div class="info-body">
          <div class="info-label">Username</div>
          <div class="info-value" id="username-value">—</div>
          <input type="text" id="username-input" style="display:none;">
        </div>
      </div>

      <div class="info-row" data-field="phone">
        <div class="info-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.362 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.338 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
        </div>
        <div class="info-body">
          <div class="info-label">Phone</div>
          <div class="info-value" id="phone-value">—</div>
          <input type="tel" id="phone-input" placeholder="e.g. 07XX XXX XXX" style="display:none;">
        </div>
      </div>

      <div class="info-row" data-field="bio">
        <div class="info-icon">ID</div>
        <div class="info-body">
          <div class="info-label">Bio</div>
          <div class="info-value" id="bio-value">—</div>
          <textarea id="bio-input" placeholder="Tell people a bit about you…" maxlength="160" style="display:none;"></textarea>
        </div>
      </div>

      <div class="info-row" data-field="email">
        <div class="info-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v16H4z" style="display:none"/><path d="M22 6c0-1.1-.9-2-2-2H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6Z"/><path d="m22 6-10 7L2 6"/></svg>
        </div>
        <div class="info-body">
          <div class="info-label">Email</div>
          <div class="info-value" id="email-value">—</div>
        </div>
      </div>

      <div class="card-actions" id="view-actions">
        <button type="button" class="pill-btn" id="edit-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4Z"/></svg>
          Edit
        </button>
        <button type="button" class="pill-btn solid" id="share-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.59 13.51 6.83 3.98"/><path d="m15.41 6.51-6.82 3.98"/></svg>
          Share
        </button>
      </div>

      <div class="card-actions" id="edit-actions" style="display:none;">
        <button type="button" class="pill-btn" id="cancel-btn">Cancel</button>
        <button type="button" class="pill-btn solid" id="save-btn">Save changes</button>
      </div>
    </div>

    <div class="share-card" id="share-card">
      <div class="share-title">Share</div>
      <div class="share-row">
        <span class="share-row-label">Share your profile via</span>
        <button type="button" class="copy-link-btn" id="copy-link-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
          <span id="copy-link-text">Copy link</span>
        </button>
      </div>
      <div class="share-icons">
        <a class="share-icon" id="share-x" target="_blank" rel="noopener" aria-label="Share on X">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M18.9 2H22l-7.6 8.7L23.3 22h-6.9l-5.4-6.6L4.8 22H1.6l8.1-9.3L1 2h7l4.9 6z"/></svg>
        </a>
        <a class="share-icon" id="share-linkedin" target="_blank" rel="noopener" aria-label="Share on LinkedIn">in</a>
        <a class="share-icon" id="share-whatsapp" target="_blank" rel="noopener" aria-label="Share on WhatsApp">

        </a>
        <a class="share-icon" id="share-email" aria-label="Share via email">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 6c0-1.1-.9-2-2-2H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6Z"/><path d="m22 6-10 7L2 6"/></svg>
        </a>
      </div>
    </div>

    <div class="quick-links">
      <a href="client-home.html?view=saved" class="quick-link" id="saved-link" style="display:none;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3.5h12a1 1 0 0 1 1 1V21l-7-4-7 4V4.5a1 1 0 0 1 1-1Z"/></svg>
        Saved listings
      </a>
      <a href="settings.html" class="quick-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>
        Settings
      </a>
      <button type="button" class="quick-link logout" id="logout-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Log out
      </button>
    </div>

    <div class="save-msg" id="save-msg"></div>
  </div>
</main>

<script src="js/supabase-client.js"></script>
<script>
  (async function(){
    const checkingAuth = document.getElementById('checking-auth');
    const profilePage = document.getElementById('profile-page');
    let currentUser = null;
    let profile = null;

    const { data: { session } } = await supabaseClient.auth.getSession();
    if (!session) { window.location.href = 'login.html'; return; }
    currentUser = session.user;

    const { data: fetchedProfile, error: profileError } = await supabaseClient
      .from('profiles')
      .select('role, full_name, username, phone, bio, avatar_url')
      .eq('id', currentUser.id)
      .maybeSingle();

    if (profileError || !fetchedProfile) { window.location.href = 'login.html'; return; }
    profile = fetchedProfile;

    document.getElementById('back-link').setAttribute('href', profile.role === 'host' ? 'host-home.html' : 'client-home.html');

    if (profile.role !== 'host') {
      document.getElementById('saved-link').style.display = 'flex';
    }

    document.getElementById('logout-btn').addEventListener('click', async function(){
      await supabaseClient.auth.signOut();
      window.location.href = 'index.html';
    });

    // ---------- Render read-only values ----------
    function renderValues(){
      document.getElementById('role-label').textContent = profile.role === 'host' ? 'Host' : 'Client';
      document.getElementById('role-value').textContent = profile.full_name || '—';

      setValueOrEmpty('full-name-value', profile.full_name);
      setValueOrEmpty('username-value', profile.username ? '@' + profile.username : null);
      setValueOrEmpty('phone-value', profile.phone);
      setValueOrEmpty('bio-value', profile.bio);
      document.getElementById('email-value').textContent = currentUser.email || '—';

      document.getElementById('full-name-input').value = profile.full_name || '';
      document.getElementById('username-input').value = profile.username || '';
      document.getElementById('phone-input').value = profile.phone || '';
      document.getElementById('bio-input').value = profile.bio || '';
    }

    function setValueOrEmpty(elId, val){
      const el = document.getElementById(elId);
      if (val) {
        el.textContent = val;
        el.classList.remove('empty');
      } else {
        el.textContent = 'Not set yet';
        el.classList.add('empty');
      }
    }

    renderValues();

    // ---------- Avatar ----------
    const avatarCircle = document.getElementById('avatar-circle');
    function renderAvatar(avatarUrl){
      if (avatarUrl) {
        const publicUrl = avatarUrl.indexOf('http') === 0
          ? avatarUrl
          : supabaseClient.storage.from('avatars').getPublicUrl(avatarUrl).data.publicUrl;
        avatarCircle.innerHTML = '<img src="' + publicUrl + '" alt="Your profile photo">';
      } else {
        avatarCircle.textContent = (profile.full_name || '?').charAt(0).toUpperCase();
      }
    }
    renderAvatar(profile.avatar_url);

    checkingAuth.style.display = 'none';
    profilePage.style.display = 'block';

    const avatarInput = document.getElementById('avatar-input');
    const avatarStatus = document.getElementById('avatar-status');
    const MAX_AVATAR_BYTES = 3 * 1024 * 1024;
    const ALLOWED_TYPES = ['image/png', 'image/jpeg', 'image/webp'];

    avatarInput.addEventListener('change', async function(){
      const file = avatarInput.files[0];
      if (!file) return;

      avatarStatus.classList.remove('error');

      if (!ALLOWED_TYPES.includes(file.type)) {
        avatarStatus.textContent = 'Use a JPG, PNG, or WEBP image.';
        avatarStatus.classList.add('error');
        return;
      }
      if (file.size > MAX_AVATAR_BYTES) {
        avatarStatus.textContent = 'Image is over 3MB — pick a smaller file.';
        avatarStatus.classList.add('error');
        return;
      }

      const previewUrl = URL.createObjectURL(file);
      avatarCircle.innerHTML = '<img src="' + previewUrl + '" alt="Your profile photo">';
      avatarStatus.textContent = 'Uploading...';

      const ext = file.name.split('.').pop().toLowerCase();
      const path = currentUser.id + '/avatar_' + Date.now() + '.' + ext;

      const { error: uploadError } = await supabaseClient
        .storage
        .from('avatars')
        .upload(path, file, { upsert: false });

      if (uploadError) {
        avatarStatus.textContent = 'Upload failed: ' + uploadError.message;
        avatarStatus.classList.add('error');
        renderAvatar(profile.avatar_url);
        return;
      }

      const { error: updateError } = await supabaseClient
        .from('profiles')
        .update({ avatar_url: path })
        .eq('id', currentUser.id);

      if (updateError) {
        avatarStatus.textContent = 'Saved the photo, but couldn\'t update your profile: ' + updateError.message;
        avatarStatus.classList.add('error');
        return;
      }

      profile.avatar_url = path;
      avatarStatus.textContent = 'Photo updated.';
    });

    // ---------- View / Edit toggle ----------
    const editableFields = ['full_name', 'username', 'phone', 'bio'];
    const viewActions = document.getElementById('view-actions');
    const editActions = document.getElementById('edit-actions');
    const saveMsg = document.getElementById('save-msg');

    function enterEditMode(){
      editableFields.forEach(function(field){
        document.querySelector('.info-row[data-field="' + field + '"] .info-value').style.display = 'none';
        document.getElementById(field.replace('_', '-') + '-input').style.display = 'block';
      });
      viewActions.style.display = 'none';
      editActions.style.display = 'flex';
      saveMsg.classList.remove('show');
    }

    function exitEditMode(){
      editableFields.forEach(function(field){
        document.querySelector('.info-row[data-field="' + field + '"] .info-value').style.display = 'block';
        document.getElementById(field.replace('_', '-') + '-input').style.display = 'none';
      });
      viewActions.style.display = 'flex';
      editActions.style.display = 'none';
    }

    document.getElementById('edit-btn').addEventListener('click', enterEditMode);
    document.getElementById('top-edit-btn').addEventListener('click', enterEditMode);

    document.getElementById('cancel-btn').addEventListener('click', function(){
      renderValues();
      exitEditMode();
    });

    document.getElementById('save-btn').addEventListener('click', async function(){
      const saveBtn = document.getElementById('save-btn');
      const fullName = document.getElementById('full-name-input').value.trim();
      const username = document.getElementById('username-input').value.trim();
      const phone = document.getElementById('phone-input').value.trim();
      const bio = document.getElementById('bio-input').value.trim();

      if (!fullName) {
        saveMsg.textContent = 'Full name can\'t be empty.';
        saveMsg.className = 'save-msg show error';
        return;
      }

      saveBtn.disabled = true;
      saveBtn.textContent = 'Saving...';

      const { error } = await supabaseClient
        .from('profiles')
        .update({
          full_name: fullName,
          username: username || null,
          phone: phone || null,
          bio: bio || null
        })
        .eq('id', currentUser.id);

      saveBtn.disabled = false;
      saveBtn.textContent = 'Save changes';

      if (error) {
        saveMsg.textContent = 'Something went wrong: ' + error.message;
        saveMsg.className = 'save-msg show error';
        return;
      }

      profile.full_name = fullName;
      profile.username = username || null;
      profile.phone = phone || null;
      profile.bio = bio || null;

      renderValues();
      renderAvatar(profile.avatar_url);
      exitEditMode();

      saveMsg.textContent = 'Saved.';
      saveMsg.className = 'save-msg show';
    });

    // ---------- Share panel ----------
    const shareCard = document.getElementById('share-card');
    document.getElementById('share-btn').addEventListener('click', function(){
      shareCard.classList.toggle('show');
      if (shareCard.classList.contains('show')) {
        shareCard.scrollIntoView({ behavior:'smooth', block:'nearest' });
      }
    });

    const profileUrl = profile.username
      ? window.location.origin + '/u/' + profile.username
      : window.location.href;
    document.getElementById('share-x').href = 'https://twitter.com/intent/tweet?url=' + encodeURIComponent(profileUrl);
    document.getElementById('share-linkedin').href = 'https://www.linkedin.com/sharing/share-offsite/?url=' + encodeURIComponent(profileUrl);
    document.getElementById('share-whatsapp').href = 'https://wa.me/?text=' + encodeURIComponent(profileUrl);
    document.getElementById('share-email').href = 'mailto:?subject=' + encodeURIComponent('My VaRoom profile') + '&body=' + encodeURIComponent(profileUrl);

    document.getElementById('copy-link-btn').addEventListener('click', async function(){
      const textEl = document.getElementById('copy-link-text');
      try {
        await navigator.clipboard.writeText(profileUrl);
        textEl.textContent = 'Copied!';
        setTimeout(function(){ textEl.textContent = 'Copy link'; }, 2000);
      } catch (e) {
        textEl.textContent = 'Couldn\'t copy';
      }
    });
  })();
</script>

</body>
</html>
