<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile — VaRoom</title>
<link rel="icon" href="favicon/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="favicon/favicon-180.png">
<script>
  (function(){
    try{
      var saved = localStorage.getItem('varoom_theme') || 'system';
      var resolved = saved === 'system'
        ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
        : saved;
      document.documentElement.setAttribute('data-theme', resolved);
    }catch(e){}
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;0,9..144,900;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --red:#C41E3A; --red-deep:#8F1229; --white:#FFFFFF; --ink:#1A1210; --paper:#FBF4F1;
    --muted:#7a6b67; --card-border:rgba(26,18,16,.1);
    --font-display:'Fraunces', serif; --font-body:'Inter', sans-serif;
    --glass-bg:rgba(255,255,255,.55);
    --glass-border:rgba(255,255,255,.6);
    --glass-shadow:0 24px 55px rgba(26,18,16,.10);
    --glow-a:rgba(196,30,58,.14);
    --glow-b:rgba(196,30,58,.09);
  }
  [data-theme="dark"]{
    --white:#241C1A; --paper:#15100F; --ink:#F5EFEC; --muted:#B8ACA8; --card-border:rgba(255,255,255,.1);
    --glass-bg:rgba(28,20,18,.55);
    --glass-border:rgba(255,255,255,.09);
    --glass-shadow:0 24px 55px rgba(0,0,0,.5);
    --glow-a:transparent;
    --glow-b:transparent;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  body{
    font-family:var(--font-body); color:var(--ink); height:100vh; overflow:hidden;
    transition:background .2s ease, color .2s ease;
    background:
      radial-gradient(640px circle at 6% 12%, var(--glow-a), transparent 60%),
      radial-gradient(560px circle at 92% 85%, var(--glow-b), transparent 60%),
      var(--paper);
  }
  a{ color:inherit; text-decoration:none; }
  button{ font-family:inherit; cursor:pointer; border:none; background:none; }
  :focus-visible{ outline:3px solid var(--red-deep); outline-offset:3px; }
  img{ display:block; max-width:100%; }

  /* ============================================================
     APP SHELL — matches host-home exactly
  ============================================================ */
  .app-shell{ display:grid; grid-template-columns:282px 1fr; height:100vh; overflow:hidden; }

  /* ── SIDEBAR ── */
  .sidebar{
    background:var(--glass-bg);
    backdrop-filter:blur(22px) saturate(140%);
    -webkit-backdrop-filter:blur(22px) saturate(140%);
    border:1px solid var(--glass-border);
    border-radius:22px;
    box-shadow:var(--glass-shadow);
    margin:1rem 0 1rem 1rem;
    padding:1.6rem 1.2rem;
    display:flex; flex-direction:column; gap:1.4rem;
    height:calc(100vh - 2rem);
    overflow-y:auto; scrollbar-width:none;
  }
  .sidebar::-webkit-scrollbar{ display:none; }

  .logo{ font-family:var(--font-display); font-weight:900; font-size:1.4rem; display:flex; align-items:baseline; padding:0 .4rem; }
  .logo .va{ color:var(--red); }

  .elie-logo-nav{ width:22px; height:22px; object-fit:contain; flex-shrink:0; }
  .beta-pill{ margin-left:auto; font-size:.68rem; font-weight:600; background:#FBE4E7; color:var(--red-deep); padding:.15rem .5rem; border-radius:100px; }

  .nav-group{ display:flex; flex-direction:column; gap:.2rem; }
  .nav-label{ font-size:.72rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); padding:.6rem .6rem .3rem; }

  .nav-item{
    display:flex; align-items:center; gap:.7rem;
    padding:.6rem .7rem; border-radius:10px;
    font-size:.92rem; font-weight:500; color:var(--ink); cursor:pointer;
  }
  .nav-item:hover{ background:var(--paper); }
  .nav-item.active{ background:#FBE4E7; color:var(--red-deep); font-weight:600; }
  .nav-item svg{ flex-shrink:0; }
  .host-only-nav{ display:none; }

  .list-space-btn{
    display:flex; align-items:center; gap:.5rem;
    border:1.5px solid var(--red); color:var(--red);
    border-radius:10px; padding:.6rem .7rem;
    font-size:.9rem; font-weight:600;
  }
  .list-space-btn:hover{ background:#FBE4E7; }

  .logout-btn{ color:var(--red); font-weight:600; font-size:.9rem; padding:.5rem .7rem; text-align:left; }

  /* ── MAIN COLUMN ── */
  .main-col{ display:flex; flex-direction:column; height:100vh; overflow:hidden; }

  .topbar{
    display:flex; align-items:center; gap:1rem;
    padding:1.2rem 2rem;
    background:transparent;
  }
  .preview-badge{
    display:inline-flex; align-items:center; gap:.4rem;
    font-size:.78rem; font-weight:600; background:rgba(196,30,58,.1); color:var(--red-deep);
    padding:.3rem .8rem; border-radius:100px; border:1px solid rgba(196,30,58,.2);
  }

  /* ── PROFILE CONTENT SCROLL AREA ── */
  .profile-scroll{
    flex:1; overflow-y:auto; overflow-x:hidden;
    padding:0 2.5rem 6rem;
    scrollbar-width:none;
  }
  .profile-scroll::-webkit-scrollbar{ display:none; }

  /* ============================================================
     PROFILE HEADER
  ============================================================ */
  .profile-header{
    display:flex; align-items:flex-start; gap:2rem;
    padding:2.2rem 0 2rem;
    border-bottom:1px solid var(--card-border);
    margin-bottom:2rem;
  }

  /* Avatar */
  .profile-avatar-wrap{ position:relative; flex-shrink:0; }

  .profile-avatar{
    width:96px; height:96px; border-radius:50%;
    background:var(--red); color:var(--white);
    display:flex; align-items:center; justify-content:center;
    font-family:var(--font-display); font-weight:700; font-size:2.2rem;
    overflow:hidden; flex-shrink:0;
  }
  .profile-avatar img{ width:100%; height:100%; object-fit:cover; }

  .avatar-upload-btn{
    position:absolute; bottom:0; right:0;
    width:30px; height:30px; border-radius:50%;
    background:var(--ink); color:var(--white);
    display:flex; align-items:center; justify-content:center;
    border:2.5px solid var(--paper); cursor:pointer;
  }
  .avatar-upload-btn:hover{ background:var(--red); }
  .avatar-upload-btn input[type="file"]{ display:none; }
  .avatar-upload-btn svg{ width:13px; height:13px; }

  /* Profile info */
  .profile-info{ flex:1; min-width:0; }

  .profile-role-badge{
    display:inline-block;
    font-size:.72rem; font-weight:700; letter-spacing:.1em; text-transform:uppercase;
    color:var(--red-deep); margin-bottom:.5rem;
  }

  .profile-name{
    font-family:var(--font-display); font-weight:700;
    font-size:clamp(1.6rem, 3vw, 2.4rem); line-height:1.05;
    letter-spacing:-1px; margin-bottom:.3rem;
  }

  .profile-username{ font-size:.9rem; color:var(--muted); margin-bottom:.8rem; }

  .profile-bio{
    font-size:.95rem; line-height:1.65; color:var(--ink);
    max-width:560px; margin-bottom:.9rem;
  }
  .profile-bio.empty{ color:var(--muted); font-style:italic; }

  .profile-meta{
    display:flex; align-items:center; gap:1.2rem; flex-wrap:wrap;
    font-size:.84rem; color:var(--muted); margin-bottom:1.2rem;
  }
  .profile-meta-item{ display:flex; align-items:center; gap:.35rem; }
  .profile-meta-item svg{ width:14px; height:14px; color:var(--red); flex-shrink:0; }

  /* Action buttons */
  .profile-actions{ display:flex; gap:.7rem; flex-wrap:wrap; }

  .btn-outline{
    display:inline-flex; align-items:center; gap:.4rem;
    font-size:.85rem; font-weight:600; padding:.6rem 1.2rem;
    border-radius:100px; border:1.5px solid var(--card-border);
    color:var(--ink); background:var(--white);
    transition:border-color .2s ease, background .2s ease;
  }
  .btn-outline:hover{ border-color:var(--red); color:var(--red); }
  .btn-outline svg{ width:14px; height:14px; }

  .btn-solid{
    display:inline-flex; align-items:center; gap:.4rem;
    font-size:.85rem; font-weight:600; padding:.6rem 1.2rem;
    border-radius:100px; background:var(--red); color:var(--white);
    transition:background .2s ease;
  }
  .btn-solid:hover{ background:var(--red-deep); }
  .btn-solid svg{ width:14px; height:14px; }

  /* ============================================================
     LISTINGS GRID
  ============================================================ */
  .listings-section-head{
    display:flex; align-items:baseline; justify-content:space-between;
    margin-bottom:1.2rem;
  }

  .listings-section-head h2{
    font-family:var(--font-display); font-weight:600;
    font-size:clamp(1.2rem, 2vw, 1.5rem); letter-spacing:-.5px;
  }
  .listings-count{ font-size:.85rem; color:var(--muted); margin-left:.6rem; }

  .listings-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(260px, 1fr));
    gap:1.1rem;
    margin-bottom:3rem;
  }

  /* Listing card */
  .listing-card{
    background:var(--white); border:1px solid var(--card-border);
    border-radius:16px; overflow:hidden;
    transition:transform .18s ease, box-shadow .18s ease;
    cursor:pointer;
  }
  .listing-card:hover{ transform:translateY(-3px); box-shadow:0 16px 40px -18px rgba(26,18,16,.3); }

  .listing-thumb{
    position:relative; height:180px;
    background:linear-gradient(135deg, var(--red) 0%, var(--red-deep) 100%);
    overflow:hidden;
  }
  .listing-thumb img{ width:100%; height:100%; object-fit:cover; }

  .listing-cat-pill{
    position:absolute; top:.7rem; left:.7rem;
    font-size:.66rem; font-weight:700; text-transform:uppercase; letter-spacing:.06em;
    background:rgba(255,255,255,.92); color:var(--ink);
    padding:.25rem .6rem; border-radius:100px;
  }

  .listing-card-body{ padding:1rem 1.1rem 1.2rem; }

  .listing-card-title{ font-family:var(--font-display); font-weight:600; font-size:1rem; margin-bottom:.25rem; line-height:1.25; }
  .listing-card-loc{ font-size:.8rem; color:var(--muted); margin-bottom:.5rem; }
  .listing-card-attrs{ font-size:.78rem; color:var(--muted); margin-bottom:.7rem; }

  .listing-card-footer{ display:flex; align-items:center; justify-content:space-between; }
  .listing-card-price{ font-size:.88rem; font-weight:700; }
  .listing-card-status{
    font-size:.72rem; font-weight:700; letter-spacing:.05em; text-transform:uppercase;
    color:var(--red-deep);
  }
  .listing-card-status.available{ color:#1E6B3C; }
  .listing-card-status.booked{ color:#7a6b67; }

  /* Empty state */
  .listings-empty{
    grid-column:1/-1; text-align:center; padding:3rem 1.5rem;
    color:var(--muted); font-size:.92rem; line-height:1.6;
  }
  .listings-empty-icon{
    width:48px; height:48px; border-radius:50%;
    background:rgba(196,30,58,.08); color:var(--red-deep);
    display:flex; align-items:center; justify-content:center;
    margin:0 auto 1rem;
  }

  /* ============================================================
     EDIT MODAL
  ============================================================ */
  .modal-overlay{
    display:none; position:fixed; inset:0; z-index:300;
    background:rgba(26,18,16,.5);
    align-items:center; justify-content:center; padding:1.5rem;
  }
  .modal-overlay.open{ display:flex; }

  .modal-card{
    background:var(--paper); border-radius:20px; max-width:460px; width:100%;
    padding:2rem 1.8rem;
    box-shadow:0 40px 80px -30px rgba(26,18,16,.5);
  }

  .modal-card h2{
    font-family:var(--font-display); font-weight:600; font-size:1.3rem;
    margin-bottom:1.4rem;
  }

  .modal-field{ margin-bottom:1rem; }
  .modal-field label{ display:block; font-size:.78rem; font-weight:700; margin-bottom:.4rem; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); }
  .modal-field input, .modal-field textarea{
    width:100%; padding:.7rem .9rem;
    border:1px solid var(--card-border); border-radius:10px;
    background:var(--white); color:var(--ink);
    font-family:inherit; font-size:.9rem;
  }
  .modal-field input:focus, .modal-field textarea:focus{ outline:none; border-color:var(--red); }
  .modal-field textarea{ resize:vertical; min-height:80px; line-height:1.5; }

  .modal-actions{ display:flex; gap:.8rem; margin-top:1.4rem; }
  .modal-actions button{ flex:1; padding:.8rem; border-radius:100px; font-weight:600; font-size:.9rem; }
  .modal-cancel{ background:transparent; border:1.5px solid var(--card-border); color:var(--ink); }
  .modal-cancel:hover{ border-color:var(--muted); }
  .modal-save{ background:var(--red); color:#fff; }
  .modal-save:hover{ background:var(--red-deep); }
  .modal-save:disabled{ opacity:.6; cursor:not-allowed; }
  .modal-msg{ font-size:.82rem; margin-top:.8rem; text-align:center; color:var(--red); }

  /* ============================================================
     SHARE PANEL
  ============================================================ */
  .share-panel{
    display:none; background:var(--white); border:1px solid var(--card-border);
    border-radius:16px; padding:1.3rem 1.5rem; margin-top:1rem; margin-bottom:2rem;
  }
  .share-panel.show{ display:block; }
  .share-panel-title{ font-weight:700; font-size:.95rem; color:var(--red); margin-bottom:1rem; padding-bottom:.8rem; border-bottom:1px solid var(--card-border); }
  .share-row{ display:flex; align-items:center; justify-content:space-between; gap:1rem; margin-bottom:1rem; flex-wrap:wrap; }
  .share-row-label{ font-size:.85rem; font-weight:600; }
  .copy-btn{
    display:inline-flex; align-items:center; gap:.4rem;
    font-size:.8rem; font-weight:600; padding:.5rem 1rem;
    border-radius:100px; border:1.5px solid var(--red); color:var(--red);
  }
  .copy-btn:hover{ background:var(--red); color:#fff; }
  .share-icons{ display:flex; gap:.8rem; }
  .share-icon{
    width:42px; height:42px; border-radius:50%; border:1.5px solid var(--red); color:var(--red);
    display:flex; align-items:center; justify-content:center;
  }
  .share-icon:hover{ background:var(--red); color:#fff; }
  .share-icon svg{ width:17px; height:17px; }

  /* ============================================================
     TOAST
  ============================================================ */
  .toast{
    position:fixed; bottom:1.5rem; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--ink); color:var(--white); padding:.8rem 1.4rem; border-radius:100px;
    font-size:.88rem; font-weight:600; z-index:400; opacity:0; pointer-events:none;
    transition:opacity .25s ease, transform .25s ease;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  /* ============================================================
     MOBILE
  ============================================================ */
  .sidebar-backdrop{ display:none; position:fixed; inset:0; background:rgba(26,18,16,.45); z-index:190; }
  .sidebar-backdrop.show{ display:block; }
  .bottom-bar{ display:none; }

  @media (max-width:860px){
    .app-shell{ grid-template-columns:1fr; }

    .sidebar{
      position:fixed; inset:0 auto 0 0; width:260px; height:100vh;
      margin:0; border-radius:0; z-index:200;
      transform:translateX(-100%); transition:transform .25s ease;
      box-shadow:0 0 40px rgba(26,18,16,.25);
    }
    .sidebar.mobile-open{ transform:translateX(0); }

    body{ height:auto; overflow-y:auto; overflow-x:hidden; }
    .app-shell{ height:auto; overflow-y:visible; overflow-x:hidden; }
    .main-col{ height:auto; overflow-y:visible; }

    .profile-scroll{ padding:0 1.2rem 7rem; overflow-y:visible; }

    .profile-header{
      flex-direction:column; align-items:center; gap:1.2rem;
      padding:1.6rem 0 1.6rem; text-align:center;
    }
    .profile-info{ width:100%; }
    .profile-meta, .profile-actions{ justify-content:center; }
    .profile-avatar{ width:80px; height:80px; font-size:1.9rem; }
    .avatar-upload-btn{ width:26px; height:26px; }

    .listings-grid{ grid-template-columns:1fr 1fr; gap:.8rem; }

    .topbar{
      position:sticky; top:0; z-index:100;
      background:var(--glass-bg);
      backdrop-filter:blur(18px) saturate(140%);
      -webkit-backdrop-filter:blur(18px) saturate(140%);
    }

    .bottom-bar{
      display:flex; align-items:center; justify-content:space-around;
      position:fixed; bottom:0; left:0; right:0; z-index:150;
      background:var(--white); border-top:1px solid rgba(26,18,16,.08);
      padding:.6rem 0 calc(.6rem + env(safe-area-inset-bottom));
    }
    .bottom-bar-item{
      display:flex; flex-direction:column; align-items:center; gap:.2rem;
      font-size:.66rem; font-weight:600; color:var(--muted);
      padding:.3rem .6rem; background:none; border:none; font-family:inherit; cursor:pointer;
    }
    .bottom-bar-item.active{ color:var(--red-deep); }
    .bottom-bar-item .notification-icon{ position:relative; display:flex; }
    .bottom-bar-item .notification-count{
      position:absolute; top:-7px; right:-11px; min-width:15px; height:15px;
      padding:0 4px; border-radius:999px; background:var(--red); color:var(--white);
      font-size:.58rem; line-height:15px; font-weight:700;
    }
  }

  @media (max-width:500px){
    .listings-grid{ grid-template-columns:1fr; }
  }
</style>
</head>
<body>

<div class="sidebar-backdrop" id="sidebar-backdrop"></div>
<div class="toast" id="toast"></div>

<!-- EDIT MODAL -->
<div class="modal-overlay" id="edit-modal">
  <div class="modal-card">
    <h2>Edit profile</h2>
    <div class="modal-field">
      <label>Full name</label>
      <input type="text" id="edit-fullname" placeholder="Your name" />
    </div>
    <div class="modal-field">
      <label>Username</label>
      <input type="text" id="edit-username" placeholder="e.g. ziondaily" />
    </div>
    <div class="modal-field">
      <label>Phone</label>
      <input type="tel" id="edit-phone" placeholder="07XX XXX XXX" />
    </div>
    <div class="modal-field" id="edit-bio-field">
      <label>Bio</label>
      <textarea id="edit-bio" placeholder="Tell people a bit about yourself…" maxlength="200"></textarea>
    </div>
    <div class="modal-field">
      <label>City</label>
      <input type="text" id="edit-location" placeholder="e.g. Nairobi, Kenya" />
    </div>
    <div class="modal-actions">
      <button type="button" class="modal-cancel" id="edit-cancel">Cancel</button>
      <button type="button" class="modal-save" id="edit-save">Save changes</button>
    </div>
    <p class="modal-msg" id="edit-msg"></p>
  </div>
</div>

<div class="app-shell">

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <a href="host-home.html" class="logo"><span class="va">Va</span><span class="room">Room</span></a>

    <nav class="nav-group">
      <a href="elie.html" class="nav-item">
        <img src="elie-logo.png" alt="Elie" class="elie-logo-nav">
        Elie
        <span class="beta-pill">Free preview</span>
      </a>
    </nav>

    <nav class="nav-group">
      <a href="host-home.html" class="nav-item" data-nav="explore">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m15 9-2 6-6 2 2-6 6-2Z"/></svg>
        Explore
      </a>
      <a href="host-home.html" class="nav-item">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1Z"/><path d="M9 21v-6h6v6"/></svg>
        Home
      </a>
      <a href="saved.html" class="nav-item" data-nav="saved">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3.5h12a1 1 0 0 1 1 1V21l-7-4-7 4V4.5a1 1 0 0 1 1-1Z"/></svg>
        Saved
      </a>
    </nav>

    <nav class="nav-group">
      <p class="nav-label">My activity</p>
      <a href="bookings.html" class="nav-item">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="16" rx="2"/><path d="M8 3v4M16 3v4M3.5 10h17"/></svg>
        Bookings
      </a>
      <a href="chats.html" class="nav-item">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5Z"/></svg>
        Chats
      </a>
    </nav>

    <nav class="nav-group host-only-nav" id="host-tools-nav">
      <p class="nav-label">Host</p>
      <a href="list.html" class="list-space-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        List a space
      </a>

<script src="js/supabase-client.js"></script>
<script>
(async function(){
  const toast = document.getElementById('toast');
  function showToast(msg, dur){
    toast.textContent = msg; toast.classList.add('show');
    setTimeout(function(){ toast.classList.remove('show'); }, dur || 2200);
  }

  /* ── Auth ── */
  const { data: { session } } = await supabaseClient.auth.getSession();
  if (!session) { window.location.href = 'login.html'; return; }
  const currentUser = session.user;
  const { data: currentProfile, error: currentProfileError } = await supabaseClient
    .from('profiles')
    .select('role')
    .eq('id', currentUser.id)
    .maybeSingle();
  if (currentProfileError || !currentProfile) {
    window.location.href = 'login.html';
    return;
  }
  const currentRole = currentProfile.role || 'client';
  const dashboardHref = currentRole === 'host' ? 'host-home.html' : 'client-home.html';
  document.querySelectorAll('a[href="host-home.html"]').forEach(function(link){
    if (!link.closest('#host-tools-nav')) link.setAttribute('href', dashboardHref);
  });

  /* ── Determine whose profile to show ── */
  const params = new URLSearchParams(window.location.search);
  const viewUsername = params.get('u') || null; // ?u=ziondaily11 for public links

  /* ── Fetch profile ── */
  let profileData = null;
  let isOwner = false;

  const SELECT = 'id, role, full_name, username, phone, bio, avatar_url, city, created_at';
  // UUID pattern — ?u= can be a username OR a UUID (fallback when no username set)
  const isUUID = viewUsername && /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(viewUsername);
  async function loadProfile(column, value){
    let result = await supabaseClient
      .from('profiles')
      .select(SELECT)
      .eq(column, value)
      .maybeSingle();
    if (result.error) {
      // Keep rendering the profile if an optional profile column is not
      // available in an older database schema.
      result = await supabaseClient
        .from('profiles')
        .select('id, role, full_name, username, bio, avatar_url, city, created_at')
        .eq(column, value)
        .maybeSingle();
      if (result.error) {
        console.error('Unable to load profile:', result.error);
        return null;
      }
    }
    return result.data;
  }

  if (viewUsername) {
    if (isUUID) {
      // Passed as UUID — look up by id
      profileData = await loadProfile('id', viewUsername);
    } else {
      // Passed as username string
      profileData = await loadProfile('username', viewUsername);
      // If username lookup fails, try by id as last resort
      if (!profileData) {
        profileData = await loadProfile('id', viewUsername);
      }
    }
    isOwner = profileData && profileData.id === currentUser.id;
  } else {
    // No ?u= param — show own profile
    profileData = await loadProfile('id', currentUser.id);
    isOwner = true;
  }

  // Last resort — if still nothing, load current user's own profile
  if (!profileData) {
    profileData = await loadProfile('id', currentUser.id);
    isOwner = true;
  }

  if (!profileData) {
    document.getElementById('loading-state').textContent =
      'Unable to load your profile. Check your connection and try again.';
    return;
  }

  const notificationCount = document.getElementById('mobile-notification-count');
  async function refreshNotificationCount(){
    const { count, error } = await supabaseClient
      .from('notifications')
      .select('id', { count:'exact', head:true })
      .eq('user_id', currentUser.id)
      .eq('read', false);
    if (error) return;
    notificationCount.textContent = count > 99 ? '99+' : String(count || '');
    notificationCount.style.display = count > 0 ? 'block' : 'none';
  }
  refreshNotificationCount();
  supabaseClient.channel('profile-notifications-' + currentUser.id)
    .on('postgres_changes', {
      event:'*', schema:'public', table:'notifications',
      filter:'user_id=eq.' + currentUser.id
    }, refreshNotificationCount)
    .subscribe();

  /* ── Render profile header ── */
  function renderProfile(){
    const isClientOwner = isOwner && currentRole !== 'host';
    document.getElementById('host-tools-nav').style.display = currentRole === 'host' ? 'flex' : 'none';
    document.getElementById('edit-bio-field').style.display = isClientOwner ? 'none' : 'block';

    // Avatar
    const av = document.getElementById('profile-avatar');
    if (profileData.avatar_url) {
      const url = profileData.avatar_url.startsWith('http') ? profileData.avatar_url
        : supabaseClient.storage.from('avatars').getPublicUrl(profileData.avatar_url).data.publicUrl;
      av.innerHTML = '<img src="' + url + '" alt="' + (profileData.full_name||'') + '">';
    } else {
      av.textContent = (profileData.full_name || '?').charAt(0).toUpperCase();
    }

    // Role
    document.getElementById('profile-role').textContent =
      profileData.role === 'host' ? 'HOST' : 'CLIENT';

    // Name
    document.getElementById('profile-name').textContent = profileData.full_name || 'VaRoom member';

    // Username
    const usernameEl = document.getElementById('profile-username');
    usernameEl.textContent = profileData.username ? '@' + profileData.username : '';

    // Bio
    const bioEl = document.getElementById('profile-bio');
    if (isClientOwner) {
      bioEl.style.display = 'none';
    } else if (profileData.bio) {
      bioEl.style.display = 'block';
      bioEl.textContent = profileData.bio;
      bioEl.classList.remove('empty');
    } else {
      bioEl.style.display = 'block';
      bioEl.textContent = isOwner ? 'Add a bio to tell people about yourself.' : '';
      bioEl.classList.add('empty');
    }

    // Location
    if (profileData.city) {
      document.getElementById('meta-location').style.display = 'flex';
      document.getElementById('meta-location-text').textContent = profileData.city;
    }

    // Hosting since
    if (profileData.created_at) {
      const year = new Date(profileData.created_at).getFullYear();
      document.getElementById('meta-since').style.display = 'flex';
      document.getElementById('meta-since-text').textContent =
        (profileData.role === 'host' ? 'Hosting since ' : 'Member since ') + year;
    }

    // Ask host button name
    const firstName = (profileData.full_name || 'host').split(' ')[0];
    document.getElementById('ask-name').textContent = firstName;

    // Actions — owner vs visitor
    const showingAsVisitor = !isOwner;
    document.getElementById('owner-actions').style.display = (!showingAsVisitor && !isClientOwner) ? 'flex' : 'none';
    document.getElementById('visitor-actions').style.display = showingAsVisitor ? 'flex' : 'none';

    // Camera button — owner only
    document.getElementById('avatar-upload-label').style.display = isOwner ? 'flex' : 'none';

    // Listings heading
    document.getElementById('listings-section').style.display = isClientOwner ? 'none' : 'block';
    document.getElementById('listings-heading').textContent =
      isClientOwner ? '' : 'Places by ' + firstName;
  }

  renderProfile();
  document.getElementById('loading-state').style.display = 'none';
  document.getElementById('profile-content').style.display = 'block';

  /* ── Profile actions ── */
  document.getElementById('edit-profile-btn').addEventListener('click', function(){
    document.getElementById('edit-fullname').value = profileData.full_name || '';
    document.getElementById('edit-username').value = profileData.username || '';
    document.getElementById('edit-phone').value = profileData.phone || '';
    document.getElementById('edit-bio').value = currentRole === 'host' ? (profileData.bio || '') : '';
    document.getElementById('edit-location').value = profileData.city || '';
    document.getElementById('edit-msg').textContent = '';
    document.getElementById('edit-modal').classList.add('open');
  });

  document.getElementById('edit-cancel').addEventListener('click', function(){
    document.getElementById('edit-modal').classList.remove('open');
  });

  document.getElementById('edit-modal').addEventListener('click', function(e){
    if (e.target === this) this.classList.remove('open');
  });

  const sharePanel = document.getElementById('share-panel');
  const profileUrl = profileData.username
    ? window.location.origin + '/u/' + encodeURIComponent(profileData.username)
    : window.location.origin + '/profile.html';

  async function shareProfile(){
    if (navigator.share) {
      try {
        await navigator.share({
          title: (profileData.full_name || 'VaRoom profile') + ' — VaRoom',
          text: 'Check out this VaRoom profile',
          url: profileUrl
        });
        return;
      } catch (error) {
        if (error.name === 'AbortError') return;
      }
    }
    sharePanel.classList.add('show');
  }

  document.getElementById('share-profile-btn').addEventListener('click', shareProfile);
  document.getElementById('share-profile-btn-visitor').addEventListener('click', shareProfile);
  document.getElementById('share-x').href = 'https://twitter.com/intent/tweet?url=' + encodeURIComponent(profileUrl);
  document.getElementById('share-wa').href = 'https://wa.me/?text=' + encodeURIComponent(profileUrl);
  document.getElementById('share-email').href = 'mailto:?subject=' + encodeURIComponent('Check out this VaRoom profile') + '&body=' + encodeURIComponent(profileUrl);

  document.getElementById('copy-link-btn').addEventListener('click', async function(){
    const el = document.getElementById('copy-link-text');
    try {
      await navigator.clipboard.writeText(profileUrl);
      el.textContent = 'Copied!';
      setTimeout(function(){ el.textContent = 'Copy link'; }, 2000);
    } catch (error) {
      el.textContent = 'Couldn\'t copy';
    }
  });

  document.getElementById('edit-save').addEventListener('click', async function(){
    const btn = this;
    const fullName = document.getElementById('edit-fullname').value.trim();
    const username = document.getElementById('edit-username').value.trim();
    const phone    = document.getElementById('edit-phone').value.trim();
    const bio      = document.getElementById('edit-bio').value.trim();
    const location = document.getElementById('edit-location').value.trim();

    if (!fullName) { document.getElementById('edit-msg').textContent = 'Full name is required.'; return; }

    btn.disabled = true; btn.textContent = 'Saving…';

    const update = {
      full_name: fullName,
      username: username || null,
      phone: phone || null,
      city: location || null
    };
    if (currentRole === 'host') update.bio = bio || null;
    const { error } = await supabaseClient.from('profiles').update(update).eq('id', currentUser.id);

    btn.disabled = false; btn.textContent = 'Save changes';

    if (error) { document.getElementById('edit-msg').textContent = error.message; return; }

    profileData.full_name = fullName;
    profileData.username  = username || null;
    profileData.phone     = phone || null;
    if (currentRole === 'host') profileData.bio = bio || null;
    profileData.city      = location || null;

    renderProfile();
    document.getElementById('edit-modal').classList.remove('open');
    showToast('Profile saved ✓');
  });

  /* ── Fetch and render listings ── */
  const { data: listings, error: listingsError } = await supabaseClient
    .from('listings')
    .select('id, title, category, location_text, created_at, listing_photos(storage_path), listing_booking_details(price_amount, price_unit)')
    .eq('host_id', profileData.id)
    .order('created_at', { ascending: false });

  const grid = document.getElementById('listings-grid');
  if (listingsError) {
    console.error('Could not load host listings:', listingsError);
    grid.innerHTML = '<div class="listings-empty">Couldn\'t load your listings right now. Please refresh and try again.</div>';
    return;
  }
  const count = listings ? listings.length : 0;
  document.getElementById('listings-count').textContent =
    count + ' space' + (count !== 1 ? 's' : '') +
    (profileData.city ? ' in ' + profileData.city : '');

  const CAT_LABELS = { airbnb:'Airbnb', hotel:'Hotel', venue:'Event Venue', office:'Office', shop:'Shop', property:'Property' };
  const listingVideoUrls = {};
  async function getAuthToken(){
    const { data: { session } } = await supabaseClient.auth.getSession();
    return session && session.access_token ? session.access_token : null;
  }
  const authToken = await getAuthToken();
  for (const listing of (listings || [])) {
    try {
      if (!authToken) {
        listingVideoUrls[listing.id] = null;
        continue;
      }
      const mediaResponse = await fetch('/api/properties/' + encodeURIComponent(listing.id) + '/media', {
        headers: { Authorization: 'Bearer ' + authToken }
      });
      if (mediaResponse.status === 403 || mediaResponse.status === 404) {
        listingVideoUrls[listing.id] = null;
        continue;
      }
      if (!mediaResponse.ok) {
        listingVideoUrls[listing.id] = null;
        continue;
      }
      const mediaPayload = await mediaResponse.json();
      const media = Array.isArray(mediaPayload.media) ? mediaPayload.media : [];
      const videoItem = media.find(function(item){ return item && item.type === 'video'; });
      if (!videoItem || !videoItem.id) {
        listingVideoUrls[listing.id] = null;
        continue;
      }
      const playbackResponse = await fetch('/api/media/' + encodeURIComponent(videoItem.id) + '/playback', {
        headers: { Authorization: 'Bearer ' + authToken }
      });
      if (playbackResponse.status === 403 || playbackResponse.status === 404) {
        listingVideoUrls[listing.id] = null;
        continue;
      }
      const playbackPayload = playbackResponse.ok ? await playbackResponse.json() : null;
      listingVideoUrls[listing.id] = playbackPayload && playbackPayload.url ? playbackPayload.url : null;
    } catch (error) {
      listingVideoUrls[listing.id] = null;
    }
  }

  if (!listings || listings.length === 0) {
    grid.innerHTML = '<div class="listings-empty">' +
      '<div class="listings-empty-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M12 8v8M8 12h8"/></svg></div>' +
      (isOwner ? 'No listings yet. <a href="list.html" style="color:var(--red);font-weight:600;">List your first space →</a>' : 'No listings yet.') +
      '</div>';
    return;
  }

  function getPhotoUrl(listing){
    const photos = listing.listing_photos;
    if (!photos || photos.length === 0) return null;
    const p = photos[0];
    const path = p.storage_path || p.photo_path;
    if (!path) return null;
    if (path.startsWith('http')) return path;
    return supabaseClient.storage.from('listing-photos').getPublicUrl(path).data.publicUrl;
  }

  function getListingMediaMarkup(listing){
    const videoUrl = listingVideoUrls[listing.id];
    if (videoUrl) {
      return '<div class="listing-thumb"><video muted autoplay playsinline loop preload="metadata" src="' + videoUrl + '" style="width:100%;height:100%;object-fit:cover;display:block;background:#000;"></video><span class="listing-cat-pill">' + (CAT_LABELS[listing.category] || listing.category) + '</span></div>';
    }
    const photoUrl = getPhotoUrl(listing);
    const thumb = photoUrl ? '<img src="' + photoUrl + '" alt="' + listing.title + '" loading="lazy">' : '';
    return '<div class="listing-thumb">' + thumb + '<span class="listing-cat-pill">' + (CAT_LABELS[listing.category] || listing.category) + '</span></div>';
  }

  function priceLabel(listing){
    const details = Array.isArray(listing.listing_booking_details)
      ? listing.listing_booking_details[0]
      : listing.listing_booking_details;
    if (details && details.price_amount) {
      const unit = details.price_unit === 'month' ? 'month' : details.price_unit === 'hour' ? 'hour' : 'night';
      return 'KSh ' + Number(details.price_amount).toLocaleString() + ' / ' + unit;
    }
    return '';
  }

  function statusLabel(listing){
    const s = (listing.availability_status || '').toLowerCase();
    if (s === 'booked') return '<span class="listing-card-status booked">Booked</span>';
    if (s === 'few_dates') return '<span class="listing-card-status" style="color:#b45309;">Few dates left</span>';
    return '<span class="listing-card-status available">Available</span>';
  }

  grid.innerHTML = listings.map(function(l){
    return '<a class="listing-card" href="listing.html?id=' + l.id + '">' +
      getListingMediaMarkup(l) +
      '<div class="listing-card-body">' +
        '<div class="listing-card-title">' + l.title + '</div>' +
        '<div class="listing-card-loc">' + (l.location_text || '') + '</div>' +
        '<div class="listing-card-footer">' +
          '<span class="listing-card-price">' + priceLabel(l) + '</span>' +
          statusLabel(l) +
        '</div>' +
      '</div>' +
    '</a>';
  }).join('');

  /* ── Avatar upload ── */
  document.getElementById('avatar-input').addEventListener('change', async function(){
    const file = this.files[0];
    if (!file) return;
    if (file.size > 3 * 1024 * 1024) { showToast('Image over 3MB — pick a smaller file.'); return; }

    const ext = file.name.split('.').pop().toLowerCase();
    const path = currentUser.id + '/avatar_' + Date.now() + '.' + ext;

    showToast('Uploading…');

    const av = document.getElementById('profile-avatar');
    av.innerHTML = '<img src="' + URL.createObjectURL(file) + '" alt="">';

    const { error: upErr } = await supabaseClient.storage.from('avatars').upload(path, file, { upsert:false });
    if (upErr) { showToast('Upload failed: ' + upErr.message); return; }

    await supabaseClient.from('profiles').update({ avatar_url: path }).eq('id', currentUser.id);
    profileData.avatar_url = path;
    showToast('Photo updated ✓');
  });

  /* ── Mobile hamburger ── */
  const sidebar   = document.getElementById('sidebar');
  const backdrop  = document.getElementById('sidebar-backdrop');
  backdrop.addEventListener('click', function(){
    sidebar.classList.remove('mobile-open');
    backdrop.classList.remove('show');
  });

  /* ── Mobile bottom bar nav ── */
  const bottomNavMap = {
    explore: 'host-home.html',
    bookings: 'bookings.html',
    chats: 'chats.html'
  };
  document.querySelectorAll('.bottom-bar-item[data-nav]').forEach(function(btn){
    btn.addEventListener('click', function(){
      window.location.href = bottomNavMap[btn.getAttribute('data-nav')] || '#';
    });
    document.getElementById('mobile-notifications-btn').addEventListener('click', function(){
      window.location.href = 'notifications.html';
    });
  });

  /* ── Logout ── */
  document.getElementById('logout-btn').addEventListener('click', async function(){
    await supabaseClient.auth.signOut();
    window.location.href = 'index.html';
  });

})();
</script>
</body>
</html>
