<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marketplace — VaRoom</title>
<link rel="icon" href="favicon/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="favicon/favicon-180.png">
<script>
  (function(){
    try{
      var saved = localStorage.getItem('varoom_theme') || 'system';
      var resolved = saved === 'system'
        ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
        : saved;
      document.documentElement.setAttribute('data-theme', resolved);
    }catch(e){}
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;0,9..144,900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="js/skeleton-loader.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/skeleton-loader.js"></script>
<style>
  :root{
    --bg-surface: #121212;
    --card-bg: #1E1E1E;
    --card-bg-hover: #2A2A2A;
    --text-primary: #FFFFFF;
    --text-secondary: #A1A1AA;
    --accent-cta: #FF385C;
    --accent-link: #FF6B81;
    --border-subtle: #3F3F46;
    --radius-lg: 12px;
    --radius-sm: 6px;
    --red: var(--accent-cta); --red-deep:#8F1229; --white:#FFFFFF; --ink:#24211E; --paper:#F7F6F3;
    --muted:#5c584f;
    --font-display:'Helvetica Neue', Arial, sans-serif; --font-body:'Helvetica Neue', Arial, sans-serif; --font-brand:'Fraunces', serif;
    --line:#E4E1DA;
    --line-soft:#E4E1DA;
  }
  [data-theme="dark"]{
    /* Keep the marketplace on the same continuous VaRoom dark canvas as
       the dashboards. Listing cards are delineated by their outline and
       imagery, rather than a second dark slab behind every property. */
    --bg-surface: #0F0D0D;
    --card-bg: #0F0D0D;
    --card-bg-hover: #151211;
    --border-subtle: rgba(255,255,255,.10);
    --white: var(--bg-surface); --paper: var(--bg-surface); --ink: var(--text-primary); --muted: var(--text-secondary);
    --line: rgba(255,255,255,.12);
    --line-soft: rgba(255,255,255,.07);
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html{ overflow-x:hidden; font-size:16px !important; }
  body{ font-family:var(--font-body); font-size:16px !important; background:var(--paper); color:var(--ink); min-height:100vh; }
  a{ color:inherit; text-decoration:none; }
  button, input, select{ font-family:inherit; }
  :focus-visible{ outline:3px solid var(--red-deep); outline-offset:3px; }

  .mkt-header{
    display:flex; align-items:center; gap:1rem; padding:1rem 1.4rem;
    border-bottom:1px solid var(--line); background:var(--white); flex-wrap:wrap;
  }
  .logo{ font-family:var(--font-brand); font-weight:900; font-size:1.3rem; display:flex; align-items:baseline; white-space:nowrap; }
  .logo .va{ color:var(--red); }
  .mode-switch{
    display:flex; align-items:center; gap:.4rem; font-size:.82rem; color:var(--muted); font-weight:600;
    padding:.35rem .5rem; border-radius:100px; background:var(--paper);
  }
  .mode-switch a{ padding:.3rem .7rem; border-radius:100px; }
  .mode-switch a.active{ background:var(--red); color:#fff; }

  .search-bar{
    flex:1; display:flex; align-items:center; gap:.65rem; min-width:280px; max-width:980px;
  }
  .search-field{ display:flex; align-items:center; min-height:46px; padding:.55rem .95rem; min-width:150px; border:1px solid var(--line); border-radius:12px; background:var(--white); transition:border-color .2s, box-shadow .2s; }
  .search-field:first-child{ flex:1; min-width:260px; }
  .search-field.category-field{ flex:0 0 190px; }
  .search-field:focus-within{ border-color:var(--red); box-shadow:0 0 0 3px rgba(196,30,58,.12); }
  .search-field label{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0,0,0,0); }
  .search-field input, .search-field select{ border:none; background:none; color:var(--ink); font-size:.86rem; outline:none; width:100%; }
  .search-field input::placeholder{ color:var(--muted); opacity:1; }
  .search-field select option, .results-controls select option{ background:var(--white); color:var(--ink); }
  .search-submit{ min-height:46px; background:var(--red); color:#fff; border:1px solid var(--red); border-radius:12px; padding:0 1.25rem; font-weight:700; font-size:.86rem; cursor:pointer; }
  .search-submit:hover{ background:var(--red-deep); }
  .price-control{ position:relative; flex:0 0 190px; }
  .price-trigger{ width:100%; min-height:46px; display:flex; align-items:center; justify-content:space-between; padding:0 .95rem; border:1px solid var(--line); border-radius:12px; background:var(--white); color:var(--ink); font-size:.86rem; cursor:pointer; }
  .price-trigger:hover{ border-color:var(--muted); }
  .price-popover{ display:none; position:absolute; z-index:10; top:calc(100% + .55rem); right:0; width:250px; padding:.8rem; border:1px solid var(--line); border-radius:12px; background:var(--white); box-shadow:0 16px 36px rgba(0,0,0,.3); }
  .price-popover.open{ display:block; }
  .price-popover .price-inputs input{ min-width:0; }
  .price-popover .filter-row{ margin-top:.55rem; }
  .toolbar-compatible-filters{ display:none; }

  .topbar-actions{ margin-left:auto; display:flex; align-items:center; gap:.6rem; }
  .avatar-circle{ width:34px; height:34px; border-radius:50%; background:var(--paper); display:flex; align-items:center; justify-content:center; overflow:hidden; font-weight:700; color:var(--red-deep); }
  .avatar-circle img{ width:100%; height:100%; object-fit:cover; }

  .mkt-body{ display:flex; align-items:flex-start; }

  .filters{
    width:260px; flex-shrink:0; padding:1.4rem 1.2rem; border-right:1px solid var(--line);
    position:sticky; top:0; height:100vh; overflow-y:auto;
  }
  .filters-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:1rem; }
  .filters-head h2{ font-family:var(--font-display); font-size:1.05rem; font-weight:700; }
  .filters-reset{ font-size:.8rem; color:var(--red); font-weight:600; background:none; border:none; cursor:pointer; }
  .filter-group{ margin-bottom:1.4rem; }
  .filter-group h3{ font-size:.82rem; font-weight:700; margin-bottom:.6rem; }
  .price-inputs{ display:flex; align-items:center; gap:.5rem; }
  .price-inputs input{ width:100%; padding:.5rem .6rem; border:1px solid var(--line); border-radius:8px; background:var(--paper); color:var(--ink); font-size:.85rem; }
  .filter-row{ display:flex; align-items:center; justify-content:space-between; gap:.5rem; padding:.35rem 0; font-size:.87rem; cursor:pointer; }
  button.filter-row{ width:100%; border:0; background:transparent; color:var(--ink); text-align:left; }
  button.filter-row.active{ color:var(--red); font-weight:700; }
  .filter-row span.count{ color:var(--muted); font-size:.78rem; }
  .filter-row input[type="checkbox"]{ accent-color:var(--red); width:16px; height:16px; }

  .results-col{ flex:1; padding:1.8rem clamp(1rem, 2.5vw, 2.5rem) 3rem; min-width:0; }
  .results-head{ display:flex; align-items:flex-start; justify-content:space-between; flex-wrap:wrap; gap:.8rem; margin-bottom:1.1rem; }
  .results-head h1{ font-family:var(--font-brand); font-size:2rem; font-weight:700; letter-spacing:-.02em; }
  .results-sub{ font-size:.85rem; color:var(--muted); margin-top:.2rem; }
  .results-controls{ display:flex; align-items:center; gap:.6rem; }
  .results-controls select{ padding:.5rem .7rem; border:1px solid var(--line); border-radius:8px; background:var(--white); color:var(--ink); font-size:.83rem; }

  .grid{
    display:grid; grid-template-columns:repeat(4, minmax(0, 1fr)); gap:1rem; align-items:stretch;
  }
  @media (min-width: 1440px){
    .grid{ grid-template-columns:repeat(5, minmax(0, 1fr)); gap:1rem; }
  }
  .card{
    position:relative; min-width:0; border-radius:var(--radius-lg); overflow:hidden;
    background:var(--card-bg); border:1px solid var(--border-subtle); box-shadow:none; cursor:pointer;
    transition:transform .2s ease, box-shadow .2s ease, border-color .2s ease, background-color .2s ease;
  }
  .card:hover{ transform:translateY(-1px); box-shadow:none; border-color:rgba(255,56,92,.32); background:var(--card-bg-hover); }
  .card:focus-visible{ outline:2px solid var(--accent-cta); outline-offset:2px; }
  .card-media{ position:relative; aspect-ratio:4 / 3; background:var(--paper); overflow:hidden; }
  .card-media img{ width:100%; height:100%; object-fit:cover; display:block; transition:transform .25s ease; }
  .card:hover .card-media img{ transform:scale(1.03); }
  .image-fallback{ display:block; width:100%; height:100%; }
  .card-media .placeholder,
  .card-media-empty,
  .media-loading,
  .card-media.is-loading,
  .card-media-loading{
    display:flex; align-items:center; justify-content:center; height:100%; color:var(--ink); background:linear-gradient(180deg, rgba(15,19,24,.08), rgba(15,19,24,.02));
    font-size:.78rem; text-align:center; padding:1rem;
  }
  .card-media-empty{ background:linear-gradient(180deg, rgba(10,12,15,.92), rgba(10,12,15,.84)); }
  .media-loading, .card-media.is-loading, .card-media-loading{ position:relative; background:rgba(10,12,15,.9); }
  .media-loading::before, .card-media.is-loading::before, .card-media-loading::before{
    content:""; width:18px; height:18px; border:2px solid rgba(255,255,255,.2); border-top-color:rgba(255,255,255,.8); border-radius:50%;
    animation:spin .8s linear infinite; display:block; position:relative;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .card-media::after{ content:""; position:absolute; inset:auto 0 0; height:35%; background:linear-gradient(transparent, rgba(8,11,14,.62)); pointer-events:none; }
  .card-save{
    position:absolute; top:.65rem; right:.65rem; width:30px; height:30px; border-radius:50%; border:none; z-index:3;
    background:rgba(15,19,24,.42); backdrop-filter: blur(8px); display:flex; align-items:center; justify-content:center; cursor:pointer; color:#fff;
    box-shadow:0 8px 18px rgba(0,0,0,.18);
  }
  .card-save.saved{ color:#fff; background:rgba(196,30,58,.7); }
  .card-verified{
    position:absolute; top:.65rem; left:.65rem; z-index:3; background:rgba(15,19,24,.72); color:#fff; font-size:.62rem; font-weight:600;
    padding:.25rem .5rem; border-radius:100px; letter-spacing:.01em; backdrop-filter:blur(8px);
  }
  .card-body{
    position:relative; padding:.72rem .78rem .7rem; display:flex; flex-direction:column; gap:.22rem; color:var(--ink);
  }
  .card-title{ font-family:var(--font-display); font-weight:600; font-size:1rem; line-height:1.25; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:var(--text-primary); }
  .card-loc{ font-size:.875rem; line-height:1.35; color:var(--text-secondary); min-height:1.8em; }
  .card-loc a{ color:var(--accent-link); font-weight:600; }
  .card-foot{ display:flex; align-items:flex-end; justify-content:space-between; gap:.65rem; margin-top:.12rem; }
  .card-price{ font-weight:700; font-size:.95rem; color:var(--text-primary); }
  .card-price span{ font-weight:500; color:var(--text-secondary); font-size:.72rem; }
  .card-amenities{
    display:flex; align-items:center; flex-wrap:nowrap; gap:.5rem; min-height:1.5rem; padding:.06rem 0 .12rem; color:var(--text-secondary); overflow:hidden;
  }
  .card-amenity{ display:inline-flex; align-items:center; gap:.2rem; flex:0 0 auto; color:var(--text-secondary); font-size:.72rem; line-height:1; white-space:nowrap; }
  .card-amenity svg{ width:14px; height:14px; flex:0 0 auto; }
  .card-amenity-more{ display:none; }
  .card-book{ font-size:.72rem; font-weight:700; color:var(--accent-link); letter-spacing:-.01em; }
  .skeleton{ background:linear-gradient(90deg,var(--paper) 25%,var(--line-soft) 50%,var(--paper) 75%); background-size:200% 100%; animation:skeleton-shimmer 1.4s infinite; }
  .skeleton-card{ pointer-events:none; }
  .skeleton-media{ aspect-ratio:4/3; }
  .skeleton-line{ height:.75rem; border-radius:5px; }
  .skeleton-line.title{ width:72%; height:1rem; }
  .skeleton-line.host{ width:55%; }
  .skeleton-line.price{ width:38%; }
  @keyframes skeleton-shimmer{ to{ background-position:-200% 0; } }

  .empty-state{ padding:3rem 1rem; text-align:center; color:var(--muted); }
  .empty-state h2{ font-family:var(--font-display); color:var(--ink); font-size:1.15rem; margin-bottom:.4rem; }

  .pagination{ display:flex; align-items:center; justify-content:center; gap:.4rem; margin-top:2rem; }
  .pagination button{
    min-width:36px; height:36px; border-radius:8px; border:1px solid var(--line); background:var(--white);
    color:var(--ink); font-size:.85rem; cursor:pointer;
  }
  .pagination button.active{ background:var(--red); color:#fff; border-color:var(--red); }
  .pagination button[disabled]{ opacity:.4; cursor:not-allowed; }
  .load-more{ min-width:120px; padding:0 1rem; }
  .card-video{ width:100%; height:100%; object-fit:cover; display:block; }
  .card-video video{ width:100%; height:100%; object-fit:cover; display:block; background:var(--paper); }
  .card-media-loading{
    display:grid; place-items:center; aspect-ratio:4/3; background:#050505;
  }
  .card-media-loading::before{
    content:''; width:1.5rem; height:1.5rem; border:2px solid rgba(255,255,255,.2);
    border-top-color:rgba(255,255,255,.85); border-radius:50%;
    animation:varoom-video-spin .8s linear infinite;
  }
  @keyframes varoom-video-spin{ to{ transform:rotate(360deg); } }
  .mobile-marketplace-tools, .mobile-bottom-nav{ display:none; }

  @media (max-width: 1200px) and (min-width: 861px){
    .grid{ grid-template-columns:repeat(3, minmax(0, 1fr)); }
  }
  @media (max-width: 980px) and (min-width: 861px){
    .grid{ grid-template-columns:repeat(2, minmax(0, 1fr)); }
    .search-field.category-field, .price-control{ flex-basis:155px; }
  }

  @media (max-width: 860px){
    body{ padding-bottom:4.4rem; }
    .mkt-header{ display:block; padding:.8rem .8rem .3rem; border:0; background:var(--paper); }
    .mkt-header .logo, .mode-switch, .topbar-actions{ display:none; }
    .filters{ display:none; }
    .mkt-body{ flex-direction:column; }
    .search-bar{ display:none; }
    .mobile-marketplace-tools{ display:block; }
    .mobile-search{ display:flex; align-items:center; gap:.55rem; height:2.75rem; padding:0 .9rem; border:1px solid var(--line-soft); border-radius:999px; background:var(--white); box-shadow:0 3px 12px rgba(26,18,16,.05); }
    .mobile-search svg{ flex:0 0 auto; color:var(--muted); }
    .mobile-search input{ min-width:0; flex:1; border:0; outline:0; background:transparent; color:var(--ink); font-size:.78rem; }
    .mobile-search input::placeholder{ color:var(--muted); opacity:1; }
    .mobile-search button{ display:flex; align-items:center; justify-content:center; width:1.55rem; height:1.55rem; border:0; background:none; color:var(--muted); cursor:pointer; }
    .mobile-category-row{ display:flex; gap:.5rem; margin-top:.65rem; margin-right:-.8rem; overflow-x:auto; padding:0 .8rem .2rem 0; -ms-overflow-style:none; scrollbar-width:none; }
    .mobile-category-row::-webkit-scrollbar{ display:none; }
    .mobile-category-chip{ flex:0 0 auto; min-height:2rem; padding:0 .82rem; border:0; border-radius:999px; background:var(--white); color:var(--ink); font-size:.68rem; font-weight:600; cursor:pointer; white-space:nowrap; }
    .mobile-category-chip.active{ background:var(--ink); color:var(--paper); }
    .results-col{ width:100%; padding:.35rem .8rem 1.5rem; }
    .grid{ width:100%; display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:.65rem; }
    .card{ width:100%; max-width:none; border:0; border-radius:12px; background:transparent; aspect-ratio:4 / 5; }
    .card:hover{ transform:none; background:transparent; }
    .card-media{ position:absolute; inset:0; aspect-ratio:auto; border-radius:inherit; }
    .card-media::after{ height:58%; background:linear-gradient(to bottom, transparent 0%, rgba(8,11,14,.08) 25%, rgba(8,11,14,.78) 100%); }
    .card-body{ position:absolute; z-index:2; right:0; bottom:0; left:0; padding:.55rem .58rem .6rem; gap:.13rem; color:#fff; pointer-events:none; }
    .card-title{ font-size:.72rem; line-height:1.2; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .card-loc{ font-size:.58rem; min-height:0; line-height:1.25; color:rgba(255,255,255,.86); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .card-foot{ align-items:center; justify-content:space-between; gap:.25rem; margin-top:0; }
    .card-price{ font-size:.64rem; color:#fff; white-space:nowrap; }
    .card-price span{ font-size:.5rem; color:rgba(255,255,255,.8); }
    .card-book{ font-size:.54rem; color:#fff; pointer-events:auto; white-space:nowrap; }
    .card-amenities{ display:none; }
    .card-save{ top:.48rem; right:.48rem; width:1.7rem; height:1.7rem; background:rgba(15,19,24,.45); }
    .card-save svg{ width:11px; height:11px; }
    .card-verified{ top:.48rem; left:.48rem; padding:.18rem .36rem; font-size:.5rem; }
    .card-video{ min-height:0; }
    .pagination{ margin-top:1rem; }
    .mobile-bottom-nav{ position:fixed; z-index:20; bottom:0; left:50%; display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); width:min(100% - 1rem,32rem); min-height:3.7rem; transform:translateX(-50%); padding:.3rem .35rem calc(.3rem + env(safe-area-inset-bottom)); margin-bottom:max(.45rem,env(safe-area-inset-bottom)); border:1px solid var(--line-soft); border-radius:999px; background:var(--white); box-shadow:0 10px 28px rgba(26,18,16,.14); }
    .mobile-bottom-nav a{ display:flex; flex-direction:column; align-items:center; justify-content:center; min-width:0; min-height:2.85rem; gap:.18rem; padding:.35rem .2rem; border-radius:999px; color:var(--ink); font-size:.62rem; font-weight:600; white-space:nowrap; }
    .mobile-bottom-nav a.active{ color:#fff; background:var(--red); font-weight:700; }
    .mobile-bottom-nav svg{ width:1.05rem; height:1.05rem; flex-shrink:0; }
  }
</style>
</head>
<body>

<header class="mkt-header">
  <a href="/client-home" class="logo" id="marketplace-home-link"><span class="va">Va</span><span class="room">Room</span></a>
  <div class="mode-switch">
    <a href="/client-home" id="marketplace-discover-link">Discover</a>
    <a href="/marketplace" class="active">Marketplace</a>
  </div>

  <div class="search-bar">
    <div class="search-field">
      <label for="q-dest">Where</label>
      <input type="text" id="q-dest" placeholder="Search by location, property name, or keyword...">
    </div>
    <div class="search-field category-field">
      <label for="q-category">Type</label>
      <select id="q-category">
        <option value="all">All types</option>
        <option value="airbnb">Airbnbs</option>
        <option value="hotel">Hotels</option>
        <option value="venue">Event Venues</option>
        <option value="office">Offices</option>
        <option value="shop">Shops</option>
        <option value="property">Property</option>
      </select>
    </div>
    <div class="price-control">
      <button type="button" class="price-trigger" id="price-trigger" aria-expanded="false">
        <span id="price-label">Any price</span><span aria-hidden="true">⌄</span>
      </button>
      <div class="price-popover" id="price-popover">
        <div class="price-inputs">
          <input type="number" id="price-min" placeholder="Min price" min="0">
          <span>–</span>
          <input type="number" id="price-max" placeholder="Max price" min="0">
        </div>
        <label class="filter-row"><span>Verified hosts only</span><input type="checkbox" id="verified-only"></label>
        <button type="button" class="filters-reset" id="filters-reset">Reset filters</button>
      </div>
    </div>
    <input type="hidden" id="q-guests" value="">
    <button type="button" class="search-submit" id="search-submit">Search</button>
  </div>

  <div class="topbar-actions">
    <a href="/profile" class="avatar-circle" id="user-avatar" aria-label="Profile"></a>
  </div>
  <div class="mobile-marketplace-tools">
    <div class="mobile-search">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><line x1="16.5" y1="16.5" x2="21" y2="21"></line></svg>
      <input type="text" id="mobile-q-dest" placeholder="Search properties, locations..." aria-label="Search properties and locations">
      <button type="button" id="mobile-search-submit" aria-label="Search">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h16M7 12h10M10 18h4"></path></svg>
      </button>
    </div>
    <div class="mobile-category-row" role="tablist" aria-label="Property categories">
      <button type="button" class="mobile-category-chip active" data-mobile-category="all">All</button>
      <button type="button" class="mobile-category-chip" data-mobile-category="airbnb">Airbnbs</button>
      <button type="button" class="mobile-category-chip" data-mobile-category="hotel">Hotels</button>
      <button type="button" class="mobile-category-chip" data-mobile-category="venue">Event Venues</button>
      <button type="button" class="mobile-category-chip" data-mobile-category="office">Offices</button>
      <button type="button" class="mobile-category-chip" data-mobile-category="shop">Shops</button>
      <button type="button" class="mobile-category-chip" data-mobile-category="property">Property</button>
    </div>

<script src="js/supabase-client.js"></script>
<script>
(async function(){
  const CATEGORY_LABELS = { airbnb:'Airbnbs', hotel:'Hotels', venue:'Event Venues', office:'Offices', shop:'Shops', property:'Property' };
  const ICON_BOOKMARK_OUTLINE = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3.5h12a1 1 0 0 1 1 1V21l-7-4-7 4V4.5a1 1 0 0 1 1-1Z"/></svg>';
  const ICON_BOOKMARK_FILLED = '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3.5h12a1 1 0 0 1 1 1V21l-7-4-7 4V4.5a1 1 0 0 1 1-1Z"/></svg>';
  const ICON_BED = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 12.5V7.8A1.8 1.8 0 0 1 5.3 6h2.4a2.1 2.1 0 0 1 2.1 2.1v2.4h9.7v3.5h-2.2v1.9H3.5v-1.9H3.5Zm1.8-1.8h9.7v-2.5H5.3a1.1 1.1 0 0 0-1.1 1.1v1.4Z"/><path d="M3.5 17v2M20.5 17v2"/></svg>';
  const ICON_BATH = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 12h10a2.5 2.5 0 0 1 2.5 2.5V15a2.5 2.5 0 0 1-2.5 2.5H8A2.5 2.5 0 0 1 5.5 15v-.5A2.5 2.5 0 0 1 8 12h-.5"/><path d="M8 12V8.5A2.5 2.5 0 0 1 10.5 6H11a2.5 2.5 0 0 1 2.5 2.5V12"/><path d="M5.5 18.5h13"/></svg>';
  const ICON_GUEST = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16.5 18a4.5 4.5 0 0 0-9 0"/><circle cx="12" cy="9" r="3.5"/><path d="M18.5 18a4.5 4.5 0 0 0-2.8-4.2"/><path d="M5.5 18a4.5 4.5 0 0 1 2.8-4.2"/></svg>';
  const ICON_SIZE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8V4h4M20 8V4h-4M4 16v4h4M20 16v4h-4"/><path d="M8 4 4 8M16 4l4 4M4 16l4 4M20 16l-4 4"/></svg>';
  const PAGE_SIZE = 12;

  const MKT_SELECT = 'id,title,description,location_text,category,verified,created_at,host_id,availability_status,' +
    'host:profiles!inner(full_name,verified,avatar_url,username),' +
    'listing_photos(storage_path),listing_booking_details(*)';
  const MKT_LEGACY_SELECT = 'id,title,description,location_text,category,verified,created_at,host_id,' +
    'host:profiles!inner(full_name,verified,avatar_url,username),' +
    'listing_photos(storage_path),listing_booking_details(*)';

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str || '';
    return div.innerHTML;
  }

  function formatHostName(host){
    if (Array.isArray(host)) host = host[0];
    if (!host) return '';
    return host.full_name || host.username || '';
  }

  // ---------- Auth guard ----------
  const { data: { session } } = await supabaseClient.auth.getSession();
  if (!session) { window.location.href = '/login'; return; }
  const currentUser = session.user;

  const dataCache = window.VaRoomDataCache;
  const profileResult = await dataCache.get('account:' + currentUser.id + ':profile:marketplace', function(){
    return supabaseClient
      .from('profiles')
      .select('role, full_name, avatar_url, looking_timeline, interested_categories')
      .eq('id', currentUser.id)
      .maybeSingle();
  });
  const profile = profileResult && profileResult.data;
  if (!profile) { window.location.href = '/login'; return; }
  const preferredCategories = profile.role === 'client' && profile.looking_timeline === 'soon'
    ? (profile.interested_categories || []).map(function(category){ return String(category || '').trim().toLowerCase(); }).filter(function(category){ return Object.prototype.hasOwnProperty.call(CATEGORY_LABELS, category); })
    : [];
  const homeHref = profile.role === 'host' ? '/host-home' : '/client-home';
  ['marketplace-home-link', 'marketplace-discover-link', 'marketplace-mobile-home-link'].forEach(function(id){
    document.getElementById(id).setAttribute('href', homeHref);
  });
  const avatarEl = document.getElementById('user-avatar');
  if (profile.avatar_url) {
    avatarEl.innerHTML = '<img src="' + escapeHtml(profile.avatar_url) + '" alt="">';
  } else {
    avatarEl.textContent = (profile.full_name || '?').charAt(0).toUpperCase();
  }

  // ---------- Bookmarks ----------
  let bookmarkedIds = new Set();
  const bookmarkResult = await dataCache.get('account:' + currentUser.id + ':bookmarks', function(){
    return supabaseClient.from('bookmarks').select('listing_id').eq('client_id', currentUser.id);
  });
  const bookmarks = bookmarkResult && bookmarkResult.data;
  if (bookmarks) bookmarkedIds = new Set(bookmarks.map(function(b){ return b.listing_id; }));

  async function toggleBookmark(listingId, btn){
    if (bookmarkedIds.has(listingId)) {
      await supabaseClient.from('bookmarks').delete().eq('client_id', currentUser.id).eq('listing_id', listingId);
      bookmarkedIds.delete(listingId);
      btn.classList.remove('saved');
      btn.innerHTML = ICON_BOOKMARK_OUTLINE;
    } else {
      await supabaseClient.from('bookmarks').insert({ client_id: currentUser.id, listing_id: listingId });
      bookmarkedIds.add(listingId);
      btn.classList.add('saved');
      btn.innerHTML = ICON_BOOKMARK_FILLED;
    }
  }

  // ---------- State (seeded from URL, so Explore/search handoff works) ----------
  const params = new URLSearchParams(window.location.search);
  const state = {
    q: params.get('q') || '',
    category: params.get('category') || 'all',
    guests: params.get('guests') || '',
    priceMin: null,
    priceMax: null,
    verifiedOnly: false,
    sort: 'newest',
    page: 1
  };
  document.getElementById('q-dest').value = state.q;
  document.getElementById('q-category').value = state.category;
  document.getElementById('q-guests').value = state.guests;
  document.getElementById('mobile-q-dest').value = state.q;
  document.getElementById('mobile-q-category').value = state.category;
  document.getElementById('mobile-q-guests').value = state.guests;
  function syncMobileCategoryChips(){
    document.querySelectorAll('[data-mobile-category]').forEach(function(chip){
      const active = chip.getAttribute('data-mobile-category') === state.category;
      chip.classList.toggle('active', active);
      chip.setAttribute('aria-selected', String(active));
    });
  }
  syncMobileCategoryChips();

  let allListings = []; // full result set for the current search text/category, filters applied client-side
  const videoLookups = new Map();

  function formatPrice(details){
    if (Array.isArray(details)) details = details[0];
    if (!details) return null;
    const amount = details.price_amount;
    const unit = details.price_unit;
    if (amount == null) return null;
    return { amount: Number(amount), unit: unit || 'night' };
  }

  function placeholderHtml(listing){
    return '<div class="placeholder">' + escapeHtml((CATEGORY_LABELS[listing.category] || listing.category || 'Property')) + '</div>';
  }

  function sanitizeLocationText(value){
    if (!value) return '';
    const cleaned = String(value).trim().replace(/\s+/g, ' ');
    if (!cleaned || /location to be added|not available|coming soon/i.test(cleaned)) return '';
    return cleaned;
  }

  function normalizeListingTitle(value){
    const fallback = 'Property';
    if (!value || typeof value !== 'string') return fallback;
    const cleaned = value.replace(/\s+/g, ' ').trim();
    if (!cleaned) return fallback;
    const normalized = cleaned.replace(/^\.+\s*$/, '').trim();
    if (!normalized || normalized.length <= 2 || /^(a|test|new|listing)$/i.test(normalized)) return fallback;
    return normalized;
  }

  function dedupeListings(listings){
    const seen = new Set();
    return (listings || []).filter(function(listing){
      if (!listing || !listing.id) return false;
      if (seen.has(listing.id)) return false;
      seen.add(listing.id);
      return true;
    });
  }

  const AMENITY_ICONS = {
    wifi: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.55a11 11 0 0 1 14.08 0"/><path d="M1.42 9a16 16 0 0 1 21.16 0"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/></svg>',
    air_conditioning: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 10h14M7.5 7.5v5m9-5v5M12 4v16m0-10c-3.5 0-5.5 2.2-5.5 5.2C6.5 17.1 8.2 19 12 19s5.5-1.9 5.5-5.8C17.5 14.2 15.5 14 12 14Z"/></svg>',
    ac: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 10h14M7.5 7.5v5m9-5v5M12 4v16m0-10c-3.5 0-5.5 2.2-5.5 5.2C6.5 17.1 8.2 19 12 19s5.5-1.9 5.5-5.8C17.5 14.2 15.5 14 12 14Z"/></svg>',
    pool: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 14c3-2 5-2 7 0s4 2 7 0 4-2 4 0v3H3v-3Z"/><path d="M7 18v3M17 18v3M12 10c0-1.7 1.3-3 3-3 1.7 0 3 1.3 3 3"/><path d="M12 10c0-1.7-1.3-3-3-3S6 8.3 6 10"/></svg>',
    parking: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 17V7h4a3 3 0 0 1 0 6H9"/></svg>',
    kitchen: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/></svg>',
    tv: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="15" x="2" y="7" rx="2"/><polyline points="17 2 12 7 7 2"/></svg>',
    balcony: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21V9l8-6 8 6v12"/><path d="M4 21h16"/><path d="M9 21v-6h6v6"/></svg>',
    workspace: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 16V7a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v9m16 0H4m16 0 1.28 2.55a1 1 0 0 1-.9 1.45H3.62a1 1 0 0 1-.9-1.45L4 16"/></svg>',
    washing_machine: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="16" height="18" x="4" y="3" rx="2"/><circle cx="12" cy="12" r="4"/><path d="M8 6h.01M16 6h.01"/></svg>',
    heating: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.07-2.14-.22-4.05 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.15.43-2.29 1-3a2.5 2.5 0 0 0 2.5 2.5Z"/></svg>',
    breakfast: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 8h1a4 4 0 1 1 0 8h-1"/><path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4Z"/><line x1="6" y1="2" x2="6" y2="4"/><line x1="10" y1="2" x2="10" y2="4"/><line x1="14" y1="2" x2="14" y2="4"/></svg>',
    mountain: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m8 3 4 8 5-5 5 15H2L8 3z"/></svg>',
    pet: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="4" r="2"/><circle cx="18" cy="8" r="2"/><circle cx="20" cy="16" r="2"/><path d="M9 10a5 5 0 0 1 5 5v3.5a3.5 3.5 0 0 1-6.84 1.04Q6.52 17.48 4.46 16.84A3.5 3.5 0 0 1 5.5 10Z"/></svg>',
    power: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 7h1a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2h-1"/><path d="M6 7H5a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h1"/><polyline points="11 7 7 12 13 12 9 17"/><line x1="22" y1="11" x2="22" y2="13"/></svg>'
  };

  function imageHtml(listing){
    const photo = (listing.listing_photos || []).find(function(item){ return item && item.storage_path; });
    if (!photo) return '<div class="card-media-empty" aria-hidden="true"></div>';
    const url = supabaseClient.storage.from('listing-photos').getPublicUrl(photo.storage_path).data.publicUrl;
    const title = normalizeListingTitle(listing.title || listing.name || '');
    return '<div class="card-media-loading" aria-hidden="true"></div>' +
      '<img src="' + escapeHtml(url) + '" alt="' + escapeHtml(title) + '" loading="lazy" style="opacity:0; transition:opacity .2s ease;" onload="this.style.opacity=1; this.previousElementSibling.remove();" onerror="this.style.display=\'none\'; this.previousElementSibling.remove(); this.nextElementSibling.hidden=false;">' +
      '<span class="image-fallback" hidden><div class="placeholder">' + escapeHtml((CATEGORY_LABELS[listing.category] || listing.category || 'Property')) + '</div></span>';
  }

  function getListingAmenities(listing){
    const detail = Array.isArray(listing.listing_booking_details)
      ? (listing.listing_booking_details[0] || {})
      : (listing.listing_booking_details || {});
    const raw = Array.isArray(detail.amenities) ? detail.amenities : [];
    const icons = [];
    raw.forEach(function(key){
      const normalized = String(key).trim().toLowerCase();
      if (normalized && AMENITY_ICONS[normalized]) icons.push({ key: normalized, html: AMENITY_ICONS[normalized] });
    });
    return icons.slice(0, 4);
  }

  function getListingCardAmenities(listing){
    return getListingAmenities(listing).map(function(item){
      return {
        key: item.key,
        html: item.html,
        label: item.key.replace(/_/g, ' ')
      };
    });
  }

  function createListingCard(listing){
    const isBookmarked = bookmarkedIds.has(listing.id);
    const price = formatPrice(listing.listing_booking_details || listing.booking_details);
    const mediaHtml = imageHtml(listing);
    const detail = Array.isArray(listing.listing_booking_details)
      ? (listing.listing_booking_details[0] || {})
      : (listing.listing_booking_details || {});
    const locationText = sanitizeLocationText(listing.location_text || detail.location_text || '');
    const amenities = getListingCardAmenities(listing);
    const visibleAmenities = amenities.map(function(item){
      return '<span class="card-amenity" title="' + escapeHtml(item.label) + '" aria-label="' + escapeHtml(item.label) + '">' + item.html + '</span>';
    }).join('');
    const title = normalizeListingTitle(listing.title || listing.name || '');

    return (
      '<div class="card" data-listing-id="' + listing.id + '" data-href="/booking?listing=' + listing.id + '" tabindex="0" role="link" aria-label="Open listing: ' + escapeHtml(title) + '">' +
        '<div class="card-media" data-media-listing-id="' + listing.id + '">' +
          mediaHtml +
          '<span class="card-verified">' + escapeHtml(CATEGORY_LABELS[listing.category] || listing.category || 'Property') + '</span>' +
          '<button type="button" class="card-save ' + (isBookmarked ? 'saved' : '') + '" data-listing-id="' + listing.id + '" aria-label="Save">' +
            (isBookmarked ? ICON_BOOKMARK_FILLED : ICON_BOOKMARK_OUTLINE) +
          '</button>' +
        '</div>' +
        '<div class="card-body">' +
          '<div class="card-title">' + escapeHtml(title) + '</div>' +
          (locationText ? '<div class="card-loc">' + escapeHtml(locationText) + '</div>' : '') +
          '<div class="card-amenities" aria-label="Property amenities">' + visibleAmenities + '</div>' +
          '<div class="card-foot">' +
            (price
              ? '<div class="card-price">KSh ' + price.amount.toLocaleString() + ' <span>/ ' + escapeHtml(price.unit) + '</span></div>'
              : '<div class="card-price"><span>Price on request</span></div>') +
            '<a href="/booking?listing=' + listing.id + '" class="card-book" aria-label="View listing">View property →</a>' +
          '</div>' +
        '</div>' +
      '</div>'
    );
  }

  function renderCard(listing){
    return createListingCard(listing);
  }

  async function loadListingVideo(listingId){
    const element = document.querySelector('[data-media-listing-id="' + listingId + '"]');
    if (!element || (videoLookups.get(listingId) === element && element.querySelector('video'))) return;
    videoLookups.set(listingId, element);
    element.classList.add('is-loading');
    try {
      const playback = await dataCache.get('public:listing-video:' + listingId, async function(){
        const auth = await supabaseClient.auth.getSession();
        const token = auth.data.session && auth.data.session.access_token;
        const headers = token ? { Authorization: 'Bearer ' + token } : {};
        const mediaResponse = await fetch('/api/properties/' + encodeURIComponent(listingId) + '/media', { headers: headers });
        if (!mediaResponse.ok) return null;
        const payload = await mediaResponse.json();
        const media = (payload.media || []).find(function(item){ return item && item.type === 'video'; });
        if (!media) return null;
        const playbackResponse = await fetch('/api/media/' + encodeURIComponent(media.id) + '/playback', { headers: headers });
        if (!playbackResponse.ok) return null;
        const playback = await playbackResponse.json();
        return playback && playback.url
          ? { id: media.id, url: playback.url, thumbnailUrl: playback.thumbnailUrl || null }
          : null;
      }, { ttl: 5 * 60 * 1000 });
      const currentElement = document.querySelector('[data-media-listing-id="' + listingId + '"]');
      if (!currentElement || currentElement !== element) {
        return;
      }
      if (!playback || !playback.url) {
        element.classList.remove('is-loading');
        const pending = element.querySelector('.card-media-loading');
        if (pending) pending.outerHTML = imageHtml(allListings.find(function(listing){ return listing.id === listingId; }) || {});
        return;
      }
      const mediaNodes = Array.from(element.children).filter(function(child){
        return !child.classList.contains('card-verified') && !child.classList.contains('card-save');
      });
      mediaNodes.forEach(function(node){ node.remove(); });
      const video = document.createElement('video');
      video.className = 'card-video';
      video.muted = true;
      video.playsInline = true;
      video.controls = false;
      video.preload = 'metadata';
      element.insertBefore(video, element.firstChild);
      element.dataset.videoId = playback.id;
      if (playback.thumbnailUrl) video.poster = playback.thumbnailUrl;
      video.src = playback.url;
      video.addEventListener('loadeddata', function(){
        element.classList.remove('is-loading');
      }, { once: true });
      video.addEventListener('error', function(){
        element.classList.remove('is-loading');
        video.remove();
        const mediaFragment = document.createDocumentFragment();
        mediaNodes.forEach(function(node){ mediaFragment.appendChild(node); });
        element.insertBefore(mediaFragment, element.firstChild);
      }, { once: true });
    } catch (error) {
      element.classList.remove('is-loading');
      console.warn('Marketplace video preview unavailable:', error.message);
      const pending = element.querySelector('.card-media-loading');
      if (pending) pending.outerHTML = imageHtml(allListings.find(function(listing){ return listing.id === listingId; }) || {});
    }
  }

  document.addEventListener('click', function(event){
    const card = event.target.closest('.card');
    if (!card) return;
    if (event.target.closest('.card-save')) return;
    const href = card.getAttribute('data-href');
    if (href) window.location.href = href;
  });

  document.addEventListener('keydown', function(event){
    const card = event.target.closest('.card');
    if (!card) return;
    if (event.key !== 'Enter' && event.key !== ' ') return;
    if (event.target.closest('.card-save')) return;
    event.preventDefault();
    const href = card.getAttribute('data-href');
    if (href) window.location.href = href;
  });

  function observeVideoCards(){
    const cards = document.querySelectorAll('[data-media-listing-id]');
    if (!('IntersectionObserver' in window)) {
      cards.forEach(function(card){ loadListingVideo(card.getAttribute('data-media-listing-id')); });
      return;
    }
    const observer = new IntersectionObserver(function(entries, instance){
      entries.forEach(function(entry){
        if (!entry.isIntersecting) return;
        instance.unobserve(entry.target);
        loadListingVideo(entry.target.getAttribute('data-media-listing-id'));
      });
    }, { rootMargin: '240px' });
    cards.forEach(function(card){ observer.observe(card); });
  }

  function renderSkeletons(count){
    return Array.from({ length: count }, function(){
      return '<div class="card skeleton-card" aria-hidden="true">' +
        '<div class="skeleton skeleton-media"></div>' +
        '<div class="card-body">' +
          '<div class="skeleton skeleton-line title"></div>' +
          '<div class="skeleton skeleton-line"></div>' +
          '<div class="skeleton skeleton-line host"></div>' +
          '<div class="card-foot"><div class="skeleton skeleton-line price"></div><div class="skeleton skeleton-line" style="width:30%;"></div></div>' +
        '</div>' +
      '</div>';
    }).join('');
  }

  function applyFiltersAndSort(items){
    let out = items.filter(function(l){
      const price = formatPrice(l.listing_booking_details);
      if (state.priceMin != null && (price == null || price.amount < state.priceMin)) return false;
      if (state.priceMax != null && (price == null || price.amount > state.priceMax)) return false;
      if (state.verifiedOnly && !l.verified) return false;
      return true;
    });
    out.sort(function(a, b){
      // The default Marketplace view is still complete and filterable. This
      // only ranks a looking-soon client's saved niches ahead of other
      // listings until they choose a specific category or search.
      if (state.category === 'all' && !state.q && preferredCategories.length > 0) {
        const aPreferred = preferredCategories.includes(a.category);
        const bPreferred = preferredCategories.includes(b.category);
        if (aPreferred !== bPreferred) return aPreferred ? -1 : 1;
      }
      if (state.sort === 'newest') return new Date(b.created_at) - new Date(a.created_at);
      const pa = formatPrice(a.listing_booking_details);
      const pb = formatPrice(b.listing_booking_details);
      const va = pa ? pa.amount : Infinity;
      const vb = pb ? pb.amount : Infinity;
      return state.sort === 'price_asc' ? va - vb : vb - va;
    });
    return out;
  }

  function renderTypeFilters(items){
    const counts = {};
    items.forEach(function(l){ counts[l.category] = (counts[l.category] || 0) + 1; });
    const wrap = document.getElementById('type-filters');
    const categories = ['all'].concat(Object.keys(CATEGORY_LABELS));
    wrap.innerHTML = categories.map(function(cat){
      const n = counts[cat] || 0;
      const active = state.category === cat ? ' active' : '';
      return '<button type="button" class="filter-row' + active + '" data-category="' + cat + '">' +
        '<span>' + (cat === 'all' ? 'All types' : CATEGORY_LABELS[cat]) + '</span><span class="count">' + (cat === 'all' ? resultCount : n) + '</span></button>';
    }).join('');
    wrap.querySelectorAll('[data-category]').forEach(function(button){
      button.addEventListener('click', function(){
        state.category = button.getAttribute('data-category');
        document.getElementById('q-category').value = state.category;
        runSearch();
      });
    });
  }

  function renderPagination(total){
    const el = document.getElementById('pagination');
    if (!hasMoreResults) { el.innerHTML = ''; return; }
    el.innerHTML = '<button type="button" class="load-more">Load more</button>';
    el.querySelector('button').addEventListener('click', function(){
      loadListings(false);
    });
  }

  function renderResults(){
    const uniqueListings = dedupeListings(allListings);
    const filtered = applyFiltersAndSort(uniqueListings);
    renderTypeFilters(uniqueListings.filter(function(l){
      // type counts reflect the search text + price/verified filters, not the type filter itself
      return true;
    }));
    const displayedCount = resultCount || filtered.length;
    const resultsSub = document.getElementById('results-sub');
    if (resultsSub) {
      resultsSub.textContent =
        displayedCount + ' ' + (displayedCount === 1 ? 'property' : 'properties') + ' found' + (state.q ? ' for "' + state.q + '"' : '') +
        (state.category === 'all' && !state.q && preferredCategories.length > 0 ? ' · showing your niches first' : '');
    }

    const grid = document.getElementById('results-grid');
    if (filtered.length === 0) {
      grid.innerHTML = '';
      grid.parentElement.insertAdjacentHTML('afterbegin', '');
      grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1;"><h2>No listings match yet</h2><p>Try widening your price range or clearing a filter.</p></div>';
      renderPagination(0);
      return;
    }
    grid.innerHTML = filtered.map(renderCard).join('');
    grid.querySelectorAll('.card-save').forEach(function(btn){
      btn.addEventListener('click', function(){
        toggleBookmark(btn.getAttribute('data-listing-id'), btn);
      });
    });
    observeVideoCards();
    renderPagination(filtered.length);
  }

  let loadingMore = false;
  let hasMoreResults = true;
  let listingOffset = 0;
  let resultCount = 0;
  let requestVersion = 0;

  async function fetchListings(select, filterAvailability, offset){
      let query = supabaseClient.from('listings').select(select, { count: 'exact' }).range(offset, offset + PAGE_SIZE - 1);
      query = query.eq('moderation_status', 'active');
      if (filterAvailability) query = query.eq('availability_status', 'available');
      if (state.category !== 'all') query = query.eq('category', state.category);
      if (state.q) {
        const term = state.q.replace(/[%(),]/g, ' ').trim();
        if (term) {
          query = query.or('title.ilike.%' + term + '%,location_text.ilike.%' + term + '%,category.ilike.%' + term + '%');
        }
      }
      if (state.priceMin != null) query = query.gte('listing_booking_details.price_amount', state.priceMin);
      if (state.priceMax != null) query = query.lte('listing_booking_details.price_amount', state.priceMax);
      if (state.guests) query = query.gte('listing_booking_details.max_guests', parseInt(state.guests, 10));
      if (state.verifiedOnly) query = query.eq('host.verified', true);
      if (state.sort === 'price_asc') query = query.order('price_amount', { foreignTable: 'listing_booking_details', ascending: true, nullsFirst: false });
      else if (state.sort === 'price_desc') query = query.order('price_amount', { foreignTable: 'listing_booking_details', ascending: false, nullsFirst: false });
      else query = query.order('created_at', { ascending: false });
      const cacheKey = [
        'public:listings:marketplace', select, filterAvailability, offset,
        state.category, state.q, state.guests, state.priceMin, state.priceMax,
        state.verifiedOnly, state.sort
      ].join(':');
      return dataCache.get(cacheKey, function(){ return query; });
  }

  async function loadListings(reset){
    if (loadingMore || (!reset && !hasMoreResults)) return;
    loadingMore = true;
    const currentRequest = ++requestVersion;
    const offset = reset ? 0 : listingOffset;
    let { data, error, count } = await fetchListings(MKT_SELECT, true, offset);
    if (error) {
      console.warn('Marketplace availability-aware query failed; retrying shared listing shape:', error.message);
      const fallback = await fetchListings(MKT_LEGACY_SELECT, false, offset);
      data = fallback.data;
      error = fallback.error;
      count = fallback.count;
    }
    if (currentRequest !== requestVersion) {
      loadingMore = false;
      return;
    }
    if (error) {
      console.error('Marketplace listings query failed:', error);
      const resultsTitle = document.getElementById('results-title');
      const resultsSub = document.getElementById('results-sub');
      if (resultsTitle) resultsTitle.textContent = 'Listings';
      if (resultsSub) resultsSub.textContent = 'Listings are temporarily unavailable.';
      document.getElementById('results-grid').innerHTML =
        '<div class="empty-state" style="grid-column:1/-1;"><h2>Unable to load listings</h2><p>Please try again in a moment.</p><button type="button" class="load-more" id="retry-listings">Retry</button></div>';
      document.getElementById('pagination').innerHTML = '';
      loadingMore = false;
      document.getElementById('retry-listings').addEventListener('click', function(){ runSearch(); });
      return;
    }
    const minGuests = state.guests ? parseInt(state.guests, 10) : null;
    const pageListings = dedupeListings((data || []).filter(function(l){
      if (minGuests != null) {
        const details = Array.isArray(l.listing_booking_details) ? l.listing_booking_details[0] : l.listing_booking_details;
        const guests = details && details.max_guests;
        if (guests != null && guests < minGuests) return false;
      }
      return true;
    }));
    const knownIds = new Set(allListings.map(function(listing){ return listing.id; }));
    if (reset) allListings = [];
    if (reset) resultCount = count || 0;
    pageListings.forEach(function(listing){
      if (!knownIds.has(listing.id)) {
        allListings.push(listing);
        knownIds.add(listing.id);
      }
    });
    hasMoreResults = (data || []).length === PAGE_SIZE;
    listingOffset = offset + (data || []).length;
    loadingMore = false;
    const resultsTitle = document.getElementById('results-title');
    if (resultsTitle) {
      resultsTitle.textContent = state.q ? ('Results for "' + state.q + '"' ) : 'Listings';
    }
    renderResults();
  }

  async function runSearch(){
    requestVersion += 1;
    state.page = 1;
    allListings = [];
    resultCount = 0;
    hasMoreResults = true;
    listingOffset = 0;
    const resultsSub = document.getElementById('results-sub');
    if (resultsSub) resultsSub.textContent = 'Loading…';
    document.getElementById('results-grid').innerHTML = renderSkeletons(6);
    await loadListings(true);
  }

  document.getElementById('search-submit').addEventListener('click', function(){
    state.q = document.getElementById('q-dest').value.trim();
    state.category = document.getElementById('q-category').value;
    state.guests = document.getElementById('q-guests').value;
    runSearch();
  });
  document.getElementById('mobile-search-submit').addEventListener('click', function(){
    state.q = document.getElementById('mobile-q-dest').value.trim();
    document.getElementById('q-dest').value = state.q;
    document.getElementById('q-category').value = state.category;
    document.getElementById('q-guests').value = state.guests;
    runSearch();
  });
  document.getElementById('mobile-q-dest').addEventListener('keydown', function(e){
    if (e.key === 'Enter') document.getElementById('mobile-search-submit').click();
  });
  document.getElementById('mobile-q-category').addEventListener('change', function(){
    state.category = this.value;
    document.getElementById('q-category').value = state.category;
    syncMobileCategoryChips();
    runSearch();
  });
  document.querySelectorAll('[data-mobile-category]').forEach(function(chip){
    chip.addEventListener('click', function(){
      state.category = this.getAttribute('data-mobile-category');
      document.getElementById('mobile-q-category').value = state.category;
      document.getElementById('q-category').value = state.category;
      syncMobileCategoryChips();
      runSearch();
    });
  });
  document.getElementById('q-category').addEventListener('change', function(){
    state.category = this.value;
    document.getElementById('mobile-q-category').value = state.category;
    syncMobileCategoryChips();
    runSearch();
  });
  document.getElementById('q-dest').addEventListener('keydown', function(e){
    if (e.key === 'Enter') document.getElementById('search-submit').click();
  });
  const sortSelect = document.getElementById('sort-select');
  if (sortSelect) {
    sortSelect.addEventListener('change', function(){
      state.sort = this.value; state.page = 1; runSearch();
    });
  }
  document.getElementById('price-min').addEventListener('change', function(){
    state.priceMin = this.value ? Number(this.value) : null; state.page = 1; runSearch();
  });
  document.getElementById('price-max').addEventListener('change', function(){
    state.priceMax = this.value ? Number(this.value) : null; state.page = 1; runSearch();
  });
  function updatePriceLabel(){
    const min = document.getElementById('price-min').value;
    const max = document.getElementById('price-max').value;
    document.getElementById('price-label').textContent =
      min || max ? ('KSh ' + (min || '0') + ' – ' + (max || 'Any')) : 'Any price';
  }
  document.getElementById('price-min').addEventListener('input', updatePriceLabel);
  document.getElementById('price-max').addEventListener('input', updatePriceLabel);
  document.getElementById('price-trigger').addEventListener('click', function(){
    const popover = document.getElementById('price-popover');
    const open = popover.classList.toggle('open');
    this.setAttribute('aria-expanded', String(open));
  });
  document.getElementById('verified-only').addEventListener('change', function(){
    state.verifiedOnly = this.checked; state.page = 1; runSearch();
  });
  document.getElementById('filters-reset').addEventListener('click', function(){
    document.getElementById('price-min').value = '';
    document.getElementById('price-max').value = '';
    document.getElementById('verified-only').checked = false;
    state.priceMin = null; state.priceMax = null; state.verifiedOnly = false; state.page = 1;
    document.getElementById('q-dest').value = '';
    document.getElementById('q-category').value = 'all';
    document.getElementById('q-guests').value = '';
    state.q = ''; state.category = 'all'; state.guests = '';
    updatePriceLabel();
    document.getElementById('price-popover').classList.remove('open');
    document.getElementById('price-trigger').setAttribute('aria-expanded', 'false');
    runSearch();
  });
  runSearch();
})();
</script>
</body>
</html>
