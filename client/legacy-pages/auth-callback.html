<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090a0f">
<title>Signing you in — VaRoom</title>
<style>
  * { box-sizing: border-box; }
  html, body, #__next {
    width: 100%;
    height: 100%;
    min-height: 100%;
    margin: 0;
    background: #090a0f !important;
  }
  body {
    min-height: 100vh;
    overflow: hidden;
  }
  main, .orb-screen {
    width: 100%;
    min-height: 100vh;
    margin: 0;
    padding: 0;
    display: grid;
    place-items: center;
    background: #090a0f !important;
  }
  .orb-screen {
    position: fixed;
    inset: 0;
    z-index: 9999;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    min-height: 0;
  }
  .orb-slot {
    width: 64px;
    height: 64px;
  }
  .orb-fallback {
    position: relative;
    display: block;
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: radial-gradient(circle at 33% 28%, #f4f4f7 0, #a7a9b6 12%, #484b59 38%, #171820 72%);
    box-shadow: 0 0 36px rgba(211, 214, 235, .2), inset -8px -9px 18px rgba(0, 0, 0, .8);
    animation: orb-breathe 2.4s ease-in-out infinite;
  }
  .orb-fallback::before, .orb-fallback::after {
    position: absolute;
    inset: -6px -12px;
    border: 1px solid rgba(221, 224, 241, .38);
    border-radius: 50%;
    content: "";
    transform: rotate(-28deg) scaleY(.42);
  }
  .orb-fallback::after {
    inset: -10px -5px;
    opacity: .55;
    transform: rotate(52deg) scaleY(.5);
  }
  @keyframes orb-breathe {
    50% { transform: scale(.94); filter: brightness(.8); }
  }
  @media (prefers-reduced-motion: reduce) {
    .orb-fallback { animation: none; }
  }
</style>
</head>
<body>
<main id="loading" class="orb-screen">
  <div class="orb-slot" data-thinking-orb="true" role="img" aria-label="Signing you in">
    <span class="orb-fallback" aria-hidden="true"></span>
  </div>
</main>
<script src="/js/supabase-client.js"></script>
<script>
  (async function(){
    const hashParams = new URLSearchParams((window.location.hash || '').replace(/^#/, ''));
    const queryParams = new URLSearchParams(window.location.search || '');
    const requestedRedirect = queryParams.get('redirect') || '';

    function getSafeRedirect(value){
      if (!value) return '';
      try {
        const url = new URL(value, window.location.origin);
        if (url.origin !== window.location.origin) return '';
        return url.pathname + url.search + url.hash;
      } catch (error) {
        return '';
      }
    }

    const postAuthRedirect = getSafeRedirect(requestedRedirect);
    const { data: { session }, error: sessionError } = await supabaseClient.auth.getSession();

    if (!session) {
      if (sessionError) console.error('Sign-in callback failed to load the session.');
      window.location.replace('/login');
      return;
    }

    const user = session.user;
    const authType = hashParams.get('type') || queryParams.get('type') || '';

    if (authType === 'recovery') {
      window.location.replace('/?auth=recovery&step=password');
      return;
    }

    if (user.email === 'varoonhq@gmail.com') {
      window.location.replace('/varoom-post');
      return;
    }

    const { data: profile, error: profileError } = await supabaseClient
      .from('profiles')
      .select('role, onboarding_completed')
      .eq('id', user.id)
      .maybeSingle();

    if (profileError) {
      console.error('Sign-in callback could not load the profile.');
      window.location.replace('/login');
      return;
    }

    if (profile && profile.role) {
      redirectByRole(profile.role, profile.onboarding_completed);
      return;
    }

    const intendedRole = sessionStorage.getItem('varoom_intended_role') || user.user_metadata.role;
    const fullName = user.user_metadata.full_name || user.user_metadata.name || user.email;

    if (intendedRole !== 'host' && intendedRole !== 'client') {
      window.location.replace('/?auth=signup');
      return;
    }

    const { error: upsertError } = await supabaseClient
      .from('profiles')
      .upsert({ id: user.id, role: intendedRole, full_name: fullName }, { onConflict: 'id' });

    if (upsertError) {
      console.error('Sign-in callback could not finish setting up the profile.');
      window.location.replace('/login');
      return;
    }

    sessionStorage.removeItem('varoom_intended_role');
    redirectByRole(intendedRole, false);

    function redirectByRole(role, onboardingCompleted){
      if (!onboardingCompleted) {
        window.location.replace('/onboarding' + (postAuthRedirect ? '?redirect=' + encodeURIComponent(postAuthRedirect) : ''));
      } else if (postAuthRedirect) {
        window.location.replace(postAuthRedirect);
      } else {
        window.location.replace(role === 'host' ? '/host-home' : '/client-home');
      }
    }
  })();
</script>
</body>
</html>
