<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hotel | Varoom</title><style>body{margin:0;background:#f8f8f6;color:#191919;font:16px Inter,Arial,sans-serif}.wrap{max-width:960px;margin:auto;padding:40px 20px}a{color:#1f513d}.hero,.section{background:#fff;border:1px solid #e2e5df;border-radius:16px;padding:24px;margin:18px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.item{border:1px solid #e6e8e3;border-radius:11px;padding:15px}h1,h2,h3,p{margin-top:0}.muted{color:#676d67}.button{background:#1f513d;color:#fff;border:0;border-radius:8px;padding:10px 14px;font-weight:700}.hidden{display:none}</style></head><body><main class="wrap"><a href="/marketplace">← Marketplace</a><div id="loading" class="hero">Loading hotel…</div><div id="content" class="hidden"><header class="hero"><h1 id="name"></h1><p id="description" class="muted"></p><p id="branches" class="muted"></p></header><section class="section"><h2>Rooms &amp; Suites</h2><div id="rooms" class="grid"></div></section><section class="section"><h2>Menu</h2><div id="menus" class="grid"></div></section><section class="section"><h2>Tables</h2><div id="tables" class="grid"></div></section><section class="section"><h2>Reviews</h2><div id="reviews"></div></section></div></main><script>
const id=new URLSearchParams(location.search).get('id');const esc=v=>String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const by=id=>document.getElementById(id);const branchName=(branchId,branches)=>((branches||[]).find(b=>b.id===branchId)||{}).name||'Hotel branch';
(async()=>{if(!id){by('loading').textContent='Hotel not found.';return}const [profile,reviews]=await Promise.all([fetch('/api/businesses/'+encodeURIComponent(id)+'/public').then(r=>r.ok?r.json():Promise.reject()),fetch('/api/businesses/'+encodeURIComponent(id)+'/reviews').then(r=>r.ok?r.json():({reviews:[],summary:{}}))]).catch(()=>[null,null]);if(!profile){by('loading').textContent='Hotel not found.';return}by('loading').className='hidden';by('content').classList.remove('hidden');by('name').textContent=profile.business.name;by('description').textContent=profile.business.description||'';by('branches').textContent=(profile.branches||[]).length?'Locations: '+profile.branches.map(b=>b.name).join(' · '):'Locations will be shared when available.';
by('rooms').innerHTML=profile.rooms.length?profile.rooms.map(r=>'<article class="item"><h3>'+esc(r.listing.title)+'</h3><p class="muted">'+esc(branchName(r.branch_id,profile.branches))+'</p><p>'+esc(r.listing.description||'')+'</p></article>').join(''):'<p class="muted">No rooms or suites are available yet.</p>';
by('menus').innerHTML=profile.menus.length?profile.menus.map(m=>'<article class="item"><h3>'+esc(m.title)+'</h3><p class="muted">'+esc(branchName(m.branch_id,profile.branches))+'</p>'+m.hotel_menu_categories.map(c=>'<strong>'+esc(c.name)+'</strong><br>'+c.hotel_menu_items.map(i=>esc(i.name)+' — KES '+esc(i.price_amount)).join('<br>')).join('<br><br>')+'</article>').join(''):'<p class="muted">No menu is available yet.</p>';
by('tables').innerHTML=profile.tables.length?profile.tables.map(t=>'<article class="item"><h3>'+esc(t.identifier)+'</h3><p>'+esc(branchName(t.branch_id,profile.branches))+' · seats '+esc(t.seating_capacity)+'</p><p class="muted">'+esc(t.area_description||'')+'</p><button class="button" disabled>Reservation coming soon</button></article>').join(''):'<p class="muted">No tables are available yet.</p>';
by('reviews').innerHTML=reviews.reviews.length?reviews.reviews.map(r=>'<article class="item"><strong>'+esc(r.client&&r.client.full_name||'Guest')+' · '+esc(r.rating)+'/5</strong><p>'+esc(r.comment)+'</p></article>').join(''):'<p class="muted">No reviews yet.</p>';
})()</script></body></html>
