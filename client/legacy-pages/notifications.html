<script>
  (function(){
    var role = '';
    try { role = sessionStorage.getItem('varoom_user_role') || ''; } catch (e) {}
    document.documentElement.setAttribute('data-account-role', role === 'host' ? 'host' : role === 'client' ? 'client' : 'pending');
  })();
  (function(){
    try{
      var saved = localStorage.getItem('varoom_theme') || 'system';
      var resolved = saved === 'system'
        ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
        : saved;
      document.documentElement.setAttribute('data-theme', resolved);
    }catch(e){}
  })();
</script>

<style>
  :root{
    --black:#14141a;
    --white:#ffffff;
    --red:#C41E3A;
    --red-soft:#FBE9EC;
    --red-soft-2:#F6D3D8;
    --grey-bg:#F6F6F7;
    --border:#EAEAEC;
    --text:#17171C;
    --text-muted:#6E6E76;
    --green:#1B8A5A;
    --green-soft:#E7F7EE;
    --amber:#B45309;
    --amber-soft:#FFF4E1;
    --radius-lg:16px;
    --radius-md:12px;
    --radius-sm:8px;
    --shadow-card:0 1px 2px rgba(20,20,26,0.04);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    color:var(--text);
    background:var(--grey-bg);
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit;}
  a{color:inherit;text-decoration:none;}
  .icon{width:18px;height:18px;flex-shrink:0;}
  .icon-sm{width:15px;height:15px;flex-shrink:0;}

  /* ---------- Layout ---------- */
  .app-shell{
    display:grid;
    grid-template-columns: 280px minmax(0, 1fr);
    height:100vh;
    overflow:hidden;
  }
  @media (max-width:860px){
    .app-shell{ grid-template-columns:1fr; }
  }

  /* ---------- Main ---------- */
  .main{flex:1;overflow-y:auto;height:100vh;min-width:0;}
  .main-inner{max-width:980px;margin:0 auto;padding:28px 32px 60px;}

  .page-header{
    display:flex;align-items:flex-start;justify-content:space-between;
    margin-bottom:20px;
  }
  .page-header h1{font-size:26px;font-weight:800;margin:0 0 4px;letter-spacing:-0.02em;}
  .page-header p{margin:0;color:var(--text-muted);font-size:14px;}
  .header-actions{display:flex;gap:8px;}
  .icon-btn{
    width:38px;height:38px;border-radius:10px;
    border:1px solid var(--border);background:var(--white);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;color:var(--text);
    transition:background .12s ease;
  }
  .icon-btn:hover{background:var(--grey-bg);}
  .icon-btn.confirm svg{color:var(--red);}
  .icon-btn.confirm.is-complete{color:#2EAF65;}
  .icon-btn.confirm.is-complete:hover{color:#39C878;}

  .toolbar{
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:22px;flex-wrap:wrap;gap:10px;
  }
  .tabs{
    display:flex;gap:6px;background:var(--white);
    padding:4px;border-radius:11px;border:1px solid var(--border);
  }
  .tab{
    padding:7px 14px;border-radius:8px;border:none;background:transparent;
    font-size:13.5px;font-weight:600;color:var(--text-muted);cursor:pointer;
  }
  .tab.active{background:var(--black);color:var(--white);}
  .toolbar-search{
    display:flex;align-items:center;gap:8px;
    background:var(--white);border:1px solid var(--border);
    border-radius:10px;padding:8px 12px;min-width:220px;
  }
  .toolbar-search input{border:none;outline:none;background:transparent;font-size:13.5px;width:100%;}
  .toolbar-search svg{color:var(--text-muted);}

  .section{margin-bottom:26px;}
  .section-title{font-size:13px;font-weight:700;color:var(--text-muted);margin:0 0 10px;padding-left:2px;}

  .card-list{
    background:var(--white);
    border:1px solid var(--border);
    border-radius:var(--radius-lg);
    overflow:hidden;
  }
  .notif-card{
    display:flex;gap:14px;
    padding:16px 18px;
    border-bottom:1px solid var(--border);
    transition:background .12s ease;
  }
  .notif-card:last-child{border-bottom:none;}
  .notif-card:hover{background:#FCFCFD;}
  .notif-card[hidden]{display:none;}

  .notif-icon{
    width:42px;height:42px;border-radius:11px;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }
  .notif-icon.tint-red{background:var(--red-soft);color:var(--red);}
  .notif-icon.tint-green{background:var(--green-soft);color:var(--green);}
  .notif-icon.tint-amber{background:var(--amber-soft);color:var(--amber);}
  .notif-icon.tint-black{background:#F0F0F1;color:var(--black);}

  .notif-body{flex:1;min-width:0;}
  .notif-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .notif-title{font-size:14.5px;font-weight:700;}
  .tag{
    font-size:11px;font-weight:700;padding:2px 8px;border-radius:100px;
    letter-spacing:.01em;
  }
  .tag.booking{background:var(--red-soft);color:var(--red);}
  .tag.payment{background:var(--green-soft);color:var(--green);}
  .tag.alert{background:var(--red-soft-2);color:var(--red);}
  .tag.reminder{background:var(--amber-soft);color:var(--amber);}
  .tag.review{background:#F0F0F1;color:var(--black);}
  .notif-desc{font-size:13.5px;color:var(--text-muted);margin:4px 0 0;line-height:1.5;}
  .notif-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
  .action-btn{
    font-size:12.5px;font-weight:600;
    padding:6px 12px;border-radius:8px;
    border:1px solid var(--border);background:var(--white);
    cursor:pointer;color:var(--text);
  }
  .action-btn:hover{background:var(--grey-bg);}
  .action-btn.primary{background:var(--black);color:var(--white);border-color:var(--black);}
  .action-btn.primary:hover{background:#000;}
  .action-btn.ghost-red{color:var(--red);border-color:var(--red-soft-2);}
  .action-btn.ghost-red:hover{background:var(--red-soft);}
  .done-chip{
    display:inline-flex;align-items:center;gap:6px;
    font-size:12.5px;font-weight:600;color:var(--green);
    background:var(--green-soft);padding:6px 12px;border-radius:8px;margin-top:10px;
  }

  .notif-meta{
    display:flex;flex-direction:column;align-items:flex-end;gap:8px;
    flex-shrink:0;padding-top:2px;
  }
  .notif-time{font-size:12px;color:var(--text-muted);white-space:nowrap;}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--red);}

  .notifications-loading .notifications-content{display:none;}
  .notifications-skeleton{display:none;}
  .notifications-loading .notifications-skeleton{display:block;}
  .notification-skeleton-block{
    background:rgba(128,110,100,.18);
    border-radius:5px;
    animation:notification-skeleton-shimmer 1.5s ease-in-out infinite;
  }
  @keyframes notification-skeleton-shimmer{
    50%{opacity:.48;}
  }
  .notification-skeleton-header{
    display:flex;align-items:flex-start;justify-content:space-between;
    margin-bottom:20px;
  }
  .notification-skeleton-heading{width:220px;}
  .notification-skeleton-title{height:27px;width:170px;margin-bottom:8px;}
  .notification-skeleton-subtitle{height:14px;width:205px;}
  .notification-skeleton-header-actions{display:flex;gap:8px;}
  .notification-skeleton-header-action{width:38px;height:38px;border-radius:10px;}
  .notification-skeleton-toolbar{
    display:flex;align-items:center;justify-content:space-between;
    gap:10px;flex-wrap:wrap;margin-bottom:22px;
  }
  .notification-skeleton-tabs{
    display:flex;gap:6px;padding:4px;background:var(--white);
    border:1px solid var(--border);border-radius:11px;
  }
  .notification-skeleton-tab{width:74px;height:34px;border-radius:8px;}
  .notification-skeleton-tab:last-child{width:102px;}
  .notification-skeleton-search{
    display:flex;align-items:center;gap:10px;padding:0 14px;
    width:240px;height:40px;border:1px solid var(--border);
    border-radius:10px;background:var(--white);
  }
  .notification-skeleton-search-icon{width:14px;height:14px;border-radius:50%;flex-shrink:0;}
  .notification-skeleton-search-text{width:120px;height:12px;}
  .notification-skeleton-section{margin-bottom:26px;}
  .notification-skeleton-section-title{height:14px;width:72px;margin:0 0 10px 2px;}
  .notification-skeleton-list{
    overflow:hidden;border:1px solid var(--border);
    border-radius:var(--radius-lg);background:var(--white);
  }
  .notification-skeleton-row{
    display:grid;grid-template-columns:42px minmax(0,1fr) auto;
    align-items:start;gap:14px;padding:16px 18px;
    border-bottom:1px solid var(--border);
  }
  .notification-skeleton-row:last-child{border-bottom:0;}
  .notification-skeleton-icon{width:42px;height:42px;border-radius:11px;}
  .notification-skeleton-copy{min-width:0;padding-top:1px;}
  .notification-skeleton-title-line{
    display:flex;gap:8px;width:auto;height:15px;margin-bottom:10px;
    background:transparent;animation:none;
  }
  .notification-skeleton-title-line::before,
  .notification-skeleton-title-line::after{
    content:"";height:15px;border-radius:5px;
    background:rgba(128,110,100,.18);
    animation:notification-skeleton-shimmer 1.5s ease-in-out infinite;
  }
  .notification-skeleton-title-line::before{width:150px;}
  .notification-skeleton-title-line::after{width:52px;border-radius:100px;}
  .notification-skeleton-description{height:14px;width:78%;margin-bottom:10px;}
  .notification-skeleton-actions{display:flex;gap:8px;}
  .notification-skeleton-button{height:33px;width:76px;border-radius:8px;}
  .notification-skeleton-button.short{width:66px;}
  .notification-skeleton-meta{display:flex;flex-direction:column;align-items:flex-end;gap:10px;padding-top:4px;}
  .notification-skeleton-time{height:12px;width:60px;}
  .notification-skeleton-dot{width:8px;height:8px;border-radius:50%;}
  [data-theme="dark"] .notification-skeleton-block,
  [data-theme="dark"] .notification-skeleton-title-line::before,
  [data-theme="dark"] .notification-skeleton-title-line::after{background:rgba(245,239,236,.18);}

  /* ---------- Mobile ---------- */
  .menu-toggle{display:none;}

  @media (max-width:860px){
    .menu-toggle{
      display:flex;align-items:center;justify-content:center;
      width:38px;height:38px;border-radius:10px;border:1px solid var(--border);
      background:var(--white);margin-right:10px;cursor:pointer;flex-shrink:0;
    }
    .page-header{align-items:center;}
    .page-header-left{display:flex;align-items:center;}
    .main-inner{padding:18px 16px 40px;}
    .toolbar-search{display:none;}
    .notification-skeleton-search{display:none;}
  }

  /* Phone-width refinements: stack card meta, full-width tabs and actions
     so nothing gets cramped or hard to tap. */
  @media (max-width:640px){
    .page-header h1{font-size:21px;}
    .page-header p{font-size:12.5px;}
    .header-actions{gap:6px;}
    .icon-btn{width:36px;height:36px;}
    .tabs{width:100%;}
    .tab{flex:1;text-align:center;}
    .notif-card{flex-wrap:wrap;padding:14px;}
    .notif-icon{width:38px;height:38px;}
    .notif-meta{
      order:5;width:100%;flex-direction:row;
      align-items:center;justify-content:flex-end;gap:6px;
      margin-top:8px;padding-top:0;
    }
    .notif-meta .dot{order:-1;}
    .notif-actions{flex-direction:column;}
    .action-btn{width:100%;text-align:center;padding:9px 12px;}
    .notification-skeleton-header{align-items:center;}
    .notification-skeleton-heading{width:auto;min-width:0;}
    .notification-skeleton-title{width:140px;}
    .notification-skeleton-subtitle{width:160px;}
    .notification-skeleton-toolbar{display:block;}
    .notification-skeleton-tabs{width:100%;margin-bottom:10px;}
    .notification-skeleton-tab{flex:1;width:auto;}
    .notification-skeleton-tab:last-child{width:auto;}
    .notification-skeleton-search{display:none;}
    .notification-skeleton-row{grid-template-columns:38px minmax(0,1fr);gap:12px;padding:14px;}
    .notification-skeleton-icon{width:38px;height:38px;}
    .notification-skeleton-meta{grid-column:2;flex-direction:row;justify-content:flex-end;gap:6px;margin-top:0;padding:0;}
    .notification-skeleton-description{width:95%;}
  }
</style>
