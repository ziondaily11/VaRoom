<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log in — VaRoom</title>
  <link rel="icon" href="favicon/favicon.ico" sizes="any">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --paper: #161a19;
      --ink: #151515;
      --muted: #707070;
      --line: #dedede;
      --accent: #000000;
      --serif: Georgia, "Times New Roman", serif;
      --sans: Arial, Helvetica, sans-serif;
      --mono: "SFMono-Regular", Consolas, monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    /* Keep every control reachable on compact screens. */
    html, body {
      min-height: 100%;
      overflow-x: hidden;
      overflow-y: auto;
    }

    body {
      font-family: var(--sans);
      background: var(--paper);
      color: var(--ink);
    }

    a { color: inherit; text-decoration: none; }

    /* ── Centered authentication card ── */
    .page {
      display: flex;
      min-height: 100vh;
      min-height: 100svh;
      background: #fff;
      padding: 0;
    }

    /* ── Form card ── */
    .form-panel {
      display: flex;
      flex-direction: column;
      width: 100%;
      min-height: 100vh;
      min-height: 100svh;
      background: #fff;
      overflow: visible;
      padding: 0 max(7vw, 28px) 32px;
    }

    .form-eyebrow {
      margin: 0 calc(-1 * max(7vw, 28px)) 30px;
      min-height: 30vh;
      min-height: 30svh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px;
      border-radius: 0 0 34px 34px;
      background: #000;
      color: #fff;
      font: 700 clamp(25px, 5vw, 32px) var(--sans);
      letter-spacing: -0.7px;
      text-transform: none;
    }

    .form-title {
      font: 700 20px var(--sans);
      letter-spacing: -0.3px;
      line-height: 1.2;
      margin-bottom: 5px;
      color: #000;
      width: min(100%, 460px);
      margin-left: auto;
      margin-right: auto;
    }

    .form-sub {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 18px;
      width: min(100%, 460px);
      margin-left: auto;
      margin-right: auto;
    }

    /* Google button */
    .btn-google {
      width: min(100%, 460px);
      align-self: center;
      width: 100%;
      padding: 14px;
      background: #fff;
      border: 1px solid #b8b8b8;
      border-radius: 9px;
      font: 700 14px var(--sans);
      color: #1d1d1d;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: background-color 0.2s, border-color 0.2s, box-shadow 0.2s;
      margin-top: 17px;
    }
    .btn-google:hover {
      background: #f7f7f7;
      border-color: #777;
      box-shadow: 0 3px 10px rgba(0,0,0,0.12);
    }

    /* Divider */
    .divider {
      width: min(100%, 460px);
      align-self: center;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 18px;
      color: #3d3d3d;
      font-size: 13px;
      font-weight: 600;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--line);
    }

    /* Fields */
    #login-form { width: min(100%, 460px); margin: 0 auto; }
    .field { margin-bottom: 12px; }

    .field label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #333;
      margin-bottom: 5px;
    }

    .field input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #a8a8a8;
      border-radius: 8px;
      background: #fff;
      font: 13px var(--sans);
      color: #111;
      outline: none;
      transition: border-color 0.2s, background-color 0.2s;
    }

    .field input::placeholder { color: #999; }
    .field input:focus { border-color: #000; background: #fff; box-shadow: 0 0 0 3px rgba(0,0,0,0.08); }
    .field input.error { border-color: #b42318; }

    .field-wrap {
      position: relative;
    }

    .toggle-pw {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: var(--muted);
      display: flex;
      align-items: center;
      padding: 4px;
    }
    .toggle-pw:hover { color: #000; }

    .field-error {
      font-size: 11px;
      color: #b42318;
      margin-top: 4px;
      display: none;
    }

    /* Submit button */
    .btn-submit {
      width: 100%;
      padding: 13px;
      background: #000;
      color: white;
      border: none;
      border-radius: 8px;
      font: 600 13px var(--sans);
      cursor: pointer;
      transition: transform 0.15s, opacity 0.2s, box-shadow 0.2s;
      box-shadow: 0 4px 14px rgba(0,0,0,0.18);
      position: relative;
      margin-top: 6px;
    }
    .btn-submit:hover { background: #242424; box-shadow: 0 6px 18px rgba(0,0,0,0.24); }
    .btn-submit:active { transform: scale(0.98); }
    .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }

    .btn-submit .spinner {
      display: none;
      width: 15px; height: 15px;
      border: 2px solid rgba(255,255,255,0.4);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 0 auto;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .btn-submit.loading .btn-text { display: none; }
    .btn-submit.loading .spinner { display: block; }

    .form-note {
      text-align: center;
      font-size: 11px;
      color: var(--muted);
      margin-top: 13px;
      line-height: 1.5;
      width: min(100%, 460px);
      align-self: center;
    }

    .form-switch {
      text-align: center;
      margin-top: 12px;
      font-size: 13px;
      color: var(--muted);
      width: min(100%, 460px);
      align-self: center;
    }

    .form-switch a { color: #000; font-weight: 700; }
    .form-switch a:hover { text-decoration: underline; }

    /* Alert */
    .alert {
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 12px;
      margin-bottom: 14px;
      display: none;
      line-height: 1.5;
    }
    .alert.error { background: #fff1f0; color: #b42318; border: 1px solid #fecdca; }
    .alert.success { background: rgba(46,125,50,0.2); color: #a5d6a7; border: 1px solid rgba(76,175,80,0.4); }
    .alert.show { display: block; }

    /* ── Mobile ── */
    @media (max-width: 760px) {
      .page { height: auto; min-height: 100vh; padding: 0; }
      .form-panel {
        padding: 0 22px 24px;
        min-height: 100vh;
      }
      .form-eyebrow { margin: 0 -22px 22px; min-height: 30vh; min-height: 30svh; padding: 22px; border-radius: 0 0 30px 30px; }
    }
  </style>
</head>
<body>

<div class="page">

  <!-- Authentication form -->
  <div class="form-panel">
    <p class="form-eyebrow">Welcome back</p>
    <h1 class="form-title">Log in to VaRoom.</h1>
    <p class="form-sub">Access your host or client account.</p>

    <div class="alert" id="form-alert"></div>

    <form id="login-form" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@example.com" autocomplete="email" required />
        <div class="field-error" id="err-email">Please enter a valid email</div>
      </div>

      <div class="field">
        <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:5px;">
          <label for="password" style="margin-bottom:0;">Password</label>
          <a href="/forgot-password" class="forgot-link" id="forgot-link" style="font-size:12px; color:#000; font-weight:700; text-decoration:none;">Forgot password?</a>
        </div>
        <div class="field-wrap">
          <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password" required style="padding-right:40px;" />
          <button type="button" class="toggle-pw" id="toggle-pw" aria-label="Show password">
            <svg id="eye-icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
        <div class="field-error" id="err-password">Please enter your password</div>
      </div>

      <button type="submit" class="btn-submit" id="submit-btn">
        <span class="btn-text">Log in</span>
        <div class="spinner"></div>
      </button>
    </form>

    <div class="divider">or sign in with</div>

    <!-- Google sign-in -->
    <button type="button" class="btn-google" id="google-btn">
      <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
      </svg>
      Continue with Google
    </button>

    <p class="form-switch">New to VaRoom? <a href="/?signup=1" id="create-link">Create an account</a></p>
  </div>

</div>

<script src="js/supabase-client.js" onerror="console.warn('Using inline Supabase client')"></script>
<script src="js/account-switcher.js" onerror="console.warn('Account switcher unavailable')"></script>
<script>
  // Use supabase-client.js if available, otherwise init inline
  if (!window.supabaseClient) {
    const SUPABASE_URL = 'https://deaphymimdaygeavhyek.supabase.co';
    // Anon key loaded from js/supabase-client.js — if that file is missing,
    // replace 'YOUR_ANON_KEY' with your actual anon key from Supabase dashboard
    const SUPABASE_ANON = window.SUPABASE_ANON_KEY || 'YOUR_ANON_KEY';
    window.supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
  }

  var alertBox  = document.getElementById('form-alert');
  var submitBtn = document.getElementById('submit-btn');
  var params    = new URLSearchParams(window.location.search);
  var redirect  = params.get('redirect');
  var mode      = params.get('mode'); // 'add' = linking a second account, current session stays signed in

  if (redirect) {
    var forgotLink = document.getElementById('forgot-link');
    if (forgotLink) forgotLink.href = '/forgot-password?redirect=' + encodeURIComponent(redirect);
    var createLink = document.getElementById('create-link');
    if (createLink) createLink.href = '/?redirect=' + encodeURIComponent(redirect);
  }

  if (mode === 'add') {
    document.querySelector('.form-eyebrow').textContent = 'Add an account';
    document.querySelector('.form-sub').textContent = 'Sign in to link another VaRoom account.';
    var formNote = document.querySelector('.form-note');
    if (formNote) formNote.textContent = 'This adds a second account — your current one stays signed in.';
    document.querySelector('.form-switch').style.display = 'none';
  }

  function showAlert(msg, type) {
    alertBox.textContent = msg;
    alertBox.className = 'alert ' + type + ' show';
  }
  function clearAlert() { alertBox.className = 'alert'; }

  /* ── Password toggle ── */
  var pwInput = document.getElementById('password');
  document.getElementById('toggle-pw').addEventListener('click', function() {
    var show = pwInput.type === 'password';
    pwInput.type = show ? 'text' : 'password';
    document.getElementById('eye-icon').style.opacity = show ? '0.4' : '1';
  });

  /* ── Google OAuth ── */
  document.getElementById('google-btn').addEventListener('click', async function() {
    try {
      if (mode === 'add' && window.VaRoomAccountSwitcher && !window.VaRoomAccountSwitcher.canAddAccount()) {
        showAlert('You can link up to 3 accounts. Remove an account before adding another.', 'error');
        return;
      }
      if (mode === 'add' && window.VaRoomAccountSwitcher) {
        var existing = await supabaseClient.auth.getSession();
        var outgoingSession = existing.data && existing.data.session;
        if (outgoingSession) {
          await window.VaRoomAccountSwitcher.upsertFromSession(supabaseClient, outgoingSession);
        }
      }
      var { error } = await supabaseClient.auth.signInWithOAuth({
        provider: 'google',
        options: {
          redirectTo: window.location.origin + '/auth-callback' +
            (redirect ? '?redirect=' + encodeURIComponent(redirect) : '')
        }
      });
      if (error) showAlert(error.message, 'error');
    } catch(e) {
      showAlert('Could not connect to Google. Please try again.', 'error');
    }
  });

  /* ── Email/password login ── */
  document.getElementById('login-form').addEventListener('submit', async function(e) {
    e.preventDefault();
    clearAlert();

    var email = document.getElementById('email').value.trim();
    var pass  = document.getElementById('password').value;
    var valid = true;

    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      document.getElementById('email').classList.add('error');
      document.getElementById('err-email').style.display = 'block';
      valid = false;
    } else {
      document.getElementById('email').classList.remove('error');
      document.getElementById('err-email').style.display = 'none';
    }

    if (!pass) {
      document.getElementById('password').classList.add('error');
      document.getElementById('err-password').style.display = 'block';
      valid = false;
    } else {
      document.getElementById('password').classList.remove('error');
      document.getElementById('err-password').style.display = 'none';
    }

    if (!valid) return;

    if (mode === 'add' && window.VaRoomAccountSwitcher && !window.VaRoomAccountSwitcher.canAddAccount()) {
      showAlert('You can link up to 3 accounts. Remove an account before adding another.', 'error');
      return;
    }

    submitBtn.classList.add('loading');
    submitBtn.disabled = true;

    try {
      var outgoingSession = null;
      if (mode === 'add') {
        var existing = await supabaseClient.auth.getSession();
        outgoingSession = existing.data && existing.data.session;
      }

      var { data, error } = await supabaseClient.auth.signInWithPassword({ email, password: pass });
      if (error) throw error;

      if (mode === 'add') {
        // Save the account we were signed in as before it got overwritten above,
        // so the switcher on profile.html can offer to switch back to it.
        if (outgoingSession && window.VaRoomAccountSwitcher) {
          await window.VaRoomAccountSwitcher.upsertFromSession(supabaseClient, outgoingSession);
        }
        window.location.href = redirect || '/profile.html';
        return;
      }

      var profileResult = await supabaseClient.from('profiles').select('role,onboarding_completed').eq('id', data.user.id).maybeSingle();
      var profile = profileResult.data;
      var role = (profile && profile.role) || (data.user.user_metadata && data.user.user_metadata.role);
      if (!profile || !profile.onboarding_completed) {
        window.location.href = '/onboarding' + (redirect ? '?redirect=' + encodeURIComponent(redirect) : '');
      } else {
        window.location.href = redirect || (role === 'host' ? '/host-home' : '/client-home');
      }

    } catch(err) {
      var msg = err.message || 'Login failed. Please try again.';
      if (msg.toLowerCase().includes('invalid')) msg = 'Incorrect email or password.';
      if (msg.toLowerCase().includes('not confirmed')) msg = 'Please confirm your email before logging in.';
      showAlert(msg, 'error');
    } finally {
      submitBtn.classList.remove('loading');
      submitBtn.disabled = false;
    }
  });

  /* Clear errors on input */
  ['email','password'].forEach(function(id) {
    document.getElementById(id).addEventListener('input', function() {
      this.classList.remove('error');
    });
  });

  /* Auto-redirect if already logged in — skipped in add-account mode, since
     the whole point there is to sign in as a *different* account while
     staying logged into the current one. */
  if (mode !== 'add') {
    (async function() {
      try {
        var { data } = await supabaseClient.auth.getSession();
        if (data && data.session) {
          var profileResult = await supabaseClient.from('profiles').select('role,onboarding_completed').eq('id', data.session.user.id).maybeSingle();
          var profile = profileResult.data;
          var role = (profile && profile.role) || (data.session.user.user_metadata && data.session.user.user_metadata.role);
          if (!profile || !profile.onboarding_completed) {
            window.location.href = '/onboarding' + (redirect ? '?redirect=' + encodeURIComponent(redirect) : '');
          } else {
            window.location.href = redirect || (role === 'host' ? '/host-home' : '/client-home');
          }
        }
      } catch(e) {}
    })();
  }
</script>
</body>
</html>
