<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log in — VaRoom</title>
  <link rel="icon" href="favicon/favicon.ico" sizes="any">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --paper: #161a19;
      --ink: #151515;
      --muted: #707070;
      --line: #dedede;
      --accent: #000000;
      --serif: Georgia, "Times New Roman", serif;
      --sans: Arial, Helvetica, sans-serif;
      --mono: "SFMono-Regular", Consolas, monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    /* Keep every control reachable on compact screens. */
    html, body {
      min-height: 100%;
      overflow-x: hidden;
      overflow-y: auto;
    }

    body {
      font-family: var(--sans);
      background: var(--paper);
      color: var(--ink);
    }

    a { color: inherit; text-decoration: none; }

    /* ── Centered authentication card ── */
    .page {
      display: flex;
      min-height: 100vh;
      min-height: 100svh;
      background: #fff;
      padding: 0;
    }

    /* ── Form card ── */
    .form-panel {
      display: flex;
      flex-direction: column;
      width: 100%;
      min-height: 100vh;
      min-height: 100svh;
      background: #fff;
      overflow: visible;
      padding: 0 max(7vw, 28px) 32px;
    }

    .form-eyebrow {
      margin: 0 calc(-1 * max(7vw, 28px)) 30px;
      min-height: 40vh;
      min-height: 40svh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px;
      border-radius: 0 0 34px 34px;
      background: #000;
      color: #fff;
      font: 700 clamp(25px, 5vw, 32px) var(--sans);
      letter-spacing: -0.7px;
      text-transform: none;
    }

    .hero-message { position: relative; width: 100%; height: 1.3em; }
    .hero-message span {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      opacity: 0; transform: translateY(10px); will-change: transform, opacity;
    }
    .hero-welcome { animation: hero-welcome 5.6s cubic-bezier(0.22, 1, 0.36, 1) infinite; }
    .hero-list { animation: hero-list 5.6s cubic-bezier(0.22, 1, 0.36, 1) infinite; }
    .hero-find { animation: hero-find 5.6s cubic-bezier(0.22, 1, 0.36, 1) infinite; }
    .hero-book { animation: hero-book 5.6s cubic-bezier(0.22, 1, 0.36, 1) infinite; }

    @keyframes hero-welcome {
      0%, 100% { opacity: 0; transform: translateY(10px); }
      7%, 28% { opacity: 1; transform: translateY(0); }
      36% { opacity: 0; transform: translateY(-12px); }
    }
    @keyframes hero-list {
      0%, 36%, 100% { opacity: 0; transform: translateY(10px); }
      43%, 52% { opacity: 1; transform: translateY(0); }
      58% { opacity: 0; transform: translateY(-10px); }
    }
    @keyframes hero-find {
      0%, 58%, 100% { opacity: 0; transform: translateY(10px); }
      65%, 70% { opacity: 1; transform: translateY(0); }
      76% { opacity: 0; transform: translateY(-10px); }
    }
    @keyframes hero-book {
      0%, 76%, 100% { opacity: 0; transform: translateY(10px); }
      83%, 91% { opacity: 1; transform: translateY(0); }
      97% { opacity: 0; transform: translateY(-10px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .hero-message span { animation: none; }
      .hero-message .hero-welcome { opacity: 1; transform: none; }
      .hero-message .hero-brand { display: none; }
    }

    .form-title {
      font: 700 20px var(--sans);
      letter-spacing: -0.3px;
      line-height: 1.2;
      margin-bottom: 5px;
      color: #000;
      width: min(100%, 460px);
      margin-left: auto;
      margin-right: auto;
    }

    .form-sub {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 18px;
      width: min(100%, 460px);
      margin-left: auto;
      margin-right: auto;
    }

    /* Google button */
    .btn-google {
      width: min(100%, 460px);
      align-self: center;
      width: 100%;
      padding: 14px;
      background: #fff;
      border: 1px solid #b8b8b8;
      border-radius: 9px;
      font: 700 14px var(--sans);
      color: #1d1d1d;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: background-color 0.2s, border-color 0.2s, box-shadow 0.2s;
      margin-top: 17px;
    }
    .btn-google:hover {
      background: #f7f7f7;
      border-color: #777;
      box-shadow: 0 3px 10px rgba(0,0,0,0.12);
    }

    /* Divider */
    .divider {
      width: min(100%, 460px);
      align-self: center;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 18px;
      color: #3d3d3d;
      font-size: 13px;
      font-weight: 600;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--line);
    }

    /* Fields */
    #login-form { width: min(100%, 460px); margin: 0 auto; }
    .field { margin-bottom: 12px; }

    .field label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #333;
      margin-bottom: 5px;
    }

    .field input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #a8a8a8;
      border-radius: 8px;
      background: #fff;
      font: 13px var(--sans);
      color: #111;
      outline: none;
      transition: border-color 0.2s, background-color 0.2s;
    }

    .field input::placeholder { color: #999; }
    .field input:focus { border-color: #000; background: #fff; box-shadow: 0 0 0 3px rgba(0,0,0,0.08); }
    .field input.error { border-color: #b42318; }

    .field-wrap {
      position: relative;
    }

    .toggle-pw {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: var(--muted);
      display: flex;
      align-items: center;
      padding: 4px;
    }
    .toggle-pw:hover { color: #000; }

    .field-error {
      font-size: 11px;
      color: #b42318;
      margin-top: 4px;
      display: none;
    }

    /* Submit button */
    .btn-submit {
      width: 100%;
      padding: 13px;
      background: #000;
      color: white;
      border: none;
      border-radius: 8px;
      font: 600 13px var(--sans);
      cursor: pointer;
      transition: transform 0.15s, opacity 0.2s, box-shadow 0.2s;
      box-shadow: 0 4px 14px rgba(0,0,0,0.18);
      position: relative;
      margin-top: 6px;
    }
    .btn-submit:hover { background: #242424; box-shadow: 0 6px 18px rgba(0,0,0,0.24); }
    .btn-submit:active { transform: scale(0.98); }
    .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }

    .btn-submit .spinner {
      display: none;
      width: 15px; height: 15px;
      border: 2px solid rgba(255,255,255,0.4);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 0 auto;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .btn-submit.loading .btn-text { display: none; }
    .btn-submit.loading .spinner { display: block; }

    .form-note {
      text-align: center;
      font-size: 11px;
      color: var(--muted);
      margin-top: 13px;
      line-height: 1.5;
      width: min(100%, 460px);
      align-self: center;
    }

    .form-switch {
      text-align: center;
      margin-top: 12px;
      font-size: 13px;
      color: var(--muted);
      width: min(100%, 460px);
      align-self: center;
    }

    .form-switch a { color: #000; font-weight: 700; }
    .form-switch a:hover { text-decoration: underline; }

    /* Alert */
    .alert {
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 12px;
      margin-bottom: 14px;
      display: none;
      line-height: 1.5;
    }
    .alert.error { background: #fff1f0; color: #b42318; border: 1px solid #fecdca; }
    .alert.success { background: rgba(46,125,50,0.2); color: #a5d6a7; border: 1px solid rgba(76,175,80,0.4); }
    .alert.show { display: block; }

    /* ── Mobile ── */
    @media (max-width: 760px) {
      .page { height: auto; min-height: 100vh; padding: 0; }
      .form-panel {
        padding: 0 22px 24px;
        min-height: 100vh;
      }
      .form-eyebrow { margin: 0 -22px 22px; min-height: 40vh; min-height: 40svh; padding: 22px; border-radius: 0 0 30px 30px; }
    }

    /* Desktop: hero and form become equal split-screen columns. */
    @media (min-width: 761px) {
      html, body { overflow: hidden; }
      .page { min-height: 100vh; height: 100vh; }
      .form-panel { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); min-height: 100vh; height: 100vh; padding: 0; }
      .form-eyebrow { grid-column: 1; grid-row: 1; min-height: 100vh; height: 100vh; margin: 0; padding: 28px; border-radius: 0 56px 56px 0; }
      .login-content { grid-column: 2; grid-row: 1; align-self: stretch; display: flex; flex-direction: column; justify-content: center; width: min(100%, 460px); min-height: 0; margin: 0 auto; padding: 48px 7vw; overflow-y: auto; }
      .login-content .form-title, .login-content .form-sub, .login-content .btn-google, .login-content .divider, .login-content #login-form, .login-content .form-note, .login-content .form-switch { width: 100%; }
    }
  </style>
</head>
<body>

<div class="page">

  <!-- Authentication form -->
  <div class="form-panel">
    <div class="form-eyebrow" aria-label="Welcome back. List. Find. Book.">
      <div class="hero-message" aria-hidden="true">
        <span class="hero-welcome">Welcome back</span>
        <span class="hero-brand hero-list">List.</span>
        <span class="hero-brand hero-find">Find.</span>
        <span class="hero-brand hero-book">Book.</span>
      </div>
    </div>
    <div class="login-content">
    <h1 class="form-title">Log in to VaRoom.</h1>
    <p class="form-sub">Access your host or client account.</p>

    <div class="alert" id="form-alert"></div>

    <form id="login-form" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@example.com" autocomplete="email" required />
        <div class="field-error" id="err-email">Please enter a valid email</div>
      </div>

      <div class="field">
        <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:5px;">
          <label for="password" style="margin-bottom:0;">Password</label>
          <a href="/?auth=recovery" class="forgot-link" id="forgot-link" style="font-size:12px; color:#000; font-weight:700; text-decoration:none;">Forgot password?</a>
        </div>
        <div class="field-wrap">
          <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password" required style="padding-right:40px;" />
          <button type="button" class="toggle-pw" id="toggle-pw" aria-label="Show password">
            <svg id="eye-icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
        <div class="field-error" id="err-password">Please enter your password</div>
      </div>

      <button type="submit" class="btn-submit" id="submit-btn">
        <span class="btn-text">Log in</span>
        <div class="spinner"></div>
      </button>
    </form>

    <div class="divider">or sign in with</div>

    <!-- Google sign-in -->
    <div class="btn-google google-signin-slot" id="google-btn" style="padding:0;background:transparent;border:0;box-shadow:none;"></div>
    <button type="button" class="google-redirect-fallback" id="google-redirect-fallback" style="display:block;width:100%;margin:8px 0 18px;border:0;background:transparent;color:#555;font:12px Arial,sans-serif;text-align:center;text-decoration:underline;cursor:pointer;">
      If the Google prompt doesn&apos;t open, use the full-page sign-in
    </button>

    <p class="form-switch">New to VaRoom? <a href="/?signup=1" id="create-link">Create an account</a></p>
    </div>
  </div>

</div>

<script src="js/account-auth.js"></script>
<script src="js/supabase-client.js" onerror="console.warn('Using inline Supabase client')"></script>
<script src="js/account-switcher.js" onerror="console.warn('Account switcher unavailable')"></script>
<script>
  // Use supabase-client.js if available, otherwise init inline
  if (!window.supabaseClient) {
    const SUPABASE_URL = 'https://deaphymimdaygeavhyek.supabase.co';
    // Anon key loaded from js/supabase-client.js — if that file is missing,
    // replace 'YOUR_ANON_KEY' with your actual anon key from Supabase dashboard
    const SUPABASE_ANON = window.SUPABASE_ANON_KEY || 'YOUR_ANON_KEY';
    window.supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
  }

  var alertBox  = document.getElementById('form-alert');
  var submitBtn = document.getElementById('submit-btn');
  var params    = new URLSearchParams(window.location.search);
  var redirect  = params.get('redirect');
  var mode      = params.get('mode'); // 'add' = linking a second account, current session stays signed in

  if (redirect) {
    var forgotLink = document.getElementById('forgot-link');
    if (forgotLink) forgotLink.href = '/?auth=recovery&redirect=' + encodeURIComponent(redirect);
    var createLink = document.getElementById('create-link');
    if (createLink) createLink.href = '/?redirect=' + encodeURIComponent(redirect);
  }

  if (mode === 'add') {
    document.querySelector('.form-eyebrow').textContent = 'Add an account';
    document.querySelector('.form-sub').textContent = 'Sign in to link another VaRoom account.';
    var formNote = document.querySelector('.form-note');
    if (formNote) formNote.textContent = 'This adds a second account — your current one stays signed in.';
    document.querySelector('.form-switch').style.display = 'none';
  }

  function showAlert(msg, type) {
    alertBox.textContent = msg;
    alertBox.className = 'alert ' + type + ' show';
  }
  function clearAlert() { alertBox.className = 'alert'; }
  if (params.get('deleted') === '1') {
    showAlert('Your VaRoom account and associated data were permanently deleted.', 'success');
  }
  if (params.get('error') === 'google_add_failed') {
    showAlert('Google sign-in could not add the account. Your current session was preserved. Please try again.', 'error');
  }

  /* ── Password toggle ── */
  var pwInput = document.getElementById('password');
  document.getElementById('toggle-pw').addEventListener('click', function() {
    var show = pwInput.type === 'password';
    pwInput.type = show ? 'text' : 'password';
    document.getElementById('eye-icon').style.opacity = show ? '0.4' : '1';
  });

  /* ── Google sign-in ── */
  var googleButton = document.getElementById('google-btn');
  var redirectFallback = document.getElementById('google-redirect-fallback');
  var callbackUrl = window.location.origin + '/auth-callback' +
    (redirect ? '?redirect=' + encodeURIComponent(redirect) : '');

  if (mode === 'add') {
    googleButton.style.display = 'none';
    redirectFallback.textContent = 'Continue with Google';
    redirectFallback.style.color = '#1d1d1d';
    redirectFallback.style.fontWeight = '700';
  } else if (window.VaRoomGoogleSignIn) {
    window.VaRoomGoogleSignIn.mount(googleButton, {
      client: supabaseClient,
      redirectTo: callbackUrl,
      fallbackButton: redirectFallback,
      onError: function(message) { showAlert(message, 'error'); }
    });
  } else {
    googleButton.style.display = 'none';
    showAlert('Google sign-in could not load. Use the full-page option or try again.', 'error');
  }

  redirectFallback.addEventListener('click', async function(event) {
    if (mode !== 'add' && window.VaRoomGoogleSignIn) return;
    event.preventDefault();
    try {
      var accountAuthFlow = mode === 'add' ? window.VaRoomAccountAuth.createFlowId() : null;
      if (window.VaRoomAccountSwitcher) {
        var existing = await supabaseClient.auth.getSession();
        var outgoingSession = existing.data && existing.data.session;
        if (!outgoingSession) throw new Error('Sign in to your current account before adding another.');
        await window.VaRoomAccountSwitcher.loadLinkedAccounts(supabaseClient, outgoingSession, { force: true });
        await window.VaRoomAccountSwitcher.upsertFromSession(supabaseClient, outgoingSession);
        if (mode === 'add' && !window.VaRoomAccountSwitcher.canAddAccount()) {
          showAlert('Account limit reached (3/3). This group cannot include another account.', 'error');
          return;
        }
      }
      var oauthClient = mode === 'add'
        ? window.VaRoomAccountAuth.createClient(window.supabase, window.VAROOM_SUPABASE_URL, window.VAROOM_SUPABASE_ANON_KEY, { usesRedirect: true, flowId: accountAuthFlow })
        : supabaseClient;
      var callbackUrl = window.location.origin + '/auth-callback' +
        (mode === 'add'
          ? '?add_account_callback=1&account_auth_flow=' + encodeURIComponent(accountAuthFlow) + (redirect ? '&redirect=' + encodeURIComponent(redirect) : '')
          : (redirect ? '?redirect=' + encodeURIComponent(redirect) : ''));
      var { error } = await oauthClient.auth.signInWithOAuth({
        provider: 'google',
        options: { redirectTo: callbackUrl }
      });
      if (error) showAlert(error.message, 'error');
    } catch(e) {
      showAlert('Could not connect to Google. Please try again.', 'error');
    }
  });

  /* ── Email/password login ── */
  document.getElementById('login-form').addEventListener('submit', async function(e) {
    e.preventDefault();
    clearAlert();

    var email = document.getElementById('email').value.trim();
    var pass  = document.getElementById('password').value;
    var valid = true;

    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      document.getElementById('email').classList.add('error');
      document.getElementById('err-email').style.display = 'block';
      valid = false;
    } else {
      document.getElementById('email').classList.remove('error');
      document.getElementById('err-email').style.display = 'none';
    }

    if (!pass) {
      document.getElementById('password').classList.add('error');
      document.getElementById('err-password').style.display = 'block';
      valid = false;
    } else {
      document.getElementById('password').classList.remove('error');
      document.getElementById('err-password').style.display = 'none';
    }

    if (!valid) return;

    submitBtn.classList.add('loading');
    submitBtn.disabled = true;

    try {
      var authClient = supabaseClient;
      if (mode === 'add') {
        var existing = await supabaseClient.auth.getSession();
        var outgoingSession = existing.data && existing.data.session;
        if (!outgoingSession || !window.VaRoomAccountSwitcher) throw new Error('Sign in to your current account before adding another.');
        await window.VaRoomAccountSwitcher.loadLinkedAccounts(supabaseClient, outgoingSession, { force: true });
        await window.VaRoomAccountSwitcher.upsertFromSession(supabaseClient, outgoingSession);
        if (!window.VaRoomAccountSwitcher.canAddAccount()) throw new Error('Account limit reached (3/3). This group cannot include another account.');
        authClient = window.VaRoomAccountAuth.createClient(window.supabase, window.VAROOM_SUPABASE_URL, window.VAROOM_SUPABASE_ANON_KEY, { usesRedirect: false });
      }

      var { data, error } = await authClient.auth.signInWithPassword({ email, password: pass });
      if (error) throw error;

      if (mode === 'add') {
        if (window.VaRoomAccountSwitcher) {
          await window.VaRoomAccountSwitcher.linkAdditionalSession(supabaseClient, data.session);
        }
        window.location.href = redirect || '/profile.html';
        return;
      }

      var profileResult = await supabaseClient.from('profiles').select('role,onboarding_completed').eq('id', data.user.id).maybeSingle();
      var profile = profileResult.data;
      var role = (profile && profile.role) || (data.user.user_metadata && data.user.user_metadata.role) || 'client';
      try {
        sessionStorage.setItem('varoom_user_role', role);
        localStorage.setItem('varoom_last_role', role);
      } catch(e) {}
      if (!profile || !profile.onboarding_completed) {
        window.location.href = '/onboarding' + (redirect ? '?redirect=' + encodeURIComponent(redirect) : '');
      } else {
        window.location.href = redirect || (role === 'host' ? '/host-home' : '/client-home');
      }

    } catch(err) {
      var msg = err.message || 'Login failed. Please try again.';
      if (msg.toLowerCase().includes('invalid')) msg = 'Incorrect email or password.';
      if (msg.toLowerCase().includes('not confirmed')) msg = 'Please confirm your email before logging in.';
      showAlert(msg, 'error');
    } finally {
      submitBtn.classList.remove('loading');
      submitBtn.disabled = false;
    }
  });

  /* Clear errors on input */
  ['email','password'].forEach(function(id) {
    document.getElementById(id).addEventListener('input', function() {
      this.classList.remove('error');
    });
  });

  /* Auto-redirect if already logged in — skipped in add-account mode, since
     the whole point there is to sign in as a *different* account while
     staying logged into the current one. */
  if (mode !== 'add') {
    (async function() {
      try {
        var { data } = await supabaseClient.auth.getSession();
        if (data && data.session) {
          var profileResult = await supabaseClient.from('profiles').select('role,onboarding_completed').eq('id', data.session.user.id).maybeSingle();
          var profile = profileResult.data;
          var role = (profile && profile.role) || (data.session.user.user_metadata && data.session.user.user_metadata.role) || 'client';
          try {
            sessionStorage.setItem('varoom_user_role', role);
            localStorage.setItem('varoom_last_role', role);
          } catch(e) {}
          if (!profile || !profile.onboarding_completed) {
            window.location.href = '/onboarding' + (redirect ? '?redirect=' + encodeURIComponent(redirect) : '');
          } else {
            window.location.href = redirect || (role === 'host' ? '/host-home' : '/client-home');
          }
        }
      } catch(e) {}
    })();
  }
</script>
</body>
</html>
