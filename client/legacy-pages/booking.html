<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book — VaRoom</title>
<script>
  (function(){
    try{
      var saved = localStorage.getItem('varoom_theme') || 'system';
      var resolved = saved === 'system'
        ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
        : saved;
      document.documentElement.setAttribute('data-theme', resolved);
    }catch(e){}
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;0,9..144,900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --red:#C41E3A; --red-deep:#8F1229; --white:#FFFFFF; --ink:#1A1210; --paper:#FBF4F1;
    --muted:#7a6b67; --line:rgba(128,110,100,.15); --line-strong:rgba(128,110,100,.28);
    --green:#2E9B54; --green-deep:#1E6B3A; --green-tint:rgba(46,155,84,.14); --green-tint-strong:rgba(46,155,84,.24);
    --font-display:'Fraunces', serif; --font-body:'Inter', sans-serif;
    --skel-base:rgba(128,110,100,.12); --skel-shine:rgba(128,110,100,.22);
  }
  [data-theme="dark"]{
    --white:#241C1A; --paper:#120D0C; --ink:#F5EFEC; --muted:#B8ACA8;
    --line:rgba(255,255,255,.09); --line-strong:rgba(255,255,255,.16);
    --green-tint:rgba(46,155,84,.16); --green-tint-strong:rgba(46,155,84,.28);
    --skel-base:rgba(255,255,255,.06); --skel-shine:rgba(255,255,255,.13);
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html{ height:100%; }
  body{ font-family:var(--font-body); background:var(--paper); color:var(--ink); height:100%; overflow:hidden; transition:background .2s ease, color .2s ease; }
  a{ color:inherit; text-decoration:none; }
  button{ font-family:inherit; cursor:pointer; border:none; background:none; }
  :focus-visible{ outline:3px solid var(--red-deep); outline-offset:3px; }
  svg{ flex-shrink:0; }

  .page-shell{ display:flex; flex-direction:column; height:100vh; overflow:hidden; }

  /* ---------- Top nav ---------- */
  header{
    display:flex; align-items:center; gap:1.5rem; padding:.9rem 2rem;
    border-bottom:1px solid var(--line); flex-wrap:wrap; flex-shrink:0;
  }
  .logo{ font-family:var(--font-display); font-weight:700; font-size:1.5rem; letter-spacing:-.01em; flex-shrink:0; }
  .logo .va{ color:var(--red); }
  .logo .room{ color:var(--ink); }

  .search-wrap{ position:relative; flex:1; min-width:200px; max-width:420px; }
  .search-input{
    width:100%; font-family:inherit; font-size:.88rem; padding:.6rem 1rem .6rem 2.3rem;
    border:1px solid var(--line-strong); border-radius:100px; background:var(--paper); color:var(--ink);
  }
  .search-input:focus{ outline:none; border-color:var(--red); }
  .search-icon{ position:absolute; left:.85rem; top:50%; transform:translateY(-50%); color:var(--muted); pointer-events:none; }
  .search-results{
    display:none; position:absolute; top:calc(100% + .5rem); left:0; right:0; z-index:40;
    background:var(--white); border:1px solid var(--line); border-radius:14px; overflow:hidden;
    box-shadow:0 12px 30px rgba(0,0,0,.18);
  }
  .search-results.show{ display:block; }
  .search-result-item{ display:block; padding:.7rem 1rem; font-size:.85rem; border-bottom:1px solid var(--line); }
  .search-result-item:last-child{ border-bottom:none; }
  .search-result-item:hover{ background:var(--paper); }
  .search-result-item .r-title{ font-weight:700; }
  .search-result-item .r-loc{ color:var(--muted); font-size:.78rem; }
  .search-empty{ padding:.9rem 1rem; font-size:.83rem; color:var(--muted); }

  .nav-links{ display:none; gap:1.5rem; font-size:.88rem; font-weight:600; color:var(--muted); }
  .nav-links a:hover{ color:var(--red); }

  .nav-icons{ display:flex; align-items:center; gap:1.1rem; margin-left:auto; }
  .icon-btn{ display:flex; align-items:center; justify-content:center; width:36px; height:36px; border-radius:50%; color:var(--muted); }
  .icon-btn:hover{ color:var(--red); background:var(--green-tint); }

  .avatar-wrap{ position:relative; }
  .avatar-btn{ display:flex; align-items:center; gap:.5rem; padding:.3rem .6rem .3rem .3rem; border-radius:100px; border:1px solid var(--line); }
  .avatar-btn:hover{ border-color:var(--red); }
  .avatar-circle{ width:28px; height:28px; border-radius:50%; background:var(--red); color:#fff; display:flex; align-items:center; justify-content:center; font-size:.72rem; font-weight:700; overflow:hidden; }
  .avatar-circle img{ width:100%; height:100%; object-fit:cover; }
  .avatar-name{ font-size:.83rem; font-weight:600; }
  .avatar-menu{
    display:none; position:absolute; right:0; top:calc(100% + .5rem); min-width:190px; z-index:40;
    background:var(--white); border:1px solid var(--line); border-radius:14px; overflow:hidden;
    box-shadow:0 12px 30px rgba(0,0,0,.18); padding:.4rem;
  }
  .avatar-menu.show{ display:block; }
  .avatar-menu a, .avatar-menu button{ display:flex; align-items:center; gap:.6rem; width:100%; text-align:left; padding:.6rem .7rem; border-radius:8px; font-size:.85rem; font-weight:600; }
  .avatar-menu a:hover, .avatar-menu button:hover{ background:var(--paper); color:var(--red); }

  @media (min-width:960px){ .nav-links{ display:flex; } }

  /* ---------- Breadcrumb ---------- */
  .breadcrumb{ font-size:.8rem; color:var(--muted); padding:.7rem 2rem; width:100%; flex-shrink:0; display:flex; align-items:center; gap:.35rem; flex-wrap:wrap; }
  @media (min-width:960px){ .breadcrumb{ padding:.7rem 3rem; } }
  .breadcrumb a:hover{ color:var(--red); }
  .breadcrumb .current{ color:var(--ink); font-weight:600; }

  .main-shell{ flex:1; min-height:0; }
  .page-error{ text-align:center; padding:3rem 1rem; color:var(--muted); font-size:.95rem; }

  .content-grid{ height:100%; display:flex; flex-direction:column; overflow-y:auto; max-width:560px; margin:0 auto; padding:0 6vw 3rem; }

  @media (min-width:960px){
    .content-grid{
      display:grid; grid-template-columns:minmax(0,1.2fr) minmax(340px,0.8fr); gap:2.25rem;
      align-items:start; max-width:1400px; margin:0; padding:0 3rem 2rem; height:100%; overflow:hidden;
    }
    .col-main{ height:100%; overflow-y:auto; padding:1.25rem 0 2rem; scrollbar-width:none; }
    .col-main::-webkit-scrollbar{ display:none; width:0; height:0; }
    .col-side{ height:100%; overflow-y:auto; padding:1.25rem 0 1.5rem; scrollbar-width:none; }
    .col-side::-webkit-scrollbar{ display:none; width:0; height:0; }
  }

  /* ---------- Gallery ---------- */
  .gallery{ position:relative; border-radius:20px; overflow:hidden; margin-bottom:1.5rem; }
  .gallery-hero{ position:relative; width:100%; height:210px; background:linear-gradient(135deg, var(--red) 0%, var(--red-deep) 100%); }
  .gallery-hero img{ width:100%; height:100%; object-fit:cover; display:block; }
  .gallery-thumbs{ display:none; }
  .view-all-btn{
    position:absolute; bottom:1rem; left:1rem; z-index:2; background:rgba(0,0,0,.55); color:#fff;
    font-size:.78rem; font-weight:700; padding:.5rem .9rem; border-radius:10px; display:flex; align-items:center; gap:.45rem;
  }
  .view-all-btn:hover{ background:rgba(0,0,0,.75); }
  @media (min-width:960px){
    .gallery{ display:grid; grid-template-columns:1.5fr 1fr; gap:.5rem; }
    .gallery-hero{ height:320px; border-radius:0; }
    .gallery-thumbs{ display:grid; grid-template-columns:repeat(2,1fr); grid-auto-rows:1fr; gap:.5rem; }
    .gallery-thumbs img{ width:100%; height:100%; object-fit:cover; display:block; min-height:155px; }
  }

  .lightbox{ display:none; position:fixed; inset:0; z-index:100; background:rgba(10,7,6,.92); padding:2.5rem; overflow-y:auto; }
  .lightbox.show{ display:block; }
  .lightbox-close{ position:fixed; top:1.5rem; right:1.5rem; width:42px; height:42px; border-radius:50%; background:rgba(255,255,255,.12); color:#fff; display:flex; align-items:center; justify-content:center; }
  .lightbox-close:hover{ background:rgba(255,255,255,.24); }
  .lightbox-grid{ max-width:960px; margin:2.5rem auto 0; display:grid; grid-template-columns:repeat(auto-fill, minmax(260px,1fr)); gap:1rem; }
  .lightbox-grid img{ width:100%; border-radius:12px; display:block; }

  /* ---------- Title block ---------- */
  .title-row{ display:flex; align-items:flex-start; justify-content:space-between; gap:1rem; margin-bottom:.5rem; }
  .listing-title{ font-family:var(--font-display); font-weight:700; font-size:1.55rem; line-height:1.2; }
  .title-actions{ display:flex; gap:.3rem; flex-shrink:0; }
  .action-btn{ display:flex; align-items:center; gap:.4rem; font-size:.85rem; font-weight:600; color:var(--ink); padding:.4rem .5rem; border-radius:8px; }
  .action-btn:hover{ color:var(--red); }
  .action-btn.saved svg{ fill:var(--red); stroke:var(--red); }

  .rating-row{ display:flex; align-items:center; gap:.5rem; font-size:.86rem; font-weight:600; margin-bottom:.5rem; flex-wrap:wrap; }
  .rating-row .icon-star{ color:var(--red); width:15px; height:15px; }
  .rating-row .superhost-tag{ font-size:.7rem; font-weight:700; padding:.2rem .6rem; border-radius:100px; background:var(--red); color:#fff; }
  .placeholder-tag{ font-size:.62rem; font-weight:700; text-transform:uppercase; letter-spacing:.03em; color:var(--muted); border:1px dashed var(--line-strong); padding:.1rem .4rem; border-radius:6px; }

  .listing-loc{ font-size:.9rem; color:var(--muted); margin-bottom:.8rem; }
  .listing-loc a{ text-decoration:underline; }
  .listing-loc a:hover{ color:var(--red); }

  .badge-row{ display:flex; gap:.5rem; margin-bottom:1.1rem; flex-wrap:wrap; }
  .mini-badge{ display:inline-flex; align-items:center; gap:.3rem; font-size:.72rem; font-weight:700; padding:.3rem .7rem; border-radius:100px; background:var(--green-tint); color:var(--green-deep); }
  .mini-badge svg{ width:12px; height:12px; }

  .info-chip-row{ display:flex; gap:.6rem; margin-bottom:1.3rem; flex-wrap:wrap; }
  .info-chip{ font-size:.82rem; font-weight:600; padding:.45rem .8rem; border-radius:10px; background:var(--white); border:1px solid var(--line); }

  .divider{ border:none; border-top:1px solid var(--line); margin:1.3rem 0; }

  /* ---------- Host card + About (side by side) ---------- */
  .host-about-row{ display:block; }
  @media (min-width:640px){ .host-about-row{ display:grid; grid-template-columns:230px 1fr; gap:1.6rem; align-items:start; } }

  .host-card{ display:flex; flex-direction:column; gap:.8rem; margin-bottom:1.3rem; }
  @media (min-width:640px){ .host-card{ margin-bottom:0; } }
  .host-avatar{
    width:52px; height:52px; border-radius:50%; background:var(--red); color:#fff;
    display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-weight:700; font-size:1.1rem; flex-shrink:0; overflow:hidden;
  }
  .host-avatar img{ width:100%; height:100%; object-fit:cover; }
  .host-name{ font-weight:700; font-size:.96rem; display:flex; align-items:center; gap:.4rem; flex-wrap:wrap; }
  .host-name .icon-verified{ width:15px; height:15px; color:var(--red); }
  .host-stats{ display:flex; gap:1.2rem; margin:.5rem 0 .6rem; }
  .host-stat b{ display:block; font-size:.92rem; }
  .host-stat span{ font-size:.7rem; color:var(--muted); }
  .contact-host-btn{ display:inline-flex; align-items:center; gap:.5rem; font-size:.83rem; font-weight:700; padding:.55rem 1rem; border-radius:10px; border:1.5px solid var(--ink); align-self:flex-start; }
  .contact-host-btn:hover{ border-color:var(--red); color:var(--red); }
  .contact-host-btn svg{ width:15px; height:15px; }

  .about-block .about-title, .section-title{ font-family:var(--font-display); font-weight:600; font-size:1.1rem; margin-bottom:.5rem; }
  .about-text{ font-size:.9rem; line-height:1.6; color:var(--ink); }

  /* ---------- Amenities (placeholder) ---------- */
  .amenity-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:.75rem 1.2rem; }
  @media (min-width:640px){ .amenity-grid{ grid-template-columns:repeat(3,1fr); } }
  .amenity-item{ display:flex; align-items:center; gap:.6rem; font-size:.87rem; }
  .amenity-item svg{ width:17px; height:17px; color:var(--red); }

  /* ---------- Reviews (placeholder) ---------- */
  .reviews-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:.9rem; flex-wrap:wrap; gap:.5rem; }
  .reviews-header .section-title{ margin-bottom:0; display:flex; align-items:center; gap:.4rem; }
  .reviews-header .icon-star{ width:15px; height:15px; color:var(--red); }
  .see-all-link{ font-size:.85rem; font-weight:700; color:var(--red); }
  .review-strip{ display:grid; grid-template-columns:repeat(auto-fit, minmax(220px,1fr)); gap:1rem; }
  .review-card{ background:var(--white); border:1px solid var(--line); border-radius:14px; padding:1rem 1.1rem; }
  .review-top{ display:flex; align-items:center; gap:.6rem; margin-bottom:.5rem; }
  .review-avatar{ width:34px; height:34px; border-radius:50%; background:var(--paper); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; font-size:.72rem; font-weight:700; }
  .review-name{ font-size:.85rem; font-weight:700; }
  .review-time{ font-size:.72rem; color:var(--muted); }
  .review-stars{ display:flex; gap:.15rem; color:var(--red); margin-bottom:.4rem; }
  .review-stars svg{ width:13px; height:13px; }
  .review-text{ font-size:.84rem; line-height:1.5; color:var(--muted); }

  /* ---------- Sidebar booking widget ---------- */
  .booking-widget{ background:var(--white); border:1px solid var(--line); border-radius:18px; padding:1.25rem 1.4rem; }
  .widget-price-row{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:.9rem; }
  .widget-price{ font-family:var(--font-display); font-weight:700; font-size:1.3rem; }
  .widget-price span{ font-family:var(--font-body); font-weight:500; font-size:.83rem; color:var(--muted); }
  .widget-rating{ display:flex; align-items:center; gap:.3rem; font-size:.83rem; font-weight:600; }
  .widget-rating svg{ width:13px; height:13px; color:var(--red); }

  .picker-title{ font-family:var(--font-display); font-weight:600; font-size:1rem; margin-bottom:.25rem; }
  .picker-sub{ font-size:.79rem; color:var(--muted); margin-bottom:.8rem; line-height:1.45; }

  .field{ display:flex; flex-direction:column; gap:.35rem; margin-bottom:.8rem; }
  label{ font-size:.83rem; font-weight:600; }
  input, select{
    font-family:inherit; font-size:.9rem; padding:.6rem .8rem;
    border:1px solid var(--line-strong); border-radius:10px;
    background:var(--paper); color:var(--ink); width:100%;
  }
  input:focus, select:focus{ outline:none; border-color:var(--red); }

  .cal-header{ display:flex; align-items:center; justify-content:space-between; margin:.2rem 0 .6rem; }
  .cal-title{ font-weight:700; font-size:.88rem; }
  .cal-nav{ display:flex; gap:.35rem; }
  .cal-nav button{ width:26px; height:26px; border-radius:8px; background:var(--paper); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; }
  .cal-nav button:hover{ border-color:var(--red); color:var(--red); }
  .cal-nav svg{ width:13px; height:13px; }

  .cal-grid{ display:grid; grid-template-columns:repeat(7, 1fr); gap:.25rem; margin-bottom:.5rem; }
  .cal-dow{ font-size:.6rem; font-weight:700; color:var(--muted); text-align:center; padding:.15rem 0; }
  .cal-day{
    aspect-ratio:1/1; display:flex; align-items:center; justify-content:center;
    border-radius:7px; font-size:.72rem; font-weight:500; background:transparent; color:var(--muted);
    border:1.5px solid transparent;
  }
  .cal-day.closed{ opacity:.35; cursor:not-allowed; }
  .cal-day.open{ cursor:pointer; background:var(--green-tint); color:var(--ink); font-weight:600; }
  .cal-day.open:hover{ border-color:var(--green); background:var(--green-tint-strong); }
  .cal-day.in-range{ background:rgba(196,30,58,.14); color:var(--ink); }
  .cal-day.range-end{ background:var(--red); color:#fff; }
  .cal-day.empty{ visibility:hidden; }

  .cal-legend{ display:flex; flex-wrap:wrap; gap:.9rem; font-size:.7rem; color:var(--muted); margin-bottom:.7rem; }
  .cal-legend .dot{ display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:.3rem; vertical-align:middle; }
  .cal-legend .dot.dot-open{ background:var(--green); }
  .cal-legend .dot.dot-selected{ background:var(--red); }

  .range-summary{ font-size:.8rem; font-weight:600; margin-bottom:.7rem; }

  .details-box{ border-top:1px solid var(--line); padding-top:.8rem; margin-top:.2rem; font-size:.85rem; }
  .details-row{ display:flex; justify-content:space-between; padding:.3rem 0; }
  .details-row.total{ border-top:1px solid var(--line); margin-top:.3rem; padding-top:.6rem; font-weight:700; }
  .details-label{ color:var(--muted); }

  .confirm-btn{
    background:var(--red); color:#fff; padding:.9rem 1.6rem; border-radius:100px;
    font-weight:600; font-size:.96rem; width:100%; margin-top:1rem; transition:background .2s ease;
  }
  .confirm-btn:hover{ background:var(--red-deep); }
  .confirm-btn:disabled{ background:#c9c0bd; cursor:not-allowed; }

  .form-note{ font-size:.77rem; color:var(--muted); text-align:center; margin-top:.6rem; }

  .success-msg{ display:none; border-radius:14px; padding:1.1rem 1.3rem; margin-top:1rem; font-size:.9rem; text-align:center; }
  .success-msg.show{ display:block; border:1px solid var(--green-tint-strong); background:var(--green-tint); color:var(--green-deep); }
  .success-msg.error{ background:rgba(196,30,58,.08); border-color:rgba(196,30,58,.3); color:var(--red-deep); }

  /* ---------- Skeleton loading ---------- */
  .skel{ position:relative; overflow:hidden; background:var(--skel-base); border-radius:8px; }
  .skel::after{
    content:''; position:absolute; inset:0;
    background:linear-gradient(100deg, transparent 30%, var(--skel-shine) 50%, transparent 70%);
    animation:skel-sweep 1.4s ease-in-out infinite;
  }
  @media (prefers-reduced-motion:reduce){
    .skel::after{ animation:none; }
    .skel{ animation:skel-pulse 1.8s ease-in-out infinite; }
  }
  @keyframes skel-sweep{ 0%{ transform:translateX(-100%); } 100%{ transform:translateX(100%); } }
  @keyframes skel-pulse{ 0%,100%{ opacity:1; } 50%{ opacity:.55; } }

  .skel-gallery{ height:210px; border-radius:20px; margin-bottom:1.5rem; }
  @media (min-width:960px){ .skel-gallery{ height:320px; } }
  .skel-shell{ display:block; padding:1.25rem 6vw; overflow-y:auto; height:100%; scrollbar-width:none; }
  .skel-shell::-webkit-scrollbar{ display:none; width:0; height:0; }
  @media (min-width:960px){ .skel-shell{ display:grid; grid-template-columns:minmax(0,1.2fr) minmax(340px,0.8fr); gap:2.25rem; padding:1.25rem 3rem; max-width:1400px; margin:0; } }
  .skel-line{ height:.75rem; border-radius:6px; margin-bottom:.55rem; }
  .skel-line.w-60{ width:60%; } .skel-line.w-40{ width:40%; } .skel-line.w-90{ width:90%; } .skel-line.w-100{ width:100%; }
  .skel-line.tall{ height:1.5rem; }
  .skel-avatar{ width:52px; height:52px; border-radius:50%; }
  .skel-card{ background:var(--white); border:1px solid var(--line); border-radius:18px; padding:1.25rem 1.4rem; }
  .skel-cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:.25rem; margin:.8rem 0; }
  .skel-cal-cell{ aspect-ratio:1/1; border-radius:7px; }
  .skel-button{ height:2.9rem; border-radius:100px; margin-top:1rem; }

  /* ---------- Narrow / mobile fallback: normal document scroll ---------- */
  @media (max-width:959px){
    html, body{ height:auto; overflow:visible; }
    .page-shell{ height:auto; overflow:visible; }
    .main-shell{ height:auto; }
    .content-grid{ height:auto; overflow:visible; padding-top:1.25rem; }
    .skel-shell{ height:auto; overflow:visible; }
  }
</style>
</head>
<body>

<div class="page-shell">
<header>
  <a href="/" class="logo" id="logo-link"><span class="va">Va</span><span class="room">Room</span></a>

  <div class="search-wrap">
    <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    <input type="text" id="nav-search" class="search-input" placeholder="Search destinations or properties" autocomplete="off">
    <div class="search-results" id="search-results"></div>
  </div>

  <nav class="nav-links">
    <a href="/client-home" id="nav-explore">Explore</a>
    <a href="/bookings">My Bookings</a>
    <a href="/become-host">Become a Host</a>
    <a href="/#how">Help</a>
  </nav>

  <div class="nav-icons">
    <a href="/client-home?view=saved" class="icon-btn" aria-label="Saved listings">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3.5h12a1 1 0 0 1 1 1V21l-7-4-7 4V4.5a1 1 0 0 1 1-1Z"/></svg>
    </a>
    <div class="avatar-wrap">
      <button type="button" class="avatar-btn" id="avatar-btn">
        <span class="avatar-circle" id="nav-avatar-circle">•</span>
        <span class="avatar-name" id="nav-avatar-name">Account</span>
      </button>
      <div class="avatar-menu" id="avatar-menu">
        <a href="#" id="menu-home-link">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 11.5 9-7.5 9 7.5"/><path d="M5.5 10v9a1 1 0 0 0 1 1H9a1 1 0 0 0 1-1v-4a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v4a1 1 0 0 0 1 1h2.5a1 1 0 0 0 1-1v-9"/></svg>
          <span id="menu-home-text">My home</span>

        <a href="/bookings">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="16" rx="2"/><path d="M8 3v4M16 3v4M3.5 10h17"/></svg>

          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.5-7 8-7s8 3 8 7"/></svg>

<script src="js/supabase-client.js"></script>
<script src="js/listing-feed-cache.js"></script>
<script>
  (async function(){
    const skeleton = document.getElementById('skeleton');
    const bookingPage = document.getElementById('booking-page');
    const pageError = document.getElementById('page-error');
    const breadcrumb = document.getElementById('breadcrumb');
    const params = new URLSearchParams(window.location.search);
    const listingId = params.get('listing');

    // ---------- Icon library (no emoji — matches app's line-icon style) ----------
    const ICON_STAR = '<svg class="icon-star" viewBox="0 0 24 24" fill="currentColor"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>';
    const ICON_VERIFIED = '<svg class="icon-verified" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.85 8.62a4 4 0 0 1 4.78-4.77 4 4 0 0 1 6.74 0 4 4 0 0 1 4.78 4.78 4 4 0 0 1 0 6.74 4 4 0 0 1-4.77 4.78 4 4 0 0 1-6.75 0 4 4 0 0 1-4.78-4.77 4 4 0 0 1 0-6.76Z"/><path d="m9 12 2 2 4-4"/></svg>';
    const ICON_GRID = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></svg>';
    const ICON_MESSAGE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5Z"/></svg>';
    const AMENITY_ICON = {
      wifi: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.55a11 11 0 0 1 14.08 0"/><path d="M1.42 9a16 16 0 0 1 21.16 0"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/></svg>',
      mountain: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m8 3 4 8 5-5 5 15H2L8 3z"/></svg>',
      parking: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 17V7h4a3 3 0 0 1 0 6H9"/></svg>',
      kitchen: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/></svg>',
      heating: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.07-2.14-.22-4.05 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.15.43-2.29 1-3a2.5 2.5 0 0 0 2.5 2.5Z"/></svg>',
      tv: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="15" x="2" y="7" rx="2"/><polyline points="17 2 12 7 7 2"/></svg>',
      workspace: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 16V7a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v9m16 0H4m16 0 1.28 2.55a1 1 0 0 1-.9 1.45H3.62a1 1 0 0 1-.9-1.45L4 16"/></svg>',
      balcony: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21V9l8-6 8 6v12"/><path d="M4 21h16"/><path d="M9 21v-6h6v6"/></svg>',
      breakfast: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 8h1a4 4 0 1 1 0 8h-1"/><path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4Z"/><line x1="6" y1="2" x2="6" y2="4"/><line x1="10" y1="2" x2="10" y2="4"/><line x1="14" y1="2" x2="14" y2="4"/></svg>',
      bonfire: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 9 9l-4 2 3 2-2 4 6-2 6 2-2-4 3-2-4-2-3-7Z"/></svg>',
      pet: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="4" r="2"/><circle cx="18" cy="8" r="2"/><circle cx="20" cy="16" r="2"/><path d="M9 10a5 5 0 0 1 5 5v3.5a3.5 3.5 0 0 1-6.84 1.04Q6.52 17.48 4.46 16.84A3.5 3.5 0 0 1 5.5 10Z"/></svg>',
      power: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 7h1a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2h-1"/><path d="M6 7H5a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h1"/><polyline points="11 7 7 12 13 12 9 17"/><line x1="22" y1="11" x2="22" y2="13"/></svg>'
    };

    function showError(msg){
      skeleton.style.display = 'none';
      pageError.textContent = msg;
      pageError.style.display = 'block';
    }

    function escapeHtml(str){ const d = document.createElement('div'); d.textContent = str || ''; return d.innerHTML; }

    function resolveAvatarUrl(avatarValue){
      if (!avatarValue) return null;
      if (avatarValue.indexOf('http') === 0) return avatarValue;
      return supabaseClient.storage.from('avatars').getPublicUrl(avatarValue).data.publicUrl;
    }

    let currentUser = null;
    let currentRole = null;
    let homeHref = '/';

    const { data: { session } } = await supabaseClient.auth.getSession();
    if (!session) {
      const returnTo = window.location.pathname + window.location.search;
      window.location.href = '/?redirect=' + encodeURIComponent(returnTo);
      return;
    }
    currentUser = session.user;

    const { data: profile } = await supabaseClient.from('profiles').select('role,full_name,avatar_url').eq('id', currentUser.id).maybeSingle();
    if (!profile) { window.location.href = '/login'; return; }
    currentRole = profile.role;
    homeHref = currentRole === 'host' ? '/host-home' : '/client-home';
    document.getElementById('logo-link').setAttribute('href', homeHref);
    document.getElementById('nav-explore').setAttribute('href', homeHref);
    document.getElementById('menu-home-link').setAttribute('href', homeHref);
    document.getElementById('menu-home-text').textContent = currentRole === 'host' ? 'Host dashboard' : 'My home';

    const myName = profile.full_name || currentUser.email || 'Account';
    const myInitials = myName.trim().split(/\s+/).slice(0,2).map(function(w){ return w[0]; }).join('').toUpperCase();
    const myAvatarUrl = resolveAvatarUrl(profile.avatar_url);
    document.getElementById('nav-avatar-circle').innerHTML = myAvatarUrl ? '<img src="' + myAvatarUrl + '" alt="">' : (myInitials || '•');
    document.getElementById('nav-avatar-name').textContent = myName.split(' ')[0] || 'Account';

    // ---------- Avatar dropdown ----------
    const avatarBtn = document.getElementById('avatar-btn');
    const avatarMenu = document.getElementById('avatar-menu');
    avatarBtn.addEventListener('click', function(e){
      e.stopPropagation();
      avatarMenu.classList.toggle('show');
    });
    document.addEventListener('click', function(){ avatarMenu.classList.remove('show'); });
    document.getElementById('menu-logout').addEventListener('click', async function(){
      await supabaseClient.auth.signOut();
      window.location.href = '/';
    });

    // ---------- Header search (wired to listings) ----------
    const navSearch = document.getElementById('nav-search');
    const searchResults = document.getElementById('search-results');
    let searchTimer = null;
    navSearch.addEventListener('input', function(){
      clearTimeout(searchTimer);
      const q = navSearch.value.trim();
      if (q.length < 2) { searchResults.classList.remove('show'); searchResults.innerHTML = ''; return; }
      searchTimer = setTimeout(async function(){
        const { data: results } = await supabaseClient
          .from('listings')
          .select('id,title,location_text')
          .or('title.ilike.%' + q + '%,location_text.ilike.%' + q + '%')
          .limit(6);
        if (!results || results.length === 0) {
          searchResults.innerHTML = '<div class="search-empty">No listings match "' + escapeHtml(q) + '".</div>';
        } else {
          searchResults.innerHTML = results.map(function(r){
            return '<a class="search-result-item" href="/booking?listing=' + r.id + '">' +
              '<div class="r-title">' + escapeHtml(r.title) + '</div>' +
              '<div class="r-loc">' + escapeHtml(r.location_text || '') + '</div>' +
            '</a>';
          }).join('');
        }
        searchResults.classList.add('show');
      }, 250);
    });
    document.addEventListener('click', function(e){
      if (!e.target.closest('.search-wrap')) { searchResults.classList.remove('show'); }
    });

    if (!listingId) { showError('No listing specified.'); return; }

    const { data: listing, error: listingError } = await supabaseClient
      .from('listings')
      .select('id,title,description,location_text,category,verified,host_id,' +
        'host:profiles(full_name,verified,avatar_url,username),listing_photos(storage_path),' +
        'listing_booking_details(*)')
      .eq('id', listingId)
      .maybeSingle();

    if (listingError || !listing) { showError("Couldn't load that listing."); return; }

    if (listing.host_id === currentUser.id) {
      showError("This is your own listing — you can't book it.");
      return;
    }

    const details = listing.listing_booking_details;
    if (!details) {
      showError('This listing has no booking details set up yet.');
      return;
    }

    // ---------- Breadcrumb ----------
    const locParts = (listing.location_text || '').split(',').map(function(s){ return s.trim(); }).filter(Boolean);
    let crumbHtml = '<a href="' + homeHref + '">Home</a><span>›</span>';
    locParts.forEach(function(part){
      crumbHtml += '<span>' + escapeHtml(part) + '</span><span>›</span>';
    });
    crumbHtml += '<span class="current">' + escapeHtml(listing.title) + '</span>';
    breadcrumb.innerHTML = crumbHtml;
    breadcrumb.style.display = 'flex';

    const SHORT_STAY = ['airbnb', 'hotel', 'venue'];
    const isShortStay = SHORT_STAY.includes(listing.category);
    const isHourly = details.price_unit === 'hour';

    const photoUrls = (listing.listing_photos || []).map(function(p){
      return supabaseClient.storage.from('listing-photos').getPublicUrl(p.storage_path).data.publicUrl;
    });

    // ---------- Booked/pending dates to grey out (short-stay only) ----------
    let unavailableDates = new Set();
    let openDates = new Set();
    if (isShortStay) {
      const { data: avail } = await supabaseClient.from('availability').select('date').eq('listing_id', listingId);
      (avail || []).forEach(function(a){ openDates.add(a.date); });

      const { data: existingBookings } = await supabaseClient
        .from('bookings').select('start_date,end_date,status').eq('listing_id', listingId).in('status', ['pending','approved']);
      (existingBookings || []).forEach(function(b){
        if (!b.start_date || !b.end_date) return;
        let d = new Date(b.start_date);
        const end = new Date(b.end_date);
        while (d <= end) {
          unavailableDates.add(d.toISOString().slice(0,10));
          d.setDate(d.getDate() + 1);
        }
      });
    }

    // ---------- Gallery ----------
    let galleryHtml = '';
    if (photoUrls.length === 0) {
      galleryHtml = '<div class="gallery-hero"></div>';
    } else {
      galleryHtml = '<div class="gallery-hero"><img src="' + photoUrls[0] + '" alt="">' +
        (photoUrls.length > 1 ? '<button type="button" class="view-all-btn" id="view-all-btn">' + ICON_GRID + '<span>View all photos</span></button>' : '') +
        '</div>';
      const thumbs = photoUrls.slice(1, 5);
      if (thumbs.length > 0) {
        galleryHtml += '<div class="gallery-thumbs">' +
          thumbs.map(function(u){ return '<img src="' + u + '" alt="">'; }).join('') +
          '</div>';
      }
    }

    // ---------- Title / rating / host / about / amenities / reviews (main column) ----------
    const badges = [];
    if (listing.verified) badges.push('GPS verified');
    if (listing.host.verified) badges.push('Verified host');

    const infoChips = [];
    if (listing.category) infoChips.push(listing.category.charAt(0).toUpperCase() + listing.category.slice(1));
    if (details.size_or_type) infoChips.push(escapeHtml(details.size_or_type));

    const hostName = listing.host.full_name || 'Host';
    const initials = hostName.trim().split(/\s+/).slice(0,2).map(function(w){ return w[0]; }).join('').toUpperCase();
    const hostAvatarUrl = resolveAvatarUrl(listing.host.avatar_url);

    const description = listing.description || '';
    const mapUrl = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(listing.location_text || listing.title);

    const AMENITY_PLACEHOLDERS = [
      ['wifi','Free Wi-Fi'], ['mountain','Mountain View'], ['parking','Free Parking'], ['kitchen','Kitchen'],
      ['heating','Heating'], ['tv','TV'], ['workspace','Workspace'], ['balcony','Balcony'],
      ['breakfast','Breakfast'], ['bonfire','Bonfire Area'], ['pet','Pet Friendly'], ['power','24/7 Power Backup']
    ];

    const REVIEW_PLACEHOLDERS = [
      { name:'N. P.', time:'2 weeks ago', text:'Absolutely loved the stay! The view was breathtaking and the place was super cozy.' },
      { name:'R. M.', time:'1 month ago', text:'Perfect getaway from the city. Clean, peaceful, and the host was very responsive.' },
      { name:'S. K.', time:'1 month ago', text:'Great location and amenities. Had a wonderful time with family, highly recommended.' }
    ];

    let colMainHtml = galleryHtml +
      '<div class="title-row">' +
        '<h1 class="listing-title">' + escapeHtml(listing.title) + '</h1>' +
        '<div class="title-actions">' +
          '<button type="button" class="action-btn" id="save-icon" aria-label="Save listing">' +
            '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8Z"/></svg>' +
            '<span>Save</span>' +
          '</button>' +
          '<button type="button" class="action-btn" id="share-btn" aria-label="Share listing">' +
            '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.6" y1="13.5" x2="15.4" y2="17.5"/><line x1="15.4" y1="6.5" x2="8.6" y2="10.5"/></svg>' +
            '<span>Share</span>' +
          '</button>' +
        '</div>' +
      '</div>' +
      '<div class="rating-row">' +
        ICON_STAR + '<span>4.8</span><span>(126 reviews)</span>' +
        '<span class="superhost-tag">Superhost</span>' +
        '<span class="placeholder-tag">sample — wire to host dashboard</span>' +
      '</div>' +
      '<p class="listing-loc">' + escapeHtml(listing.location_text) + ' · <a href="' + mapUrl + '" target="_blank" rel="noopener">View on map</a></p>' +
      (badges.length ? '<div class="badge-row">' + badges.map(function(b){ return '<span class="mini-badge">' + ICON_VERIFIED + b + '</span>'; }).join('') + '</div>' : '') +
      (infoChips.length ? '<div class="info-chip-row">' + infoChips.map(function(c){ return '<span class="info-chip">' + c + '</span>'; }).join('') + '</div>' : '') +
      '<hr class="divider">' +
      '<div class="host-about-row">' +
        '<div class="host-card">' +
          '<div style="display:flex; align-items:center; gap:.8rem;">' +
            '<div class="host-avatar">' + (hostAvatarUrl ? '<img src="' + hostAvatarUrl + '" alt="">' : escapeHtml(initials)) + '</div>' +
            '<div class="host-name">Hosted by ' + escapeHtml(hostName) + (listing.host.verified ? ICON_VERIFIED : '') + '</div>' +
          '</div>' +
          '<div class="host-stats">' +
            '<div class="host-stat"><b>5.0</b><span>Host rating</span></div>' +
            '<div class="host-stat"><b>3</b><span>Years hosting</span></div>' +
            '<div class="host-stat"><b>98%</b><span>Response rate</span></div>' +
          '</div>' +
          '<span class="placeholder-tag">sample stats — wire once host dashboard is connected</span>' +
          '<button type="button" class="contact-host-btn" id="contact-host-btn">' + ICON_MESSAGE + '<span>Contact Host</span></button>' +
        '</div>' +
        '<div class="about-block">' +
          '<p class="about-title">About this place</p>' +
          '<p class="about-text">' + (description ? escapeHtml(description) : '<span style="color:var(--muted);">The host hasn\'t added a caption for this listing yet.</span>') + '</p>' +
          '<p class="section-title" style="margin-top:1.2rem;">Top amenities</p>' +
          '<span class="placeholder-tag" style="display:inline-block; margin-bottom:.8rem;">placeholders — real list comes from listing-creation toggles</span>' +
          '<div class="amenity-grid">' +
            AMENITY_PLACEHOLDERS.map(function(a){ return '<div class="amenity-item">' + AMENITY_ICON[a[0]] + '<span>' + a[1] + '</span></div>'; }).join('') +
          '</div>' +
        '</div>' +
      '</div>' +
      '<hr class="divider">' +
      '<div class="reviews-header">' +
        '<p class="section-title">What guests say ' + ICON_STAR + ' 4.8 (126 reviews)</p>' +
        '<a href="#" class="see-all-link">See all reviews</a>' +
      '</div>' +
      '<span class="placeholder-tag" style="display:inline-block; margin-bottom:.8rem;">sample reviews — wire once reviews are collected</span>' +
      '<div class="review-strip">' +
        REVIEW_PLACEHOLDERS.map(function(r){
          return '<div class="review-card">' +
            '<div class="review-top"><span class="review-avatar">' + escapeHtml(r.name.replace(/[^A-Za-z]/g,'').slice(0,2).toUpperCase()) + '</span>' +
              '<div><div class="review-name">' + escapeHtml(r.name) + '</div><div class="review-time">' + r.time + '</div></div></div>' +
            '<div class="review-stars">' + ICON_STAR + ICON_STAR + ICON_STAR + ICON_STAR + ICON_STAR + '</div>' +
            '<div class="review-text">' + escapeHtml(r.text) + '</div>' +
          '</div>';
        }).join('') +
      '</div>';

    document.getElementById('col-main').innerHTML = colMainHtml;

    // ---------- Lightbox ----------
    const lightbox = document.getElementById('lightbox');
    const viewAllBtn = document.getElementById('view-all-btn');
    if (viewAllBtn) {
      document.getElementById('lightbox-grid').innerHTML = photoUrls.map(function(u){ return '<img src="' + u + '" alt="">'; }).join('');
      viewAllBtn.addEventListener('click', function(){ lightbox.classList.add('show'); });
    }
    document.getElementById('lightbox-close').addEventListener('click', function(){ lightbox.classList.remove('show'); });
    lightbox.addEventListener('click', function(e){ if (e.target === lightbox) lightbox.classList.remove('show'); });
    document.addEventListener('keydown', function(e){ if (e.key === 'Escape') lightbox.classList.remove('show'); });

    // ---------- Contact host: real conversation, same as the feed's chat button ----------
    document.getElementById('contact-host-btn').addEventListener('click', async function(){
      const btn = this;
      btn.disabled = true;
      const { data, error } = await supabaseClient
        .from('conversations')
        .upsert(
          { listing_id: listingId, host_id: listing.host_id, client_id: currentUser.id },
          { onConflict: 'listing_id,client_id' }
        )
        .select()
        .single();
      btn.disabled = false;
      if (error) { alert("Couldn't start that chat: " + error.message); return; }
      window.location.href = '/chats?c=' + data.id;
    });

    // ---------- Sidebar booking widget (calendar first, guests below it) ----------
    const legendHtml = '<div class="cal-legend">' +
        '<span><span class="dot dot-open"></span>Open</span>' +
        '<span><span class="dot dot-selected"></span>Selected</span>' +
      '</div>';

    let pickerHtml = '';
    if (isShortStay && isHourly) {
      pickerHtml =
        '<p class="picker-title">Pick a date &amp; duration</p>' +
        '<p class="picker-sub">Choose an open date and how many hours you need.</p>' +
        '<div id="cal-container"></div>' +
        legendHtml +
        '<div class="field">' +
          '<label for="hours-input">Hours</label>' +
          '<input type="number" id="hours-input" min="1" value="1">' +
        '</div>';
    } else if (isShortStay) {
      pickerHtml =
        '<p class="picker-title">Pick your dates</p>' +
        '<p class="picker-sub">Tap a check-in date, then a check-out date. Only open dates can be selected.</p>' +
        '<div id="cal-container"></div>' +
        legendHtml +
        '<p class="range-summary" id="range-summary">No dates selected yet.</p>';
    } else {
      const minDate = details.available_from || new Date().toISOString().slice(0,10);
      pickerHtml =
        '<p class="picker-title">Move-in details</p>' +
        '<p class="picker-sub">' + (details.available_from ? 'Available from ' + escapeHtml(details.available_from) + '.' : 'Choose your desired start date.') + '</p>' +
        '<div class="field">' +
          '<label for="lease-start">Desired start date</label>' +
          '<input type="date" id="lease-start" min="' + minDate + '" value="' + minDate + '">' +
        '</div>' +
        '<div class="field">' +
          '<label for="lease-months">Lease length (months)</label>' +
          '<input type="number" id="lease-months" min="1" value="' + (details.min_lease_months || 1) + '">' +
        '</div>';
    }

    const guestsHtml = isShortStay
      ? '<div class="field"><label for="guests-input">Guests</label><select id="guests-input"><option>1 Guest</option><option selected>2 Guests</option><option>3 Guests</option><option>4 Guests</option><option>5+ Guests</option></select></div>'
      : '';

    const colSideHtml =
      '<div class="booking-widget">' +
        '<div class="widget-price-row">' +
          '<div class="widget-price">KSh ' + Number(details.price_amount).toLocaleString() + ' <span>/ ' + details.price_unit + '</span></div>' +
          '<div class="widget-rating">' + ICON_STAR + ' 4.8 <span style="color:var(--muted); font-weight:400;">(126)</span></div>' +
        '</div>' +
        pickerHtml +
        guestsHtml +
        '<div class="details-box" id="details-box"></div>' +
        '<button type="button" class="confirm-btn" id="confirm-btn" disabled>Confirm booking</button>' +
        '<p class="form-note">This creates a request — the host needs to approve it before it\'s confirmed.</p>' +
        '<div class="success-msg" id="success-msg"></div>' +
      '</div>';

    document.getElementById('col-side').innerHTML = colSideHtml;

    skeleton.style.display = 'none';
    bookingPage.style.display = 'block';

    // ---------- Save/bookmark ----------
    const { data: existingBookmark } = await supabaseClient
      .from('bookmarks').select('id').eq('client_id', currentUser.id).eq('listing_id', listingId).maybeSingle();
    const saveIcon = document.getElementById('save-icon');
    if (existingBookmark) { saveIcon.classList.add('saved'); saveIcon.querySelector('span').textContent = 'Saved'; }
    saveIcon.addEventListener('click', async function(){
      if (saveIcon.classList.contains('saved')) {
        await supabaseClient.from('bookmarks').delete().eq('client_id', currentUser.id).eq('listing_id', listingId);
        saveIcon.classList.remove('saved');
        saveIcon.querySelector('span').textContent = 'Save';
      } else {
        await supabaseClient.from('bookmarks').insert({ client_id: currentUser.id, listing_id: listingId });
        saveIcon.classList.add('saved');
        saveIcon.querySelector('span').textContent = 'Saved';
      }
    });

    // ---------- Share (copies link) ----------
    document.getElementById('share-btn').addEventListener('click', async function(){
      try{
        await navigator.clipboard.writeText(window.location.href);
        const span = this.querySelector('span');
        const original = span.textContent;
        span.textContent = 'Copied!';
        setTimeout(function(){ span.textContent = original; }, 1500);
      }catch(e){}
    });

    // ---------- Price / details calculation ----------
    const detailsBox = document.getElementById('details-box');
    const confirmBtn = document.getElementById('confirm-btn');

    function updateDetailsBox(nightsOrHours, label, extraFee){
      const rate = Number(details.price_amount);
      const base = rate * nightsOrHours;
      const total = base + (extraFee || 0);
      let html =
        '<div class="details-row"><span class="details-label">' + label + '</span><span>KSh ' + base.toLocaleString() + '</span></div>';
      if (extraFee) {
        html += '<div class="details-row"><span class="details-label">Cleaning fee</span><span>KSh ' + extraFee.toLocaleString() + '</span></div>';
      }
      html += '<div class="details-row total"><span>Total</span><span>KSh ' + total.toLocaleString() + '</span></div>';
      detailsBox.innerHTML = html;
      return total;
    }

    let computedTotal = 0;
    let selectedStart = null, selectedEnd = null;

    if (isShortStay && isHourly) {
      // ---------- Single date + hours ----------
      let calMonth = new Date().getMonth(), calYear = new Date().getFullYear();
      let pickedDate = null;

      function renderCal(){
        const container = document.getElementById('cal-container');
        const monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];
        const firstDay = new Date(calYear, calMonth, 1).getDay();
        const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
        let html = '<div class="cal-header"><div class="cal-title">' + monthNames[calMonth] + ' ' + calYear + '</div>' +
          '<div class="cal-nav"><button type="button" id="cal-prev" aria-label="Previous month"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></button><button type="button" id="cal-next" aria-label="Next month"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></button></div></div>' +
          '<div class="cal-grid">' + ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(function(d){ return '<div class="cal-dow">' + d + '</div>'; }).join('');
        for (let i=0;i<firstDay;i++) html += '<div class="cal-day empty"></div>';
        for (let d=1; d<=daysInMonth; d++) {
          const dateStr = calYear + '-' + String(calMonth+1).padStart(2,'0') + '-' + String(d).padStart(2,'0');
          const isOpen = openDates.has(dateStr) && !unavailableDates.has(dateStr);
          const isPicked = dateStr === pickedDate;
          html += '<div class="cal-day ' + (isOpen ? 'open' : 'closed') + (isPicked ? ' range-end' : '') + '" data-date="' + dateStr + '">' + d + '</div>';
        }
        html += '</div>';
        container.innerHTML = html;

        container.querySelectorAll('.cal-day.open').forEach(function(cell){
          cell.addEventListener('click', function(){
            pickedDate = cell.getAttribute('data-date');
            selectedStart = pickedDate;
            renderCal();
            recalc();
          });
        });
        document.getElementById('cal-prev').addEventListener('click', function(){ calMonth--; if(calMonth<0){calMonth=11;calYear--;} renderCal(); });
        document.getElementById('cal-next').addEventListener('click', function(){ calMonth++; if(calMonth>11){calMonth=0;calYear++;} renderCal(); });
      }
      renderCal();

      const hoursInput = document.getElementById('hours-input');
      function recalc(){
        const hours = parseInt(hoursInput.value, 10) || 0;
        computedTotal = updateDetailsBox(hours, hours + ' hour' + (hours===1?'':'s'), null);
        confirmBtn.disabled = !(selectedStart && hours > 0);
      }
      hoursInput.addEventListener('input', recalc);
      recalc();

    } else if (isShortStay) {
      // ---------- Date range (check-in / check-out) ----------
      let calMonth = new Date().getMonth(), calYear = new Date().getFullYear();

      function isRangeValid(start, end){
        let d = new Date(start);
        const endD = new Date(end);
        while (d <= endD) {
          const ds = d.toISOString().slice(0,10);
          if (!openDates.has(ds) || unavailableDates.has(ds)) return false;
          d.setDate(d.getDate() + 1);
        }
        return true;
      }

      function renderCal(){
        const container = document.getElementById('cal-container');
        const monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];
        const firstDay = new Date(calYear, calMonth, 1).getDay();
        const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
        let html = '<div class="cal-header"><div class="cal-title">' + monthNames[calMonth] + ' ' + calYear + '</div>' +
          '<div class="cal-nav"><button type="button" id="cal-prev" aria-label="Previous month"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></button><button type="button" id="cal-next" aria-label="Next month"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></button></div></div>' +
          '<div class="cal-grid">' + ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(function(d){ return '<div class="cal-dow">' + d + '</div>'; }).join('');
        for (let i=0;i<firstDay;i++) html += '<div class="cal-day empty"></div>';
        for (let d=1; d<=daysInMonth; d++) {
          const dateStr = calYear + '-' + String(calMonth+1).padStart(2,'0') + '-' + String(d).padStart(2,'0');
          const isOpen = openDates.has(dateStr) && !unavailableDates.has(dateStr);
          let cls = isOpen ? 'open' : 'closed';
          if (selectedStart && dateStr === selectedStart) cls += ' range-end';
          if (selectedEnd && dateStr === selectedEnd) cls += ' range-end';
          if (selectedStart && selectedEnd && dateStr > selectedStart && dateStr < selectedEnd) cls += ' in-range';
          html += '<div class="cal-day ' + cls + '" data-date="' + dateStr + '">' + d + '</div>';
        }
        html += '</div>';
        container.innerHTML = html;

        container.querySelectorAll('.cal-day.open').forEach(function(cell){
          cell.addEventListener('click', function(){
            const dateStr = cell.getAttribute('data-date');
            if (!selectedStart || (selectedStart && selectedEnd)) {
              selectedStart = dateStr; selectedEnd = null;
            } else if (dateStr > selectedStart) {
              if (isRangeValid(selectedStart, dateStr)) {
                selectedEnd = dateStr;
              } else {
                document.getElementById('range-summary').textContent = 'Some dates in that range aren\'t open — pick a different check-out.';
                selectedStart = dateStr; selectedEnd = null;
              }
            } else {
              selectedStart = dateStr; selectedEnd = null;
            }
            renderCal();
            recalc();
          });
        });
        document.getElementById('cal-prev').addEventListener('click', function(){ calMonth--; if(calMonth<0){calMonth=11;calYear--;} renderCal(); });
        document.getElementById('cal-next').addEventListener('click', function(){ calMonth++; if(calMonth>11){calMonth=0;calYear++;} renderCal(); });
      }
      renderCal();

      function recalc(){
        const summary = document.getElementById('range-summary');
        if (selectedStart && selectedEnd) {
          const nights = Math.round((new Date(selectedEnd) - new Date(selectedStart)) / 86400000);
          summary.textContent = selectedStart + ' → ' + selectedEnd + ' (' + nights + ' night' + (nights===1?'':'s') + ')';
          computedTotal = updateDetailsBox(nights, nights + ' night' + (nights===1?'':'s'), details.cleaning_fee || null);
          confirmBtn.disabled = false;
        } else if (selectedStart) {
          summary.textContent = 'Check-in: ' + selectedStart + ' — now pick a check-out date.';
          confirmBtn.disabled = true;
        } else {
          summary.textContent = 'No dates selected yet.';
          confirmBtn.disabled = true;
        }
      }

    } else {
      // ---------- Long-term ----------
      const leaseMonthsInput = document.getElementById('lease-months');
      function recalc(){
        const months = parseInt(leaseMonthsInput.value, 10) || 0;
        computedTotal = updateDetailsBox(months, months + ' month' + (months===1?'':'s'), null);
        confirmBtn.disabled = months < 1;
      }
      leaseMonthsInput.addEventListener('input', recalc);
      recalc();
    }

    // ---------- Confirm booking ----------
    confirmBtn.addEventListener('click', async function(){
      confirmBtn.disabled = true;
      confirmBtn.textContent = 'Sending request...';

      const payload = {
        listing_id: listingId,
        host_id: listing.host_id,
        client_id: currentUser.id,
        price_unit: details.price_unit,
        total_price: computedTotal
      };

      if (isShortStay && isHourly) {
        payload.start_date = selectedStart;
        payload.hours = parseInt(document.getElementById('hours-input').value, 10);
      } else if (isShortStay) {
        payload.start_date = selectedStart;
        payload.end_date = selectedEnd;
      } else {
        payload.lease_start_date = document.getElementById('lease-start').value;
        payload.lease_months = parseInt(document.getElementById('lease-months').value, 10);
      }

      const { data: newBooking, error } = await supabaseClient.from('bookings').insert(payload).select('id').single();
      const successMsg = document.getElementById('success-msg');

      if (error) {
        successMsg.textContent = 'Something went wrong: ' + error.message;
        successMsg.classList.add('show', 'error');
        confirmBtn.disabled = false;
        confirmBtn.textContent = 'Confirm booking';
        return;
      }

      // Booking availability is reflected by the next feed revalidation.
      // Retain cards immediately, but ensure a return to Listings does not
      // keep a booking-related state stale past this user action.
      if (window.VaRoomListingFeedCache) window.VaRoomListingFeedCache.invalidateAll();

      await supabaseClient.from('notifications').insert({
        user_id: listing.host_id,
        type: 'booking_request',
        message: 'New booking request for "' + listing.title + '".',
        booking_id: newBooking ? newBooking.id : null
      });

      successMsg.textContent = 'Request sent! The host has 48 hours to respond — you\'ll be notified either way.';
      successMsg.classList.add('show');
      confirmBtn.style.display = 'none';
    });
  })();
</script>

</body>
</html>
