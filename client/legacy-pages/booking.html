<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book — VaRoom</title>
<script>
  (function(){
    try{
      var saved = localStorage.getItem('varoom_theme') || 'system';
      var resolved = saved === 'system'
        ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
        : saved;
      document.documentElement.setAttribute('data-theme', resolved);
    }catch(e){}
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;0,9..144,900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --red:#C41E3A; --red-deep:#8F1229; --white:#FFFFFF; --ink:#24211E; --paper:#F7F6F3;
    --muted:#5c584f; --line:#E4E1DA; --line-strong:#E4E1DA;
    --green:#2E9B54; --green-deep:#1E6B3A; --green-tint:rgba(46,155,84,.14); --green-tint-strong:rgba(46,155,84,.24);
    --font-display:'Helvetica Neue', Arial, sans-serif; --font-body:'Helvetica Neue', Arial, sans-serif; --font-brand:'Fraunces', serif;
    --skel-base:rgba(128,110,100,.12); --skel-shine:rgba(128,110,100,.22);
  }
  [data-theme="dark"]{
    --white:#241C1A; --paper:#120D0C; --ink:#F5EFEC; --muted:#C7BDB9;
    --line:rgba(255,255,255,.16); --line-strong:rgba(255,255,255,.3);
    --green-tint:rgba(46,155,84,.18); --green-tint-strong:rgba(46,155,84,.3);
    --skel-base:rgba(255,255,255,.06); --skel-shine:rgba(255,255,255,.13);
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html{ height:100%; }
  body{ font-family:var(--font-body); background:var(--paper); color:var(--ink); height:100%; overflow:hidden; transition:background .2s ease, color .2s ease; }
  a{ color:inherit; text-decoration:none; }
  button{ font-family:inherit; cursor:pointer; border:none; background:none; }
  :focus-visible{ outline:3px solid var(--red-deep); outline-offset:3px; }
  svg{ flex-shrink:0; }

  .page-shell{ display:flex; flex-direction:column; height:100vh; overflow:hidden; }

  /* ---------- Top nav ---------- */
  header{
    display:flex; align-items:center; gap:1.5rem; padding:.7rem 2rem;
    border-bottom:1px solid var(--line); flex-wrap:wrap; flex-shrink:0;
  }
  .logo{ font-family:var(--font-brand); font-weight:700; font-size:1.4rem; letter-spacing:-.01em; flex-shrink:0; }
  .logo .va{ color:var(--red); }
  .logo .room{ color:var(--ink); }

  .search-wrap{ position:relative; flex:1; min-width:200px; max-width:420px; }
  .search-input{
    width:100%; font-family:inherit; font-size:.85rem; padding:.5rem 1rem .5rem 2.3rem;
    border:1px solid var(--line-strong); border-radius:100px; background:var(--paper); color:var(--ink);
  }
  .search-input:focus{ outline:none; border-color:var(--red); }
  .search-icon{ position:absolute; left:.85rem; top:50%; transform:translateY(-50%); color:var(--muted); pointer-events:none; }
  .search-results{
    display:none; position:absolute; top:calc(100% + .5rem); left:0; right:0; z-index:40;
    background:var(--white); border:1px solid var(--line-strong); border-radius:14px; overflow:hidden;
    box-shadow:0 12px 30px rgba(0,0,0,.28);
  }
  .search-results.show{ display:block; }
  .search-result-item{ display:block; padding:.7rem 1rem; font-size:.85rem; border-bottom:1px solid var(--line); }
  .search-result-item:last-child{ border-bottom:none; }
  .search-result-item:hover{ background:var(--paper); }
  .search-result-item .r-title{ font-weight:700; }
  .search-result-item .r-loc{ color:var(--muted); font-size:.78rem; }
  .search-empty{ padding:.9rem 1rem; font-size:.83rem; color:var(--muted); }

  .nav-links{ display:none; gap:1.5rem; font-size:.86rem; font-weight:600; color:var(--muted); }
  .nav-links a:hover{ color:var(--red); }

  .nav-icons{ display:flex; align-items:center; gap:1.1rem; margin-left:auto; }
  .icon-btn{ display:flex; align-items:center; justify-content:center; width:34px; height:34px; border-radius:50%; color:var(--muted); }
  .icon-btn:hover{ color:var(--red); background:var(--green-tint); }

  .avatar-wrap{ position:relative; }
  .avatar-btn{ display:flex; align-items:center; gap:.5rem; padding:.25rem .6rem .25rem .25rem; border-radius:100px; border:1px solid var(--line-strong); }
  .avatar-btn:hover{ border-color:var(--red); }
  .avatar-circle{ width:26px; height:26px; border-radius:50%; background:var(--red); color:#fff; display:flex; align-items:center; justify-content:center; font-size:.7rem; font-weight:700; overflow:hidden; }
  .avatar-circle img{ width:100%; height:100%; object-fit:cover; }
  .avatar-name{ font-size:.82rem; font-weight:600; }
  .avatar-menu{
    display:none; position:absolute; right:0; top:calc(100% + .5rem); min-width:190px; z-index:40;
    background:var(--white); border:1px solid var(--line-strong); border-radius:14px; overflow:hidden;
    box-shadow:0 12px 30px rgba(0,0,0,.28); padding:.4rem;
  }
  .avatar-menu.show{ display:block; }
  .avatar-menu a, .avatar-menu button{ display:flex; align-items:center; gap:.6rem; width:100%; text-align:left; padding:.6rem .7rem; border-radius:8px; font-size:.85rem; font-weight:600; }
  .avatar-menu a:hover, .avatar-menu button:hover{ background:var(--paper); color:var(--red); }

  @media (min-width:960px){ .nav-links{ display:flex; } }

  /* ---------- Breadcrumb ---------- */
  .breadcrumb{ font-size:.78rem; color:var(--muted); padding:.5rem 2rem; width:100%; flex-shrink:0; display:flex; align-items:center; gap:.35rem; flex-wrap:wrap; }
  @media (min-width:960px){ .breadcrumb{ padding:.5rem 3rem; } }
  .breadcrumb a:hover{ color:var(--red); }
  .breadcrumb .current{ color:var(--ink); font-weight:600; }

  .main-shell{ flex:1; min-height:0; }
  .page-error{ text-align:center; padding:3rem 1rem; color:var(--muted); font-size:.95rem; }

  .content-grid{ height:100%; display:flex; flex-direction:column; overflow-y:auto; max-width:560px; margin:0 auto; padding:0 6vw 3rem; }

  @media (min-width:960px){
    .content-grid{
      display:grid; grid-template-columns:minmax(0,1.2fr) minmax(340px,0.8fr); gap:2rem;
      align-items:start; max-width:1400px; margin:0; padding:0 3rem 1rem; height:100%; overflow:hidden;
    }
    .col-main{ height:100%; overflow-y:auto; padding:.6rem 0 .5rem; scrollbar-width:none; }
    .col-main::-webkit-scrollbar{ display:none; width:0; height:0; }
    .col-side{ height:100%; overflow-y:auto; padding:.6rem 0 .5rem; scrollbar-width:none; }
    .col-side::-webkit-scrollbar{ display:none; width:0; height:0; }
  }

  /* ---------- Gallery carousel (Instagram-style: swipe/scroll/arrows) ---------- */
  .gallery-carousel{
    position:relative; width:100%; height:150px; border-radius:16px; overflow:hidden; margin-bottom:.7rem;
    background:linear-gradient(135deg, var(--red) 0%, var(--red-deep) 100%); touch-action:pan-y;
  }
  @media (min-width:960px){ .gallery-carousel{ height:190px; } }
  .gallery-slide-track{ display:flex; width:100%; height:100%; transition:transform .3s ease; will-change:transform; }
  .gallery-slide{ flex:0 0 100%; width:100%; height:100%; }
  .gallery-slide img,.gallery-slide video{ width:100%; height:100%; object-fit:cover; display:block; -webkit-user-drag:none; user-select:none; }
  .gallery-index-pill{
    position:absolute; top:.65rem; right:.65rem; z-index:3; background:rgba(0,0,0,.55); color:#fff;
    font-size:.68rem; font-weight:700; padding:.25rem .55rem; border-radius:100px;
  }
  .gallery-nav{
    position:absolute; top:50%; transform:translateY(-50%); width:32px; height:32px; border-radius:50%;
    background:rgba(0,0,0,.45); color:#fff; display:flex; align-items:center; justify-content:center; z-index:3;
  }
  .gallery-nav:hover{ background:rgba(0,0,0,.68); }
  .gallery-nav.prev{ left:.55rem; }
  .gallery-nav.next{ right:.55rem; }
  .gallery-nav svg{ width:15px; height:15px; }
  .gallery-dots{ position:absolute; bottom:.55rem; left:50%; transform:translateX(-50%); display:flex; gap:.32rem; z-index:3; }
  .gallery-dot{ width:6px; height:6px; border-radius:50%; background:rgba(255,255,255,.5); transition:all .2s ease; cursor:pointer; }
  .gallery-dot.active{ background:#fff; width:14px; border-radius:4px; }
  .view-all-btn{
    position:absolute; bottom:.6rem; left:.6rem; z-index:3; background:rgba(0,0,0,.6); color:#fff;
    font-size:.72rem; font-weight:700; padding:.4rem .7rem; border-radius:9px; display:flex; align-items:center; gap:.4rem;
  }
  .view-all-btn:hover{ background:rgba(0,0,0,.8); }

  .lightbox{ display:none; position:fixed; inset:0; z-index:100; background:rgba(10,7,6,.92); padding:2.5rem; overflow-y:auto; }
  .lightbox.show{ display:block; }
  .lightbox-close{ position:fixed; top:1.5rem; right:1.5rem; width:42px; height:42px; border-radius:50%; background:rgba(255,255,255,.12); color:#fff; display:flex; align-items:center; justify-content:center; }
  .lightbox-close:hover{ background:rgba(255,255,255,.24); }
  .lightbox-grid{ max-width:960px; margin:2.5rem auto 0; display:grid; grid-template-columns:repeat(auto-fill, minmax(260px,1fr)); gap:1rem; }
  .lightbox-grid img{ width:100%; border-radius:12px; display:block; }

  /* ---------- Title block ---------- */
  .title-row{ display:flex; align-items:flex-start; justify-content:space-between; gap:1rem; margin-bottom:.25rem; }
  .listing-title{ font-family:var(--font-display); font-weight:700; font-size:1.25rem; line-height:1.2; }
  .title-actions{ display:flex; gap:.2rem; flex-shrink:0; }
  .action-btn{ display:flex; align-items:center; gap:.35rem; font-size:.8rem; font-weight:600; color:var(--ink); padding:.3rem .4rem; border-radius:8px; }
  .action-btn:hover{ color:var(--red); }
  .action-btn.saved svg{ fill:var(--red); stroke:var(--red); }
  .action-btn svg{ width:15px; height:15px; }

  .rating-row{ display:flex; align-items:center; gap:.45rem; font-size:.8rem; font-weight:600; margin-bottom:.3rem; flex-wrap:wrap; }
  .rating-row .icon-star{ color:var(--red); width:13px; height:13px; }
  .rating-row .superhost-tag{ font-size:.66rem; font-weight:700; padding:.15rem .55rem; border-radius:100px; background:var(--red); color:#fff; }
  .placeholder-tag{ font-size:.6rem; font-weight:700; text-transform:uppercase; letter-spacing:.03em; color:var(--muted); border:1px dashed var(--line-strong); padding:.08rem .35rem; border-radius:6px; }

  .listing-loc{ font-size:.83rem; color:var(--muted); margin-bottom:.4rem; }
  .listing-loc a{ text-decoration:underline; }
  .listing-loc a:hover{ color:var(--red); }

  .badge-row{ display:flex; gap:.4rem; margin-bottom:.5rem; flex-wrap:wrap; }
  .mini-badge{ display:inline-flex; align-items:center; gap:.25rem; font-size:.68rem; font-weight:700; padding:.22rem .55rem; border-radius:100px; background:var(--green-tint); color:var(--green-deep); }
  .mini-badge svg{ width:11px; height:11px; }

  .info-chip-row{ display:flex; gap:.5rem; margin-bottom:.5rem; flex-wrap:wrap; }
  .info-chip{ font-size:.76rem; font-weight:600; padding:.32rem .65rem; border-radius:9px; background:var(--white); border:1px solid var(--line-strong); }

  .divider{ border:none; border-top:1px solid var(--line); margin:.6rem 0; }

  /* ---------- Host card + About (side by side) ---------- */
  .host-about-row{ display:block; }
  @media (min-width:640px){ .host-about-row{ display:grid; grid-template-columns:200px 1fr; gap:1.3rem; align-items:start; } }

  .host-card{ display:flex; flex-direction:column; gap:.7rem; margin-bottom:.7rem; }
  @media (min-width:640px){ .host-card{ margin-bottom:0; } }
  .host-avatar{
    width:38px; height:38px; border-radius:50%; background:var(--red); color:#fff;
    display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-weight:700; font-size:.9rem; flex-shrink:0; overflow:hidden;
  }
  .host-avatar img{ width:100%; height:100%; object-fit:cover; }
  .host-name{ font-weight:700; font-size:.85rem; display:flex; align-items:center; gap:.35rem; flex-wrap:wrap; }
  .host-name{ color:inherit; text-decoration:none; }
  .host-name .icon-verified{ width:13px; height:13px; color:var(--red); }
  .contact-host-btn{
    display:flex; align-items:center; justify-content:center; gap:.5rem; width:100%;
    font-size:.82rem; font-weight:700; padding:.65rem .9rem; border-radius:10px;
    background:var(--red); color:#fff;
  }
  .contact-host-btn:hover{ background:var(--red-deep); }
  .contact-host-btn svg{ width:15px; height:15px; }

  .about-block .about-title, .section-title{ font-family:var(--font-display); font-weight:600; font-size:.92rem; margin-bottom:.3rem; }
  .about-text{ font-size:.8rem; line-height:1.4; color:var(--ink); }

  /* ---------- Amenities (placeholder) ---------- */
  .amenity-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:.4rem .7rem; }
  @media (min-width:640px){ .amenity-grid{ grid-template-columns:repeat(3,1fr); } }
  @media (min-width:1180px){ .amenity-grid{ grid-template-columns:repeat(4,1fr); } }
  .amenity-item{ display:flex; align-items:center; gap:.45rem; font-size:.76rem; }
  .amenity-item svg{ width:14px; height:14px; color:var(--red); }

  /* ---------- Reviews ---------- */
  .reviews-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:.4rem; flex-wrap:wrap; gap:.5rem; }
  .reviews-header .section-title{ margin-bottom:0; display:flex; align-items:center; gap:.35rem; }
  .reviews-header .icon-star{ width:13px; height:13px; color:var(--red); }
  .see-all-link{ font-size:.78rem; font-weight:700; color:var(--red); }
  .review-strip{ display:grid; grid-template-columns:repeat(auto-fit, minmax(200px,1fr)); gap:.6rem; }
  .review-card{ background:var(--white); border:1px solid var(--line-strong); border-radius:12px; padding:.6rem .7rem; }
  .review-top{ display:flex; align-items:center; gap:.45rem; margin-bottom:.3rem; }
  .review-avatar{ width:24px; height:24px; border-radius:50%; background:var(--paper); border:1px solid var(--line-strong); display:flex; align-items:center; justify-content:center; font-size:.62rem; font-weight:700; }
  .review-name{ font-size:.78rem; font-weight:700; }
  .review-time{ font-size:.65rem; color:var(--muted); }
  .review-stars{ display:flex; gap:.12rem; color:var(--red); margin-bottom:.25rem; }
  .review-stars svg{ width:11px; height:11px; }
  .review-text{ font-size:.74rem; line-height:1.3; color:var(--muted); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .reviews-state{ grid-column:1 / -1; color:var(--muted); font-size:.8rem; padding:.8rem 0; }
  .review-avatar img{ width:100%; height:100%; object-fit:cover; border-radius:50%; }

  /* ---------- Sidebar booking widget ---------- */
  .booking-widget{ background:var(--white); border:1px solid var(--line-strong); border-radius:16px; padding:1rem 1.2rem; }
  .widget-price-row{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:.6rem; }
  .widget-price{ font-family:var(--font-display); font-weight:700; font-size:1.15rem; }
  .widget-price span{ font-family:var(--font-body); font-weight:500; font-size:.78rem; color:var(--muted); }
  .widget-rating{ display:flex; align-items:center; gap:.3rem; font-size:.78rem; font-weight:600; }
  .widget-rating svg{ width:12px; height:12px; color:var(--red); }

  .picker-title{ font-family:var(--font-display); font-weight:600; font-size:.92rem; margin-bottom:.2rem; }
  .picker-sub{ font-size:.73rem; color:var(--muted); margin-bottom:.55rem; line-height:1.35; }

  .field{ display:flex; flex-direction:column; gap:.3rem; margin-bottom:.55rem; }
  label{ font-size:.78rem; font-weight:600; }
  input, select{
    font-family:inherit; font-size:.85rem; padding:.5rem .7rem;
    border:1px solid var(--line-strong); border-radius:9px;
    background:var(--paper); color:var(--ink); width:100%;
  }
  input:focus, select:focus{ outline:none; border-color:var(--red); }

  .cal-header{ display:flex; align-items:center; justify-content:space-between; margin:.15rem 0 .4rem; }
  .cal-title{ font-weight:700; font-size:.82rem; }
  .cal-nav{ display:flex; gap:.3rem; }
  .cal-nav button{ width:23px; height:23px; border-radius:7px; background:var(--paper); border:1px solid var(--line-strong); display:flex; align-items:center; justify-content:center; }
  .cal-nav button:hover{ border-color:var(--red); color:var(--red); }
  .cal-nav svg{ width:12px; height:12px; }

  .cal-grid{ display:grid; grid-template-columns:repeat(7, 1fr); gap:.2rem; margin-bottom:.35rem; }
  .cal-dow{ font-size:.56rem; font-weight:700; color:var(--muted); text-align:center; padding:.1rem 0; }
  .cal-day{
    aspect-ratio:1/1; display:flex; align-items:center; justify-content:center;
    border-radius:6px; font-size:.68rem; font-weight:500; background:transparent; color:var(--muted);
    border:1.5px solid transparent;
  }
  .cal-day.closed{ opacity:.35; cursor:not-allowed; }
  .cal-day.open{ cursor:pointer; background:var(--green-tint); color:var(--ink); font-weight:600; }
  .cal-day.open:hover{ border-color:var(--green); background:var(--green-tint-strong); }
  .cal-day.in-range{ background:rgba(196,30,58,.14); color:var(--ink); }
  .cal-day.range-end{ background:var(--red); color:#fff; }
  .cal-day.empty{ visibility:hidden; }

  .cal-legend{ display:flex; flex-wrap:wrap; gap:.7rem; font-size:.66rem; color:var(--muted); margin-bottom:.45rem; }
  .cal-legend .dot{ display:inline-block; width:6px; height:6px; border-radius:50%; margin-right:.28rem; vertical-align:middle; }
  .cal-legend .dot.dot-open{ background:var(--green); }
  .cal-legend .dot.dot-selected{ background:var(--red); }

  .range-summary{ font-size:.75rem; font-weight:600; margin-bottom:.45rem; }

  .details-box{ border-top:1px solid var(--line); padding-top:.55rem; margin-top:.15rem; font-size:.8rem; }
  .details-row{ display:flex; justify-content:space-between; padding:.2rem 0; }
  .details-row.total{ border-top:1px solid var(--line); margin-top:.2rem; padding-top:.45rem; font-weight:700; }
  .details-label{ color:var(--muted); }

  .confirm-btn{
    background:var(--red); color:#fff; padding:.7rem 1.4rem; border-radius:100px;
    font-weight:600; font-size:.9rem; width:100%; margin-top:.6rem; transition:background .2s ease;
  }
  .confirm-btn:hover{ background:var(--red-deep); }
  .confirm-btn:disabled{ background:#c9c0bd; cursor:not-allowed; }

  .form-note{ font-size:.72rem; color:var(--muted); text-align:center; margin-top:.4rem; }

  .success-msg{ display:none; border-radius:12px; padding:.8rem 1rem; margin-top:.6rem; font-size:.85rem; text-align:center; }
  .success-msg.show{ display:block; border:1px solid var(--green-tint-strong); background:var(--green-tint); color:var(--green-deep); }
  .success-msg.error{ background:rgba(196,30,58,.1); border-color:rgba(196,30,58,.35); color:var(--red-deep); }

  /* ---------- Skeleton loading ---------- */
  .skel{ position:relative; overflow:hidden; background:var(--skel-base); border-radius:8px; }
  .skel::after{
    content:''; position:absolute; inset:0;
    background:linear-gradient(100deg, transparent 30%, var(--skel-shine) 50%, transparent 70%);
    animation:skel-sweep 1.4s ease-in-out infinite;
  }
  @media (prefers-reduced-motion:reduce){
    .skel::after{ animation:none; }
    .skel{ animation:skel-pulse 1.8s ease-in-out infinite; }
  }
  @keyframes skel-sweep{ 0%{ transform:translateX(-100%); } 100%{ transform:translateX(100%); } }
  @keyframes skel-pulse{ 0%,100%{ opacity:1; } 50%{ opacity:.55; } }

  .skel-gallery{ height:150px; border-radius:16px; margin-bottom:.7rem; }
  @media (min-width:960px){ .skel-gallery{ height:190px; } }
  .skel-shell{ display:block; padding:.75rem 6vw; overflow-y:auto; height:100%; scrollbar-width:none; }
  .skel-shell::-webkit-scrollbar{ display:none; width:0; height:0; }
  @media (min-width:960px){ .skel-shell{ display:grid; grid-template-columns:minmax(0,1.2fr) minmax(340px,0.8fr); gap:2rem; padding:.75rem 3rem; max-width:1400px; margin:0; } }
  .skel-line{ height:.65rem; border-radius:5px; margin-bottom:.45rem; }
  .skel-line.w-60{ width:60%; } .skel-line.w-40{ width:40%; } .skel-line.w-90{ width:90%; } .skel-line.w-100{ width:100%; }
  .skel-line.tall{ height:1.2rem; }
  .skel-avatar{ width:38px; height:38px; border-radius:50%; }
  .skel-card{ background:var(--white); border:1px solid var(--line-strong); border-radius:16px; padding:1rem 1.2rem; }
  .skel-cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:.2rem; margin:.6rem 0; }
  .skel-cal-cell{ aspect-ratio:1/1; border-radius:6px; }
  .skel-button{ height:2.6rem; border-radius:100px; margin-top:.8rem; }

  /* ---------- Narrow / mobile fallback: normal document scroll ---------- */
  @media (max-width:959px){
    html, body{ height:auto; overflow:visible; }
    .page-shell{ height:auto; overflow:visible; }
    .main-shell{ height:auto; }
    .content-grid{ height:auto; overflow:visible; padding-top:1rem; }
    .skel-shell{ height:auto; overflow:visible; }
  }

  /* ---------- Dedicated desktop booking workspace ---------- */
  .client-sidebar{ display:none; }

    .details-box{ padding-top:.45rem; font-size:.74rem; }

    .confirm-btn{
      min-height:42px; margin-top:.65rem; padding:.7rem 1.2rem; font-size:.88rem; font-weight:700;

    const ICON_LOCATION = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 5-8 11-8 11s-8-6-8-11a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/></svg>';
    const AMENITY_ICON = {

      pet: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="4" r="2"/><circle cx="18" cy="8" r="2"/><circle cx="20" cy="16" r="2"/><path d="M9 10a5 5 0 0 1 5 5v3.5a3.5 3.5 0 0 1-6.84 1.04Q6.52 17.48 4.46 16.84A3.5 3.5 0 0 1 5.5 10Z"/></svg>',
      power: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 7h1a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2h-1"/><path d="M6 7H5a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h1"/><polyline points="11 7 7 12 13 12 9 17"/><line x1="22" y1="11" x2="22" y2="13"/></svg>'
    };
    const AMENITY_LABEL = {
      wifi: 'Free Wi-Fi', mountain: 'Mountain View', parking: 'Free Parking', kitchen: 'Kitchen',
      heating: 'Heating', tv: 'TV', workspace: 'Workspace', balcony: 'Balcony',
      breakfast: 'Breakfast', bonfire: 'Bonfire Area', pet: 'Pet Friendly', power: '24/7 Power Backup'
    };
    const ICON_GENERIC_AMENITY = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';

    function showError(msg){
      skeleton.style.display = 'none';
      pageError.textContent = msg;
      pageError.style.display = 'block';
    }

    function escapeHtml(str){ const d = document.createElement('div'); d.textContent = str || ''; return d.innerHTML; }

    function resolveAvatarUrl(avatarValue){
      if (!avatarValue) return null;
      if (avatarValue.indexOf('http') === 0) return avatarValue;
      return window.VaRoomMedia.publicUrl('avatars', avatarValue);
    }

    let currentUser = null;
    let currentRole = null;
    let homeHref = '/';

    const { data: { session } } = await supabaseClient.auth.getSession();
    if (!session) {
      const returnTo = window.location.pathname + window.location.search;
      window.location.href = '/?redirect=' + encodeURIComponent(returnTo);
      return;
    }
    currentUser = session.user;

    const { data: profile } = await supabaseClient.from('profiles').select('role,full_name,avatar_url').eq('id', currentUser.id).maybeSingle();
    if (!profile) { window.location.href = '/login'; return; }
    currentRole = profile.role;
    homeHref = currentRole === 'host' ? '/host-home' : '/client-home';
    document.getElementById('logo-link').setAttribute('href', homeHref);
    document.getElementById('nav-explore').setAttribute('href', '/marketplace');
    document.getElementById('menu-home-link').setAttribute('href', homeHref);
    document.getElementById('menu-home-text').textContent = currentRole === 'host' ? 'Host dashboard' : 'My home';

    const myName = profile.full_name || currentUser.email || 'Account';
    const myInitials = myName.trim().split(/\s+/).slice(0,2).map(function(w){ return w[0]; }).join('').toUpperCase();
    const myAvatarUrl = resolveAvatarUrl(profile.avatar_url);
    document.getElementById('nav-avatar-circle').innerHTML = myAvatarUrl ? '<img src="' + myAvatarUrl + '" alt="">' : (myInitials || '•');
    document.getElementById('nav-avatar-name').textContent = myName.split(' ')[0] || 'Account';

    // ---------- Avatar dropdown ----------
    const avatarBtn = document.getElementById('avatar-btn');
    const avatarMenu = document.getElementById('avatar-menu');
    avatarBtn.addEventListener('click', function(e){
      e.stopPropagation();
      avatarMenu.classList.toggle('show');
    });
    document.addEventListener('click', function(){ avatarMenu.classList.remove('show'); });
    document.getElementById('menu-logout').addEventListener('click', async function(){
      await supabaseClient.auth.signOut();
      window.location.href = '/';
    });

    // ---------- Header search (wired to listings) ----------
    const navSearch = document.getElementById('nav-search');
    const searchResults = document.getElementById('search-results');
    let searchTimer = null;
    navSearch.addEventListener('input', function(){
      clearTimeout(searchTimer);
      const q = navSearch.value.trim();
      if (q.length < 2) { searchResults.classList.remove('show'); searchResults.innerHTML = ''; return; }
      searchTimer = setTimeout(async function(){
        const { data: results } = await supabaseClient
          .from('listings')
          .select('id,title,location_text')
          .or('title.ilike.%' + q + '%,location_text.ilike.%' + q + '%')
          .limit(6);
        if (!results || results.length === 0) {
          searchResults.innerHTML = '<div class="search-empty">No listings match "' + escapeHtml(q) + '".</div>';
        } else {
          searchResults.innerHTML = results.map(function(r){
            return '<a class="search-result-item" href="/booking?listing=' + r.id + '">' +
              '<div class="r-title">' + escapeHtml(r.title) + '</div>' +
              '<div class="r-loc">' + escapeHtml(r.location_text || '') + '</div>' +
            '</a>';
          }).join('');
        }
        searchResults.classList.add('show');
      }, 250);
    });
    document.addEventListener('click', function(e){
      if (!e.target.closest('.search-wrap')) { searchResults.classList.remove('show'); }
    });

    if (!listingId) { showError('No listing specified.'); return; }

    const { data: listing, error: listingError } = await supabaseClient
      .from('listings')
      .select('id,title,description,location_text,category,verified,availability_status,host_id,' +
        'host:profiles(full_name,verified,avatar_url,username,phone),listing_photos(storage_path,sort_order),' +
        'listing_booking_details(*)')
      .eq('id', listingId)
      .maybeSingle();

    if (listingError || !listing) { showError("Couldn't load that listing."); return; }

    if (listing.host_id === currentUser.id) {
      showError("This is your own listing — you can't book it.");
      return;
    }

    const details = listing.listing_booking_details;
    if (!details) {
      showError('This listing has no booking details set up yet.');
      return;
    }
    const listingUnavailable = listing.availability_status && listing.availability_status !== 'available';
    const availabilityMessage = listingUnavailable
      ? 'This listing is currently ' + String(listing.availability_status).replace('_', ' ') + ' and cannot accept new bookings.'
      : '';

    let reviews = [];
    let reviewSummary = { average_rating: null, review_count: 0 };
    let reviewsError = null;
    try {
      const reviewsResponse = await fetch('/api/listings/' + encodeURIComponent(listingId) + '/reviews');
      if (!reviewsResponse.ok) throw new Error('Unable to load reviews');
      const reviewsPayload = await reviewsResponse.json();
      reviews = Array.isArray(reviewsPayload.reviews) ? reviewsPayload.reviews : [];
      reviewSummary = reviewsPayload.summary || reviewSummary;
    } catch (error) {
      reviewsError = 'Reviews are temporarily unavailable.';
    }

    // ---------- Breadcrumb ----------
    const locParts = (listing.location_text || '').split(',').map(function(s){ return s.trim(); }).filter(Boolean);
    let crumbHtml = '<a href="' + homeHref + '">Home</a><span>›</span>';
    locParts.forEach(function(part){
      crumbHtml += '<span>' + escapeHtml(part) + '</span><span>›</span>';
    });
    crumbHtml += '<span class="current">' + escapeHtml(listing.title) + '</span>';
    breadcrumb.innerHTML = crumbHtml;
    breadcrumb.style.display = 'flex';

    const SHORT_STAY = ['airbnb', 'hotel', 'venue'];
    const isShortStay = SHORT_STAY.includes(listing.category);
    const isHourly = details.price_unit === 'hour';

    const photoUrls = window.VaRoomMedia.sortPhotos(listing.listing_photos).map(function(p){
      return window.VaRoomMedia.publicUrl('listing-photos', p.storage_path);
    });
    let listingVideoUrl = null;
    let listingVideoThumbnailUrl = null;
    try {
      const videoResponse = await fetch('/api/properties/' + encodeURIComponent(listingId) + '/media', {
        headers: { Authorization: 'Bearer ' + session.access_token }
      });
      if (videoResponse.ok) {
        const mediaPayload = await videoResponse.json();
        const videoItem = (Array.isArray(mediaPayload.media) ? mediaPayload.media : [])
          .find(function(item){ return item && item.type === 'video'; });
        if (videoItem) {
          const playbackResponse = await fetch('/api/media/' + encodeURIComponent(videoItem.id) + '/playback', {
            headers: { Authorization: 'Bearer ' + session.access_token }
          });
          if (playbackResponse.ok) {
            const playbackPayload = await playbackResponse.json();
            listingVideoUrl = playbackPayload && playbackPayload.url ? playbackPayload.url : null;
            listingVideoThumbnailUrl = playbackPayload && playbackPayload.thumbnailUrl ? playbackPayload.thumbnailUrl : null;
          }
        }
      }
    } catch (mediaError) {
      listingVideoUrl = null;
    }

    // ---------- Booked/pending dates to grey out (short-stay only) ----------
    let unavailableDates = new Set();
    let openDates = new Set();
    if (isShortStay) {
      const { data: avail } = await supabaseClient.from('availability').select('date').eq('listing_id', listingId);
      (avail || []).forEach(function(a){ openDates.add(a.date); });

      const { data: existingBookings } = await supabaseClient
        .from('bookings').select('start_date,end_date,status').eq('listing_id', listingId).in('status', ['pending','approved']);
      (existingBookings || []).forEach(function(b){
        if (!b.start_date || !b.end_date) return;
        let d = new Date(b.start_date);
        const end = new Date(b.end_date);
        while (d <= end) {
          unavailableDates.add(d.toISOString().slice(0,10));
          d.setDate(d.getDate() + 1);
        }
      });
    }

    // ---------- Gallery (swipeable carousel) ----------
    let galleryHtml = '';
    const mediaUrls = listingVideoUrl ? [listingVideoUrl].concat(photoUrls) : photoUrls;
    if (mediaUrls.length === 0) {
      galleryHtml = '<div class="gallery-carousel">' +
        '<button type="button" class="gallery-close-btn" id="gallery-close-btn" aria-label="Close property details">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>' +
        '</button>' +
        '<button type="button" class="gallery-like-btn" id="like-placeholder" aria-label="Likes coming soon" title="Likes coming soon">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8Z"/></svg>' +
        '</button>' +
      '</div>';
    } else {
      galleryHtml = '<div class="gallery-carousel" id="gallery-carousel">' +
        (mediaUrls.length > 1 ? '<div class="gallery-index-pill" id="gallery-index-pill">1/' + mediaUrls.length + '</div>' : '') +
        '<div class="gallery-slide-track" id="gallery-slide-track">' +
          mediaUrls.map(function(u, index){
            return '<div class="gallery-slide">' +
              (listingVideoUrl && index === 0
                ? '<video src="' + u + '" poster="' + escapeHtml(listingVideoThumbnailUrl || '') + '" muted autoplay loop playsinline controlslist="nodownload" aria-label="' + escapeHtml(listing.title) + ' video"></video>'
                : '<img src="' + u + '" alt="' + escapeHtml(listing.title) + '">') +
            '</div>';
          }).join('') +
        '</div>' +
        '<button type="button" class="gallery-close-btn" id="gallery-close-btn" aria-label="Close property details">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>' +
        '</button>' +
        '<button type="button" class="gallery-like-btn" id="like-placeholder" aria-label="Likes coming soon" title="Likes coming soon">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8Z"/></svg>' +
        '</button>' +
        (mediaUrls.length > 1 ?
          '<button type="button" class="gallery-nav prev" id="gallery-prev" aria-label="Previous photo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></button>' +
          '<button type="button" class="gallery-nav next" id="gallery-next" aria-label="Next photo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></button>' +
          '<div class="gallery-dots" id="gallery-dots">' + mediaUrls.map(function(_, i){ return '<span class="gallery-dot' + (i===0?' active':'') + '" data-index="' + i + '"></span>'; }).join('') + '</div>'
          : '') +
        '<button type="button" class="view-all-btn" id="view-all-btn">' + ICON_GRID + '<span>View all photos</span></button>' +
      '</div>';
    }

    // ---------- Title / rating / host / about / amenities / reviews (main column) ----------
    const badges = [];
    if (listing.verified) badges.push('GPS verified');
    if (listing.host.verified) badges.push('Verified host');

    const infoChips = [];
    if (listing.category) infoChips.push(listing.category.charAt(0).toUpperCase() + listing.category.slice(1));
    if (details.size_or_type) infoChips.push(escapeHtml(details.size_or_type));

    const hostName = listing.host.full_name || 'Host';
    const initials = hostName.trim().split(/\s+/).slice(0,2).map(function(w){ return w[0]; }).join('').toUpperCase();
    const hostAvatarUrl = resolveAvatarUrl(listing.host.avatar_url);
    const hostPhone = String(listing.host.phone || '').trim();
    const ICON_PHONE = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6 19.8 19.8 0 0 1-3.1-8.7A2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 2 .7 2.9a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.9.6 2.9.7A2 2 0 0 1 22 17Z"/></svg>';
    const hostPhoneHtml = hostPhone
      ? '<p class="host-phone">' + ICON_PHONE + '<a href="tel:' + escapeHtml(hostPhone.replace(/[^+\d]/g, '')) + '">' + escapeHtml(hostPhone) + '</a></p>'
      : '';

    const description = listing.description || '';
    const mapUrl = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(listing.location_text || listing.title);

    // Real amenities selected by the host during listing creation.
    // Falls back gracefully for listings saved before this column existed.
    const rawAmenities = Array.isArray(details.amenities) ? details.amenities : [];
    const amenitiesHtml = rawAmenities.length
      ? '<div class="amenity-grid">' +
          rawAmenities.map(function(key){
            const icon = AMENITY_ICON[key] || ICON_GENERIC_AMENITY;
            const label = AMENITY_LABEL[key] || (key.charAt(0).toUpperCase() + key.slice(1));
            return '<div class="amenity-item">' + icon + '<span>' + escapeHtml(label) + '</span></div>';
          }).join('') +
        '</div>'
      : '<p style="font-size:.8rem; color:var(--muted);">No amenities listed for this space yet.</p>';

    const reviewCount = Number(reviewSummary.review_count || reviews.length);
    const averageRating = Number(reviewSummary.average_rating);
    const ratingText = reviewsError
      ? 'Reviews unavailable'
      : reviewCount && Number.isFinite(averageRating)
      ? averageRating.toFixed(1)
      : 'No reviews yet';
    const ratingCountText = reviewCount ? '(' + reviewCount + ' ' + (reviewCount === 1 ? 'review' : 'reviews') + ')' : '';
    const reviewStars = function(rating){
      const roundedRating = Math.max(0, Math.min(5, Math.round(Number(rating) || 0)));
      return Array.from({ length: 5 }, function(_, index){
        return index < roundedRating ? ICON_STAR : '';
      }).join('');
    };
    const reviewTime = function(createdAt){
      const date = new Date(createdAt);
      return Number.isNaN(date.getTime()) ? '' : date.toLocaleDateString();
    };
    const reviewCardsHtml = reviewsError
      ? '<p class="reviews-state" role="alert">' + escapeHtml(reviewsError) + '</p>'
      : reviews.length
      ? reviews.map(function(review){
          const client = review.client || {};
          const reviewerName = client.full_name || 'Anonymous guest';
          const reviewerInitials = reviewerName.replace(/[^A-Za-z]/g, '').slice(0, 2).toUpperCase();
          const reviewerAvatarUrl = resolveAvatarUrl(client.avatar_url);
          const reviewerAvatar = reviewerAvatarUrl
            ? '<img src="' + escapeHtml(reviewerAvatarUrl) + '" alt="">'
            : escapeHtml(reviewerInitials || '?');
          return '<div class="review-card">' +
            '<div class="review-top"><span class="review-avatar">' + reviewerAvatar + '</span>' +
              '<div><div class="review-name">' + escapeHtml(reviewerName) + '</div><div class="review-time">' + escapeHtml(reviewTime(review.created_at)) + '</div></div></div>' +
            '<div class="review-stars">' + reviewStars(review.rating) + '</div>' +
            '<div class="review-text">' + escapeHtml(review.comment) + '</div>' +
          '</div>';
        }).join('')
      : '<p class="reviews-state">No reviews yet for this listing.</p>';

    let colMainHtml = galleryHtml +
      '<div class="title-row">' +
        '<h1 class="listing-title">' + escapeHtml(listing.title) + '</h1>' +
        '<div class="title-actions">' +
          '<button type="button" class="action-btn" id="share-btn" aria-label="Share listing">' +
            '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.6" y1="13.5" x2="15.4" y2="17.5"/><line x1="15.4" y1="6.5" x2="8.6" y2="10.5"/></svg>' +
            '<span>Share</span>' +
          '</button>' +
        '</div>' +
      '</div>' +
      '<div class="rating-row">' +
        (reviewCount ? ICON_STAR + '<span>' + escapeHtml(ratingText) + '</span><span>' + escapeHtml(ratingCountText) + '</span>' : '<span>' + escapeHtml(ratingText) + '</span>') +
      '</div>' +
      '<p class="listing-loc">' + ICON_LOCATION + '<span>' + escapeHtml(listing.location_text) + '</span><a class="map-link-inline" href="' + mapUrl + '" target="_blank" rel="noopener">View on map</a></p>' +
      hostPhoneHtml +
      (badges.length ? '<div class="badge-row">' + badges.map(function(b){ return '<span class="mini-badge">' + ICON_VERIFIED + b + '</span>'; }).join('') + '</div>' : '') +
      (infoChips.length ? '<div class="info-chip-row">' + infoChips.map(function(c){ return '<span class="info-chip">' + c + '</span>'; }).join('') + '</div>' : '') +
      '<hr class="divider">' +
      '<div class="host-about-row">' +
        '<div class="host-card">' +
          '<div style="display:flex; align-items:center; gap:.8rem;">' +
            '<div class="host-avatar">' + (hostAvatarUrl ? '<img src="' + hostAvatarUrl + '" alt="">' : escapeHtml(initials)) + '</div>' +
            '<a class="host-name" href="/host/' + encodeURIComponent(listing.host_id) + '">Hosted by ' + escapeHtml(hostName) + (listing.host.verified ? ICON_VERIFIED : '') + '</a>' +
          '</div>' +
          '<button type="button" class="contact-host-btn" id="contact-host-btn">' + ICON_MESSAGE + '<span>Contact Host</span></button>' +
        '</div>' +
        '<div class="about-block">' +
          '<h2 class="about-title">About this place</h2>' +
          '<p class="about-text">' + (description ? escapeHtml(description) : '<span style="color:var(--muted);">The host hasn\'t added a caption for this listing yet.</span>') + '</p>' +
          '<h2 class="section-title" style="margin-top:.8rem;">Top amenities</h2>' +
          amenitiesHtml +
        '</div>' +
      '</div>' +
      '<hr class="divider">' +
      '<div class="reviews-header">' +
        '<h2 class="section-title">What guests say' + (reviewsError ? '' : reviewCount ? ' \u00b7 ' + ICON_STAR + ' ' + escapeHtml(ratingText) + ' ' + escapeHtml(ratingCountText) : ' \u00b7 No reviews yet') + '</h2>' +
        '<a href="#" class="see-all-link">See all reviews</a>' +
      '</div>' +
      '<div class="review-strip">' + reviewCardsHtml + '</div>';

    document.getElementById('col-main').innerHTML = colMainHtml;

    // Reporting remains available without competing with the primary booking actions.
    const reportListingBtn = document.getElementById('report-listing-btn');
    if (reportListingBtn) {
      reportListingBtn.addEventListener('click', function(){
        const reason = window.prompt('Why are you reporting this listing?');
        if (reason && reason.trim()) {
          window.alert('Thanks. Your report has been noted for review.');
        }
      });
    }

    const galleryCloseBtn = document.getElementById('gallery-close-btn');
    if (galleryCloseBtn) {
      galleryCloseBtn.addEventListener('click', function(){
        if (window.history.length > 1 && document.referrer) {
          window.history.back();
        } else {
          window.location.href = '/marketplace';
        }
      });
    }

    // ---------- Gallery carousel: click arrows, click dots, drag/swipe, trackpad horizontal scroll ----------
    const galleryCarousel = document.getElementById('gallery-carousel');
    if (galleryCarousel && mediaUrls.length > 1) {
      const track = document.getElementById('gallery-slide-track');
      const dots = galleryCarousel.querySelectorAll('.gallery-dot');
      const pill = document.getElementById('gallery-index-pill');
      let activeIndex = 0;

      function applyGalleryState(){
        track.style.transform = 'translateX(' + (-(activeIndex * 100)) + '%)';
        dots.forEach(function(d, i){ d.classList.toggle('active', i === activeIndex); });
        if (pill) pill.textContent = (activeIndex + 1) + '/' + mediaUrls.length;
      }
      function goToPhoto(i){
        activeIndex = Math.max(0, Math.min(mediaUrls.length - 1, i));
        applyGalleryState();
      }

      document.getElementById('gallery-prev').addEventListener('click', function(){ goToPhoto(activeIndex - 1); });
      document.getElementById('gallery-next').addEventListener('click', function(){ goToPhoto(activeIndex + 1); });
      dots.forEach(function(d){
        d.addEventListener('click', function(){ goToPhoto(parseInt(d.getAttribute('data-index'), 10)); });
      });

      // Drag / touch swipe
      let startX = 0, currentX = 0, dragging = false;
      galleryCarousel.addEventListener('pointerdown', function(e){
        dragging = true; startX = e.clientX; currentX = e.clientX;
        track.style.transition = 'none';
        galleryCarousel.setPointerCapture(e.pointerId);
      });
      galleryCarousel.addEventListener('pointermove', function(e){
        if (!dragging) return;
        currentX = e.clientX;
        const delta = currentX - startX;
        track.style.transform = 'translateX(' + (-(activeIndex * 100) + (delta / galleryCarousel.clientWidth) * 100) + '%)';
      });
      function endDrag(e){
        if (!dragging) return;
        dragging = false;
        track.style.transition = '';
        const delta = currentX - startX;
        if (Math.abs(delta) > 40) goToPhoto(activeIndex + (delta < 0 ? 1 : -1));
        else applyGalleryState();
        try { galleryCarousel.releasePointerCapture(e.pointerId); } catch (err) {}
      }
      galleryCarousel.addEventListener('pointerup', endDrag);
      galleryCarousel.addEventListener('pointerleave', function(){ if (dragging) { dragging = false; track.style.transition = ''; applyGalleryState(); } });

      // Trackpad / shift-wheel horizontal scroll — "scroll right to see the next photo"
      let wheelLock = false;
      galleryCarousel.addEventListener('wheel', function(e){
        if (Math.abs(e.deltaX) > Math.abs(e.deltaY) && Math.abs(e.deltaX) > 10) {
          e.preventDefault();
          if (wheelLock) return;
          wheelLock = true;
          goToPhoto(activeIndex + (e.deltaX > 0 ? 1 : -1));
          setTimeout(function(){ wheelLock = false; }, 350);
        }
      }, { passive:false });
    }

    // ---------- Lightbox ----------
    const lightbox = document.getElementById('lightbox');
    const viewAllBtn = document.getElementById('view-all-btn');
    if (viewAllBtn) {
      document.getElementById('lightbox-grid').innerHTML = photoUrls.map(function(u){ return '<img src="' + u + '" alt="">'; }).join('');
      viewAllBtn.addEventListener('click', function(){ lightbox.classList.add('show'); });
    }
    document.getElementById('lightbox-close').addEventListener('click', function(){ lightbox.classList.remove('show'); });
    lightbox.addEventListener('click', function(e){ if (e.target === lightbox) lightbox.classList.remove('show'); });
    document.addEventListener('keydown', function(e){ if (e.key === 'Escape') lightbox.classList.remove('show'); });

    // ---------- Contact host: real conversation, same as the feed's chat button ----------
    document.getElementById('contact-host-btn').addEventListener('click', async function(){
      const btn = this;
      btn.disabled = true;
      const { data, error } = await supabaseClient
        .from('conversations')
        .upsert(
          { listing_id: listingId, host_id: listing.host_id, client_id: currentUser.id },
          { onConflict: 'listing_id,client_id' }
        )
        .select()
        .single();
      btn.disabled = false;
      if (error) { alert("Couldn't start that chat: " + error.message); return; }
      window.location.href = '/chats?c=' + data.id;
    });

    // ---------- Sidebar booking widget (calendar first, guests below it) ----------
    const legendHtml = '<div class="cal-legend">' +
        '<span><span class="dot dot-open"></span>Open</span>' +
        '<span><span class="dot dot-selected"></span>Selected</span>' +
      '</div>';

    let pickerHtml = '';
    if (isShortStay && isHourly) {
      pickerHtml =
        '<p class="picker-title">Pick a date &amp; duration</p>' +
        '<p class="picker-sub">Choose an open date and how many hours you need.</p>' +
        '<div id="cal-container"></div>' +
        legendHtml +
        '<div class="field">' +
          '<label for="hours-input">Hours</label>' +
          '<input type="number" id="hours-input" min="1" value="1">' +
        '</div>';
    } else if (isShortStay) {
      pickerHtml =
        '<p class="picker-title">Pick your dates</p>' +
        '<p class="picker-sub">Tap a check-in date, then a check-out date. Only open dates can be selected.</p>' +
        '<div id="cal-container"></div>' +
        legendHtml +
        '<p class="range-summary" id="range-summary">No dates selected yet.</p>';
    } else {
      const minDate = details.available_from || new Date().toISOString().slice(0,10);
      pickerHtml =
        '<p class="picker-title">Move-in details</p>' +
        '<p class="picker-sub">' + (details.available_from ? 'Available from ' + escapeHtml(details.available_from) + '.' : 'Choose your desired start date.') + '</p>' +
        '<div class="field">' +
          '<label for="lease-start">Desired start date</label>' +
          '<input type="date" id="lease-start" min="' + minDate + '" value="' + minDate + '">' +
        '</div>' +
        '<div class="field">' +
          '<label for="lease-months">Lease length (months)</label>' +
          '<input type="number" id="lease-months" min="1" value="' + (details.min_lease_months || 1) + '">' +
        '</div>';
    }

    const guestsHtml = isShortStay
      ? '<div class="field"><label for="guests-input">Guests</label><select id="guests-input"><option>1 Guest</option><option selected>2 Guests</option><option>3 Guests</option><option>4 Guests</option><option>5+ Guests</option></select></div>'
      : '';

    const colSideHtml =
      '<div class="booking-widget">' +
        '<div class="widget-price-row">' +
          '<div class="widget-price">KSh ' + Number(details.price_amount).toLocaleString() + ' <span>/ ' + details.price_unit + '</span></div>' +
          '<div class="widget-rating">' + (reviewCount ? ICON_STAR + ' ' + escapeHtml(ratingText) + ' <span style="color:var(--muted); font-weight:400;">(' + reviewCount + ')</span>' : '<span style="color:var(--muted); font-weight:400;">No reviews yet</span>') + '</div>' +
        '</div>' +
        pickerHtml +
        guestsHtml +
        '<div class="details-box" id="details-box"></div>' +
        '<button type="button" class="confirm-btn" id="confirm-btn" disabled' + (listingUnavailable ? ' aria-disabled="true"' : '') + '>Book now</button>' +
        '<p class="form-note">' + (availabilityMessage || 'This creates a request — the host needs to approve it before it\'s confirmed.') + '</p>' +
        '<div class="success-msg" id="success-msg"></div>' +
      '</div>';

    document.getElementById('col-side').innerHTML = colSideHtml;

    skeleton.style.display = 'none';
    bookingPage.style.display = 'block';

    // ---------- Share (copies link) ----------
    document.getElementById('share-btn').addEventListener('click', async function(){
      try{
        await navigator.clipboard.writeText(window.location.href);
        const span = this.querySelector('span');
        const original = span.textContent;
        span.textContent = 'Copied!';
        setTimeout(function(){ span.textContent = original; }, 1500);
      }catch(e){}
    });

    // ---------- Price / details calculation ----------
    const detailsBox = document.getElementById('details-box');
    const confirmBtn = document.getElementById('confirm-btn');
    detailsBox.hidden = true;

    function clearDetailsBox(){
      detailsBox.innerHTML = '';
      detailsBox.hidden = true;
    }

    function updateDetailsBox(nightsOrHours, label, extraFee){
      const rate = Number(details.price_amount);
      const base = rate * nightsOrHours;
      const total = base + (extraFee || 0);
      let html =
        '<div class="details-row"><span class="details-label">' + label + '</span><span>KSh ' + base.toLocaleString() + '</span></div>';
      if (extraFee) {
        html += '<div class="details-row"><span class="details-label">Cleaning fee</span><span>KSh ' + extraFee.toLocaleString() + '</span></div>';
      }
      html += '<div class="details-row total"><span>Total</span><span>KSh ' + total.toLocaleString() + '</span></div>';
      detailsBox.innerHTML = html;
      detailsBox.hidden = false;
      return total;
    }

    let computedTotal = 0;
    let selectedStart = null, selectedEnd = null;

    if (isShortStay && isHourly) {
      // ---------- Single date + hours ----------
      let calMonth = new Date().getMonth(), calYear = new Date().getFullYear();
      let pickedDate = null;

      function renderCal(){
        const container = document.getElementById('cal-container');
        const monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];
        const firstDay = new Date(calYear, calMonth, 1).getDay();
        const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
        let html = '<div class="cal-header"><div class="cal-title">' + monthNames[calMonth] + ' ' + calYear + '</div>' +
          '<div class="cal-nav"><button type="button" id="cal-prev" aria-label="Previous month"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></button><button type="button" id="cal-next" aria-label="Next month"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></button></div></div>' +
          '<div class="cal-grid">' + ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(function(d){ return '<div class="cal-dow">' + d + '</div>'; }).join('');
        for (let i=0;i<firstDay;i++) html += '<div class="cal-day empty"></div>';
        for (let d=1; d<=daysInMonth; d++) {
          const dateStr = calYear + '-' + String(calMonth+1).padStart(2,'0') + '-' + String(d).padStart(2,'0');
          const isOpen = openDates.has(dateStr) && !unavailableDates.has(dateStr);
          const isPicked = dateStr === pickedDate;
          html += '<div class="cal-day ' + (isOpen ? 'open' : 'closed') + (isPicked ? ' range-end' : '') + '" data-date="' + dateStr + '">' + d + '</div>';
        }
        html += '</div>';
        container.innerHTML = html;

        container.querySelectorAll('.cal-day.open').forEach(function(cell){
          cell.addEventListener('click', function(){
            pickedDate = cell.getAttribute('data-date');
            selectedStart = pickedDate;
            renderCal();
            recalc();
          });
        });
        document.getElementById('cal-prev').addEventListener('click', function(){ calMonth--; if(calMonth<0){calMonth=11;calYear--;} renderCal(); });
        document.getElementById('cal-next').addEventListener('click', function(){ calMonth++; if(calMonth>11){calMonth=0;calYear++;} renderCal(); });
      }
      renderCal();

      const hoursInput = document.getElementById('hours-input');
      function recalc(){
        const hours = parseInt(hoursInput.value, 10) || 0;
        if (!(selectedStart && hours > 0)) {
          computedTotal = 0;
          clearDetailsBox();
          confirmBtn.disabled = true;
          return;
        }
        computedTotal = updateDetailsBox(hours, hours + ' hour' + (hours===1?'':'s'), null);
        confirmBtn.disabled = false;
      }
      hoursInput.addEventListener('input', recalc);
      recalc();

    } else if (isShortStay) {
      // ---------- Date range (check-in / check-out) ----------
      let calMonth = new Date().getMonth(), calYear = new Date().getFullYear();

      function isRangeValid(start, end){
        let d = new Date(start);
        const endD = new Date(end);
        while (d <= endD) {
          const ds = d.toISOString().slice(0,10);
          if (!openDates.has(ds) || unavailableDates.has(ds)) return false;
          d.setDate(d.getDate() + 1);
        }
        return true;
      }

      function renderCal(){
        const container = document.getElementById('cal-container');
        const monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];
        const firstDay = new Date(calYear, calMonth, 1).getDay();
        const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
        let html = '<div class="cal-header"><div class="cal-title">' + monthNames[calMonth] + ' ' + calYear + '</div>' +
          '<div class="cal-nav"><button type="button" id="cal-prev" aria-label="Previous month"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></button><button type="button" id="cal-next" aria-label="Next month"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></button></div></div>' +
          '<div class="cal-grid">' + ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(function(d){ return '<div class="cal-dow">' + d + '</div>'; }).join('');
        for (let i=0;i<firstDay;i++) html += '<div class="cal-day empty"></div>';
        for (let d=1; d<=daysInMonth; d++) {
          const dateStr = calYear + '-' + String(calMonth+1).padStart(2,'0') + '-' + String(d).padStart(2,'0');
          const isOpen = openDates.has(dateStr) && !unavailableDates.has(dateStr);
          let cls = isOpen ? 'open' : 'closed';
          if (selectedStart && dateStr === selectedStart) cls += ' range-end';
          if (selectedEnd && dateStr === selectedEnd) cls += ' range-end';
          if (selectedStart && selectedEnd && dateStr > selectedStart && dateStr < selectedEnd) cls += ' in-range';
          html += '<div class="cal-day ' + cls + '" data-date="' + dateStr + '">' + d + '</div>';
        }
        html += '</div>';
        container.innerHTML = html;

        container.querySelectorAll('.cal-day.open').forEach(function(cell){
          cell.addEventListener('click', function(){
            const dateStr = cell.getAttribute('data-date');
            if (!selectedStart || (selectedStart && selectedEnd)) {
              selectedStart = dateStr; selectedEnd = null;
            } else if (dateStr > selectedStart) {
              if (isRangeValid(selectedStart, dateStr)) {
                selectedEnd = dateStr;
              } else {
                document.getElementById('range-summary').textContent = 'Some dates in that range aren\'t open — pick a different check-out.';
                selectedStart = dateStr; selectedEnd = null;
              }
            } else {
              selectedStart = dateStr; selectedEnd = null;
            }
            renderCal();
            recalc();
          });
        });
        document.getElementById('cal-prev').addEventListener('click', function(){ calMonth--; if(calMonth<0){calMonth=11;calYear--;} renderCal(); });
        document.getElementById('cal-next').addEventListener('click', function(){ calMonth++; if(calMonth>11){calMonth=0;calYear++;} renderCal(); });
      }
      renderCal();

      function recalc(){
        const summary = document.getElementById('range-summary');
        if (selectedStart && selectedEnd) {
          const nights = Math.round((new Date(selectedEnd) - new Date(selectedStart)) / 86400000);
          summary.textContent = selectedStart + ' → ' + selectedEnd + ' (' + nights + ' night' + (nights===1?'':'s') + ')';
          computedTotal = updateDetailsBox(nights, nights + ' night' + (nights===1?'':'s'), details.cleaning_fee || null);
          confirmBtn.disabled = false;
        } else if (selectedStart) {
          summary.textContent = 'Check-in: ' + selectedStart + ' — now pick a check-out date.';
          computedTotal = 0;
          clearDetailsBox();
          confirmBtn.disabled = true;
        } else {
          summary.textContent = 'No dates selected yet.';
          computedTotal = 0;
          clearDetailsBox();
          confirmBtn.disabled = true;
        }
      }

    } else {
      // ---------- Long-term ----------
      const leaseMonthsInput = document.getElementById('lease-months');
      const leaseStartInput = document.getElementById('lease-start');
      let leaseDatePicked = false;
      function recalc(){
        const months = parseInt(leaseMonthsInput.value, 10) || 0;
        if (!leaseDatePicked || months < 1) {
          computedTotal = 0;
          clearDetailsBox();
          confirmBtn.disabled = true;
          return;
        }
        computedTotal = updateDetailsBox(months, months + ' month' + (months===1?'':'s'), null);
        confirmBtn.disabled = false;
      }
      leaseMonthsInput.addEventListener('input', recalc);
      leaseStartInput.addEventListener('change', function(){ leaseDatePicked = true; recalc(); });
      recalc();
    }

    // ---------- Confirm booking ----------
    confirmBtn.addEventListener('click', async function(){
      confirmBtn.disabled = true;
      confirmBtn.textContent = 'Sending request...';

      const payload = {
        listing_id: listingId,
        host_id: listing.host_id,
        client_id: currentUser.id,
        price_unit: details.price_unit,
        total_price: computedTotal
      };

      if (isShortStay && isHourly) {
        payload.start_date = selectedStart;
        payload.hours = parseInt(document.getElementById('hours-input').value, 10);
      } else if (isShortStay) {
        payload.start_date = selectedStart;
        payload.end_date = selectedEnd;
      } else {
        payload.lease_start_date = document.getElementById('lease-start').value;
        payload.lease_months = parseInt(document.getElementById('lease-months').value, 10);
      }

      const { data: newBooking, error } = await supabaseClient.from('bookings').insert(payload).select('id').single();
      const successMsg = document.getElementById('success-msg');

      if (error) {
        successMsg.textContent = 'Something went wrong: ' + error.message;
        successMsg.classList.add('show', 'error');
        confirmBtn.disabled = false;
        confirmBtn.textContent = 'Book now';
        return;
      }

      // Booking availability is reflected by the next feed revalidation.
      // Retain cards immediately, but ensure a return to Listings does not
      // keep a booking-related state stale past this user action.
      if (window.VaRoomListingFeedCache) window.VaRoomListingFeedCache.invalidateAll();

      await window.VaRoomNotificationAPI.create({
        recipient_user_id: listing.host_id,
        actor_user_id: currentUser.id,
        type: 'booking_request',
        title: 'New booking request',
        message: '"' + (currentUser.full_name || 'A guest') + '" requested to book "' + (listing.title || 'this listing') + '".',
        related_entity_type: 'booking',
        related_entity_id: newBooking ? newBooking.id : null,
        booking_id: newBooking ? newBooking.id : null,
        event_key: 'booking-request:' + (newBooking ? newBooking.id : listingId),
        metadata: {
          listing_id: listingId,
          listing_name: listing.title,
          booking_id: newBooking ? newBooking.id : null,
          client_id: currentUser.id,
          client_name: currentUser.full_name || currentUser.email || 'Guest'
        }
      });

      successMsg.textContent = 'Request sent! The host has 48 hours to respond — you\'ll be notified either way.';
      successMsg.classList.add('show');
      confirmBtn.style.display = 'none';
    });
  })();
</script>

</body>
</html>
