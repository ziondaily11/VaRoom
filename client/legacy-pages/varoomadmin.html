<!DOCTYPE html>
<html lang="en" data-t="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Varoom Admin</title>
<style>
:root{--bg:#0f0d0e;--pn:#1c1819;--p2:#262122;--ln:#332c2d;--tx:#f4f1f1;--mu:#a1979a;--ac:#34d1a4;--rd:#ef6b5b;--am:#f5b942;--bl:#5aa9ff;--sh:none}
[data-t=light]{--bg:#f1f3f8;--pn:#fff;--p2:#f5f6fa;--ln:#e4e7ee;--tx:#1d2433;--mu:#6b7385;--ac:#0f9f7a;--sh:0 1px 4px #1d243318}
*{box-sizing:border-box;margin:0}[hidden]{display:none!important}
body{background:var(--bg);color:var(--tx);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}a{color:var(--ac)}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
aside{background:var(--pn);border-right:1px solid var(--ln);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:16px 12px;z-index:30}
.br{padding:4px 10px 18px;font-weight:700;font-size:18px}.br small{display:block;font-weight:400;font-size:12px;color:var(--mu)}
nav{flex:1;overflow:auto}
nav button,.lo{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;padding:9px 12px;border-radius:8px;color:var(--mu);text-decoration:none;margin-bottom:2px;cursor:pointer;font:inherit}
nav button:hover,.lo:hover{background:var(--p2);color:var(--tx)}
nav button.on{background:var(--ac);color:#06241c;font-weight:600}
nav .n,.ib .n{margin-left:auto;background:var(--rd);color:#fff;border-radius:99px;font-size:11px;padding:0 7px}
main{min-width:0}
.top{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:12px;padding:12px 28px;background:var(--pn);border-bottom:1px solid var(--ln)}
.sr{flex:1;max-width:520px;display:flex;align-items:center;gap:8px;background:var(--p2);border:1px solid var(--ln);border-radius:8px;padding:0 12px;color:var(--mu)}
.sr input{flex:1;min-width:0;background:none;border:0;outline:0;padding:8px 0}
.ib{background:none;border:1px solid var(--ln);border-radius:8px;width:36px;height:36px;display:grid;place-items:center;cursor:pointer;position:relative}
.ib .n{position:absolute;top:-6px;right:-6px;font-size:10px;padding:0 5px}#mb{display:none}
.av{width:34px;height:34px;border-radius:50%;background:var(--ac);color:#06241c;display:grid;place-items:center;font-weight:700}
.wrap{padding:28px;max-width:1400px}
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:22px;flex-wrap:wrap}.ph h1{font-size:26px}.ph p,.sb{color:var(--mu)}.sb{margin-bottom:12px}
.g4{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px;margin-bottom:16px}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px;margin-bottom:16px}
.cd{background:var(--pn);border:1px solid var(--ln);border-radius:12px;padding:18px;box-shadow:var(--sh);min-width:0;margin-bottom:16px}.g2 .cd{margin:0}
.ct{display:flex;justify-content:space-between;margin-bottom:12px}.ct h3{font-size:15px}
.kp{border-radius:12px;padding:18px;color:#fff;display:flex;flex-direction:column;gap:2px;box-shadow:var(--sh)}.kp b{font-size:30px;line-height:1.15}.kp span,.kp small{opacity:.92}
.k1{background:linear-gradient(135deg,#12b886,#0e8a68)}.k2{background:linear-gradient(135deg,#4c9bff,#2f6fe0)}.k3{background:linear-gradient(135deg,#f0657a,#d64562)}.k4{background:linear-gradient(135deg,#f8b64c,#e8862a)}
.ch{width:100%;height:auto}.gl{stroke:var(--ln)}.tk{fill:var(--mu);font-size:11px}.bar,.dot{fill:var(--c)}.ln{fill:none;stroke:var(--c);stroke-width:2.5;stroke-linejoin:round}.ar{fill:var(--c);opacity:.14}
.tb{display:flex;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}.tb .sr{max-width:300px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--mu);font-weight:500;padding:10px 12px;background:var(--p2);cursor:pointer;white-space:nowrap;user-select:none}
th:first-child{border-radius:8px 0 0 8px}th:last-child{border-radius:0 8px 8px 0}
td{padding:11px 12px;border-bottom:1px solid var(--ln);vertical-align:middle}tbody tr[data-i]{cursor:pointer}tbody tr[data-i]:hover{background:var(--p2)}
.em{text-align:center;color:var(--mu);padding:28px}code{font-size:12px;color:var(--mu);word-break:break-all}
.pg{display:flex;justify-content:space-between;align-items:center;margin-top:12px;color:var(--mu);font-size:13px}
.btn{background:var(--p2);border:1px solid var(--ln);border-radius:8px;padding:6px 12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn:hover:not(:disabled){border-color:var(--ac)}.btn:disabled{opacity:.45;cursor:default}
.btn.pr,.btn.on{background:var(--ac);color:#06241c;border-color:var(--ac);font-weight:600}.btn.dn{background:#ef6b5b26;color:var(--rd);border-color:#ef6b5b55}.btn.sm{padding:3px 9px;font-size:12px}
.pl{display:inline-block;padding:1px 9px;border-radius:99px;font-size:12px;background:var(--p2);color:var(--mu);border:1px solid var(--ln)}
.pl.active,.pl.available,.pl.resolved,.pl.published,.pl.paid,.pl.low{background:#34d1a422;color:var(--ac);border-color:#34d1a44d}
.pl.pending,.pl.proposed,.pl.hidden,.pl.open,.pl.medium,.pl.invited,.pl.in-progress{background:#f5b94222;color:var(--am);border-color:#f5b9424d}
.pl.removed,.pl.rejected,.pl.suspended,.pl.high,.pl.unavailable{background:#ef6b5b22;color:var(--rd);border-color:#ef6b5b4d}
.q,.fd{list-style:none;padding:0}.q button{width:100%;text-align:left;background:none;border:0;font:inherit;display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--ln);color:var(--tx);cursor:pointer}
.q b{background:var(--p2);border-radius:99px;padding:0 10px}.q b.hot{background:var(--rd);color:#fff}
.fd li{display:flex;gap:12px;padding:8px 0}.fd i{width:9px;height:9px;border-radius:50%;background:var(--ac);margin-top:6px;flex:none}.fd span,.fd small{display:block;color:var(--mu);font-size:12px;word-break:break-all}
.fn{display:grid;grid-template-columns:130px 1fr 50px;gap:10px;align-items:center;margin:10px 0}.fn i{display:block;height:14px;border-radius:7px;background:var(--ac)}
.nc{background:var(--p2);border:1px solid var(--ln);border-radius:12px;padding:16px;margin-bottom:12px;display:flex;gap:16px;justify-content:space-between;align-items:flex-start}.nc h3{font-size:15px;margin-bottom:4px}.nc small{color:var(--mu)}.nc p{margin-top:6px}
.spl{display:grid;grid-template-columns:340px 1fr;gap:16px;align-items:start}
.spl-list{max-height:74vh;overflow:auto;padding-right:4px}
.tkc{background:var(--pn);border:1px solid var(--ln);border-radius:10px;padding:12px 14px;margin-bottom:10px;cursor:pointer}
.tkc:hover{border-color:var(--ac)}.tkc.sel{border-color:var(--ac);background:var(--p2)}
.tkc h4{font-size:14px;margin-bottom:8px}
.tkc-meta{display:flex;justify-content:space-between;align-items:center;color:var(--mu);font-size:12px;gap:8px}
.spl-detail{background:var(--pn);border:1px solid var(--ln);border-radius:12px;padding:22px;box-shadow:var(--sh)}
.dtop{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.dtop code{font-size:12px;color:var(--mu)}
.spl-detail h3{font-size:20px;margin-bottom:6px}
.cmp{margin-top:20px;border-top:1px solid var(--ln);padding-top:18px}
.cmp>label{display:flex;align-items:center;gap:6px;font-weight:600;color:var(--tx);margin-bottom:6px}
.cmp input,.cmp textarea{display:block;width:100%;background:var(--p2);border:1px solid var(--ln);border-radius:8px;padding:9px;margin:6px 0;font-family:inherit}
.cmp textarea{font-family:ui-monospace,monospace;font-size:12.5px}
.thread{margin:16px 0;display:flex;flex-direction:column;gap:10px}
.rmsg{background:var(--p2);border:1px solid var(--ln);border-radius:8px;padding:10px 12px}
.rmsg b{display:flex;align-items:center;gap:6px;font-size:13px}.rmsg small{color:var(--mu);font-size:11px}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}.ra{display:flex;gap:8px;justify-content:flex-end}
.fm label,.md label{font-size:12px;color:var(--mu)}
.fm input,.fm textarea,.fm select,.md textarea{display:block;width:100%;background:var(--p2);border:1px solid var(--ln);border-radius:8px;padding:9px;margin:4px 0 12px}
.mo{position:fixed;inset:0;background:#0009;display:grid;place-items:center;z-index:50}.md{background:var(--pn);border:1px solid var(--ln);border-radius:12px;padding:22px;width:min(440px,92vw)}.md h3{margin-bottom:6px}.md p{color:var(--mu);margin-bottom:12px}
#dr{position:fixed;top:0;right:0;height:100%;width:min(420px,100vw);background:var(--pn);border-left:1px solid var(--ln);transform:translateX(100%);transition:transform .2s;z-index:40;display:flex;flex-direction:column}#dr.open{transform:none}
.dh{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--ln)}.db{padding:20px;overflow:auto}
dl{display:grid;grid-template-columns:110px 1fr;gap:10px 12px;margin-bottom:16px}dt{color:var(--mu)}dd{margin:0;word-break:break-word}
.ts{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:60}
#lg{min-height:100vh;display:grid;place-items:center;padding:20px}
.lgc{width:100%;max-width:360px;background:var(--pn);border:1px solid var(--ln);border-radius:14px;padding:34px 30px;box-shadow:var(--sh)}
.lgc h1{font-size:20px}.lgc h1 b{color:var(--ac)}.lgc p.sub{color:var(--mu);margin:2px 0 22px}
.lgc label{display:block;font-size:12px;color:var(--mu);margin:14px 0 4px}
.lgc input{width:100%;background:var(--p2);border:1px solid var(--ln);border-radius:8px;padding:10px 12px}
.lgc input:focus{outline:2px solid var(--ac);outline-offset:1px}
.lgc button{width:100%;margin-top:20px;background:var(--ac);color:#06241c;border:0;border-radius:8px;padding:11px;font-weight:600;cursor:pointer}
.lgerr{color:var(--rd);font-size:13px;margin-top:12px}
.lghint{color:var(--mu);font-size:12px;margin-top:18px;text-align:center;line-height:1.5}
@media(max-width:900px){.app{grid-template-columns:1fr}aside{position:fixed;left:0;top:0;transform:translateX(-100%);transition:transform .2s;width:250px}body.nv aside{transform:none}#mb{display:grid}.top{padding:12px 16px}.wrap{padding:16px}.g2{grid-template-columns:1fr}.spl{grid-template-columns:1fr}.spl-list{max-height:none}}
</style>
</head>
<body>
<div id="lg">
<form class="lgc" id="lf">
<h1>Va<b>room</b> Admin</h1>
<p class="sub">Sign in to manage the platform.</p>
<label for="le">Email</label><input id="le" type="email" autocomplete="username" required>
<label for="lp">Password</label><input id="lp" type="password" autocomplete="current-password" required>
<p class="lgerr" id="lerr" hidden></p>
<button type="submit">Sign in</button>

</form>
</div>
<div id="appRoot" hidden>
<div class="app">
<aside><div class="br">Varoom<small>Admin</small></div><nav></nav><button class="lo" id="lo"></button></aside>
<main>
<header class="top"><button class="ib" id="mb" aria-label="Menu"></button><label class="sr" id="sq"><input id="q" placeholder="Search users, listings, tickets…  ( / )"></label><span style="flex:1"></span><button class="ib" id="th" aria-label="Toggle theme"></button><button class="ib" id="bell" aria-label="Needs attention"><span class="n" id="bn"></span></button><div class="av">A</div></header>
<div class="wrap" id="view"></div>
</main>
</div>
<div id="dr"></div>
</div>
<script src="/admin/varoomadmin.js"></script>
</body>
</html>
