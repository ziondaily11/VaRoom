<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Messenger Dashboard</title>
<link rel="stylesheet" href="js/varoom-dark-theme.css">
<style>
  :root{
    --rail-bg:#14161c;
    --mint:#4ec1a0;
    --mint-dark:#25876e;
    --mint-pale-2:#dbf4ea;
    --text-dark:#1f2937;
    --text-gray:#71798a;
    --text-gray-2:#4b5563;
    --border:#e2e5ea;
    --bg-soft:#f6f7f9;
    --white:#ffffff;
    --radius-lg:26px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    background:var(--white);
    min-height:100vh;
    display:flex;
    align-items:stretch;
    justify-content:center;
    padding:0;
    overflow:hidden;
  }
  svg.icon{ width:1em; height:1em; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; display:block; }
  svg.icon-fill{ width:1em; height:1em; fill:currentColor; stroke:none; display:block; }

  .app-shell{
    width:100vw;
    height:100vh;
    background:var(--white);
    display:flex;
    overflow:hidden;
  }

  /* ---------- ICON RAIL ---------- */
  .icon-rail{
    width:78px;
    background:var(--rail-bg);
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:26px 0;
    flex-shrink:0;
  }
  .rail-btn{
    width:44px; height:44px;
    border:none; border-radius:13px;
    background:transparent;
    color:#aab0bc;
    font-size:19px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    transition:background .15s, color .15s;
  }
  .rail-btn:hover{ color:#ffffff; background:rgba(255,255,255,0.08); }
  .rail-btn.active{ background:var(--white); color:var(--rail-bg); }
  .icon-rail .menu-btn{ margin-bottom:36px; color:#e2e5ea; font-size:20px; }
  .rail-icons{ display:flex; flex-direction:column; gap:16px; }
  .icon-rail .settings-btn{ margin-top:auto; color:#e2e5ea; }

  /* ---------- CONTACTS COLUMN ---------- */
  .contacts-col{
    width:318px;
    flex-shrink:0;
    border-right:1px solid var(--border);
    display:flex;
    flex-direction:column;
    min-width:0;
  }
  .search-bar{
    display:flex; align-items:center; gap:10px;
    padding:22px 20px 14px 20px;
  }
  .search-box{
    flex:1;
    display:flex; align-items:center; gap:10px;
    background:var(--bg-soft);
    border-radius:12px;
    padding:10px 14px;
  }
  .search-box svg{ color:var(--text-gray-2); font-size:15px; flex-shrink:0; }
  .search-box input{
    border:none; background:transparent; outline:none;
    font-size:13.5px; color:var(--text-dark); width:100%;
    font-family:inherit;
  }
  .search-box input::placeholder{ color:var(--text-gray); }
  .compose-btn{
    width:36px; height:36px; border-radius:10px; border:1px solid var(--border);
    background:var(--white); color:var(--text-gray-2);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; flex-shrink:0; font-size:15px;
  }

  .contact-list{
    list-style:none;
    overflow-y:auto;
    padding:6px 12px 16px 12px;
    display:flex; flex-direction:column; gap:2px;
  }
  .contact-item{
    display:flex; gap:12px;
    padding:11px 10px;
    border-radius:14px;
    cursor:pointer;
    align-items:flex-start;
  }
  .contact-item:hover{ background:var(--bg-soft); }
  .contact-item.active{ background:#e6f8f0; }
  .avatar-wrap{ position:relative; flex-shrink:0; }
  .avatar-fallback{
    width:46px; height:46px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    color:#fff; font-weight:700; font-size:14px; letter-spacing:.3px;
  }
  .status-dot{
    position:absolute; right:0; bottom:0;
    width:11px; height:11px; border-radius:50%;
    border:2px solid var(--white);
    background:#c7cbd1;
  }
  .status-dot.online{ background:var(--mint); }
  .contact-body{ flex:1; min-width:0; }
  .contact-top{ display:flex; justify-content:space-between; align-items:baseline; gap:6px; }
  .contact-name{ font-size:13.5px; font-weight:700; color:var(--text-dark); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .contact-time{ font-size:10.5px; color:var(--text-gray); white-space:nowrap; flex-shrink:0; }
  .contact-bottom{ display:flex; justify-content:space-between; align-items:center; gap:6px; margin-top:3px; }
  .contact-preview{ font-size:12px; color:var(--text-gray-2); overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:1; -webkit-box-orient:vertical; line-height:1.35; }
  .conversation-menu{ display:none; }
  .contact-item.active .contact-preview{ color:var(--mint-dark); font-weight:600; }
  .badge{
    flex-shrink:0; min-width:18px; height:18px; border-radius:50%;
    background:#e6e8eb; color:var(--text-gray-2);
    font-size:10px; font-weight:700;
    display:flex; align-items:center; justify-content:center; padding:0 4px;
  }

  /* ---------- CHAT COLUMN ---------- */
  .chat-col{
    flex:1; min-width:0;
    display:flex; flex-direction:column;
    background:var(--white);
  }
  .chat-header{
    display:flex; align-items:center; justify-content:space-between;
    padding:20px 28px;
    border-bottom:1px solid var(--border);
    flex-shrink:0;
  }
  .chat-header-name{ font-size:15.5px; font-weight:700; color:var(--text-dark); }
  .chat-header-status{ display:flex; align-items:center; gap:6px; margin-top:4px; font-size:11.5px; color:var(--text-gray); }
  .chat-header-status .dot{ width:7px; height:7px; border-radius:50%; background:var(--mint); }
  .mobile-back{ display:none; }
  .chat-header-avatar-wrap{ display:none; }
  .chat-header-identity{ display:flex; align-items:center; gap:10px; }
  .chat-header-actions{ display:flex; gap:10px; }
  .chat-header-actions button{
    width:38px; height:38px; border-radius:12px; border:1px solid var(--border);
    background:var(--bg-soft); color:var(--text-dark); font-size:15px;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .chat-header-actions button:hover{ background:#eef0f3; }
  .chat-header-actions button.active{ background:#e6f8f0; color:var(--mint-dark); }

  .messages{
    flex:1; overflow-y:auto;
    padding:24px 28px;
    display:flex; flex-direction:column; gap:16px;
  }
  .msg-row{ display:flex; flex-direction:column; max-width:58%; }
  .msg-row.in{ align-self:flex-start; align-items:flex-start; }
  .msg-row.out{ align-self:flex-end; align-items:flex-end; }
  .msg-row.system{ align-self:flex-start; max-width:80%; }
  .bubble{ padding:12px 16px; font-size:14px; line-height:1.5; color:var(--text-dark); font-weight:500; }
  .msg-row.in .bubble{ background:#eef0f3; border-radius:4px 16px 16px 16px; }
  .msg-row.out .bubble{ background:#c9f0dd; border-radius:16px 4px 16px 16px; }
  .msg-row.system .bubble{ background:var(--bg-soft); color:var(--text-gray-2); font-style:italic; font-weight:400; border-radius:12px; }
  .msg-sender{ font-size:11.5px; font-weight:700; color:var(--text-gray-2); margin:0 4px 5px; }
  .msg-meta{ font-size:11px; color:var(--text-gray-2); margin-top:5px; padding:0 4px; font-weight:500; }

  .file-card{
    display:flex; align-items:center; gap:12px;
    background:var(--white); border:1px solid var(--border);
    border-radius:14px; padding:10px 14px; min-width:230px;
  }
  .file-card .file-icon{
    width:34px; height:34px; border-radius:9px; flex-shrink:0;
    background:#eaf1ff; color:#3b6fe0;
    display:flex; align-items:center; justify-content:center; font-size:16px;
  }
  .file-card .file-name{ font-size:13px; font-weight:700; color:var(--text-dark); }
  .file-card .file-sub{ font-size:11px; color:var(--text-gray-2); margin-top:2px; }
  .file-card .dl{ margin-left:auto; color:var(--text-gray-2); font-size:15px; }

  .voice-card{
    display:flex; align-items:center; gap:10px;
    background:var(--bg-soft); border-radius:16px; padding:10px 16px 10px 10px;
    min-width:230px;
  }
  .voice-card .play{
    width:32px; height:32px; border-radius:50%; background:var(--mint);
    color:var(--white); display:flex; align-items:center; justify-content:center;
    font-size:12px; flex-shrink:0; cursor:pointer;
  }
  .voice-wave{ flex:1; display:flex; align-items:center; gap:2px; height:22px; }
  .voice-wave span{ width:2.5px; background:#9aa3b1; border-radius:2px; }
  .voice-dur{ font-size:11.5px; color:var(--text-gray-2); font-weight:600; flex-shrink:0; }

  .chat-input-area{ padding:16px 28px 20px 28px; border-top:1px solid var(--border); flex-shrink:0; }
  .chat-input-area textarea{
    width:100%; border:none; outline:none; resize:none;
    font-family:inherit; font-size:13.5px; color:var(--text-dark);
    height:22px; line-height:22px;
  }
  .chat-input-area textarea::placeholder{ color:var(--text-gray); }
  .desktop-composer-editor{ display:none; }
  @media (min-width:761px){
    .chat-input-area textarea{ display:none; }
    .desktop-composer-editor{
      display:block; width:100%; min-height:22px; max-height:112px;
      overflow-y:auto; outline:none; border:0;
      font-family:inherit; font-size:13.5px; line-height:22px;
      color:var(--text-dark); white-space:pre-wrap; overflow-wrap:anywhere;
    }
    .desktop-composer-editor:empty::before{
      content:attr(data-placeholder); color:var(--text-gray); pointer-events:none;
    }
    .desktop-composer-editor ul,.desktop-composer-editor ol{
      margin:0 0 0 20px; padding:0;
    }
  }
  .input-toolbar{ display:flex; justify-content:space-between; align-items:center; margin-top:12px; }
  .format-icons, .attach-icons{ display:flex; align-items:center; gap:8px; }
  .format-icons button, .attach-icons button{
    width:32px; height:32px; border-radius:9px;
    background:var(--bg-soft); border:none; color:var(--text-dark);
    font-size:14px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .format-icons button:hover, .attach-icons button:hover{ background:#eaecef; }
  .attach-icons button[title="Share listing"]{ background:var(--mint); color:var(--white); }
  .attach-icons button[title="Share listing"]:hover{ background:var(--mint-dark); }
  .format-icons .divider{ width:1px; height:18px; background:var(--border); margin:0 4px; }
  .fmt-b{ font-weight:800; font-size:13px; }
  .fmt-i{ font-style:italic; font-weight:700; font-size:13px; }
  .fmt-u{ text-decoration:underline; font-weight:700; font-size:13px; }

  /* ---------- INFO COLUMN ---------- */
  .info-col{
    width:296px; flex-shrink:0;
    border-left:1px solid var(--border);
    overflow-y:auto;
    padding:22px 22px 28px 22px;
    transition:width .2s ease, padding .2s ease, opacity .15s ease;
  }
  .info-col.collapsed{
    width:0; padding-left:0; padding-right:0; opacity:0;
    border-left:none; overflow:hidden;
  }
  .info-title-row{ display:flex; align-items:center; justify-content:space-between; margin-bottom:22px; }
  .chat-settings-panel-head{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    min-height:54px; padding:0 12px 0 18px; border-bottom:1px solid var(--border);
    color:var(--text-dark); font-size:14.5px; font-weight:700;
  }
  .chat-settings-frame{ display:block; width:100%; height:calc(100% - 54px); border:0; background:transparent; }
  .info-close-btn{
    width:28px; height:28px; border-radius:9px; border:none;
    background:var(--bg-soft); color:var(--text-gray-2); font-size:13px;
    display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0;
  }
  .info-close-btn:hover{ background:#eaecef; }
  .info-title{ font-size:14.5px; font-weight:700; color:var(--text-dark); }
  .profile-block{ text-align:center; margin-bottom:8px; }
  .profile-block .avatar-fallback{ width:92px; height:92px; font-size:26px; margin:0 auto; }
  .profile-block .p-name{ font-size:15px; font-weight:700; color:var(--text-dark); margin-top:14px; }
  .profile-block .p-line{ font-size:11.5px; color:var(--text-gray-2); margin-top:5px; }

  .info-section{ margin-top:26px; }
  .info-section-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
  .info-section-head span.label{ font-size:13px; font-weight:700; color:var(--text-dark); }
  .info-section-head span.more{ font-size:11px; color:var(--mint-dark); font-weight:600; cursor:pointer; }

  .media-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:7px; }
  .media-grid .thumb{ position:relative; aspect-ratio:1/1; border-radius:10px; overflow:hidden; display:flex; align-items:center; justify-content:center; color:#fff; font-size:18px; }
  .media-grid .thumb .more-overlay{
    position:absolute; inset:0; background:rgba(20,22,27,0.55);
    color:var(--white); font-size:13px; font-weight:700;
    display:flex; align-items:center; justify-content:center;
  }

  .file-row{ display:flex; align-items:center; gap:11px; padding:7px 0; }
  .file-row .f-icon{ width:34px; height:34px; border-radius:9px; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:15px; }
  .file-row .f-name{ font-size:12.5px; font-weight:700; color:var(--text-dark); }
  .file-row .f-sub{ font-size:10.5px; color:var(--text-gray); margin-top:2px; }
  .file-row .f-dl{ margin-left:auto; color:var(--text-gray-2); font-size:15px; cursor:pointer; }

  .link-row{ display:flex; align-items:center; gap:11px; padding:7px 0; }
  .link-row .link-thumb{ width:40px; height:40px; border-radius:9px; flex-shrink:0; display:flex; align-items:center; justify-content:center; color:#fff; font-size:15px; }
  .link-row .l-title{ font-size:12.5px; font-weight:700; color:var(--text-dark); }
  .link-row .l-sub{ font-size:10.5px; color:var(--text-gray); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:170px; }

  .contact-list::-webkit-scrollbar, .messages::-webkit-scrollbar, .info-col::-webkit-scrollbar{ width:5px; }
  .contact-list::-webkit-scrollbar-thumb, .messages::-webkit-scrollbar-thumb, .info-col::-webkit-scrollbar-thumb{ background:#e3e5e9; border-radius:10px; }
  .inbox-empty-state{
    list-style:none; padding:28px 16px; color:var(--text-gray);
    text-align:center;
  }
  .inbox-empty-state strong{
    display:block; color:var(--text-dark); font-size:13px; font-weight:700;
    margin-bottom:6px;
  }
  .inbox-empty-state span{ display:block; font-size:12px; line-height:1.5; }
  .messages.empty-state{
    align-items:center; justify-content:center; text-align:center;
    padding:32px;
  }
  .chat-empty-state{ max-width:360px; }
  .chat-empty-state h2{
    color:var(--text-dark); font-size:18px; line-height:1.35; font-weight:700;
  }
  .chat-empty-state p{
    color:var(--text-gray); font-size:13.5px; line-height:1.55; margin-top:8px;
  }
  .chat-col.empty-conversation .chat-input-area{ display:none; }
  .chat-col.empty-conversation .chat-header-actions #infoToggleBtn{ display:none; }
  [data-theme="dark"] .contacts-col,
  [data-theme="dark"] .chat-col,
  [data-theme="dark"] .info-col,
  [data-theme="dark"] .chat-header,
  [data-theme="dark"] .chat-input-area,
  [data-theme="dark"] .search-box,
  [data-theme="dark"] .compose-btn{
    background:var(--white); border-color:var(--line);
  }
  [data-theme="dark"] .inbox-empty-state strong,
  [data-theme="dark"] .chat-empty-state h2,
  [data-theme="dark"] .contact-name,
  [data-theme="dark"] .chat-header-name,
  [data-theme="dark"] .info-title,
  [data-theme="dark"] .info-section-head span.label{ color:var(--ink); }
  [data-theme="dark"] .inbox-empty-state span,
  [data-theme="dark"] .chat-empty-state p{ color:var(--muted); }

  @media (max-width:1080px){ .info-col{ display:none; } }

  /* =====================================================================
     MOBILE ONLY  (max-width:760px)
     Everything below is scoped to this query. Desktop is not affected.
     ===================================================================== */
  @media (max-width:760px){
    body{ overflow:hidden; }
    body,.app-shell{ background:#ffffff; color:#111827; }
    .icon-rail{ display:none; }

    /* App shell tracks the VISUAL viewport (set by JS) so the composer sits
       right above the on-screen keyboard. Falls back to 100dvh without JS. */
    .app-shell{
      position:fixed; top:var(--vv-top,0px); left:0;
      width:100%; height:var(--vvh,100dvh);
    }

    .contacts-col{ display:flex; width:100%; border-right:0; background:#ffffff; color:var(--text-dark); box-shadow:inset 0 0 0 1px var(--border); }
    .contacts-col.mobile-hidden{ display:none; }
    .search-bar{ padding:16px; background:#ffffff; }
    .search-box{ height:40px; background:#ffffff; border:1px solid #46515d; border-radius:20px; padding:8px 14px; }
    .search-box svg{ color:var(--text-gray-2); font-size:16px; }
    .search-box input,.search-box input::placeholder{ color:var(--text-dark); }
    .search-box input::placeholder{ color:var(--text-gray); }
    .compose-btn{ width:40px; height:40px; border-radius:50%; background:var(--mint); border-color:var(--mint); color:var(--rail-bg); }
    .search-box{ transition:border-color .15s; }
    .search-box:focus-within{ border-color:var(--mint); }
    .contact-list{ padding:0 10px calc(16px + 5.1rem); background:#ffffff; }
    .inbox-empty-state{ padding:44px 22px; }
    .messages.empty-state{ padding:28px 20px; }
    .contact-item{ min-height:74px; padding:12px 10px; border-bottom:0; border-radius:0; }
    .contact-item:hover,.contact-item.active{ background:transparent; }
    .contact-item:active{ background:#111820; }
    .contact-item .status-dot{ border-color:#050708; }
    .contact-item .badge{ background:var(--mint); color:var(--rail-bg); font-weight:800; }
    .contact-name,.mobile-inbox-title{ color:var(--text-dark); }
    .contact-name{ max-width:100%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-size:14px; }
    .contact-preview{ color:var(--text-gray-2); }
    .contact-time{ color:var(--text-gray); font-size:11px; }
    .contact-preview{ display:block; max-width:100%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-size:12.5px; }
    .contact-time{ flex-shrink:0; white-space:nowrap; }
    .conversation-menu{
      display:flex; flex:0 0 32px; width:32px; height:32px; margin-left:2px;
      align-items:center; justify-content:center; border:0; border-radius:50%;
      background:transparent; color:var(--text-gray-2); cursor:pointer;
    }
    .conversation-menu:active,.conversation-menu:focus-visible{ background:#eef0f3; outline:none; }
    .contact-item .avatar-wrap{ margin-right:2px; }
    .contact-body{ min-width:0; }
    .contact-top,.contact-bottom{ min-width:0; }
    .chat-col{ display:none; width:100%; background:#ffffff; }
    .chat-col.mobile-visible{
      display:flex; width:100%; height:100%; min-height:0; overflow:hidden;
    }
    .chat-header{ padding:14px 12px; background:#ffffff; border-bottom-color:var(--border); }
    .mobile-back{ display:flex; color:#0b0b0c; }
    .chat-header-avatar-wrap{ display:block; position:relative; }
    .chat-header-avatar-wrap .avatar-fallback{ width:38px; height:38px; font-size:13px; }
    .chat-header-avatar-wrap .status-dot{ width:9px; height:9px; border:2px solid #fff; }
    .chat-header-identity{ flex:1; flex-direction:column; align-items:center; gap:2px; }
    .chat-header-identity .chat-header-name{ color:#0b0b0c; font-size:13px; }
    .chat-header-identity .chat-header-status{ display:none; }
    .chat-header-actions button[title="Search"],
    .chat-header-actions #infoToggleBtn{ display:none; }
    .chat-header-actions button[title="More"]{
      display:flex; background:transparent; border:none; color:#0b0b0c;
    }
    .chat-header-actions{ gap:6px; }
    .chat-header::before{ content:none; }
    .messages{ padding:16px 14px; background:#fbfbfc; gap:14px; }
    .messages{ min-height:0; overscroll-behavior:contain; }
    .msg-row{ max-width:80%; }
    .chat-message-image,.chat-listing-card{ max-width:100%; }
    .msg-row.out .bubble{ background:var(--rail-bg); color:#ffffff; }
    .msg-row.in .bubble{ background:#edeef0; color:#1c1c1e; }
    .msg-row.system .bubble{ background:#f1f1f3; }
    .msg-sender{ color:#8e8e93; }
    .msg-meta{ color:#6f737a; font-size:11.5px; }
    .voice-card{ background:#edeef0; }
    .voice-card .play{ background:var(--rail-bg); }
    .voice-wave span{ background:#1c1c1e; }

    /* ---------- MOBILE COMPOSER (WhatsApp-style interaction) ----------
       Row 1: notice   Row 2: attachment tray   Row 3: [ sticker | text | clip ]  (send)
       The rounded "pill" is drawn by ::before behind columns 1-3, so the
       existing desktop markup order is untouched.                              */
    .chat-input-area{
      position:relative;
      display:grid;
      grid-template-columns:40px minmax(0,1fr) 40px 52px;
      grid-template-rows:auto auto auto;
      align-items:end;
      column-gap:0;
      flex:0 0 auto;
      margin:0;
      border:0;
      background:#fbfbfc;
      padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));
    }
    /* keyboard is open: small visible gap between composer and keyboard */
    .app-shell.kb-open .chat-input-area{ padding-bottom:8px; }

    .chat-input-area::before{
      content:""; grid-column:1 / 4; grid-row:3; align-self:stretch; z-index:0;
      background:#ffffff; border:1px solid var(--border); border-radius:24px;
      box-shadow:0 1px 2px rgba(20,22,28,.05);
      pointer-events:none; transition:border-color .15s;
    }
    .chat-input-area:focus-within::before{ border-color:var(--mint); }

    .chat-input-area textarea{
      grid-column:2; grid-row:3; align-self:end; z-index:1;
      width:100%; min-width:0; min-height:44px; height:44px; max-height:min(132px,30dvh);
      padding:11px 0; margin:0; border:0; outline:none; resize:none;
      background:transparent; color:#1c1c1e;
      font-size:16px;              /* 16px stops iOS Safari zooming the page on focus */
      line-height:22px;
      overflow-y:hidden;
      -webkit-appearance:none; appearance:none;
    }
    .chat-input-area textarea::placeholder{ color:#9a9aa0; }

    .input-toolbar{ display:contents; }
    .format-icons{ display:none; }
    .attach-icons{ display:contents; }
    .attach-icons button.share-photo,
    .attach-icons button.share-file,
    .attach-icons button[title="Share listing"]{ display:none; }

    .attach-icons .mobile-plus,
    .attach-icons .mobile-attach{
      display:flex; align-items:center; justify-content:center; z-index:1;
      width:40px; height:44px; padding:0; border:0; border-radius:50%;
      background:transparent; color:var(--text-gray-2); font-size:21px; cursor:pointer;
      -webkit-tap-highlight-color:transparent; touch-action:manipulation;
    }
    .attach-icons .mobile-plus{ grid-column:1; grid-row:3; align-self:end; }
    .attach-icons .mobile-attach{ grid-column:3; grid-row:3; align-self:end; }
    .attach-icons .mobile-plus:active,
    .attach-icons .mobile-attach:active,
    .attach-icons .mobile-attach[aria-expanded="true"]{ color:var(--mint-dark); }

    .attach-icons .send-message{
      display:flex; align-items:center; justify-content:center;
      grid-column:4; grid-row:3; justify-self:end; align-self:end;
      width:44px; height:44px; padding:0; border:0; border-radius:50%;
      background:#e6e8eb; color:#9aa0ab; font-size:19px; cursor:default;
      transition:background .15s,color .15s,transform .1s;
      -webkit-tap-highlight-color:transparent; touch-action:manipulation;
    }
    .chat-input-area.can-send .attach-icons .send-message{ background:var(--mint); color:var(--rail-bg); cursor:pointer; }
    .chat-input-area.can-send .attach-icons .send-message:active{ transform:scale(.93); }
    .attach-icons .mobile-plus:focus-visible,
    .attach-icons .mobile-attach:focus-visible,
    .attach-icons .send-message:focus-visible{ outline:2px solid var(--mint-dark); outline-offset:2px; }

    /* notice (e.g. "Only photos can be attached") */
    .composer-note{
      grid-column:1 / -1; grid-row:1; justify-self:start; max-width:100%;
      margin:0 0 8px; padding:7px 12px; border-radius:12px;
      background:#fff4e0; color:#8a5a00; font-size:12.5px; font-weight:600; line-height:1.35;
    }
    .composer-note[hidden]{ display:none; }

    /* pending attachments */
    .composer-tray{
      grid-column:1 / -1; grid-row:2; min-width:0;
      display:flex; gap:8px; overflow-x:auto; overflow-y:hidden;
      padding:2px 2px 10px; margin:0;
      -webkit-overflow-scrolling:touch; scrollbar-width:none;
    }
    .composer-tray::-webkit-scrollbar{ display:none; }
    .composer-tray[hidden]{ display:none; }
    .composer-thumb,.composer-file{ position:relative; flex:0 0 auto; height:60px; border-radius:12px; }
    .composer-thumb{ width:60px; overflow:hidden; background:#eef0f3; }
    .composer-thumb img{ width:100%; height:100%; object-fit:cover; display:block; }
    .composer-file{
      display:flex; align-items:center; gap:8px; max-width:210px; padding:0 30px 0 10px;
      background:#ffffff; border:1px solid var(--border);
    }
    .composer-file-ico{
      width:32px; height:32px; border-radius:9px; flex-shrink:0;
      background:#eaf1ff; color:#3b6fe0; font-size:16px;
      display:flex; align-items:center; justify-content:center;
    }
    .composer-file-meta{ min-width:0; display:flex; flex-direction:column; gap:2px; }
    .composer-file-name{ font-size:12.5px; font-weight:700; color:var(--text-dark); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .composer-file-size{ font-size:10.5px; color:var(--text-gray); }
    .composer-rm{
      position:absolute; top:4px; right:4px; width:22px; height:22px; padding:0;
      display:flex; align-items:center; justify-content:center;
      border:0; border-radius:50%; background:rgba(20,22,28,.72); color:#ffffff; font-size:12px; cursor:pointer;
      -webkit-tap-highlight-color:transparent;
    }
    .composer-rm::after{ content:""; position:absolute; inset:-9px; }   /* larger tap area */

    /* host attachment menu (photos / files / listing) */
    .mobile-attach-menu{
      position:absolute; right:10px; bottom:calc(100% + 6px); z-index:30;
      display:flex; flex-direction:column; gap:2px;
      min-width:200px; max-width:calc(100vw - 20px); padding:6px;
      background:#ffffff; border:1px solid var(--border); border-radius:18px;
      box-shadow:0 10px 30px rgba(20,22,28,.16);
    }
    .mobile-attach-menu[hidden]{ display:none; }
    .mobile-attach-item{
      display:flex; align-items:center; gap:12px; width:100%; min-height:48px; padding:0 12px 0 8px;
      border:0; border-radius:12px; background:transparent; color:var(--text-dark);
      font:inherit; font-size:14px; font-weight:600; text-align:left; cursor:pointer;
      -webkit-tap-highlight-color:transparent; touch-action:manipulation;
    }
    .mobile-attach-item:active{ background:var(--bg-soft); }
    .mobile-attach-item .ico{
      width:34px; height:34px; border-radius:50%; flex-shrink:0; font-size:17px;
      display:flex; align-items:center; justify-content:center;
    }
    .mobile-attach-item .ico-photos{ background:var(--mint-pale-2); color:var(--mint-dark); }
    .mobile-attach-item .ico-files{ background:#eaf1ff; color:#3b6fe0; }
    .mobile-attach-item .ico-listing{ background:#fff4e0; color:#b7791f; }

    .mobile-preview{
      grid-column:1 / -1; grid-row:2; width:100%; min-width:0;
      margin:0 0 8px;
    }

    /* very small phones */
    @media (max-width:360px){
      .messages{ padding:14px 10px; }
      .chat-input-area{
        grid-template-columns:36px minmax(0,1fr) 36px 48px;
        padding-left:8px; padding-right:8px;
      }
      .attach-icons .mobile-plus,
      .attach-icons .mobile-attach{ width:36px; font-size:20px; }
      .attach-icons .send-message{ width:40px; height:40px; }
      .composer-file{ max-width:170px; }
      .mobile-attach-menu{ right:8px; }
    }

    .info-col.mobile-visible{
      display:block; width:100%; border-left:0; padding:16px; background:#ffffff; color:var(--text-dark);
    }
    .info-title-row{ border-bottom-color:var(--border); }
    .info-title,.p-name,.p-line,.info-section .label{ color:var(--text-dark); }
    .info-col.mobile-visible .p-line{ color:var(--text-gray-2); }
    .info-col.mobile-visible .info-section-head span.more{ color:var(--mint-dark); }
    .info-col.mobile-visible .file-row .f-name,
    .info-col.mobile-visible .link-row .l-title{ color:var(--text-dark); }
    .info-col.mobile-visible .file-row .f-sub,
    .info-col.mobile-visible .link-row .l-sub{ color:var(--text-gray); }
    .info-col.mobile-visible .file-row .f-dl{ color:var(--text-gray-2); }
    .info-col.mobile-visible .info-close-btn{ display:flex; }
    .mobile-inbox-title{
      display:flex; align-items:center; justify-content:space-between;
      padding:14px 16px 10px; font-size:20px; line-height:24px;
      font-weight:600; color:var(--text-dark);
    }
    .mobile-chat-settings{
      width:40px; height:40px; display:flex; align-items:center; justify-content:center;
      border:0; border-radius:50%; background:transparent; color:var(--text-dark);
      cursor:pointer;
    }
    .mobile-chat-settings .icon{ width:3em; height:3em; }
    .mobile-chat-settings:active,.mobile-chat-settings:focus-visible{ background:#eef0f3; outline:none; }
    .mobile-back{ display:flex; align-items:center; justify-content:center; border:0; background:transparent; cursor:pointer; }
    .mobile-back{ width:40px; height:40px; padding:0; color:#0b0b0c; }
    .chat-header-actions button[title="More"]{ width:40px; height:40px; }

    [data-theme="dark"] .search-box,
    [data-theme="dark"] .chat-col.mobile-visible,
    [data-theme="dark"] .info-col.mobile-visible{ background:var(--white); }
    [data-theme="dark"] .messages{ background:var(--paper); }
    [data-theme="dark"] .chat-input-area{ background:var(--paper,#fbfbfc); border-color:transparent; }
    [data-theme="dark"] .chat-input-area::before{ background:var(--white,#ffffff); border-color:var(--line,#e2e5ea); }
    [data-theme="dark"] .chat-input-area textarea{ color:var(--ink,#1c1c1e); }
    [data-theme="dark"] .attach-icons .mobile-plus,
    [data-theme="dark"] .attach-icons .mobile-attach{ color:var(--muted,#4b5563); }
    [data-theme="dark"] .mobile-attach-menu,
    [data-theme="dark"] .composer-file{ background:var(--white,#ffffff); border-color:var(--line,#e2e5ea); }
    [data-theme="dark"] .mobile-attach-item,
    [data-theme="dark"] .composer-file-name{ color:var(--ink,#1f2937); }

    [data-theme="dark"] .contacts-col:not(.mobile-hidden){
      background:var(--paper) !important;
      color:var(--ink);
      box-shadow:inset 0 0 0 1px var(--line);
    }
    [data-theme="dark"] .contacts-col:not(.mobile-hidden) .mobile-inbox-title{
      color:var(--ink);
    }
    [data-theme="dark"] .contacts-col:not(.mobile-hidden) .mobile-chat-settings{
      color:var(--ink);
    }
    [data-theme="dark"] .contacts-col:not(.mobile-hidden) .mobile-chat-settings:active,
    [data-theme="dark"] .contacts-col:not(.mobile-hidden) .mobile-chat-settings:focus-visible{
      background:rgba(255,255,255,.08);
    }
    [data-theme="dark"] .contacts-col:not(.mobile-hidden) .search-box{
      background:var(--white);
      border-color:var(--line);
    }
    [data-theme="dark"] .contacts-col:not(.mobile-hidden) .search-box svg,
    [data-theme="dark"] .contacts-col:not(.mobile-hidden) .search-box input{
      color:var(--ink);
    }
    [data-theme="dark"] .contacts-col:not(.mobile-hidden) .search-box input::placeholder{
      color:var(--muted);
      opacity:1;
    }
    [data-theme="dark"] .contacts-col:not(.mobile-hidden) .compose-btn{
      color:var(--paper);
    }
    [data-theme="dark"] .contacts-col:not(.mobile-hidden) .contact-list{
      background:var(--paper);
    }
    [data-theme="dark"] .contacts-col:not(.mobile-hidden) .contact-item{
      border-bottom:1px solid var(--line-soft);
    }
    [data-theme="dark"] .contacts-col:not(.mobile-hidden) .contact-name{
      color:var(--ink);
    }
    [data-theme="dark"] .contacts-col:not(.mobile-hidden) .contact-preview,
    [data-theme="dark"] .contacts-col:not(.mobile-hidden) .contact-time{
      color:var(--muted);
    }
    [data-theme="dark"] .contacts-col:not(.mobile-hidden) .conversation-menu{
      color:var(--muted);
    }
    [data-theme="dark"] .contacts-col:not(.mobile-hidden) .conversation-menu:active,
    [data-theme="dark"] .contacts-col:not(.mobile-hidden) .conversation-menu:focus-visible{
      background:rgba(255,255,255,.08);
    }
    [data-theme="dark"] .contacts-col:not(.mobile-hidden) .inbox-empty-state strong{
      color:var(--ink);
    }
    [data-theme="dark"] .contacts-col:not(.mobile-hidden) .inbox-empty-state span{
      color:var(--muted);
    }

    .mobile-back .icon{ width:18px; height:18px; }
    .mobile-preview{ display:none; border:1px solid var(--border); border-radius:10px; padding:8px; color:var(--text-dark); font-size:12px; }
    .mobile-preview.has-content{ display:block; }
  }
  @media (min-width:761px){
    .mobile-inbox-title{ display:none; }
    .mobile-plus{ display:none !important; }
    .mobile-preview{ display:none !important; }
    .mobile-attach,.mobile-attach-menu,.composer-tray,.composer-note{ display:none !important; }
  }

  /* Dark chat uses the app canvas, but retains enough contrast for the
     conversation hierarchy. These tokens deliberately override the light
     messenger defaults above instead of inheriting them into dark mode. */
  [data-theme="dark"]{
    --rail-bg:#121010;
    --mint:#55c6a5;
    --mint-dark:#92e1c8;
    --mint-pale-2:rgba(85,198,165,.16);
    --text-dark:#F5EFEC;
    --text-gray:rgba(245,239,236,.58);
    --text-gray-2:rgba(245,239,236,.72);
    --border:rgba(255,255,255,.12);
    --bg-soft:#171313;
    --white:#0F0D0D;
  }
  [data-theme="dark"] body,
  [data-theme="dark"] .app-shell,
  [data-theme="dark"] .contacts-col,
  [data-theme="dark"] .chat-col,
  [data-theme="dark"] .info-col,
  [data-theme="dark"] .chat-header,
  [data-theme="dark"] .chat-input-area,
  [data-theme="dark"] .messages { background:#0F0D0D !important; color:var(--text-dark); }
  [data-theme="dark"] .icon-rail { background:#121010; border-right:1px solid var(--border); }
  [data-theme="dark"] .rail-btn { color:var(--text-gray); }
  [data-theme="dark"] .rail-btn:hover { color:var(--text-dark); background:rgba(255,255,255,.06); }
  [data-theme="dark"] .rail-btn.active { background:rgba(196,30,58,.18); color:var(--text-dark); }
  [data-theme="dark"] .search-box,
  [data-theme="dark"] .compose-btn,
  [data-theme="dark"] .chat-header-actions button,
  [data-theme="dark"] .format-icons button,
  [data-theme="dark"] .attach-icons button,
  [data-theme="dark"] .info-close-btn { background:#171313; border-color:var(--border); color:var(--text-dark); }
  [data-theme="dark"] .search-box input,
  [data-theme="dark"] .chat-input-area textarea,
  [data-theme="dark"] .desktop-composer-editor { color:var(--text-dark); }
  [data-theme="dark"] .search-box input::placeholder,
  [data-theme="dark"] .chat-input-area textarea::placeholder,
  [data-theme="dark"] .desktop-composer-editor:empty::before { color:var(--text-gray); }
  [data-theme="dark"] .contact-item:hover { background:rgba(255,255,255,.05); }
  [data-theme="dark"] .contact-item.active { background:rgba(85,198,165,.14); }
  [data-theme="dark"] .contact-name,
  [data-theme="dark"] .chat-header-name,
  [data-theme="dark"] .info-title,
  [data-theme="dark"] .profile-block .p-name,
  [data-theme="dark"] .info-section-head span.label,
  [data-theme="dark"] .file-row .f-name,
  [data-theme="dark"] .link-row .l-title { color:var(--text-dark) !important; }
  [data-theme="dark"] .contact-preview,
  [data-theme="dark"] .contact-time,
  [data-theme="dark"] .chat-header-status,
  [data-theme="dark"] .msg-meta,
  [data-theme="dark"] .profile-block .p-line,
  [data-theme="dark"] .file-row .f-sub,
  [data-theme="dark"] .link-row .l-sub { color:var(--text-gray) !important; }
  [data-theme="dark"] .msg-row.in .bubble { background:#171313 !important; color:var(--text-dark) !important; border:1px solid var(--border); }
  [data-theme="dark"] .msg-row.out .bubble { background:#2b806d; color:#fff; }
  [data-theme="dark"] .msg-row.system .bubble,
  [data-theme="dark"] .voice-card { background:#171313; color:var(--text-gray); }
  [data-theme="dark"] .file-card { background:#171313; border-color:var(--border); }
  [data-theme="dark"] .chat-sheet,
  [data-theme="dark"] .chat-listing-option { background:#171313; border-color:var(--border); color:var(--text-dark); box-shadow:none; }
  [data-theme="dark"] .chat-sheet-head,
  [data-theme="dark"] .chat-listing-option div,
  [data-theme="dark"] .chat-listing-option strong { color:var(--text-dark); }
  [data-theme="dark"] .chat-listing-option small,
  [data-theme="dark"] .chat-listing-card-sub,
  [data-theme="dark"] .chat-sheet-close { color:var(--text-gray); }
  [data-theme="dark"] .chat-listing-card { background:#171313; }
  [data-theme="dark"] .chat-listing-card-title { color:var(--text-dark); }
  [data-theme="dark"] .chat-report-details { background:#0F0D0D; border-color:var(--border); color:var(--text-dark); }
  [data-theme="dark"] .chat-settings-panel-head { background:#0F0D0D; border-color:var(--border); }
  [data-theme="dark"] .contact-list::-webkit-scrollbar-thumb,
  [data-theme="dark"] .messages::-webkit-scrollbar-thumb,
  [data-theme="dark"] .info-col::-webkit-scrollbar-thumb { background:rgba(255,255,255,.18); }
  @media (max-width:760px){
    [data-theme="dark"] body,
    [data-theme="dark"] .app-shell,
    [data-theme="dark"] .contacts-col,
    [data-theme="dark"] .contact-list,
    [data-theme="dark"] .chat-col.mobile-visible,
    [data-theme="dark"] .chat-header,
    [data-theme="dark"] .messages,
    [data-theme="dark"] .chat-input-area,
    [data-theme="dark"] .info-col.mobile-visible { background:#0F0D0D !important; color:var(--text-dark) !important; }
    [data-theme="dark"] .search-bar,
    [data-theme="dark"] .search-box,
    [data-theme="dark"] .chat-input-area::before,
    [data-theme="dark"] .mobile-attach-menu,
    [data-theme="dark"] .composer-file { background:#171313 !important; border-color:var(--border) !important; }
    [data-theme="dark"] .contact-item:active,
    [data-theme="dark"] .conversation-menu:active { background:rgba(255,255,255,.08) !important; }
    [data-theme="dark"] .chat-header-identity .chat-header-name,
    [data-theme="dark"] .mobile-back,
    [data-theme="dark"] .chat-header-actions button[title="More"] { color:var(--text-dark) !important; }
    [data-theme="dark"] .messages .msg-row.in .bubble { background:#171313 !important; color:var(--text-dark) !important; }
    [data-theme="dark"] .messages .msg-row.out .bubble { background:#2b806d !important; color:#fff !important; }
  }
</style>

  <nav class="icon-rail" id="chatRoleNavigation" aria-label="VaRoom navigation"></nav>
  <script>
    (function () {
      var rail = document.getElementById('chatRoleNavigation');
      if (!rail) return;
      var clientItems = [
        ['Home', '/client-home', 'i-home'], ['Marketplace', '/marketplace', 'i-store'],
        ['Saved', '/client-home?view=saved', 'i-bookmark'], ['Chats', '/chats', 'i-chat'],
        ['Bookings', '/bookings', 'i-calendar'], ['Notifications', '/notifications', 'i-bell'],
        ['Profile', '/profile', 'i-user-circle']
      ];
      var hostItems = [
        ['Home', '/host-home', 'i-home'], ['Marketplace', '/marketplace', 'i-store'],
        ['Chats', '/chats', 'i-chat'], ['Bookings', '/bookings', 'i-calendar'],
        ['Notifications', '/notifications', 'i-bell'], ['List a space', '/list', 'i-plus'],
        ['My listings', '/host-home?view=my-listings', 'i-store'], ['Payments', '/payments', 'i-card'],
        ['Analytics', '/analytics', 'i-chart']
      ];
      function icon(id) { return '<svg class="icon"><use href="#' + id + '"/></svg>'; }
      function render(role) {
        var isHost = role === 'host';
        var items = isHost ? hostItems : clientItems;
        rail.setAttribute('data-role', isHost ? 'host' : 'client');
        rail.setAttribute('aria-label', isHost ? 'Host navigation' : 'Client navigation');
        rail.innerHTML = '<div class="rail-icons">' + items.map(function (item) {
          var active = item[1] === '/chats' ? ' active' : '';
          return '<a class="rail-btn' + active + '" href="' + item[1] + '" title="' + item[0] + '" aria-label="' + item[0] + '"' + (active ? ' aria-current="page"' : '') + '>' + icon(item[2]) + '</a>';
        }).join('') + '</div><a class="rail-btn settings-btn" href="/settings" title="Settings" aria-label="Settings">' + icon('i-gear') + '</a>';
      }
      window.VaroomChatNavigation = { setRole: render };
      var cachedRole = '';
      try { cachedRole = window.sessionStorage.getItem('varoom_user_role') || ''; } catch (e) {}
      render(cachedRole === 'host' ? 'host' : 'client');
    })();

<!-- =====================================================================
     MOBILE COMPOSER  (every handler is a no-op above 760px)
     ===================================================================== -->
<script>
(function () {
  'use strict';

  var MOBILE_QUERY = '(max-width:760px)';
  var MAX_ATTACHMENTS = 10;
  var IMAGE_EXT = /\.(jpe?g|png|gif|webp|heic|heif|avif|bmp)$/i;
  var SVG_NS = 'http://www.w3.org/2000/svg';

  var root      = document.documentElement;
  var shell     = document.querySelector('.app-shell');
  var chatCol   = document.querySelector('.chat-col');
  var messages  = document.querySelector('.messages');
  var composer  = document.querySelector('.chat-input-area');
  if (!shell || !chatCol || !messages || !composer) return;

  var ta         = composer.querySelector('textarea');
  var sendBtn    = composer.querySelector('.send-message');
  var attachBtn  = composer.querySelector('.mobile-attach');
  var stickerBtn = composer.querySelector('.mobile-plus');
  var menu       = document.getElementById('mobileAttachMenu');
  var tray       = document.getElementById('composerTray');
  var note       = document.getElementById('composerNote');
  var photoInput = document.getElementById('composerPhotoInput');
  var fileInput  = document.getElementById('composerFileInput');
  if (!ta || !sendBtn || !attachBtn || !stickerBtn || !menu || !tray || !note || !photoInput || !fileInput) return;

  var mq = window.matchMedia(MOBILE_QUERY);
  function isMobile() { return mq.matches; }

  var vv = window.visualViewport || null;
  var pending = [];      // { id, kind:'image'|'file', file, url }
  var uid = 0;
  var forcedRole = null;
  var sending = false;
  var stick = true;      // is the message list scrolled to (near) the bottom?
  var noteTimer = 0;

  /* ---------------- role: clients = photos only, hosts = photos + files + listings ---------------- */
  // Fails closed: anything that is not exactly "host" is treated as a client.
  // Set it with  window.VaroomComposer.setRole('host')  or  data-role="host"  on <body>, <html> or .chat-col.
  function getRole() {
    var raw = forcedRole ||
      chatCol.getAttribute('data-role') ||
      (document.body && document.body.getAttribute('data-role')) ||
      root.getAttribute('data-role') ||
      window.VAROOM_ROLE || '';
    return String(raw).toLowerCase() === 'host' ? 'host' : 'client';
  }

  /* ---------------- small helpers ---------------- */
  function makeIcon(id) {
    var svg = document.createElementNS(SVG_NS, 'svg');
    svg.setAttribute('class', 'icon');
    var use = document.createElementNS(SVG_NS, 'use');
    use.setAttribute('href', '#' + id);
    svg.appendChild(use);
    return svg;
  }
  function formatSize(bytes) {
    if (!bytes && bytes !== 0) return '';
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024 * 1024) return Math.round(bytes / 1024) + ' KB';
    return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
  }
  function isImageFile(f) {
    return /^image\//i.test(f.type || '') || IMAGE_EXT.test(f.name || '');
  }
  // keep the keyboard open when tapping composer buttons (mouse events are synthesized after touchend)
  function keepFocus(el) {
    el.addEventListener('mousedown', function (e) { if (isMobile()) e.preventDefault(); });
  }

  /* ---------------- message list stays pinned to the bottom ---------------- */
  messages.addEventListener('scroll', function () {
    stick = (messages.scrollHeight - messages.scrollTop - messages.clientHeight) < 80;
  }, { passive: true });
  function keepBottom() {
    if (!stick || !isMobile()) return;
    requestAnimationFrame(function () { messages.scrollTop = messages.scrollHeight; });
  }
  if (window.ResizeObserver) {
    var ro = new ResizeObserver(keepBottom);
    ro.observe(composer);
    ro.observe(messages);
  }

  /* ---------------- textarea auto-grow ---------------- */
  function autoGrow() {
    if (!isMobile()) { ta.style.height = ''; ta.style.overflowY = ''; return; }
    ta.style.height = '0px';
    var max = parseFloat(window.getComputedStyle(ta).maxHeight);
    if (!max || isNaN(max)) max = 132;
    var full = ta.scrollHeight;
    ta.style.height = Math.min(full, max) + 'px';
    ta.style.overflowY = full > max ? 'auto' : 'hidden';
  }

  /* ---------------- send-button state ---------------- */
  function updateState() {
    var ready = ta.value.trim().length > 0 || pending.length > 0;
    composer.classList.toggle('can-send', ready);
    composer.classList.toggle('has-text', ready);   // kept for existing code that reads this class
    sendBtn.setAttribute('aria-disabled', ready ? 'false' : 'true');
    attachBtn.setAttribute('aria-label', getRole() === 'host' ? 'Attach photos, files or a listing' : 'Add photos');
  }

  /* ---------------- notice ---------------- */
  function showNote(text) {
    note.textContent = text;
    note.hidden = false;
    clearTimeout(noteTimer);
    noteTimer = setTimeout(function () { note.hidden = true; }, 3500);
  }

  /* ---------------- attachment tray ---------------- */
  function renderTray() {
    while (tray.firstChild) tray.removeChild(tray.firstChild);
    pending.forEach(function (item) {
      var el = document.createElement('div');
      if (item.kind === 'image') {
        el.className = 'composer-thumb';
        var img = document.createElement('img');
        img.src = item.url;
        img.alt = item.file.name || 'Photo';
        el.appendChild(img);
      } else {
        el.className = 'composer-file';
        var ico = document.createElement('span');
        ico.className = 'composer-file-ico';
        ico.appendChild(makeIcon('i-file-text'));
        var meta = document.createElement('span');
        meta.className = 'composer-file-meta';
        var nm = document.createElement('span');
        nm.className = 'composer-file-name';
        nm.textContent = item.file.name || 'File';
        var sz = document.createElement('span');
        sz.className = 'composer-file-size';
        sz.textContent = formatSize(item.file.size);
        meta.appendChild(nm);
        meta.appendChild(sz);
        el.appendChild(ico);
        el.appendChild(meta);
      }
      var rm = document.createElement('button');
      rm.type = 'button';
      rm.className = 'composer-rm';
      rm.setAttribute('aria-label', 'Remove ' + (item.file.name || 'attachment'));
      rm.appendChild(makeIcon('i-close'));
      keepFocus(rm);
      rm.addEventListener('click', function () { removeItem(item.id); });
      el.appendChild(rm);
      tray.appendChild(el);
    });
    tray.hidden = pending.length === 0;
  }
  function removeItem(id) {
    pending = pending.filter(function (p) {
      if (p.id === id && p.url) URL.revokeObjectURL(p.url);
      return p.id !== id;
    });
    renderTray();
    updateState();
  }
  function clearPending() {
    pending.forEach(function (p) { if (p.url) URL.revokeObjectURL(p.url); });
    pending = [];
    renderTray();
  }

  function addFiles(list, kind) {
    if (!isMobile()) return;
    var role = getRole();
    var incoming = Array.prototype.slice.call(list || []);
    var rejected = 0, overflow = 0;

    incoming.forEach(function (f) {
      var image = isImageFile(f);
      var okForRole = role === 'host' || image;          // clients: photos only
      var okForKind = kind === 'photos' ? image : true;   // the photo picker only takes images
      if (!okForRole || !okForKind) { rejected++; return; }
      if (pending.length >= MAX_ATTACHMENTS) { overflow++; return; }
      uid += 1;
      pending.push({
        id: uid,
        kind: image ? 'image' : 'file',
        file: f,
        url: image ? URL.createObjectURL(f) : null
      });
    });

    renderTray();
    updateState();
    if (overflow) showNote('You can attach up to ' + MAX_ATTACHMENTS + ' items at a time.');
    else if (rejected) showNote(role === 'host' ? 'Some items were skipped.' : 'Only photos can be attached.');
  }

  photoInput.addEventListener('change', function () {
    var files = Array.prototype.slice.call(photoInput.files || []);
    photoInput.value = '';            // lets the same photo be picked again
    addFiles(files, 'photos');
  });
  fileInput.addEventListener('change', function () {
    var files = Array.prototype.slice.call(fileInput.files || []);
    fileInput.value = '';
    if (getRole() !== 'host') { showNote('Only photos can be attached.'); return; }
    addFiles(files, 'files');
  });

  /* ---------------- attachment menu ---------------- */
  function openMenu()  { menu.hidden = false; attachBtn.setAttribute('aria-expanded', 'true'); }
  function closeMenu() { menu.hidden = true;  attachBtn.setAttribute('aria-expanded', 'false'); }

  attachBtn.addEventListener('click', function () {
    if (!isMobile()) return;
    if (getRole() === 'host') {
      if (menu.hidden) openMenu(); else closeMenu();
    } else {
      closeMenu();
      photoInput.click();             // clients go straight to the photo picker
    }
  });

  menu.addEventListener('click', function (e) {
    if (!isMobile()) return;
    var btn = e.target.closest ? e.target.closest('[data-attach]') : null;
    if (!btn) return;
    var action = btn.getAttribute('data-attach');
    closeMenu();
    if (getRole() !== 'host' && action !== 'photos') return;   // hard guard
    if (action === 'photos') {
      photoInput.click();
    } else if (action === 'files') {
      fileInput.click();
    } else if (action === 'listing') {
      // reuse the existing "Share listing" flow (hidden on mobile, still clickable), and announce it
      var listingBtn = composer.querySelector('.attach-icons button[title="Share listing"]');
      if (listingBtn) listingBtn.click();
      composer.dispatchEvent(new CustomEvent('varoom:composer-share-listing', { bubbles: true }));
    }
  });

  document.addEventListener('pointerdown', function (e) {
    if (menu.hidden) return;
    if (menu.contains(e.target) || attachBtn.contains(e.target)) return;
    closeMenu();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !menu.hidden) closeMenu();
  });

  /* ---------------- sticker / emoji button (hook only) ---------------- */
  stickerBtn.addEventListener('click', function () {
    if (!isMobile()) return;
    composer.dispatchEvent(new CustomEvent('varoom:composer-sticker', { bubbles: true }));
  });

  /* ---------------- sending ---------------- */
  function send() {
    if (!isMobile() || sending) return;
    var role = getRole();
    var text = ta.value.trim();
    var attachments = pending
      .filter(function (p) { return role === 'host' || p.kind === 'image'; })
      .map(function (p) { return { kind: p.kind, file: p.file }; });
    if (!text && !attachments.length) return;

    sending = true;
    var hadFocus = document.activeElement === ta;
    closeMenu();

    // Listen for this to do the real send (Supabase insert / upload):
    //   document.addEventListener('varoom:composer-send', e => { e.detail.text; e.detail.attachments; e.detail.role })
    composer.dispatchEvent(new CustomEvent('varoom:composer-send', {
      bubbles: true, cancelable: true,
      detail: { text: text, attachments: attachments, role: role }
    }));

    // clear right away; the 0ms delay only lets other click handlers on this button read the text first
    setTimeout(function () {
      ta.value = '';
      clearPending();
      autoGrow();
      updateState();
      stick = true;
      keepBottom();
      if (hadFocus) ta.focus();
      sending = false;
    }, 0);
  }
  sendBtn.addEventListener('click', send);

  keepFocus(sendBtn);
  keepFocus(attachBtn);
  keepFocus(stickerBtn);
  keepFocus(menu);

  ta.addEventListener('input', function () {
    if (!isMobile()) return;
    autoGrow();
    updateState();
  });

  /* ---------------- keyboard / visual viewport ---------------- */
  function resetViewport() {
    root.style.removeProperty('--vvh');
    root.style.removeProperty('--vv-top');
    shell.classList.remove('kb-open');
    ta.style.height = '';
    ta.style.overflowY = '';
    closeMenu();
  }
  function syncViewport() {
    if (!isMobile()) { resetViewport(); return; }
    var h = vv ? vv.height : window.innerHeight;
    var top = vv ? Math.max(0, vv.offsetTop) : 0;
    if (vv && vv.scale > 1.05) {       // user pinch-zoomed: don't fight it
      root.style.removeProperty('--vvh');
      root.style.removeProperty('--vv-top');
      shell.classList.remove('kb-open');
      return;
    }
    root.style.setProperty('--vvh', Math.round(h) + 'px');
    root.style.setProperty('--vv-top', Math.round(top) + 'px');
    var kbOpen = document.activeElement === ta && (window.innerHeight - h) > 100;
    shell.classList.toggle('kb-open', kbOpen);
    keepBottom();
  }
  if (vv) {
    vv.addEventListener('resize', syncViewport);
    vv.addEventListener('scroll', syncViewport);
  }
  window.addEventListener('resize', syncViewport);
  window.addEventListener('orientationchange', function () { setTimeout(syncViewport, 250); });
  ta.addEventListener('focus', function () {
    syncViewport();
    setTimeout(syncViewport, 150);     // iOS animates the keyboard in
    setTimeout(syncViewport, 400);
  });
  ta.addEventListener('blur', function () {
    syncViewport();
    setTimeout(syncViewport, 150);
  });

  function onBreakpointChange() {
    if (!isMobile()) resetViewport();
    else { syncViewport(); autoGrow(); }
    updateState();
  }
  if (mq.addEventListener) mq.addEventListener('change', onBreakpointChange);
  else if (mq.addListener) mq.addListener(onBreakpointChange);

  /* ---------------- tiny public API ---------------- */
  window.VaroomComposer = {
    setRole: function (r) { forcedRole = r || null; updateState(); },
    getRole: getRole,
    clear: function () { ta.value = ''; clearPending(); autoGrow(); updateState(); },
    focus: function () { ta.focus(); }
  };

  syncViewport();
  updateState();
})();
</script>

</body>
</html>
