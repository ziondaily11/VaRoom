<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile — VaRoom</title>
<script>
  (function(){
    try{
      var saved = localStorage.getItem('varoom_theme') || 'system';
      var resolved = saved === 'system'
        ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
        : saved;
      document.documentElement.setAttribute('data-theme', resolved);
    }catch(e){}
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;0,9..144,900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="icon" href="favicon/favicon.ico" sizes="any">
<style>
  :root{
    --red:#C41E3A; --red-deep:#8F1229; --white:#FFFFFF; --ink:#1A1210; --paper:#FBF4F1;
    --muted:#7a6b67; --card-border:rgba(26,18,16,.12);
    --font-display:'Fraunces', serif; --font-body:'Inter', sans-serif;
  }
  [data-theme="dark"]{
    --white:#241C1A; --paper:#15100F; --ink:#F5EFEC; --muted:#B8ACA8; --card-border:rgba(255,255,255,.1);
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  body{ font-family:var(--font-body); background:var(--paper); color:var(--ink); min-height:100vh; }
  a{ color:inherit; text-decoration:none; }
  button{ font-family:inherit; cursor:pointer; border:none; background:none; }

  header{ display:flex; align-items:center; justify-content:space-between; padding:1.5rem 2.5rem; }
  .logo{ font-family:var(--font-display); font-weight:900; font-size:1.55rem; display:flex; align-items:baseline; }
  .logo .va{ color:var(--red); -webkit-text-stroke:1.5px var(--ink); text-shadow:-1px -1px 0 var(--ink), 1px -1px 0 var(--ink), -1px 1px 0 var(--ink), 1px 1px 0 var(--ink); }
  .logo .pin{ width:.34em; height:.34em; border-radius:50% 50% 50% 0; background:var(--red); transform:rotate(-45deg); margin:0 .05em 0 .08em; align-self:flex-start; margin-top:.08em; }
  .home-link{ font-size:.9rem; font-weight:500; }
  .home-link:hover{ color:var(--red); }

  main{ max-width:640px; margin:0 auto; padding:1.5rem 6vw 6rem; }
  .state-msg{ text-align:center; padding:4rem 0; color:var(--muted); }

  .profile-head{ display:flex; flex-direction:column; align-items:center; text-align:center; margin-bottom:2rem; }
  .avatar-circle{
    width:110px; height:110px; border-radius:50%;
    background:var(--red); color:var(--white);
    display:flex; align-items:center; justify-content:center;
    font-weight:700; font-size:2.2rem; overflow:hidden; margin-bottom:1rem;
  }
  .avatar-circle img{ width:100%; height:100%; object-fit:cover; }

  .role-tag{
    display:inline-block; font-size:.75rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase;
    padding:.3rem .8rem; border-radius:100px; border:1.5px solid var(--red); color:var(--red); margin-bottom:.7rem;
  }
  .profile-name{ font-family:var(--font-display); font-weight:600; font-size:1.7rem; margin-bottom:.2rem; }
  .profile-username{ color:var(--muted); font-size:.9rem; margin-bottom:1rem; }
  .profile-bio{ font-size:.95rem; line-height:1.55; color:var(--ink); max-width:440px; }

  .section-title{ font-family:var(--font-display); font-weight:600; font-size:1.2rem; margin:2.2rem 0 1rem; }
  .listing-grid{ display:grid; grid-template-columns:1fr 1fr; gap:1rem; }
  @media (max-width:520px){ .listing-grid{ grid-template-columns:1fr; } }

  .listing-card{
    border:1px solid var(--card-border); border-radius:16px; overflow:hidden; display:block;
    transition:transform .15s ease;
  }
  .listing-card:hover{ transform:translateY(-2px); }
  .listing-card img{ width:100%; aspect-ratio:4/3; object-fit:cover; display:block; background:var(--card-border); }
  .listing-card-body{ padding:.8rem .9rem; }
  .listing-card-cat{ font-size:.7rem; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--red-deep); margin-bottom:.25rem; }
  .listing-card-title{ font-weight:700; font-size:.9rem; margin-bottom:.15rem; }
  .listing-card-loc{ font-size:.78rem; color:var(--muted); }

  .no-listings{ color:var(--muted); font-size:.9rem; text-align:center; padding:2rem 0; }
  .cta-footer{ text-align:center; margin-top:3rem; padding-top:2rem; border-top:1px solid var(--card-border); }
  .cta-footer p{ color:var(--muted); font-size:.9rem; margin-bottom:.9rem; }
  .cta-btn{ display:inline-block; background:var(--ink); color:var(--white); padding:.9rem 1.8rem; border-radius:100px; font-weight:600; font-size:.9rem; }
  .cta-btn:hover{ background:var(--red); }
</style>
</head>
<body>

<header>
  <a href="index.html" class="logo"><span class="va">Va</span><span class="pin"></span><span class="room">Room</span></a>
  <a href="index.html" class="home-link">VaRoom home →</a>
</header>

<main>
  <div id="loading-state" class="state-msg">Loading profile…</div>
  <div id="not-found-state" class="state-msg" style="display:none;">This profile doesn't exist or isn't available.</div>

  <div id="profile-content" style="display:none;">
    <div class="profile-head">
      <div class="avatar-circle" id="avatar-circle">·</div>
      <span class="role-tag" id="role-tag">Host</span>
      <div class="profile-name" id="profile-name">—</div>
      <div class="profile-username" id="profile-username">—</div>
      <p class="profile-bio" id="profile-bio"></p>
    </div>

    <div id="listings-section" style="display:none;">
      <h2 class="section-title" id="listings-title">Listings</h2>
      <div class="listing-grid" id="listing-grid"></div>
    </div>

    <div class="cta-footer">
      <p>Looking for a place to stay or list your own space?</p>
      <a href="index.html" class="cta-btn">Explore VaRoom</a>
    </div>
  </div>
</main>

<script src="js/supabase-client.js"></script>
<script>
  (async function(){
    // Supports both the clean /u/username route (via vercel.json rewrite)
    // and a direct ?u=username query param, useful for local testing.
    function getUsernameFromUrl(){
      const params = new URLSearchParams(window.location.search);
      if (params.get('u')) return params.get('u');

      const segments = window.location.pathname.split('/').filter(Boolean);
      if (segments.length >= 2 && segments[0] === 'u') return segments[1];
      return null;
    }

    const username = getUsernameFromUrl();
    const loadingState = document.getElementById('loading-state');
    const notFoundState = document.getElementById('not-found-state');
    const profileContent = document.getElementById('profile-content');

    if (!username) {
      loadingState.style.display = 'none';
      notFoundState.style.display = 'block';
      return;
    }

    const { data: profile, error: profileError } = await supabaseClient
      .from('profiles')
      .select('id, role, full_name, username, bio, avatar_url')
      .eq('username', username)
      .maybeSingle();

    if (profileError || !profile) {
      loadingState.style.display = 'none';
      notFoundState.style.display = 'block';
      return;
    }

    document.title = (profile.full_name || 'Profile') + ' — VaRoom';

    document.getElementById('role-tag').textContent = profile.role === 'host' ? 'Host' : 'Client';
    document.getElementById('profile-name').textContent = profile.full_name || 'VaRoom user';
    document.getElementById('profile-username').textContent = '@' + profile.username;

    const bioEl = document.getElementById('profile-bio');
    if (profile.bio) {
      bioEl.textContent = profile.bio;
    } else {
      bioEl.remove();
    }

    const avatarCircle = document.getElementById('avatar-circle');
    if (profile.avatar_url) {
      const publicUrl = profile.avatar_url.indexOf('http') === 0
        ? profile.avatar_url
        : supabaseClient.storage.from('avatars').getPublicUrl(profile.avatar_url).data.publicUrl;
      avatarCircle.innerHTML = '<img src="' + publicUrl + '" alt="">';
    } else {
      avatarCircle.textContent = (profile.full_name || '?').charAt(0).toUpperCase();
    }

    loadingState.style.display = 'none';
    profileContent.style.display = 'block';

    // ---------- Host listings ----------
    if (profile.role === 'host') {
      const listingsSection = document.getElementById('listings-section');
      const listingGrid = document.getElementById('listing-grid');
      const listingsTitle = document.getElementById('listings-title');

      const { data: listings, error: listingsError } = await supabaseClient
        .from('listings')
        .select('id, title, category, location_text, listing_photos(storage_path)')
        .eq('host_id', profile.id)
        .order('created_at', { ascending:false })
        .limit(12);

      listingsSection.style.display = 'block';

      if (listingsError || !listings || listings.length === 0) {
        listingGrid.innerHTML = '<p class="no-listings">No listings yet.</p>';
        return;
      }

      listingsTitle.textContent = profile.full_name.split(' ')[0] + '\u2019s listings';

      listingGrid.innerHTML = listings.map(function(l){
        let img = '';
        if (l.listing_photos && l.listing_photos.length > 0) {
          const path = l.listing_photos[0].storage_path;
          const url = path.indexOf('http') === 0
            ? path
            : supabaseClient.storage.from('listing-photos').getPublicUrl(path).data.publicUrl;
          img = '<img src="' + url + '" alt="">';
        }
        return (
          '<a class="listing-card" href="booking.html?id=' + l.id + '">' +
            img +
            '<div class="listing-card-body">' +
              '<div class="listing-card-cat">' + (l.category || '') + '</div>' +
              '<div class="listing-card-title">' + l.title + '</div>' +
              '<div class="listing-card-loc">' + (l.location_text || '') + '</div>' +
            '</div>' +
          '</a>'
        );
      }).join('');
    }
  })();
</script>

</body>
</html>
