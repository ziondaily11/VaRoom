<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Signing you in — VaRoom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;0,9..144,900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --red:#C41E3A; --red-deep:#8F1229; --white:#FFFFFF; --ink:#1A1210; --paper:#FBF4F1;
    --font-display:'Fraunces', serif; --font-body:'Inter', sans-serif;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  body{ font-family:var(--font-body); background:var(--paper); color:var(--ink); min-height:100vh; }
  button{ font-family:inherit; cursor:pointer; border:none; }

  main{ max-width:460px; margin:0 auto; padding:6vh 6vw; min-height:100vh; display:flex; flex-direction:column; justify-content:center; align-items:center; }

  .loading{ display:flex; flex-direction:column; align-items:center; gap:1rem; }

  .loading-logo{
    font-family:var(--font-display);
    font-weight:900;
    font-size:2.4rem;
    line-height:1;
    display:inline-flex;
    align-items:baseline;
    animation:pulse 1.5s ease-in-out infinite;
  }

  .loading-logo .va{
    color:var(--red);
    -webkit-text-stroke:1.5px var(--ink);
    text-shadow:
      -1px -1px 0 var(--ink),
       1px -1px 0 var(--ink),
      -1px  1px 0 var(--ink),
       1px  1px 0 var(--ink);
  }
  .loading-logo .room{ color:var(--ink); }

  .loading-pin{
    width:.32em;
    height:.32em;
    border-radius:50% 50% 50% 0;
    background:var(--red);
    transform:rotate(-45deg);
    margin:0 .06em 0 .1em;
    align-self:flex-start;
    margin-top:.1em;
  }

  @keyframes pulse{
    0%, 100%{ opacity:1; transform:scale(1); }
    50%{ opacity:.45; transform:scale(.96); }
  }

  @media (prefers-reduced-motion: reduce){
    .loading-logo{ animation:none; }
  }

  .loading-text{ font-size:.9rem; color:#7a6b67; }

  h1{
    font-family:var(--font-display); font-weight:600;
    font-size:1.8rem; margin-bottom:.6rem; text-align:center;
  }
  .sub{ font-size:1rem; color:#3a2e2c; text-align:center; margin-bottom:2rem; }

  .role-options{ display:flex; flex-direction:column; gap:.9rem; width:100%; }

  .role-card{
    text-align:left; background:var(--white); border:1.5px solid rgba(26,18,16,.1);
    border-radius:16px; padding:1.1rem 1.2rem; display:flex; flex-direction:column; gap:.3rem;
    transition:border-color .2s ease, transform .2s ease; width:100%;
  }
  .role-card:hover{ border-color:var(--red); transform:translateY(-2px); }

  .role-title{ font-weight:700; font-size:1rem; color:var(--ink); }
  .role-desc{ font-size:.85rem; color:#6a5b57; line-height:1.45; }

  .error-msg{
    background:#FBE9E9; border:1px solid rgba(196,30,58,.3); color:var(--red-deep);
    border-radius:14px; padding:1.4rem 1.6rem; font-size:.95rem; text-align:center;
  }
</style>
</head>
<body>

<main>
  <div id="loading" class="loading">
    <div class="loading-logo">
      <span class="va">Va</span><span class="loading-pin"></span><span class="room">Room</span>
    </div>
    <p class="loading-text" id="loading-text">Signing you in</p>
  </div>

  <div id="role-picker" style="display:none; width:100%;">
    <h1>Almost there.</h1>
    <p class="sub">How are you using VaRoom?</p>
    <div class="role-options">
      <button type="button" class="role-card" data-role="host">
        <span class="role-title">I'm a Host</span>
        <span class="role-desc">List and showcase your spaces — Airbnbs, hotels, venues, offices, shops, or property.</span>
      </button>
      <button type="button" class="role-card" data-role="client">
        <span class="role-title">I'm a Client</span>
        <span class="role-desc">Find suitable places for events and stays.</span>
      </button>
    </div>
  </div>

  <div id="error-box" style="display:none;" class="error-msg"></div>
</main>

<script src="js/supabase-client.js"></script>
<script>
  (async function(){
    const loading = document.getElementById('loading');
    const loadingText = document.getElementById('loading-text');
    const rolePicker = document.getElementById('role-picker');
    const errorBox = document.getElementById('error-box');

    function showError(message){
      loading.style.display = 'none';
      errorBox.textContent = message;
      errorBox.style.display = 'block';
    }

    const { data: { session }, error: sessionError } = await supabaseClient.auth.getSession();

    if (sessionError || !session) {
      showError('Something went wrong signing you in. Please try again from the login page.');
      setTimeout(function(){ window.location.href = 'login.html'; }, 2500);
      return;
    }

    const user = session.user;

    // VaRoom's own official account lands on the updates composer instead
    // of a normal host/client dashboard, regardless of how it signed in.
    if (user.email === 'varoonhq@gmail.com') {
      window.location.href = 'varoom-post.html';
      return;
    }

    // Does a profile already exist for this user?
    const { data: profile, error: profileError } = await supabaseClient
      .from('profiles')
      .select('role, onboarding_completed')
      .eq('id', user.id)
      .maybeSingle();

    if (profileError) {
      showError('Signed in, but could not check your profile: ' + profileError.message);
      return;
    }

    if (profile && profile.role) {
      // Fully resolved existing user — route by their saved role and onboarding status
      redirectByRole(profile.role, profile.onboarding_completed);
      return;
    }

    // Either no profile row exists yet (rare — the DB trigger should
    // normally have created one), or it exists but role is still null
    // (e.g. a Google sign-in, since Google has no channel to tell the
    // trigger which role was intended). Either way, we need to resolve
    // the role now.
    const intendedRole = sessionStorage.getItem('varoom_intended_role') || user.user_metadata.role;
    const fullName = user.user_metadata.full_name || user.user_metadata.name || user.email;

    if (intendedRole === 'host' || intendedRole === 'client') {
      await setRoleAndRedirect(intendedRole, fullName);
      return;
    }

    // No prior intent recorded — ask now
    loading.style.display = 'none';
    rolePicker.style.display = 'block';

    document.querySelectorAll('.role-card').forEach(function(card){
      card.addEventListener('click', async function(){
        const role = card.getAttribute('data-role');
        rolePicker.style.display = 'none';
        loadingText.textContent = 'Setting up your account';
        loading.style.display = 'flex';
        await setRoleAndRedirect(role, fullName);
      });
    });

    async function setRoleAndRedirect(role, name){
      // Upsert rather than insert: the DB trigger has very likely already
      // created this row (with role=null), so we need to update it, not
      // create a second conflicting one. This also safely covers the rare
      // case where no row exists at all yet.
      const { error: upsertError } = await supabaseClient
        .from('profiles')
        .upsert({ id: user.id, role: role, full_name: name }, { onConflict: 'id' });

      if (upsertError) {
        showError('Signed in, but could not finish setting up your profile: ' + upsertError.message);
        return;
      }

      sessionStorage.removeItem('varoom_intended_role');
      // A user who just had their role resolved for the first time hasn't
      // been through onboarding yet.
      redirectByRole(role, false);
    }

    function redirectByRole(role, onboardingCompleted){
          if (!onboardingCompleted) {
            window.location.href = 'onboarding.html';
            return;
          }
          if (role === 'host') {
            window.location.href = 'host-home.html';
          } else {
            window.location.href = 'client-home.html';
          }
        }
  })();
</script>

</body>
</html>
