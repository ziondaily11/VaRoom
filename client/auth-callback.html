<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Signing you in — VaRoom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;0,9..144,900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --red:#C41E3A; --red-deep:#8F1229; --white:#FFFFFF; --ink:#1A1210; --paper:#FBF4F1;
    --font-display:'Fraunces', serif; --font-body:'Inter', sans-serif;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  body{ font-family:var(--font-body); background:var(--paper); color:var(--ink); min-height:100vh; }
  button{ font-family:inherit; cursor:pointer; border:none; }

  main{ max-width:460px; margin:0 auto; padding:6vh 6vw; min-height:100vh; display:flex; flex-direction:column; justify-content:center; }

  .loading{ text-align:center; color:#7a6b67; }

  h1{
    font-family:var(--font-display); font-weight:600;
    font-size:1.8rem; margin-bottom:.6rem; text-align:center;
  }
  .sub{ font-size:1rem; color:#3a2e2c; text-align:center; margin-bottom:2rem; }

  .role-options{ display:flex; flex-direction:column; gap:.9rem; }

  .role-card{
    text-align:left; background:var(--white); border:1.5px solid rgba(26,18,16,.1);
    border-radius:16px; padding:1.1rem 1.2rem; display:flex; flex-direction:column; gap:.3rem;
    transition:border-color .2s ease, transform .2s ease; width:100%;
  }
  .role-card:hover{ border-color:var(--red); transform:translateY(-2px); }

  .role-title{ font-weight:700; font-size:1rem; color:var(--ink); }
  .role-desc{ font-size:.85rem; color:#6a5b57; line-height:1.45; }

  .error-msg{
    background:#FBE9E9; border:1px solid rgba(196,30,58,.3); color:var(--red-deep);
    border-radius:14px; padding:1.4rem 1.6rem; font-size:.95rem; text-align:center;
  }
</style>
</head>
<body>

<main>
  <div id="loading" class="loading">Signing you in...</div>

  <div id="role-picker" style="display:none;">
    <h1>Almost there.</h1>
    <p class="sub">How are you using VaRoom?</p>
    <div class="role-options">
      <button type="button" class="role-card" data-role="host">
        <span class="role-title">I'm a Host</span>
        <span class="role-desc">List and showcase your spaces — Airbnbs, hotels, venues, offices, shops, or property.</span>
      </button>
      <button type="button" class="role-card" data-role="client">
        <span class="role-title">I'm a Client</span>
        <span class="role-desc">Find suitable places for events and stays.</span>
      </button>
    </div>
  </div>

  <div id="error-box" style="display:none;" class="error-msg"></div>
</main>

<script src="js/supabase-client.js"></script>
<script>
  (async function(){
    const loading = document.getElementById('loading');
    const rolePicker = document.getElementById('role-picker');
    const errorBox = document.getElementById('error-box');

    function showError(message){
      loading.style.display = 'none';
      errorBox.textContent = message;
      errorBox.style.display = 'block';
    }

    const { data: { session }, error: sessionError } = await supabaseClient.auth.getSession();

    if (sessionError || !session) {
      showError('Something went wrong signing you in. Please try again from the login page.');
      setTimeout(function(){ window.location.href = 'login.html'; }, 2500);
      return;
    }

    const user = session.user;

    // Does a profile already exist for this user?
    const { data: profile, error: profileError } = await supabaseClient
      .from('profiles')
      .select('role')
      .eq('id', user.id)
      .maybeSingle();

    if (profileError) {
      showError('Signed in, but could not check your profile: ' + profileError.message);
      return;
    }

    if (profile) {
      // Existing user — route by their saved role
      redirectByRole(profile.role);
      return;
    }

    // Brand new user. Did they already tell us their role from the signup modal?
    const intendedRole = sessionStorage.getItem('varoom_intended_role');
    const fullName = user.user_metadata.full_name || user.user_metadata.name || user.email;

    if (intendedRole === 'host' || intendedRole === 'client') {
      await createProfileAndRedirect(intendedRole, fullName);
      return;
    }

    // No prior intent recorded — ask now
    loading.style.display = 'none';
    rolePicker.style.display = 'block';

    document.querySelectorAll('.role-card').forEach(function(card){
      card.addEventListener('click', async function(){
        const role = card.getAttribute('data-role');
        rolePicker.style.display = 'none';
        loading.textContent = 'Setting up your account...';
        loading.style.display = 'block';
        await createProfileAndRedirect(role, fullName);
      });
    });

    async function createProfileAndRedirect(role, name){
      const { error: insertError } = await supabaseClient
        .from('profiles')
        .insert({ id: user.id, role: role, full_name: name });

      if (insertError) {
        showError('Signed in, but could not finish setting up your profile: ' + insertError.message);
        return;
      }

      sessionStorage.removeItem('varoom_intended_role');
      redirectByRole(role);
    }

    function redirectByRole(role){
      if (role === 'host') {
        window.location.href = 'list.html';
      } else {
        window.location.href = 'client-home.html';
      }
    }
  })();
</script>

</body>
</html>
