<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transactions — VaRoom</title>
<script>
  (function(){
    try{
      var saved = localStorage.getItem('varoom_theme') || 'system';
      var resolved = saved === 'system'
        ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
        : saved;
      document.documentElement.setAttribute('data-theme', resolved);
    }catch(e){}
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;0,9..144,900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --red:#C41E3A; --red-deep:#8F1229; --white:#FFFFFF; --ink:#1A1210; --paper:#FBF4F1;
    --muted:#7a6b67;
    --font-display:'Fraunces', serif; --font-body:'Inter', sans-serif;
  }
  [data-theme="dark"]{
    --white:#241C1A; --paper:#15100F; --ink:#F5EFEC; --muted:#B8ACA8;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  body{ font-family:var(--font-body); background:var(--paper); color:var(--ink); min-height:100vh; transition:background .2s ease, color .2s ease; }
  a{ color:inherit; text-decoration:none; }
  button{ font-family:inherit; cursor:pointer; border:none; background:none; }
  :focus-visible{ outline:3px solid var(--red-deep); outline-offset:3px; }

  header{ display:flex; align-items:center; justify-content:space-between; padding:1.5rem 2.5rem; }
  .logo{ font-family:var(--font-display); font-weight:900; font-size:1.55rem; display:flex; align-items:baseline; }
  .logo .va{ color:var(--red); }
  .logo .pin{ width:.34em; height:.34em; border-radius:50% 50% 50% 0; background:var(--red); transform:rotate(-45deg); margin:0 .05em 0 .08em; align-self:flex-start; margin-top:.08em; }
  .back-link{ font-size:.9rem; font-weight:500; color:var(--muted); }
  .back-link:hover{ color:var(--red); }

  main{ max-width:720px; margin:0 auto; padding:1rem 6vw 6rem; }
  .checking-msg{ text-align:center; padding:5rem 0; color:var(--muted); }

  .page-head{ display:flex; align-items:center; gap:.7rem; flex-wrap:wrap; margin-bottom:.4rem; }
  h1{ font-family:var(--font-display); font-weight:600; font-size:clamp(1.9rem, 4vw, 2.4rem); }
  .page-sub{ color:var(--muted); font-size:.92rem; margin-bottom:1.4rem; }

  .badge{ display:inline-flex; align-items:center; gap:.3rem; font-size:.76rem; font-weight:600; padding:.3rem .65rem; border-radius:100px; }
  .badge-soon{ background:rgba(26,18,16,.05); color:var(--muted); font-weight:500; }
  [data-theme="dark"] .badge-soon{ background:rgba(255,255,255,.08); }

  .tabs{ display:flex; gap:.6rem; margin-bottom:1.4rem; }
  .tab{ padding:.55rem 1.1rem; border-radius:100px; font-size:.86rem; font-weight:600; background:var(--white); border:1px solid rgba(128,110,100,.15); color:var(--ink); }
  .tab.active{ background:var(--red); color:#fff; border-color:var(--red); }

  .state-msg{ color:var(--muted); font-size:.92rem; padding:2rem 0; text-align:center; }
  .state-msg.error{ color:var(--red-deep); }
  .skeleton{ background:linear-gradient(90deg, rgba(128,110,100,.08) 25%, rgba(128,110,100,.15) 37%, rgba(128,110,100,.08) 63%); background-size:400% 100%; animation:shimmer 1.4s ease infinite; border-radius:14px; height:76px; margin-bottom:.7rem; }
  @keyframes shimmer{ 0%{background-position:100% 0;} 100%{background-position:-100% 0;} }

  .tx-card{ background:var(--white); border:1px solid rgba(128,110,100,.15); border-radius:14px; padding:1rem 1.2rem; margin-bottom:.7rem; }
  .tx-top{ display:flex; align-items:center; gap:.8rem; }
  .tx-icon{ width:36px; height:36px; border-radius:10px; background:var(--paper); display:flex; align-items:center; justify-content:center; flex-shrink:0; color:var(--red-deep); }
  .tx-main{ flex:1; min-width:0; }
  .tx-listing{ font-weight:700; font-size:.9rem; }
  .tx-ref{ font-size:.76rem; color:var(--muted); font-variant-numeric:tabular-nums; }
  .tx-right{ text-align:right; flex-shrink:0; }
  .tx-amount{ font-weight:700; font-size:.94rem; font-variant-numeric:tabular-nums; }
  .status-chip{ display:inline-block; margin-top:.3rem; font-size:.7rem; font-weight:700; padding:.2rem .6rem; border-radius:100px; text-transform:capitalize; }
  .status-chip.paid{ background:#EAF4EE; color:#1E6B3C; }
  .status-chip.pending{ background:#FFF3CD; color:#8A6D00; }
  .status-chip.failed{ background:#FBE9E9; color:var(--red-deep); }
  .status-chip.refunded, .status-chip.partially-refunded{ background:#E9F0FB; color:#1A4E8F; }

  .tx-bottom{ display:flex; align-items:center; justify-content:space-between; margin-top:.7rem; padding-top:.7rem; border-top:1px solid rgba(128,110,100,.1); font-size:.8rem; color:var(--muted); }
  .tx-method{ display:flex; align-items:center; gap:.4rem; }
  .tx-detail-btn{ font-weight:600; color:var(--red-deep); }
  .tx-detail-btn:hover{ text-decoration:underline; }

  .detail-panel{ display:none; margin-top:.7rem; padding-top:.7rem; border-top:1px dashed rgba(128,110,100,.2); font-size:.82rem; line-height:1.7; }
  .detail-panel.open{ display:block; }
  .detail-panel .drow{ display:flex; justify-content:space-between; }
  .detail-panel .drow .label{ color:var(--muted); }

  @media (max-width:520px){
    header{ padding:1.1rem 1.3rem; }
    main{ padding:0 5vw 6rem; }
    .tx-card{ padding:.85rem .95rem; }
  }
</style>
</head>
<body>

<header>
  <a href="client-home.html" class="logo"><span class="va">Va</span><span class="room">Room</span></a>
  <a href="client-home.html" class="back-link">← Back to dashboard</a>
</header>

<main>
  <div id="checking-auth" class="checking-msg">Loading your transactions…</div>

  <div id="transactions-page" style="display:none;">
    <div class="page-head">
      <h1>Transactions</h1>
      <span class="badge badge-soon" title="Online payments aren't live yet — this is a preview of how they'll appear.">Preview data</span>
    </div>
    <p class="page-sub">Your own payments and refunds — nothing here is visible to anyone else.</p>

    <div class="tabs">
      <button class="tab active" data-filter="all">All</button>
      <button class="tab" data-filter="paid">Paid</button>
      <button class="tab" data-filter="pending">Pending</button>
      <button class="tab" data-filter="refunded">Refunded</button>
    </div>

    <div id="tx-list">
      <div class="skeleton"></div>
      <div class="skeleton"></div>
      <div class="skeleton"></div>
    </div>
  </div>
</main>

<script src="js/supabase-client.js"></script>
<script>
  (async function(){
    const checkingAuth = document.getElementById('checking-auth');
    const txPage = document.getElementById('transactions-page');

    const { data: { session } } = await supabaseClient.auth.getSession();
    if (!session) { window.location.href = 'login.html'; return; }
    const currentUser = session.user;

    const { data: profile, error: profileError } = await supabaseClient
      .from('profiles').select('role').eq('id', currentUser.id).single();
    if (profileError || !profile) { window.location.href = 'login.html'; return; }

    checkingAuth.style.display = 'none';
    txPage.style.display = 'block';

    function ksh(n){ return 'KSh ' + Number(n || 0).toLocaleString(); }
    function escapeHtml(str){ const d = document.createElement('div'); d.textContent = str || ''; return d.innerHTML; }
    const iconReceipt = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2V3Z"/><path d="M9 8h6M9 12h6"/></svg>';
    const iconMpesa = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18"/></svg>';

    // ---------- TODO(backend): swap this mock fetch for the real transactions API. ----------
    // Only the current client's own records should ever come back from that endpoint
    // (see brief §5 — clients must see only their own data).
    function fetchTransactions(){
      return new Promise(function(resolve){
        setTimeout(function(){
          resolve([
            { id: 'tx_a1', ref: 'VR-284915', listing: 'Sunset Loft, Kilimani', date: '2026-08-18', amount: 14500, method: 'M-Pesa', status: 'paid' },
            { id: 'tx_a2', ref: 'VR-284620', listing: 'Two Rivers Studio', date: '2026-08-10', amount: 9800, method: 'M-Pesa', status: 'pending' },
            { id: 'tx_a3', ref: 'VR-281004', listing: 'Karen Garden Villa', date: '2026-07-22', amount: 22000, method: 'M-Pesa', status: 'refunded' },
            { id: 'tx_a4', ref: 'VR-279912', listing: 'Westlands One-Bed', date: '2026-07-05', amount: 11200, method: 'M-Pesa', status: 'failed' }
          ]);
        }, 500);
      });
    }

    let allTx = [];
    let activeFilter = 'all';

    function render(){
      const el = document.getElementById('tx-list');
      const filtered = activeFilter === 'all' ? allTx : allTx.filter(function(t){ return t.status === activeFilter; });

      if (filtered.length === 0) {
        el.innerHTML = '<p class="state-msg">No ' + (activeFilter === 'all' ? '' : activeFilter + ' ') + 'transactions ' + (activeFilter === 'all' ? 'yet' : 'here') + '.</p>';
        return;
      }

      el.innerHTML = filtered.map(function(t){
        return (
          '<div class="tx-card">' +
            '<div class="tx-top">' +
              '<div class="tx-icon">' + iconReceipt + '</div>' +
              '<div class="tx-main">' +
                '<div class="tx-listing">' + escapeHtml(t.listing) + '</div>' +
                '<div class="tx-ref">' + t.ref + ' · ' + new Date(t.date + 'T00:00:00').toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}) + '</div>' +
              '</div>' +
              '<div class="tx-right">' +
                '<div class="tx-amount">' + ksh(t.amount) + '</div>' +
                '<span class="status-chip ' + t.status + '">' + t.status + '</span>' +
              '</div>' +
            '</div>' +
            '<div class="tx-bottom">' +
              '<span class="tx-method">' + iconMpesa + ' ' + escapeHtml(t.method) + '</span>' +
              '<button type="button" class="tx-detail-btn" data-toggle="' + t.id + '">Details ›</button>' +
            '</div>' +
            '<div class="detail-panel" id="detail-' + t.id + '">' +
              '<div class="drow"><span class="label">Reference</span><span>' + t.ref + '</span></div>' +
              '<div class="drow"><span class="label">Listing</span><span>' + escapeHtml(t.listing) + '</span></div>' +
              '<div class="drow"><span class="label">Amount paid</span><span>' + ksh(t.amount) + '</span></div>' +
              '<div class="drow"><span class="label">Method</span><span>' + escapeHtml(t.method) + '</span></div>' +
              '<div class="drow"><span class="label">Status</span><span>' + t.status + '</span></div>' +
            '</div>' +
          '</div>'
        );
      }).join('');

      el.querySelectorAll('[data-toggle]').forEach(function(btn){
        btn.addEventListener('click', function(){
          const panel = document.getElementById('detail-' + btn.getAttribute('data-toggle'));
          panel.classList.toggle('open');
        });
      });
    }

    document.querySelectorAll('.tab').forEach(function(tab){
      tab.addEventListener('click', function(){
        document.querySelectorAll('.tab').forEach(function(t){ t.classList.remove('active'); });
        tab.classList.add('active');
        activeFilter = tab.getAttribute('data-filter');
        render();
      });
    });

    try {
      allTx = await fetchTransactions();
      render();
    } catch (e) {
      document.getElementById('tx-list').innerHTML = '<p class="state-msg error">Couldn\'t load your transactions right now. Try refreshing.</p>';
    }
  })();
</script>

</body>
</html>
