<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notifications — VaRoom</title>
<script>
  (function(){
    try{
      var saved = localStorage.getItem('varoom_theme') || 'system';
      var resolved = saved === 'system'
        ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
        : saved;
      document.documentElement.setAttribute('data-theme', resolved);
    }catch(e){}
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;0,9..144,900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="icon" href="favicon/favicon.ico" sizes="any">
<style>
  :root{
    --red:#C41E3A; --red-deep:#8F1229; --white:#FFFFFF; --ink:#1A1210; --paper:#FBF4F1;
    --muted:#7a6b67; --card-border:rgba(26,18,16,.1);
    --font-display:'Fraunces', serif; --font-body:'Inter', sans-serif;
  }
  [data-theme="dark"]{
    --white:#241C1A; --paper:#15100F; --ink:#F5EFEC; --muted:#B8ACA8; --card-border:rgba(255,255,255,.1);
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  body{ font-family:var(--font-body); background:var(--paper); color:var(--ink); min-height:100vh; padding-bottom:5.5rem; }
  a{ color:inherit; text-decoration:none; }
  button{ font-family:inherit; cursor:pointer; border:none; background:none; color:inherit; }

  header{
    display:flex; align-items:center; gap:.9rem; padding:1.1rem 1.2rem;
    border-bottom:1px solid var(--card-border); background:var(--white);
    position:sticky; top:0; z-index:50;
  }
  .back-btn{ display:flex; align-items:center; justify-content:center; width:34px; height:34px; border-radius:50%; color:var(--ink); flex-shrink:0; }
  .back-btn:hover{ background:var(--paper); }
  header h1{ font-family:var(--font-display); font-weight:600; font-size:1.25rem; flex:1; }
  .mark-all-btn{ font-size:.78rem; font-weight:600; color:var(--red); white-space:nowrap; }
  .mark-all-btn:hover{ text-decoration:underline; }

  .tabs{ display:flex; gap:.5rem; padding:1rem 1.2rem .2rem; overflow-x:auto; scrollbar-width:none; }
  .tabs::-webkit-scrollbar{ display:none; }
  .tab{
    flex-shrink:0; font-size:.82rem; font-weight:600; padding:.5rem 1rem; border-radius:100px;
    background:var(--white); border:1px solid var(--card-border); color:var(--ink);
  }
  .tab.active{ background:var(--red); border-color:var(--red); color:#fff; }

  main{ max-width:640px; margin:0 auto; padding:.5rem 0 2rem; }
  .state-msg{ text-align:center; padding:3.5rem 1.5rem; color:var(--muted); font-size:.9rem; }

  .group-label{
    font-size:.75rem; font-weight:700; text-transform:uppercase; letter-spacing:.08em;
    color:var(--muted); padding:1.1rem 1.2rem .5rem;
  }

  .notif-row{
    display:flex; gap:.8rem; align-items:flex-start; padding:.9rem 1.2rem;
    border-bottom:1px solid var(--card-border); position:relative;
  }
  .notif-row.unread{ background:rgba(196,30,58,.05); }
  .notif-row.clickable{ cursor:pointer; }
  .notif-row.clickable:hover{ background:rgba(196,30,58,.08); }

  .notif-icon{
    width:38px; height:38px; border-radius:50%; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
  }
  .notif-body{ flex:1; min-width:0; }
  .notif-title{ font-weight:700; font-size:.9rem; margin-bottom:.15rem; }
  .notif-message{ font-size:.85rem; color:var(--muted); line-height:1.4; }
  .notif-time{ font-size:.76rem; color:var(--muted); margin-top:.3rem; }
  .notif-unread-dot{ width:8px; height:8px; border-radius:50%; background:var(--red); flex-shrink:0; margin-top:.4rem; }

  .notif-chevron{ color:var(--muted); flex-shrink:0; align-self:center; }

  /* ---------- BOTTOM BAR (matches client-home / host-home) ---------- */
  .bottom-bar{
    display:none; position:fixed; bottom:0; left:0; right:0; z-index:150;
    background:var(--white); border-top:1px solid var(--card-border);
    padding:.6rem .5rem calc(.6rem + env(safe-area-inset-bottom));
  }
  @media (max-width:860px){ .bottom-bar{ display:flex; } }
  .bottom-bar-item{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:.25rem;
    font-size:.68rem; font-weight:600; color:var(--muted); padding:.3rem 0;
  }
  .bottom-bar-item.active{ color:var(--red-deep); }
  .bottom-bar-elie .elie-badge{
    width:30px; height:30px; border-radius:50%; background:var(--red);
    display:flex; align-items:center; justify-content:center; margin-bottom:-2px;
  }
</style>
</head>
<body>

<header>
  <a href="#" class="back-btn" id="back-link" aria-label="Back">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
  </a>
  <h1>Notifications</h1>
  <button type="button" class="mark-all-btn" id="mark-all-btn">Mark all read</button>
</header>

<div class="tabs">
  <button type="button" class="tab active" data-filter="all">All</button>
  <button type="button" class="tab" data-filter="unread">Unread</button>
  <button type="button" class="tab" data-filter="bookings">Bookings</button>
</div>

<main id="main-content">
  <div class="state-msg" id="loading-state">Loading…</div>
</main>

<nav class="bottom-bar" id="bottom-bar">
  <a href="#" class="bottom-bar-item" id="bb-home">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9a1 1 0 0 0 1 1H9a1 1 0 0 0 1-1v-4a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v4a1 1 0 0 0 1 1h2.5a1 1 0 0 0 1-1v-9"/></svg>
    Home
  </a>
  <a href="bookings.html" class="bottom-bar-item">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="16" rx="2"/><path d="M8 3v4M16 3v4M3.5 10h17"/></svg>
    Bookings
  </a>
  <a href="chats.html" class="bottom-bar-item">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5Z"/></svg>
    Chats
  </a>
  <a href="elie.html" class="bottom-bar-item bottom-bar-elie">
    <span class="elie-badge"><img src="elie-logo.png" alt="" style="width:18px;height:18px;object-fit:contain;"></span>
    Elie
  </a>
  <button type="button" class="bottom-bar-item active">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
    Notifications
  </button>
</nav>

<script src="js/supabase-client.js"></script>
<script>
(function(){
  function iconFor(type){
    const CHECK = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';
    const XICON = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>';
    const CALENDAR = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="16" rx="2"/><path d="M8 3v4M16 3v4M3.5 10h17"/></svg>';

    if (type === 'booking_approved') return { bg:'#DCF5E3', fg:'#1E7D3A', svg:CHECK, label:'Booking Confirmed' };
    if (type === 'booking_declined') return { bg:'#FBE4E7', fg:'#C41E3A', svg:XICON, label:'Booking Declined' };
    if (type === 'booking_cancelled') return { bg:'#FBE4E7', fg:'#C41E3A', svg:XICON, label:'Booking Cancelled' };
    if (type === 'booking_request') return { bg:'#E8EEFB', fg:'#2255C4', svg:CALENDAR, label:'New Booking Request' };
    return { bg:'#E8EEFB', fg:'#2255C4', svg:CALENDAR, label:'Notification' };
  }

  function timeAgo(dateStr){
    const diffMs = Date.now() - new Date(dateStr).getTime();
    const mins = Math.floor(diffMs / 60000);
    if (mins < 1) return 'just now';
    if (mins < 60) return mins + 'm ago';
    const hrs = Math.floor(mins / 60);
    if (hrs < 24) return hrs + 'h ago';
    return Math.floor(hrs / 24) + 'd ago';
  }

  function escapeHtml(str){
    const d = document.createElement('div');
    d.textContent = str || '';
    return d.innerHTML;
  }

  function groupLabel(dateStr){
    const d = new Date(dateStr);
    const now = new Date();
    const startOfDay = function(dt){ return new Date(dt.getFullYear(), dt.getMonth(), dt.getDate()); };
    const diffDays = Math.round((startOfDay(now) - startOfDay(d)) / 86400000);
    if (diffDays === 0) return 'Today';
    if (diffDays === 1) return 'Yesterday';
    return 'Older';
  }

  (async function(){
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (!session) { window.location.href = 'login.html'; return; }
    const currentUser = session.user;

    const { data: profile } = await supabaseClient.from('profiles').select('role').eq('id', currentUser.id).maybeSingle();
    const homeUrl = (profile && profile.role === 'host') ? 'host-home.html' : 'client-home.html';
    document.getElementById('back-link').setAttribute('href', homeUrl);
    document.getElementById('bb-home').setAttribute('href', homeUrl);

    let allNotifications = [];
    let currentFilter = 'all';

    async function loadAll(){
      const { data } = await supabaseClient
        .from('notifications')
        .select('id,message,type,read,created_at,booking_id')
        .eq('user_id', currentUser.id)
        .order('created_at', { ascending:false })
        .limit(100);
      allNotifications = data || [];
      render();
    }

    function render(){
      const main = document.getElementById('main-content');

      let filtered = allNotifications;
      if (currentFilter === 'unread') filtered = allNotifications.filter(function(n){ return !n.read; });
      if (currentFilter === 'bookings') filtered = allNotifications.filter(function(n){ return (n.type || '').indexOf('booking_') === 0; });

      if (filtered.length === 0) {
        main.innerHTML = '<div class="state-msg">Nothing here yet.</div>';
        return;
      }

      const groups = {};
      const order = [];
      filtered.forEach(function(n){
        const g = groupLabel(n.created_at);
        if (!groups[g]) { groups[g] = []; order.push(g); }
        groups[g].push(n);
      });

      main.innerHTML = order.map(function(g){
        return (
          '<div class="group-label">' + g + '</div>' +
          groups[g].map(function(n){
            const icon = iconFor(n.type);
            const clickable = n.booking_id ? ' clickable" data-booking-id="' + n.booking_id + '"' : '"';
            const chevron = n.booking_id
              ? '<svg class="notif-chevron" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>'
              : '';
            return (
              '<div class="notif-row' + (n.read ? '' : ' unread') + clickable + '>' +
                '<div class="notif-icon" style="background:' + icon.bg + ';color:' + icon.fg + ';">' + icon.svg + '</div>' +
                '<div class="notif-body">' +
                  '<div class="notif-title">' + icon.label + '</div>' +
                  '<div class="notif-message">' + escapeHtml(n.message) + '</div>' +
                  '<div class="notif-time">' + timeAgo(n.created_at) + '</div>' +
                '</div>' +
                (n.read ? '' : '<div class="notif-unread-dot"></div>') +
                chevron +
              '</div>'
            );
          }).join('')
        );
      }).join('');

      main.querySelectorAll('.notif-row[data-booking-id]').forEach(function(row){
        row.addEventListener('click', function(){
          window.location.href = 'booking-approved.html?id=' + row.getAttribute('data-booking-id');
        });
      });

      // Mark visible unread ones as read
      const unreadIds = filtered.filter(function(n){ return !n.read; }).map(function(n){ return n.id; });
      if (unreadIds.length > 0) {
        supabaseClient.from('notifications').update({ read:true }).in('id', unreadIds).then(function(){
          allNotifications.forEach(function(n){ if (unreadIds.indexOf(n.id) !== -1) n.read = true; });
        });
      }
    }

    document.querySelectorAll('.tab').forEach(function(tab){
      tab.addEventListener('click', function(){
        document.querySelectorAll('.tab').forEach(function(t){ t.classList.remove('active'); });
        tab.classList.add('active');
        currentFilter = tab.getAttribute('data-filter');
        render();
      });
    });

    document.getElementById('mark-all-btn').addEventListener('click', async function(){
      await supabaseClient.from('notifications').update({ read:true }).eq('user_id', currentUser.id).eq('read', false);
      allNotifications.forEach(function(n){ n.read = true; });
      render();
    });

    loadAll();
  })();
})();
</script>

</body>
</html>
